<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>去中心鹹水雞 X 厝邊溫食 POS 系統</title>
<style>
:root{--g:#d4af37;--bd:#8c6a27;--tx:#f5e4b3;--bg:#140f0a;--pn:#221910;--gr:linear-gradient(135deg,#f3e5ab,#c59b27 50%,#7a580c)}
*{box-sizing:border-box;margin:0;padding:0;font-family:"PingFang TC","Microsoft JhengHei",sans-serif}
body{display:flex;height:100vh;background:var(--bg);color:var(--tx);overflow:hidden}
button{font:inherit;cursor:pointer}
.L{flex:7;display:flex;flex-direction:column;background:var(--pn);border-right:2px solid var(--bd);min-width:0}
.R{flex:3.2;display:flex;flex-direction:column;background:#1a120b}
.hd{background:linear-gradient(#2b1f14,#150f09);padding:12px 18px;border-bottom:2px solid #aa7c11;display:flex;flex-direction:column;gap:8px;align-items:center}
.ttl{font-size:26px;font-weight:bold;background:var(--gr);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px}
.info{width:100%;background:#1a110a;border:1px solid var(--bd);border-radius:6px;padding:8px 14px;font-size:13px;color:#eddab2;line-height:1.7}
.info b{color:var(--g)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.hb{background:linear-gradient(135deg,#1e7e34,#145222);color:#e6ffe6;border:1px solid #81c784;padding:6px 12px;border-radius:4px;font-size:13px;font-weight:bold;position:relative}
.hb.b{background:#3d2b1a;border-color:var(--bd);color:var(--tx)}.hb.r{background:#8b1e0f;border-color:#b33927}
.cnt{position:absolute;top:-6px;right:-6px;background:#f44;color:#fff;border-radius:50%;min-width:20px;height:20px;font-size:11px;display:flex;align-items:center;justify-content:center}
.tabs{display:flex;background:#120c07;border-bottom:2px solid var(--bd);overflow-x:auto}
.tab{flex:1;min-width:100px;padding:10px 4px;text-align:center;font-size:14px;font-weight:bold;color:#a89269;cursor:pointer;border-top:4px solid transparent}
.tab.on{background:linear-gradient(#3d2b1a,#221910);color:#fff3cb;border-top-color:var(--g)}
.tab.off{opacity:.55;text-decoration:line-through}
.cx{display:inline-block;width:20px;height:20px;line-height:18px;border:1px solid var(--bd);border-radius:50%;margin-right:4px;font-size:11px;background:#3d2b1a}
#notice{display:none;background:#2e2213;color:#f0d59e;padding:8px 14px;font-size:13px;text-align:center;border-bottom:1px solid var(--bd)}
.grid{flex:1;overflow-y:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px;align-content:start;background:radial-gradient(#2b1f13,#17100a)}
.grid.two{grid-template-columns:1fr 1fr}.grid.combo{grid-template-columns:1fr}
.card{position:relative;background:linear-gradient(135deg,#362719,#20160d);border:1px solid var(--bd);border-radius:8px;padding:10px;text-align:center;cursor:pointer;min-height:85px;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:.15s}
.card:hover{transform:translateY(-2px);border-color:var(--g)}
.card.so{opacity:.45;cursor:not-allowed}.card.so .nm{text-decoration:line-through}
.edit .card{border:2px dashed #f44}
.nm{font-size:15px;font-weight:bold;color:#fcedcb;margin-bottom:6px}.pr{color:var(--g);font-weight:bold;font-size:16px}
.dt{font-size:12px;color:#d6c29a;margin-top:6px;line-height:1.5}
.bd{position:absolute;top:-6px;right:-6px;background:var(--gr);color:#1a0c00;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font:bold 12px sans-serif}
.sot{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(139,0,0,.85);color:#fff;padding:3px 10px;font-size:12px;border-radius:4px}
.ct{padding:12px;text-align:center;font-weight:bold;color:var(--g);background:linear-gradient(#3d2b1a,#20150b);border-bottom:2px solid var(--bd)}
#cart{flex:1;overflow-y:auto;padding:8px 12px;background:#150d07}
.oi{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 4px;border-bottom:1px solid #2d2014;font-size:14px}
.oi.s{padding-left:18px;font-size:12px;color:#a38c62}
.q{width:26px;height:26px;background:#3d2c1c;color:#fff;border:1px solid var(--bd);border-radius:4px}
.btn{flex:1;padding:12px;border:none;border-radius:6px;font-size:16px;font-weight:bold}
.go{background:var(--gr);color:#1a0c00}.bk{background:#3d2b1a;color:var(--tx);border:1px solid var(--bd)}.rd{background:linear-gradient(135deg,#8b1e0f,#4a0d05);color:#ffe6e6}
.inp{flex:1;padding:9px 12px;background:#150d07;border:1px solid var(--bd);border-radius:6px;color:var(--tx);font-size:15px;outline:none;min-width:0}
.ir{display:flex;align-items:center;gap:8px;margin-bottom:10px}.ir label{min-width:70px;font-weight:bold;color:var(--g);font-size:14px}
.chip{padding:6px 12px;border:1px solid #543f24;background:#170f09;color:#d1bd97;border-radius:4px;font-size:14px;margin:2px}
.chip.on{background:var(--gr);color:#1a0d00;font-weight:bold;border-color:#fff}
.pg{margin-bottom:8px}.pg>span{color:#c4ae85;font-weight:bold;margin-right:6px}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:100}
.mc{position:relative;background:var(--pn);border:2px solid var(--bd);border-radius:10px;padding:30px 24px 22px;width:520px;max-width:96vw;max-height:92vh;overflow-y:auto}
.mc h3{text-align:center;color:var(--g);margin-bottom:14px}
.x{position:absolute;top:10px;right:12px;width:32px;height:32px;border-radius:50%;background:#3d2b1a;color:#fff;border:1px solid var(--bd)}
.ln{display:flex;justify-content:space-between;margin-bottom:6px;font-size:15px}
.tot{border-top:1px dashed #5c4524;margin-top:10px;padding-top:10px;font-size:19px;font-weight:bold;color:var(--g)}
.lo{background:#150d07;border:1px solid var(--bd);padding:14px;border-radius:8px;margin-bottom:12px;display:flex;flex-direction:column;gap:6px;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:900px}th,td{padding:8px;text-align:left;border-bottom:1px solid #3d2b1a}th{color:var(--g);background:#1a110a}
.warn{background:#3d2b1a;border:1px solid var(--g);padding:8px;border-radius:6px;text-align:center;font-size:13px;margin-bottom:10px}
.ok{background:#1e7e34;border:1px solid #81c784;padding:10px;border-radius:6px;text-align:center;margin-bottom:10px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#5c4524;border-radius:4px}
@media(max-width:768px){body{flex-direction:column;height:auto;overflow:auto}.grid{max-height:55vh}}
</style></head>
<body onload="init()">
<div class="L">
 <div class="hd">
  <div class="row"><select id="st" class="inp" style="flex:none;width:130px;padding:4px 8px" onchange="setStatus(this.value)">
   <option value="營業中">🟢 營業中</option><option value="備料中">🟡 備料中</option><option value="休息中">🔴 休息中</option></select>
   <button class="hb b" id="auth" style="display:none" onclick="loginOut()">登入</button></div>
  <div class="ttl">去中心鹹水雞 X 厝邊溫食 POS 系統</div>
  <div class="info" id="info"><b>地址：</b>新竹市南大路550巷82號　<b>電話：</b>0916740175（忙碌時不接受電話訂餐）<br>
   <b>營業時間：</b>週二~週四 17:00-00:00 / 週五、週六 17:00-02:00　<b>公休：</b>週一公休 / 不定時休假（請來電詢問）</div>
  <div class="row" id="adm" style="display:none">
   <button class="hb" style="background:linear-gradient(135deg,#004080,#002040);border-color:#66b2ff" onclick="openLive()">📋 接單系統<span id="bdg" class="cnt" style="display:none"></span></button>
   <button class="hb b" id="eb" onclick="toggleEdit()">🍔 餐點管理</button>
   <button class="hb b" onclick="openSold()">📋 售完品項</button>
   <button class="hb b" onclick="openHist()">📊 歷史訂單</button>
   <button class="hb b" onclick="openPwd()">🔑 改密碼</button>
  </div>
 </div>
 <div class="tabs" id="tabs"></div><div id="notice"></div><div class="grid" id="grid"></div>
</div>
<div class="R">
 <div class="row" style="padding:8px;background:#1f160d;border-bottom:1px solid var(--bd)"><button class="hb b" onclick="queryPhone()">🔍 輸入電話查詢訂單進度</button></div>
 <div class="ct">訂單明細</div><div id="cart"></div>
 <div style="padding:14px;border-top:1px solid var(--bd)"><button class="btn go" id="next" style="width:100%" onclick="openStep1()">下一步 (填寫取餐資訊)</button></div>
</div>
<div class="mod" id="mod"><div class="mc" id="mc"></div></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const pad=n=>String(n).padStart(2,'0');
const WD=["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
const GAS_URL='https://script.google.com/macros/s/AKfycbx27ulPzvzHrwQooTcE4yPaNXNq-jWLqtwnKOLGDrMyA7Kj6Xl1rlpTekz_xAbxRRkcdw/exec';
const CM='信仰雞本位主義 (主食)',CC='智能合約 (套餐)',CH='厝邊溫食(炒麵/燴飯)';
const NOTICE={[CH]:'炒麵類預設使用芥藍菜，若遇缺貨將調整為油菜或高麗菜<br>炒青菜為當季時令蔬菜，品項隨季節調整，恕無法指定',[CC]:'套餐內容物如遇缺貨將自動更換等值商品，恕無法指定變更'};
const mk=(p,rows,x={})=>rows.map(([name,price],i)=>({id:p+(i+1),name,price,soldOut:false,...x}));
const combo=(id,name,price,chickenText,items,opts,fixed)=>({id,name,price,soldOut:false,chickenText,items,...(opts?{chickenOptions:opts}:{fixedChicken:fixed})});
const DEF={
 [CM]:mk('m',[["鹹水雞腿",65],["煙燻雞腿",75],["鹹水雞胸",65],["煙燻雞胸",75],["鹹水半雞",130],["煙燻半雞",150]]),
 [CC]:[combo('s1','散戶輕倉個人餐',260,'雞肉：半隻（鹹水 / 煙燻）',["豬耳朵","雞冠","豆干","鴨肉丸","珍珠蛋"],["鹹水半雞","煙燻半雞"]),
  combo('s2','巨鯨重倉肉多多餐',390,'雞肉：半隻（鹹水 / 煙燻）',["牛五花","松阪豬","雞冠","雞腸","雞軟骨","鴨肉丸","鑫鑫腸"],["鹹水半雞","煙燻半雞"]),
  combo('s3','DAO節點下酒派對餐',630,'雞肉：全雞（全鹹水 / 全煙燻 / 鹹半+燻半）',["牛五花","松阪豬","豬耳朵","珍珠蛋","雞冠","雞腸","雞皮","鴨肉丸","貢丸","水晶餃","百頁豆腐"],["全鹹水","全煙燻","鹹水半雞 + 煙燻半雞"]),
  combo('s4','輕食減醣套餐',139,'雞肉：鹹水雞胸',["冬粉","花椰菜","玉米筍","豆皮","高麗菜"],null,'鹹水雞胸'),
  combo('s5','輕食減醣肉多餐',239,'雞肉：鹹水雞胸 × 2',["冬粉","白蘿蔔","高麗菜","玉米筍","龍鬚菜","珍珠蛋"],null,'鹹水雞胸 x 2')],
 "鏈上綠色資產 (蔬菜)":mk('v',[["娃娃菜",40],["玉米筍",30],["筍片",25],["水蓮",25],["四季豆",25],["龍鬚菜",25],["花椰菜",25],["鴻喜菇",25],["杏鮑菇",20],["金針菇",20],["小黃瓜",20],["高麗菜",20],["白蘿蔔",20],["黑木耳",20],["洋蔥",20],["海帶",20]]),
 "DAO去中心肉類 (肉類)":mk('meat',[["松阪豬",75],["牛五花",70],["雞軟骨",40],["雞心",30],["雞胗",30],["雞冠",25],["雞腸",25],["雞皮",25],["珍珠蛋",25],["鑫鑫腸",25]]),
 "節點火鍋料":mk('f',[["鴨肉丸",30],["貢丸",30],["水晶餃",30],["甜不辣",25],["蟹味棒",25],["皮蛋(溏心)",25],["鹹蛋(碎)",25],["豆干",25],["百頁豆腐",20],["蒟蒻絲",20],["豆皮衣(炸)",20],["豆皮",20],["米血",20]]),
 "共識滷味協議":mk('l',[["無骨鳳爪",45],["豬耳朵",45],["滷脆腸",45]]),
 "自由流通麵 (麵食)":mk('z',[["王子麵",15],["冬粉",15]]),
 [CH]:[...mk('w',[["沙茶羊肉炒麵",120],["沙茶牛肉炒麵",120],["沙茶羊肉燴飯",120],["沙茶牛肉燴飯",120],["炒羊肉",150],["炒牛肉",150],["炒青菜",100]],{needCustom:true}),
  {id:'w8',name:'當歸羊肉湯',price:80,soldOut:false},{id:'w9',name:'當歸清湯',price:40,soldOut:false}]
};

/* ===== 狀態 ===== */
let S={menu:ls('pos_menu_data',null)||DEF,status:localStorage.getItem('pos_store_status')||'營業中',prep:+localStorage.getItem('pos_prep_until')||0,live:ls('pos_live_orders',[]),hist:ls('pos_order_history',[])};
let cart=[],P={},pay='現金',otype='外帶自取',cat=null,edit=false,admin=false,logged=false,track=null,pending=null,showAll=false,view=null,lastWrite=0,sig='',acceptId=null,timer;
const resetP=()=>P={flavor:'',spice:'',salt:'',extras:[],hs:'',ht:''};resetP();

function store(){localStorage.setItem('pos_menu_data',JSON.stringify(S.menu));localStorage.setItem('pos_store_status',S.status);localStorage.setItem('pos_prep_until',S.prep);
 localStorage.setItem('pos_live_orders',JSON.stringify(S.live));localStorage.setItem('pos_order_history',JSON.stringify(S.hist))}
function persist(){store();lastWrite=Date.now();clearTimeout(timer);timer=setTimeout(()=>{
 fetch(GAS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'sync_state',menuData:S.menu,storeStatus:S.status,prepUntil:S.prep,liveOrders:S.live,orderHistory:S.hist})}).catch(e=>console.error('同步失敗',e))},300)}
async function pull(){
 if(document.hidden||Date.now()-lastWrite<6000)return;
 try{const d=await(await fetch(GAS_URL+'?action=get_state')).json();if(!d||!d.success)return;
  const s=JSON.stringify([d.menuData,d.storeStatus,d.prepUntil,d.liveOrders,d.orderHistory]);if(s===sig)return;sig=s;
  if(d.menuData)S.menu=d.menuData;if(d.storeStatus){S.status=d.storeStatus;S.prep=+d.prepUntil||0}
  if(d.liveOrders)S.live=d.liveOrders;if(d.orderHistory)S.hist=d.orderHistory;
  store();renderAll();if(view==='live')renderLive();if(view==='hist')renderHist();if(track)trackView()}catch{console.warn('背景同步暫時無法連線')}}

/* ===== 共用 ===== */
function modal(html,w){$('mc').style.width=w||'520px';$('mc').innerHTML=`<button class="x" onclick="closeModal()">✕</button>${html}`;$('mod').style.display='flex'}
function closeModal(){$('mod').style.display='none';view=null;track=null}
function beep(freqs){try{const A=window.AudioContext||window.webkitAudioContext,c=new A();freqs.forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.type='triangle';o.connect(g);g.connect(c.destination);const t=c.currentTime+i*.22;g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);o.start(t);o.stop(t+.4)})}catch{}}
const recalc=o=>o.items.reduce((a,i)=>a+i.price*i.qty,0)+((o.flavorStr||'').includes('泰式')?5:0);
const cartTotal=()=>cart.reduce((a,i)=>a+i.price*i.qty,0)+(P.flavor==='泰式+5元'?5:0);
const fmtDT=d=>`${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
const toLocalInput=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const bizDate=s=>{const[d,t]=s.split(' ');const dt=new Date(d.replace(/\//g,'-')+'T00:00:00');if(+(t||'0').split(':')[0]<2)dt.setDate(dt.getDate()-1);return dt};

/* ===== 權限與營業狀態 ===== */
function checkAuth(){admin=new URLSearchParams(location.search).get('mode')==='admin';logged=localStorage.getItem('pos_mgr_logged')==='true';
 $('info').style.display=admin?'none':'block';$('adm').style.display=admin&&logged?'flex':'none';$('auth').style.display=admin?'block':'none';
 $('auth').textContent=logged?'登出':'登入';$('auth').className='hb '+(logged?'r':'b');$('st').disabled=!(admin&&logged)}
function loginOut(){if(logged){localStorage.setItem('pos_mgr_logged','false')}else{const p=prompt('請輸入管理密碼：');if(p===null)return;
 if(p!==(localStorage.getItem('pos_admin_pwd')||'8888'))return alert('密碼錯誤！');localStorage.setItem('pos_mgr_logged','true')}checkAuth()}
function openPwd(){modal(`<h3>🔑 修改管理密碼</h3>${['舊密碼','新密碼','確認新密碼'].map((l,i)=>`<div class="ir"><label>${l}</label><input type="password" id="pw${i}" class="inp"></div>`).join('')}<button class="btn go" style="width:100%" onclick="savePwd()">確認更換</button>`,'420px')}
function savePwd(){const[a,b,c]=[0,1,2].map(i=>$('pw'+i).value.trim());if(!a||!b||!c)return alert('請完整填寫！');
 if(a!==(localStorage.getItem('pos_admin_pwd')||'8888'))return alert('舊密碼錯誤！');if(b!==c)return alert('新密碼與確認不符！');
 localStorage.setItem('pos_admin_pwd',b);alert('密碼修改成功！');closeModal()}
function setStatus(v){if(v!=='備料中'){S.status=v;S.prep=0;persist();return renderAll()}
 let n=Date.now(),step=18e5,t=Math.ceil(n/step)*step,max=new Date(n);max.setHours(max.getHours()<5?2:26,0,0,0);let o='';
 for(let i=0;t<=max.getTime()&&i<30;t+=step,i++){const d=new Date(t);o+=`<option value="${t}">${d.getDate()!==new Date(n).getDate()?'隔日 ':''}${pad(d.getHours())}:${pad(d.getMinutes())}</option>`}
 modal(`<h3>🟡 設定備料解除時間</h3><select id="pt" class="inp" style="width:100%;margin-bottom:14px">${o||`<option value="${n+18e5}">30分鐘後</option>`}</select>
 <div class="row"><button class="btn bk" onclick="closeModal();renderAll()">取消</button><button class="btn go" onclick="S.status='備料中';S.prep=+$('pt').value;persist();closeModal();renderAll()">確定</button></div>`,'380px')}
function autoOpen(){if(S.status==='備料中'&&S.prep>0&&Date.now()>=S.prep){S.status='營業中';S.prep=0;persist();renderAll()}}
const closedMsg=()=>{autoOpen();if(S.status==='營業中')return'';if(S.status==='休息中')return'目前店家休息中，暫停接受點餐！';
 const d=new Date(S.prep);return`目前店家備料中（預計 ${pad(d.getHours())}:${pad(d.getMinutes())} 恢復營業），暫停接受點餐！`};

/* ===== 菜單 ===== */
function renderAll(){$('st').value=S.status;const m=closedMsg();$('next').textContent=m?(S.status==='休息中'?'目前休息中 (暫停接單)':'目前備料中 (暫停接單)'):'下一步 (填寫取餐資訊)';
 $('next').style.opacity=m?.6:1;$('bdg').style.display=S.live.length?'flex':'none';$('bdg').textContent=S.live.length;renderGrid();renderCart()}
function renderGrid(){const cats=Object.keys(S.menu);if(!cat||!S.menu[cat])cat=cats[0];

function renderHist(){if(!$('hb'))return;const f=$('hdate').value.replace(/-/g,'/');const rows=S.hist.filter(o=>showAll||o.date===f);$('hall').textContent=showAll?'取消全部':'全部訂單';
 $('hsum').textContent=`共 ${rows.length} 筆 / $${rows.reduce((a,o)=>a+o.total,0)}`;
 $('hb').innerHTML=rows.length?rows.map(o=>`<tr><td><b>${esc(o.orderNo)}</b></td><td>${o.status}</td><td>${o.orderType||'外帶自取'}</td><td>${o.date} ${o.weekDay||''}</td><td>${esc(o.customer)}</td><td>${esc(o.phone)}</td><td>${esc(o.pickupTime)}</td><td>${o.payment}</td><td><b>$${o.total}</b></td>
 <td>${esc(o.items.map(i=>i.name+'x'+i.qty).join('、'))}</td><td>${esc(o.flavorStr)}</td><td>${esc(o.custNotes)}</td><td><button class="hb r" onclick="delHist(${o.id})">✕ 刪除</button></td></tr>`).join(''):'<tr><td colspan="13" style="text-align:center;padding:30px;color:#8a7356">無符合條件的歷史訂單📊</td></tr>'}
function delHist(id){if(!confirm('確定要刪除這筆歷史訂單嗎？'))return;S.hist=S.hist.filter(o=>o.id!==id);persist();renderHist()}

function init(){checkAuth();renderAll();pull();setInterval(()=>{autoOpen();pull()},4000)}
</script></body></html>
