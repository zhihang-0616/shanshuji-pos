/* ===== 營業時間：週一至週四 17:30–24:00、週五六 17:30–02:00（次日）、週日公休；店家可手動提早開店／提早打烊／備料／臨時休假 ===== */
const TZ=28800000,DAYMS=86400000,WEEKMS=604800000;
const SCHED_TXT='週一至週四 17:30–24:00｜週五、週六 17:30–02:00｜週日公休｜營業日 16:30 起備料中（可先預訂）';
let SHOP={ovr:null,vac:null,wait:null},SV_OFF=0;
const svNow=()=>Date.now()+SV_OFF;
const twHM=ms=>{const m=Math.floor(((ms+TZ)%DAYMS)/60000);return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};   // 一律顯示台灣時間（24 小時制）
function schedOpenAt(t){      // 與 Firebase 規則使用同一組算式（台灣時間 UTC+8）
  const L=t+TZ,DM=L%DAYMS,WM=(L+4*DAYMS)%WEEKMS;     // DM：當天第幾毫秒；WM：本週（週日 00:00 起算）第幾毫秒
  return (WM>=DAYMS&&DM>=63000000)||(DM<7200000&&(WM>=6*DAYMS||WM<DAYMS));
}
function prepWinAt(t){        // 週一～週六 16:30–17:30：預定備料時段（客人可預訂）
  const L=t+TZ,DM=L%DAYMS,WM=(L+4*DAYMS)%WEEKMS;
  return WM>=DAYMS&&DM>=59400000&&DM<63000000;
}
function nextChange(t){
  const base=schedOpenAt(t);let m=Math.floor(t/60000)*60000+60000;
  for(let i=0;i<4320;i++,m+=60000)if(schedOpenAt(m)!==base)return m;
  return t+DAYMS;
}
function curStatus(t){
  t=t||svNow();
  const o=SHOP.ovr;
  if(o&&+o.until>t){
    if(o.mode==='open')return{s:'營業中',why:'手動營業'};
    if(o.mode==='prep'){const pu=+o.prepUntil||+o.until;return t<pu?{s:'備料中',why:'備料中',until:pu}:{s:'營業中',why:'備料完成，自動營業'}}
    return{s:'休息中',why:'手動休息'};
  }
  const v=SHOP.vac;
  if(v&&+v.from<=t&&t<+v.to)return{s:'休息中',why:'臨時休假'};
  if(schedOpenAt(t))return{s:'營業中',why:'依營業時間'};
  if(prepWinAt(t))return{s:'備料中',why:'預定備料時間',until:nextChange(t)};
  return{s:'休息中',why:'非營業時間'};
}
function updateStatusDisplay(){

  {const pe=$('statusText').parentElement;if(pe)pe.title=st.why}
  const c=s==='營業中'?'var(--ok)':s==='備料中'?'var(--ac)':'var(--bad)';
  $('statusDot').style.background=c;$('statusDot').style.boxShadow='0 0 8px '+c;
  const bn=$('banner'),v=SHOP.vac&&+SHOP.vac.to>svNow()&&+SHOP.vac.from<=svNow()?SHOP.vac:null;
  const back=v?`　臨時休假至 ${dayLabel(bizDay(+v.to-1)).slice(5,10)}`:'';
  if(s==='休息中'){bn.className='bn-rest';bn.textContent=isAdmin?`目前狀態：休息中（${st.why}；客人無法點餐，店家仍可下單）`:`🔴 目前休息中，暫停接單${back}　營業時間：${SCHED_TXT}`}
  else if(s==='備料中'){
    const left=Math.max(1,Math.ceil((st.until-svNow())/60000));
    bn.className='bn-prep';
    const sch=st.why==='預定備料時間';
    bn.textContent=isAdmin?(sch?`目前狀態：備料中（預定備料時間），${twHM(st.until)} 自動開始營業（還有約 ${left} 分鐘）`:`目前狀態：備料中，預計 ${twHM(st.until)} 完成（還有約 ${left} 分鐘）`)
      :(sch?`🟡 店家備料中，${twHM(st.until)} 開始營業（約還需 ${left} 分鐘）。可先預訂，開始營業後依序製作`:`🟡 店家備料中，預計 ${twHM(st.until)} 備料完成（約還需 ${left} 分鐘）。可先預訂，備料完成後依序製作`);
  }
  else{
    const wm=waitMin(),man=waitManual();

    else{bn.className='';bn.textContent=isAdmin&&st.why!=='依營業時間'?`目前狀態：營業中（${st.why}）`:''}
  }

}
/* ===== 預估等候時間：店家端依「進行中的單數」和「最近出餐速度」估算，客人看得到；也可手動設定 ===== */
function waitAuto(){
  const all=Object.values(ORDERS),n=all.filter(o=>o.status==='new'||o.status==='making').length;
  const done=all.filter(o=>o.acceptedAt&&o.doneAt&&o.doneAt>o.acceptedAt).sort((a,b)=>b.doneAt-a.doneAt).slice(0,10);
  let avg=done.length>=3?done.reduce((a,o)=>a+(o.doneAt-o.acceptedAt),0)/done.length/60000:8;
  avg=Math.min(25,Math.max(4,avg));
  const min=Math.min(120,Math.ceil((10+n*avg*0.8)/5)*5);          // 基本 10 分鐘 + 每張單的製作時間，湊到 5 分鐘
  return{n,min,avg:Math.round(avg)};
}
let lastWaitMin=-1,lastWaitAt=0;
function publishWait(){
  if(!isAdmin||!window.FB)return;
  const w=waitAuto(),t=svNow();
  if(w.min===lastWaitMin&&t-lastWaitAt<5*60000)return;
  lastWaitMin=w.min;lastWaitAt=t;
  SHOP.wait={...(SHOP.wait||{}),n:w.n,min:w.min,at:t};updateStatusDisplay();
  FB.update(FB.ref(FB.db,'shop/wait'),{n:w.n,min:w.min,at:t}).catch(()=>{});
}
const waitManual=()=>{const w=SHOP.wait;return w&&w.manual&&+w.manual.until>svNow()?w.manual:null};
function waitMin(){
  const w=SHOP.wait,t=svNow();if(!w)return 0;
  const m=waitManual();if(m)return +m.min||0;
  if(!w.at||t-(+w.at)>20*60000)return 0;       // 超過 20 分鐘沒更新（店家平板沒開），就不顯示
  return +w.min||0;
}
async function setWaitManual(){
  const m=Math.round(+($('waitIn').value)||0);
  if(!(m>=1&&m<=180)){alert('請輸入 1～180 分鐘');return}
  try{await FB.update(FB.ref(FB.db,'shop/wait'),{manual:{min:m,until:svNow()+2*3600000,by:whoAmI()}});logAct('營業狀態',null,'',`預估等候時間手動設為 ${m} 分鐘（2 小時內有效）`)}
  catch(e){alert('設定失敗：'+(e.code||e.message));return}
  SHOP.wait={...(SHOP.wait||{}),manual:{min:m,until:svNow()+2*3600000}};updateStatusDisplay();openStatusSelector();
}
async function clearWaitManual(){
  try{await FB.remove(FB.ref(FB.db,'shop/wait/manual'));logAct('營業狀態',null,'','預估等候時間改回自動')}catch(e){alert('設定失敗：'+(e.code||e.message));return}
  if(SHOP.wait)delete SHOP.wait.manual;updateStatusDisplay();openStatusSelector();
}

async function setState(mode){

      SHOP.ovr=null;updateStatusDisplay();closeModal();

async function setOvr(mode){

/* 備料中：從現在開始，輸入或快選「備料完成時間」，客人會看到預計完成時間 */
let PREP={end:''};
const tenUp=t=>Math.ceil((t+TZ)/600000)*600000-TZ;                  // 往後湊到下一個整 10 分鐘（台灣時間）
function prepSlots(){const st=tenUp(svNow()),out=[];for(let i=0;i<60;i++)out.push(twHM(st+i*600000));return out}   // 10 分鐘為單位，最長 10 小時
function prepEndMs(hm){
  const n=normTime(hm);if(!n)return NaN;
  const t=svNow(),day0=t-((t+TZ)%DAYMS),[h,m]=n.split(':').map(Number);
  let e=day0+h*3600000+m*60000;if(e<=t)e+=DAYMS;                    // 輸入的時間已經過了，就當作是隔天
  return e;
}
function prepInfo(){
  const e=prepEndMs(PREP.end);
  if(isNaN(e))return '請輸入正確的完成時間，例如 18:30';
  const t=svNow(),mins=Math.round((e-t)/60000);
  if(mins>600)return '備料時間最長 10 小時，請輸入較近的時間';
  const nextDay=Math.floor((e+TZ)/DAYMS)>Math.floor((t+TZ)/DAYMS);
  return `預計 ${twHM(e)}${nextDay?'（隔天）':''} 備料完成，約 ${mins} 分鐘`;
}
function prepForm(){PREP={end:twHM(tenUp(svNow()+30*60000))};renderPrep()}
function renderPrep(){
  const t=svNow();
  $('mBox').innerHTML=`<h3>🟡 備料中</h3>
   <div class="modal-tip" style="text-align:left">從現在（${twHM(t)}）開始備料。選好或輸入<b>備料完成時間</b>（24 小時制），<b>客人會看到「預計幾點備料完成」</b>，備料期間客人可以先預訂；時間到了會依營業時間自動切換。</div>
   <div class="fm-row"><b>完成時間</b>${timeField('prep','prepEnd24',prepSlots())}</div>
   <div class="fm-line"><span id="prepInfo" style="font-weight:700">${esc(prepInfo())}</span></div>
   <div class="m-btns"><button class="btn-cancel" onclick="openStatusSelector()">返回</button><button class="btn-confirm" onclick="savePrep()">開始備料</button></div>`;
  $('modal').classList.add('open');
}
async function savePrep(){

let GO=null;
function showGenericOpts(item,cat){const opts=effOpts(item,cat);GO={item,opts,sel:opts.map(()=>[]),miss:false};renderGenericOpts()}
function goPrice(){return GO.opts.reduce((a,g,gi)=>a+GO.sel[gi].reduce((b,ci)=>b+(+g.ch[ci].p||0),0),+GO.item.price||0)}
function renderGenericOpts(){
  const {item,opts,sel,miss}=GO;
  const groups=opts.map((g,gi)=>{
    const bad=miss&&g.req&&!sel[gi].length;
    return `<div class="opt-section-title"${bad?' style="color:var(--bad)"':''}>${esc(g.n)}<span style="font-size:12px;color:${g.req?'var(--bad)':'var(--mu)'}">　${g.req?'必選':'選填'}${g.multi?'・可複選':''}</span></div>
     <div class="opt-grid">${g.ch.map((c,ci)=>`<button class="opt-btn ${sel[gi].includes(ci)?'selected':''}" onclick="goPick(${gi},${ci})">${esc(c.n)}${(+c.p)?`<small> ${c.p>0?'+':''}${c.p}</small>`:''}</button>`).join('')}</div>
     ${g.tip?`<div class="modal-tip">${esc(g.tip)}</div>`:''}`;
  }).join('');
  $('mBox').innerHTML=`<h3>${esc(item.name)}</h3>${groups}
   ${miss?'<div class="fm-err" style="display:block">請先選好標示「必選」的項目</div>':''}
   <div class="m-btns"><button class="btn-cancel" onclick="closeModal()">取消</button><button class="btn-confirm" onclick="goConfirm()">確認加入　$${goPrice()}</button></div>`;
  $('modal').classList.add('open');
}
function goPick(gi,ci){
  const g=GO.opts[gi],a=GO.sel[gi];
  if(g.multi){const i=a.indexOf(ci);i>=0?a.splice(i,1):a.push(ci)}
  else GO.sel[gi]=a[0]===ci?[]:[ci];
  renderGenericOpts();
}
function goConfirm(){
  const {item,opts,sel}=GO;
  if(opts.some((g,gi)=>g.req&&!sel[gi].length)){GO.miss=true;renderGenericOpts();return}
  const tags=[];opts.forEach((g,gi)=>sel[gi].forEach(ci=>tags.push(String(g.ch[ci].n).replace(/_/g,'-'))));
  add(tags.length?`${item.name} (${tags.join(', ')})`:item.name,goPrice(),tags.length?item.id+'_'+tags.join('_'):item.id);
  closeModal();
}

    <div class="fm-row"><b>內容物</b><textarea id="ieD" lang="zh-TW" rows="3" placeholder="用頓號或逗號分開，例如：豬耳朵、雞冠、豆干" style="flex:1">${esc((it.d||[]).join('、'))}</textarea></div>`:''}

async function meItemSave(){
  const c=ME.m[ME.ci],it=c.items[ME.ii],n=$('ieName').value.trim(),p=parseFloat($('iePrice').value);
  if(!n){alert('品名不能是空的');return}

  const b0={name:it.name,price:it.price,c:it.c||'',d:(it.d||[]).join('、')};
  it.name=n;it.price=p;
  if(c.combo){it.c=$('ieC').value.trim();it.d=$('ieD').value.split(/[、,，\n]/).map(x=>x.trim()).filter(Boolean)}
  const ch=[];
  if(b0.name!==n)ch.push(`名稱「${b0.name}」→「${n}」`);
  if(+b0.price!==p)ch.push(`價格 $${b0.price}→$${p}`);
  if(c.combo&&b0.c!==(it.c||''))ch.push('說明已修改');
  if(c.combo&&b0.d!==(it.d||[]).join('、'))ch.push(`內容物「${b0.d}」→「${(it.d||[]).join('、')}」`);
  if(await meSave('「'+n+'」已儲存')){if(ch.length)logAct('菜單編輯',null,'',`修改「${meSplit(c.k)[0]}」的品項「${b0.name}」：${ch.join('；')}`);meCat(ME.ci)}

/* 選項編輯器：kind = 'cat'（整個群組）或 'item'（單一品項） */
const meTarget=kind=>kind==='cat'?ME.m[ME.ci]:ME.m[ME.ci].items[ME.ii];
const chText=g=>g.ch.map(c=>c.n+((+c.p)?` ${c.p>0?'+':''}${c.p}`:'')).join('\n');
function parseCh(text){
  return String(text).split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const m=l.match(/^(.+?)\s*([+\-]\s*\d+(?:\.\d+)?)\s*$/);
    const n=(m?m[1]:l).replace(/_/g,'-').replace(/,/g,'，').trim(),p=m?parseFloat(m[2].replace(/\s/g,'')):0;
    return{n,p};
  });
}
function optEditorHtml(kind){
  const t=meTarget(kind);t.opts=t.opts||[];
  const gs=t.opts.map((g,gi)=>`<div class="og">
    <div class="fm-row"><b style="width:auto">選項名稱</b><input lang="zh-TW" value="${esc(g.n)}" oninput="meOptSet('${kind}',${gi},'n',this.value)"><button class="chip sm" style="color:var(--bad)" onclick="meOptDel('${kind}',${gi})">刪除</button></div>
    <div style="display:flex;gap:18px;margin:4px 0;font-size:14px"><label><input type="checkbox" ${g.req?'checked':''} onchange="meOptSet('${kind}',${gi},'req',this.checked)"> <b>必選</b>（沒選不能加入）</label><label><input type="checkbox" ${g.multi?'checked':''} onchange="meOptSet('${kind}',${gi},'multi',this.checked)"> 可複選</label></div>
    <div style="font-size:12px;color:var(--mu)">每行一個選項；要加價就在後面寫「+5」，例如：泰式 +5</div>
    <textarea rows="${Math.max(3,g.ch.length+1)}" lang="zh-TW" style="width:100%;box-sizing:border-box" onchange="meOptCh('${kind}',${gi},this.value)">${esc(chText(g))}</textarea>
    <div class="fm-row"><b style="width:auto;font-size:13px">提示文字</b><input lang="zh-TW" value="${esc(g.tip||'')}" placeholder="可不填，例如：未選時以不辣製作" oninput="meOptSet('${kind}',${gi},'tip',this.value)"></div></div>`).join('');
  return gs+`<div class="chips" style="margin-top:6px"><button class="chip sm" onclick="meOptAdd('${kind}','口味')">＋ 口味選擇</button><button class="chip sm" onclick="meOptAdd('${kind}','辣度')">＋ 辣度選擇</button><button class="chip sm" onclick="meOptAdd('${kind}','')">＋ 自訂選項</button></div>
    <div class="m-btns"><button class="btn-confirm" onclick="meOptSave('${kind}')">儲存選項</button></div>`;
}
function meOptSet(kind,gi,key,val){meTarget(kind).opts[gi][key]=val}
function meOptCh(kind,gi,text){const g=meTarget(kind).opts[gi];g.ch=parseCh(text);$('oe_'+kind).innerHTML=optEditorHtml(kind)}
function meOptAdd(kind,preset){
  const t=meTarget(kind);t.opts=t.opts||[];
  const ch=preset==='口味'?[{n:'原味',p:0},{n:'蒜味',p:0}]:preset==='辣度'?[{n:'不辣',p:0},{n:'小辣',p:0},{n:'中辣',p:0},{n:'大辣',p:0}]:[{n:'選項一',p:0},{n:'選項二',p:0}];
  t.opts.push({n:preset||'自訂選項',req:false,multi:false,tip:'',ch});
  $('oe_'+kind).innerHTML=optEditorHtml(kind);
}
function meOptDel(kind,gi){meTarget(kind).opts.splice(gi,1);$('oe_'+kind).innerHTML=optEditorHtml(kind)}
async function meOptSave(kind){
  const t=meTarget(kind);
  t.opts=(t.opts||[]).filter(g=>g.ch&&g.ch.length);
  for(const g of t.opts){g.n=(g.n||'').trim()||'選項';if(!g.tip)delete g.tip}
  const who=kind==='cat'?`群組「${meSplit(ME.m[ME.ci].k)[0]}」`:`「${meSplit(ME.m[ME.ci].k)[0]}」的品項「${t.name}」`;
  const sum=t.opts.map(g=>`${g.n}（${g.req?'必選':'選填'}${g.multi?'、可複選':''}：${g.ch.map(c=>c.n+((+c.p)?(c.p>0?'+':'')+c.p:'')).join('/')}）`).join('；')||'（已清除所有選項）';
  if(await meSave('選項已儲存')){logAct('菜單編輯',null,'',`${who}的選項：${sum}`);kind==='cat'?meCat(ME.ci):meItem(ME.ii)}
}

function timeSlots(full){
  /* 客人：從現在之後的每 10 分鐘到 23:50；店家（full）：整天 00:00～23:50 */
  const now=new Date();now.setSeconds(0,0);
  const t=full?new Date(now.getFullYear(),now.getMonth(),now.getDate(),0,0,0,0):new Date(now);
  if(!full)t.setMinutes(Math.ceil(t.getMinutes()/10)*10);
  const day=now.getDate(),out=[];
  while(t.getDate()===day){
    out.push(String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0'));
    t.setMinutes(t.getMinutes()+10);
  }
  return out;
}

function submitCheckout(){

  CK.err=true;
  if(isAdmin&&CK.late&&!(lateMs()>0)){alert('請輸入補單的下單日期與時間（時間為 24 小時制，例如 12:35）');return}
  if(normTime(CK.time))CK.time=normTime(CK.time);
  if(!nameValid()||!phoneValid()||!timeOK()||!gearOK()){renderCheckout();return}
  const t=calcTotals();
  window.pendingOrder={
    name:CK.name.trim()||'現場客',phone:CK.phone,src:isAdmin?(CK.src||'現場'):(CK.walkin?'現場':'線上'),time:CK.time,note:CK.note.trim(),

    gear:[...CK.gear],pay:CK.pay,items:JSON.parse(JSON.stringify(cart)),

  };
  if(!isAdmin&&CK.pay==='轉帳'&&CK.x5){if(!/^\d{5}$/.test(CK.x5)){alert('轉帳帳號後五碼請輸入 5 位數字，或留空');return}window.pendingOrder.x5=CK.x5}
  if(CK.pay==='Linepay'){
    if(!CK.lpMode){alert('請選擇 LINE Pay 付款方式：現場掃碼或線上付款');return}
    if(CK.lpMode==='online'){
      if(!LINE_HOOK){alert('目前無法使用線上付款');return}
      if(isAdmin&&CK.late){alert('補單無法使用線上付款，請改選「現場掃碼」');return}

  renderReceipt();
}

let submitting=false;
async function confirmOrder(){
  const o=window.pendingOrder;if(!o||submitting)return;
  if(isClosed()){alert('店家目前休息中，暫停接單');return}
  if(!isAdmin&&!window.FB){alert('無法連線到雲端，請檢查網路後重試');return}
  submitting=true;
  const btn=$('cfBtn');if(btn){btn.disabled=true;btn.textContent='送出中…'}
  const ts=o.late?o.lateAt:Date.now(),day=o.late?bizDay(ts):today8();
  if(o.late&&o.lateNo)o.no=/^\d+$/.test(o.lateNo)?o.lateNo.padStart(3,'0'):o.lateNo;
  o.date=day;o.createdAt=ts;o.status=o.late?(o.lateStatus||'picked'):'new';
  if(o.late&&o.latePaid){o.paid=true;o.paidAt=ts;o.received=o.total;o.change=0}
  const data=JSON.parse(JSON.stringify(o));['lateAt','lateStatus','latePaid','lateNo'].forEach(k=>delete data[k]);
  if(isAdmin){
    /* 店家下單：斷線時先暫存在這台裝置，連線後自動補送 */
    const key='L'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    try{
      if(!window.FB||!CONNECTED)throw new Error('offline');
      let held=[];
      if(!o.late){
        let rs=await withTimeout(reserveStock(o.items,false),10000);
        if(!rs.ok){
          if(!confirm(`「${rs.name}」庫存只剩 ${rs.left} 份，仍要送出這張單嗎？`)){if(btn){btn.disabled=false;btn.textContent='確認送出'}submitting=false;return}
          rs=await withTimeout(reserveStock(o.items,true),10000);
        }
        held=rs.done||[];
      }
      try{o.no=await withTimeout(sendOrder(key,{...data},day),10000)}catch(er){await releaseStock(held);throw er}
      if(!o.late)notifyLine(key);
      if(o.lp){await lpGo(key,o);submitting=false;return}
      if(o.late)logAct('補單',null,o.no,`下單時間 ${fmtDT(ts)}｜${o.name||'現場客'} $${o.total}${o.lateStatus&&o.lateStatus!=='picked'?'｜狀態 '+(ST[o.lateStatus]||o.lateStatus):''}`);
      showDone(o);
    }catch(e){OUT.push({key,day,data});saveOut();showQueued(o)}
  }else{
    let held=[],written=false;
    try{
      const rs=await reserveStock(o.items,false);
      if(!rs.ok){
        alert(`「${rs.name}」目前只剩 ${rs.left} 份，請調整數量後再送出。`);
        if(btn){btn.disabled=false;btn.textContent='確認送出'}
        submitting=false;return;
      }
      held=rs.done;
      const r=await FB.runTransaction(FB.ref(FB.db,'counters/'+day),n=>(n||0)+1);
      o.no=String(r.snapshot.val()).padStart(3,'0');data.no=o.no;
      const nref=FB.push(FB.ref(FB.db,'orders'));
      await FB.set(nref,data);written=true;
      saveMy(nref.key,o.no);
      if(!isAdmin&&o.phone){try{localStorage.setItem('cust_info',JSON.stringify({name:o.name,phone:o.phone}))}catch(e){}}
      notifyLine(nref.key);
      if(o.lp){await lpGo(nref.key,o);submitting=false;return}
      showDone(o);
    }catch(e){
      if(!written)await releaseStock(held);
      const em=String(e.code||e.message);
      alert(/PERMISSION/i.test(em)?'訂單無法送出：店家目前可能已暫停接單，請稍後再試。（'+em+'）':'訂單送出失敗，請檢查網路後再試一次。\n（'+em+'）');
      if(btn){btn.disabled=false;btn.textContent='確認送出'}
    }
  }
  submitting=false;
}

let authMsg='';
async function onAuth(user){
  if(!ADMIN_PARAM)return;
  if(user){
    UID=user.uid;
    let r=null;
    try{r=(await FB.get(FB.ref(FB.db,'roles/'+user.uid))).val();localStorage.setItem('role_'+user.uid,r||'')}
    catch(e){r=localStorage.getItem('role_'+user.uid)||null}
    if(r!=='manager'&&r!=='staff'){
      authMsg='此帳號尚未被授權。請店長到 Firebase 資料庫 roles 新增這個帳號：名稱貼 '+user.uid+'，值填 staff（或 manager）。';
      FB.signOut(FB.auth);return;
    }
    ROLE=r;
    muted=false;localStorage.removeItem('alarm_muted');
    isAdmin=true;setAdminUI(true);startOrders();startAlarm();keepAwake();updateSoundBtn();
    toast(isManager()?'已登入：店長':'已登入：店員（可接單、結帳；無法刪單與查看統計）');
    setTimeout(checkOpenReminder,5000);
    if(isManager())setTimeout(checkBackupReminder,9000);
  }else{
    isAdmin=false;ROLE='staff';setAdminUI(false);stopOrders();stopAlarm();const m=authMsg;authMsg='';openAdminLogin(m);
  }
}

async function doLogin(){

let actx=null;
function unlockAudio(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
function beep(){
  if(!actx)return;
  [0,.28,.56].forEach(t=>{
    const o=actx.createOscillator(),g=actx.createGain();
    o.type='sine';o.frequency.value=880;g.gain.value=.3;
    o.connect(g);g.connect(actx.destination);
    o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.18);
  });
}
function toast(msg,fn){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  t.onclick=()=>{t.classList.remove('show');(fn||openOrders)()};
  clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),8000);
}

let ORDERS={},ordStart=0,ordUnsub=null,ordInit=false,viewingOrders=false,viewingStats=false,viewingTrack=false,ordFilter='active';
const ST={new:'待接單',making:'製作中',done:'待取餐',picked:'已取餐',cancelled:'已拒單'};
const NEXT={new:['making','接單'],making:['done','製作完成'],done:['picked','待取餐']};
function startOrders(){
  stopOrders();
  ordStart=bizStart();
  const q=FB.query(FB.ref(FB.db,'orders'),FB.orderByChild('createdAt'),FB.startAt(ordStart));
  ordUnsub=FB.onValue(q,sn=>{
    const v=sn.val()||{};
    const fresh=Object.keys(v).filter(id=>!ORDERS[id]&&v[id].status==='new'&&!v[id].staff);

/* ===== 異常提醒：金額對不起來、價格低於菜單價、疑似重複下單 ===== */
function anomalies(o){
  const w=[];if(!o||o.status==='cancelled')return w;
  const items=o.items||[],sum=items.reduce((a,x)=>a+(+x.price||0)*(+x.qty||0),0);
  if(!o.staff&&!o.late){
    if(o.subtotal!=null&&Math.abs(sum-(+o.subtotal))>0.5)w.push(`品項加總 $${sum} 和小計 $${o.subtotal} 不一致`);
    if(o.baseTotal==null&&o.subtotal!=null&&Math.abs((+o.subtotal+(+o.extra||0)-(+o.discount||0))-(+o.total))>0.5)w.push(`應付總額 $${o.total} 和小計不一致`);
    items.forEach(x=>{
      const id=baseId(String(x.id||'')),it=find(id);
      if(!(+x.qty>=1)||+x.qty>50)w.push(`「${x.name}」數量 ${x.qty} 異常`);
      if(!it||!(it.price>0))return;
      const cat=catOf(id),neg=effOpts(it,cat).some(g=>g.ch.some(c=>(+c.p)<0));
      if(!neg&&(+x.price)<it.price)w.push(`「${x.name}」單價 $${x.price} 低於菜單價 $${it.price}`);
    });
  }
  if(o.phone){
    const dup=Object.entries(ORDERS).some(([id,p])=>id!==o.id&&p.phone===o.phone&&p.status!=='cancelled'&&p.total===o.total&&Math.abs((p.createdAt||0)-(o.createdAt||0))<=180000);
    if(dup)w.push('疑似重複下單（同電話、同金額、3 分鐘內）');
  }
  return w;
}

const baseName=n=>String(n).replace(/\s+\(.*\)\s*$/,'');

function summarize(list){
  const ok=list.filter(o=>o.status!=='cancelled');
  const rev=ok.reduce((a,o)=>a+(o.total||0),0);
  const pay={},src={},items={};
  ok.forEach(o=>{
    const p=o.pay||'未填';pay[p]=pay[p]||{n:0,s:0};pay[p].n++;pay[p].s+=o.total||0;
    const sr=o.src||'線上';src[sr]=src[sr]||{n:0,s:0};src[sr].n++;src[sr].s+=o.total||0;
    (o.items||[]).forEach(x=>{const k=baseName(x.name);items[k]=items[k]||{q:0,s:0};items[k].q+=x.qty;items[k].s+=x.qty*x.price});
  });
  const un=ok.filter(o=>!o.paid);
  return{ok,rev,cancelled:list.length-ok.length,pay,src,items,unpaid:{n:un.length,s:un.reduce((a,o)=>a+(o.total||0),0)}};
}

async function loadHistory(){

function exportCSV(){
  if(!HIST.length){alert('請先查詢，且區間內要有訂單');return}
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const head=['日期時間','訂單編號','取餐時間','訂購人','電話','用餐者','餐點','口味','辣度','鹹度','配備','備註','本筆小計','整單小計','加價(+)/折扣(-)','整單應付總額','付款方式','收款','來源','狀態'];
  const rows=[];
  HIST.forEach(o=>{
    const P=peopleOf(o)||[{name:o.name,flavor:o.flavor,spice:o.spice,salt:o.salt,note:'',items:o.items||[]}];
    const n=P.length,adj=(o.extra||0)-(o.discount||0);
    P.forEach((pp,i)=>{
      const first=i===0;
      const sub=pp.items.reduce((a,x)=>a+x.price*x.qty,0);
      const note=n>1?[pp.note,first&&o.note?'整單備註：'+o.note:''].filter(Boolean).join('｜'):(o.note||'');
      rows.push([fmtDT(o.createdAt),'#'+o.no,o.time,o.name,o.phone||'',pp.name||o.name,
        pp.items.map(x=>x.name+'×'+x.qty).join('；'),pp.flavor||'',pp.spice||'',pp.salt||'',(o.gear||[]).join('、'),note,
        sub,first?o.subtotal:'',first?adj:'',first?o.total:'',
        o.pay,o.paid?'已收款':'未收款',(o.src||'線上')+(o.late?'（補單）':''),ST[o.status]||o.status]);
    });
  });
  const csv='\ufeff'+[head,...rows].map(r=>r.map(q).join(',')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='訂單_'+$('hS').value+'_'+$('hE').value+'.csv';
  document.body.appendChild(a);a.click();a.remove();
}

const fmtT=t=>{const d=new Date(t);return p2(d.getHours())+':'+p2(d.getMinutes())};
function peopleOf(o){
  if(o.people&&o.people.length>1)return o.people.map((pp,i)=>({...pp,items:(o.items||[]).filter(x=>(x.p||0)===i)}));
  return null;
}
function incText(item,cat){        // 套餐才有內含物
  if(!item||!cat||!cat.combo)return '';
  const ch=String(item.c||'').replace(/（可選[^）]*）/,'').replace(/^雞肉[：:]\s*/,'');
  return [ch,...(item.d||[])].filter(Boolean).join('、');
}
function comboLines(x){
  const inc=x.inc!=null?x.inc:(()=>{const id=baseId(x.id);return incText(find(id),catOf(id))})();
  if(!inc)return '';
  return `<div class="mu" style="margin:1px 0 5px 14px;line-height:1.5">└ 內含${x.qty>1?'（每份）':''}：${esc(inc)}</div>`;
}
function itemsBlock(o,withOpt){
  const P=peopleOf(o);
  const line=x=>withOpt?`<div>${esc(x.name)} × ${x.qty}</div>${comboLines(x)}`:`${esc(x.name)} × ${x.qty}`;
  const join=withOpt?'':'<br>';
  if(!P)return(o.items||[]).map(line).join(join);
  return P.map(pp=>`<div class="pg"><b>👤 ${esc(pp.name)}</b>${withOpt?`<span class="mu">　${esc([pp.flavor,pp.spice,pp.salt].filter(Boolean).join(' / '))}${pp.note?'｜備註：'+esc(pp.note):''}</span>`:''}<br>${pp.items.map(line).join(join)}</div>`).join('');
}

async function saveEdit(){

    const t2=normTime(ED.at);
    if(!ED.d||!t2){alert('請輸入正確的下單日期與時間（時間為 24 小時制，例如 12:35）');return}
    ED.at=t2;
    if(ED.d!==ED.d0||t2!==ED.t0){newTs=new Date(ED.d+'T'+t2+':00').getTime();if(!(newTs>0)){alert('下單日期或時間不正確');return}}
  }
  const multi=ED.people.length>1,o=ED.orig;
  const items=ED.items.map(x=>({id:x.id||'',name:String(x.name).trim(),price:parseFloat(x.price)||0,qty:Math.max(1,parseInt(x.qty)||1),p:multi?Math.min(parseInt(x.p)||0,ED.people.length-1):0})).filter(x=>x.name);
  if(!items.length){alert('至少要有一項餐點');return}
  const pp=ED.people.map((x,i)=>({name:x.name.trim()||'第'+(i+1)+'位',flavor:x.flavor||'原味',spice:x.spice||'不辣',salt:x.salt||'正常',note:x.note.trim()}));
  const sub=items.reduce((a,x)=>a+x.price*x.qty,0),adj=parseFloat(ED.adj)||0,total=Math.max(0,sub+adj);
  const data={name:ED.name.trim()||'現場客',phone:ED.phone,time:ED.time,note:ED.note.trim(),src:ED.src,
    flavor:pp[0].flavor,spice:pp[0].spice,salt:pp[0].salt,people:multi?pp:null,gear:ED.gear.length?ED.gear:null,
    pay:ED.pay,status:ED.status,items,subtotal:sub,extra:adj>0?adj:0,discount:adj<0?-adj:0,total,updatedAt:Date.now()};
  if(newTs){data.createdAt=newTs;data.date=bizDay(newTs)}
  const parts=[];
  if(ED.time!==o.time)parts.push(`取餐時間改為 ${ED.time}（原 ${o.time}）`);
  const sig=a=>(a||[]).map(x=>`${x.p||0}|${String(x.name).trim()}|${+x.price}|${+x.qty}`).join(';');
  if(sig(items)!==sig(o.items))parts.push(`餐點內容已調整，應付總額 $${total}`);
  if(parts.length)data.notice={at:Date.now(),text:parts.join('；')};
  const ch=[];
  if(newTs)ch.push(`下單日期 ${ED.d0} ${ED.t0}→${ED.d} ${ED.at}`);
  if(ED.time!==o.time)ch.push(`取餐時間 ${o.time}→${ED.time}`);
  if(total!==(+o.total||0))ch.push(`金額 $${o.total}→$${total}`);
  if(sig(items)!==sig(o.items))ch.push('餐點內容');
  if(ED.pay!==o.pay)ch.push(`付款 ${o.pay}→${ED.pay}`);
  if(ED.status!==o.status)ch.push(`狀態 ${ST[o.status]||o.status}→${ST[ED.status]||ED.status}`);
  if(ED.name.trim()!==o.name||ED.phone!==(o.phone||'')||ED.note.trim()!==(o.note||''))ch.push('姓名/電話/備註');
  const b=$('edSave');b.disabled=true;b.textContent='儲存中…';
  try{await FB.update(FB.ref(FB.db,'orders/'+ED.id),data);if(ch.length)logAct('編輯',ED.id,ED.no,ch.join('；'));
    if(newTs&&bizDay(newTs)!==today8())toast(`✅ 已移到 ${dayPlain(bizDay(newTs)).slice(5)} 的營業日，可在「歷史訂單」或日報表查看`);
    backFromEdit()}
  catch(e){alert('儲存失敗：'+(e.code||e.message));b.disabled=false;b.textContent='儲存'}
}
async function delOrder(id,no,from){
  if(!isManager()){alert('只有店長可以永久刪除訂單，請改用「拒單」');return}

/* ===== 取餐 → 自動結帳完成，並跳出結帳畫面（可改付款方式、折扣、折讓）===== */
let PAY=null;
const payBase=o=>{const sub=+o.subtotal;return(sub>0?sub:(o.items||[]).reduce((a,x)=>a+(+x.price||0)*(+x.qty||0),0))+(+o.extra||0)};
const payTotal=()=>{
  let p=parseFloat(PAY.pct);if(isNaN(p))p=100;p=Math.min(100,Math.max(0,p));
  const off=Math.max(0,parseFloat(PAY.off)||0);
  return Math.max(0,Math.round(PAY.base*p/100)-off);
};
async function pickup(id){
  const o=ORDERS[id];if(!o)return;
  if(o.paid){        // 客人先付過款的單：直接完成取餐
    try{await FB.update(FB.ref(FB.db,'orders/'+id),{status:'picked',pickedAt:Date.now(),updatedAt:Date.now()})}
    catch(e){alert('取餐失敗：'+(e.code||e.message));return}
    toast(`✅ #${o.no} 已取餐（原本已收款，訂單結束）`);
    return;
  }
  openPay(id,true);   // 取餐一定會進結帳畫面；按下「結帳」才算取餐完成
}
function openPay(id,after,fresh){
  const o=fresh||ORDERS[id];if(!o)return;
  PAY={id,o,after:!!after,pay:o.pay||'現金',recv:'',pct:'100',off:String(+o.discount||0),base:payBase(o)};
  viewingOrders=viewingStats=viewingTrack=false;
  $('mBox').className='m-box wide';renderPay();$('modal').classList.add('open');
}
function payBack(){openOrders()}
function payMethod(v){PAY.pay=v;if(v!=='現金')PAY.recv='';renderPay()}
function payRecv(v){PAY.recv=String(v);renderPay()}
function payChgText(){
  const total=payTotal();
  if(PAY.recv==='')return'$0';
  const c=(parseFloat(PAY.recv)||0)-total;
  return c>=0?'$'+c:'不足 $'+(-c);
}
function payCalc(){
  const t=$('payTotal');if(t)t.textContent='$'+payTotal();
  const el=$('payChg');if(el){el.textContent=payChgText();el.style.color=payChgText().startsWith('不足')?'var(--bad)':''}
}
function renderPay(){
  const o=PAY.o,total=payTotal(),cash=PAY.pay==='現金';
  const line=x=>`<div class="rc-item"><span class="nm">${esc(x.name)}<small>× ${x.qty}</small></span><span class="pr">$${x.price*x.qty}</span></div>`;
  const PP=peopleOf(o);
  const items=PP?PP.map(pp=>`<div class="fm-title" style="text-align:left">👤 ${esc(pp.name)}</div>${pp.items.map(line).join('')}`).join(''):(o.items||[]).map(line).join('');
  const quick=[total,100,200,500,1000,2000].filter((v,i,a)=>v>0&&a.indexOf(v)===i);
  const tip=PAY.after?`<div class="modal-tip">📦 客人取餐中。請確認金額與付款方式（可修改<b>付款方式、折扣、折讓</b>），按下「<b>結帳</b>」後，這筆訂單就完成取餐並結束。若按「返回」，訂單會維持「待取餐」。</div>`
    :(o.paid?`<div class="modal-tip">此訂單已收款（${esc(o.pay||'')}${o.received?'，收 $'+o.received:''}），可重新結帳修改。</div>`:'');
  $('mBox').innerHTML=`
   <div class="oh"><h3>💰 結帳 #${esc(o.no)}　${esc(o.name)}</h3><button onclick="payBack()">返回</button></div>
   ${tip}
   <div class="fm-sec">${items}
    <div class="fm-line" style="border-top:1px dashed var(--ln);padding-top:8px"><span>小計金額</span><span>$${PAY.base}</span></div>
    <div class="fm-row"><b style="width:auto">折扣（%數）</b><input type="number" min="0" max="100" inputmode="decimal" value="${esc(PAY.pct)}" placeholder="100＝不打折" oninput="PAY.pct=this.value;payCalc()" onchange="renderPay()"><b style="width:auto">折讓（－$）</b><input type="number" min="0" inputmode="numeric" value="${esc(PAY.off)}" placeholder="0" oninput="PAY.off=this.value;payCalc()" onchange="renderPay()"></div>
    <div style="text-align:left;font-size:12px;color:var(--mu);line-height:1.5">折扣：打 9 折請輸入 90、打 85 折輸入 85；折讓是直接扣掉的金額。</div>
    <div class="fm-total"><span>應付總額</span><b id="payTotal">$${total}</b></div></div>
   <div class="fm-sec">
    <div class="fm-title">付款方式${o.pay&&o.pay!==PAY.pay?`（客人原選：${esc(o.pay)}）`:''}</div>
    <div class="chips">${['現金','轉帳','Linepay','全支付'].map(v=>`<button class="chip${PAY.pay===v?' on':''}" onclick="payMethod('${v}')">${v}</button>`).join('')}</div>
    ${cash?`<div class="fm-row"><b style="width:auto">收到金額</b><input id="payRecv" type="number" inputmode="numeric" value="${esc(PAY.recv)}" placeholder="輸入收到的金額" oninput="PAY.recv=this.value;payCalc()"></div>
     <div class="chips">${quick.map((v,i)=>`<button class="chip" onclick="payRecv(${v})">${i===0?'剛好 $'+v:'$'+v}</button>`).join('')}</div>
     <div class="fm-total"><span>找零</span><b id="payChg" style="${payChgText().startsWith('不足')?'color:var(--bad)':''}">${payChgText()}</b></div>`
     :`<div style="color:var(--mu);font-size:14px">${esc(PAY.pay)} 無需找零，確認款項已收到即可。</div>`}
   </div>
   <div class="m-btns"><button class="btn-cancel" onclick="payBack()">返回</button><button class="btn-confirm" id="payBtn" onclick="confirmPay()">結帳</button></div>`;
}
async function confirmPay(){
  const total=payTotal(),cash=PAY.pay==='現金',o=PAY.o;
  let recv=total;
  if(cash&&PAY.recv!==''){recv=parseFloat(PAY.recv);if(!(recv>=total)){alert('收到的金額不足 $'+total);return}}
  const chg=cash?recv-total:0;
  const data={pay:PAY.pay,paid:true,paidAt:Date.now(),received:recv,change:chg,total,discount:Math.max(0,PAY.base-total),updatedAt:Date.now()};
  if(o.lp==='pending')data.lp='staff';      // 店員手動結帳，不再等線上付款
  if(PAY.after||o.status==='done'){data.status='picked';data.pickedAt=Date.now()}    // 結帳＝客人取餐完成，訂單結束
  const b=$('payBtn');b.disabled=true;b.textContent='處理中…';
  try{
    await FB.update(FB.ref(FB.db,'orders/'+PAY.id),data);
    const adj=[],pct=parseFloat(PAY.pct)||100,off=parseFloat(PAY.off)||0;      // 單純結帳不記；有改付款方式、打折、折讓、金額才記
    if(PAY.pay!==(o.pay||''))adj.push(`付款方式 ${o.pay||'—'}→${PAY.pay}`);
    if(pct<100)adj.push(`折扣 ${pct}%`);
    if(off>0&&off!==(+o.discount||0))adj.push(`折讓 $${off}`);
    if(total!==(+o.total||0))adj.push(`金額 $${o.total}→$${total}`);
    if(adj.length)logAct('結帳調整',PAY.id,o.no,adj.join('｜'));
  }catch(e){alert('結帳失敗：'+(e.code||e.message));b.disabled=false;b.textContent='結帳';return}
  $('mBox').innerHTML=`<div class="rc-done"><div class="ok">✅</div><h3>結帳完成 #${esc(o.no)}</h3>
    <div class="rc-row" style="justify-content:center;gap:8px"><span>${esc(PAY.pay)}</span><span style="color:var(--ac);font-weight:800">$${total}</span></div>
    ${cash?`<div class="rc-no">找零 $${chg}</div><div class="rc-row" style="justify-content:center;gap:8px"><span>收到</span><span>$${recv}</span></div>`:''}
    <div class="modal-tip" style="text-align:left;margin-top:10px">這筆訂單已結束。</div>
   </div><div class="m-btns"><button class="btn-confirm" onclick="openOrders()">完成</button></div>`;
}

/* ===== 斷線暫存 / 補送 ===== */
let CONNECTED=false,everConnected=false,netChecked=false,OUT=[],flushing=false;
try{OUT=JSON.parse(localStorage.getItem('outbox')||'[]')}catch(e){OUT=[]}
function saveOut(){localStorage.setItem('outbox',JSON.stringify(OUT));updateNet()}
function updateNet(){
  const b=$('netbar');if(!b)return;
  if(OUT.length){b.className='net-bad';b.innerHTML=`⚠ ${CONNECTED?'正在補送':'網路中斷'}：有 ${OUT.length} 筆訂單暫存在這台裝置　<button onclick="flushOutbox(true)">立即補送</button>`}
  else if(!CONNECTED&&window.FB&&(everConnected||netChecked)){b.className='net-bad';b.textContent='⚠ 網路連線中斷，恢復後會自動同步'}
  else{b.className='';b.textContent=''}
}
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),ms))]);
async function sendOrder(key,data,day){
  const rf=FB.ref(FB.db,'orders/'+key);
  const ex=await FB.get(rf);
  if(ex.exists())return ex.val().no;
  if(!data.no){const r=await FB.runTransaction(FB.ref(FB.db,'counters/'+day),n=>(n||0)+1);data.no=String(r.snapshot.val()).padStart(3,'0')}
  await FB.set(rf,data);
  return data.no;
}
async function flushOutbox(manual){
  if(flushing||!OUT.length||!window.FB||!isAdmin)return;
  if(!CONNECTED&&manual!==true)return;
  flushing=true;let ok=0;
  for(const it of [...OUT]){
    try{
      if(!it.reserved&&!it.data.late&&it.day===today8()){await withTimeout(reserveStock(it.data.items,true),12000);it.reserved=true;saveOut()}
      await withTimeout(sendOrder(it.key,{...it.data},it.day),12000);OUT=OUT.filter(x=>x.key!==it.key);ok++;saveOut();if(!it.data.late)notifyLine(it.key)}
    catch(e){break}
  }
  flushing=false;
  if(ok)toast(`✅ 已補送 ${ok} 筆暫存訂單`);
}
function showQueued(o){
  $('mBox').innerHTML=`<div class="rc-done"><div class="ok">⚠️</div><h3>網路中斷，訂單已暫存</h3>
   <div class="modal-tip" style="text-align:left;margin:8px 0">這筆訂單已暫存在這台裝置（目前共 ${OUT.length} 筆待補送），網路恢復後會自動送出並產生訂單編號。請保持店家頁面開啟。</div>
   <div class="rc-row" style="justify-content:center;gap:8px"><span>取餐時間</span><span>${esc(o.time)}</span></div>
   <div class="rc-row" style="justify-content:center;gap:8px"><span>應付總額</span><span style="color:var(--ac);font-weight:800">$${o.total}（${esc(o.pay)}）</span></div></div>
   <div class="m-btns"><button class="btn-confirm" onclick="finishOrder()">完成</button></div>`;
}

/* ===== LINE Pay 線上付款：請 Apps Script 向 LINE Pay 要付款連結，再把客人帶過去 ===== */
async function lpGo(id,o){
  $('mBox').innerHTML='<div class="rc-done"><div class="ok">💳</div><h3>前往 LINE Pay 付款…</h3><div class="modal-tip" style="text-align:left">訂單 #'+esc(o&&o.no||'')+' 已送出。請在 LINE Pay 完成付款，付款成功店家才會開始製作。</div></div>';
  let r=null;
  try{
    const res=await fetch(LINE_HOOK,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({type:'lpPay',id,adm:isAdmin})});
    r=await res.json();
  }catch(e){r={ok:false,err:'連線失敗'}}
  if(r&&r.ok&&r.url){location.href=r.url;return}
  $('mBox').innerHTML=`<div class="rc-done"><div class="ok">⚠️</div><h3>訂單已送出，但付款尚未完成</h3><div class="modal-tip" style="text-align:left">無法開啟 LINE Pay（${esc(r&&r.err||'未知原因')}）。<br>您可以按「重新付款」再試一次，或直接到店付款。</div></div>
   <div class="m-btns"><button class="btn-cancel" onclick="finishOrder();${isAdmin?'':'openTrack()'}">${isAdmin?'完成':'查看訂單'}</button><button class="btn-confirm" onclick="lpRetry('${id}')">重新付款</button></div>`;
}
function lpRetry(id){lpGo(id,MYD[id]||{no:''})}
function lpReturn(){

const DENOMS=[1000,500,100,50,10,5,1];
const EXP_TYPES=[['進貨','進貨/材料'],['雜支','雜支'],['退款','退款'],['其他','其他支出'],['存鈔','存鈔（存起來）'],['補入','補入收銀機']];
const expLabel=k=>(EXP_TYPES.find(x=>x[0]===k)||[k,k])[1];
const dayStartMs=day=>new Date(+day.slice(0,4),+day.slice(4,6)-1,+day.slice(6,8),2,0,0,0).getTime();
const dayPlain=day=>day.slice(0,4)+'/'+day.slice(4,6)+'/'+day.slice(6,8);
const dayWeek=day=>'週'+'日一二三四五六'[new Date(dayStartMs(day)).getDay()];
const dayLabel=day=>dayPlain(day)+'（'+dayWeek(day)+'）';
const shiftDay=(day,n)=>{const d=new Date(dayStartMs(day));d.setDate(d.getDate()+n);return d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())};

async function fetchDayOrders(day){
  const a=dayStartMs(day),b=a+86400000-1;
  const sn=await FB.get(FB.query(FB.ref(FB.db,'orders'),FB.orderByChild('createdAt'),FB.startAt(a),FB.endAt(b)));
  return Object.values(sn.val()||{});
}
function salesOf(list){
  const ok=list.filter(o=>o.status!=='cancelled');
  const r={count:ok.length,voided:list.length-ok.length,revenue:0,cash:0,transfer:0,linepay:0,allpay:0,unpaidN:0,unpaid:0};
  ok.forEach(o=>{
    const t=+o.total||0;r.revenue+=t;
    if(!o.paid){r.unpaidN++;r.unpaid+=t;return}
    if(o.pay==='現金')r.cash+=t;else if(o.pay==='轉帳')r.transfer+=t;else if(o.pay==='Linepay')r.linepay+=t;else if(o.pay==='全支付')r.allpay+=t;
  });
  return r;
}
function calcDay(cb,sales){
  const exps=Object.values(cb.expenses||{});
  const sum=f=>exps.filter(f).reduce((a,e)=>a+(+e.amount||0),0);
  const expense=sum(e=>e.type!=='存鈔'&&e.type!=='補入'),deposit=sum(e=>e.type==='存鈔'),topup=sum(e=>e.type==='補入');
  const hasOpen=!!cb.open,hasClose=!!cb.close,open=hasOpen?(+cb.open.total||0):0;
  const expected=open+sales.cash+topup-expense-deposit;
  const close=hasClose?(+cb.close.total||0):null;
  return{expense,deposit,topup,hasOpen,hasClose,open,expected,close,diff:hasClose?Math.round((close-expected)*100)/100:null};
}

/* --- 手續費、彙整計算、月報表 --- */
const FEES={Linepay:0.023,'全支付':0.02};   // ← 手續費率：Linepay 2.3%、全支付 2%（日後費率改了，改這一行）
const feeOf=(k,amt)=>Math.round((+amt||0)*(FEES[k]||0));
const rateTxt=k=>(FEES[k]*100).toFixed((FEES[k]*100)%1?1:0)+'%';
const feesOf=sales=>{const fl=feeOf('Linepay',sales.linepay),fa=feeOf('全支付',sales.allpay);return{fl,fa,fee:fl+fa,net:(+sales.revenue||0)-fl-fa}};
function figsFrom(orders,all,filter){
  const by={};
  orders.forEach(o=>{if(!o||!o.createdAt)return;const d=bizDay(o.createdAt);(by[d]=by[d]||[]).push(o)});
  const days=[...new Set([...Object.keys(by),...Object.keys(all)])].filter(d=>/^\d{8}$/.test(d)&&(!filter||filter(d))).sort();
  return days.map(day=>{
    const cb=all[day]||{},sales=(cb.summary&&cb.summary.manual)?cb.summary:salesOf(by[day]||[]);
    return{day,cb,sales,c:calcDay(cb,sales),...feesOf(sales),hasCb:!!all[day]};
  });
}
function monthAgg(figs){
  const t={days:0,count:0,voided:0,revenue:0,cash:0,transfer:0,linepay:0,allpay:0,unpaid:0,fl:0,fa:0,fee:0,net:0,expense:0,deposit:0,topup:0,diff:0,diffDays:0};
  figs.forEach(f=>{
    const s=f.sales;if(s.count>0)t.days++;
    t.count+=s.count;t.voided+=s.voided;t.revenue+=s.revenue;t.cash+=s.cash;t.transfer+=s.transfer;t.linepay+=s.linepay;t.allpay+=s.allpay;t.unpaid+=s.unpaid;
    t.fl+=f.fl;t.fa+=f.fa;t.fee+=f.fee;t.net+=f.net;t.expense+=f.c.expense;t.deposit+=f.c.deposit;t.topup+=f.c.topup;
    if(f.c.hasOpen&&f.c.hasClose){t.diff+=f.c.diff;t.diffDays++}
  });
  return t;
}

function cashTab(k){CASH.tab=k;CASH.cnt=null;CASH.inh='';renderCash()}
function cntInit(kind){const src=((CASH.data||{})[kind]||{}).counts||{};CASH.cnt={};DENOMS.forEach(d=>CASH.cnt[d]=(+src['d'+d]||0)*d)}   // CASH.cnt[面額] ＝ 這個面額的「金額」

/* 開店盤點：直接帶入「前一次」收店盤點的張數（遇到公休日會往前找，最多 14 天） */
async function inheritClose(){
  let d=CASH.day,found=null;
  try{
    for(let i=0;i<14&&!found;i++){
      d=shiftDay(d,-1);
      const sn=await FB.get(FB.ref(FB.db,'cashbook/'+d+'/close'));
      if(sn.exists())found={day:d,rec:sn.val()};
    }
    if(!found){alert('往前 14 天內找不到收店盤點紀錄');return}
    let moved=0;                                   // 這段期間（收店後到今天開店前）另外有的支出、存鈔
    for(let k=shiftDay(found.day,1);k<CASH.day;k=shiftDay(k,1)){
      const ex=(await FB.get(FB.ref(FB.db,'cashbook/'+k+'/expenses'))).val()||{};
      Object.values(ex).forEach(e=>{moved+=(+e.amount||0)});
    }
    if(!CASH.cnt)cntInit('open');
    DENOMS.forEach(x=>{CASH.cnt[x]=(+((found.rec.counts||{})['d'+x])||0)*x});
    CASH.inh=`已帶入 ${dayLabel(found.day)} 的收店盤點 $${found.rec.total}（${fmtDT(found.rec.at)}）。${moved?`<b>這段期間另有支出／存鈔共 $${moved}</b>，如果錢已經從收銀機拿出去，請把張數修正後再儲存。`:''}確認無誤後按「儲存開店盤點」。`;
  }catch(e){alert('讀取失敗：'+(e.code||e.message));return}
  renderCash();
}

function refreshExpList(){const el=$('expList');if(el)el.innerHTML=expListHtml()}
async function addExpense(){
  const amt=parseFloat(CASH.ex.amount);
  if(!(amt>0)){alert('請輸入大於 0 的金額');const el=$('exAmt');if(el)el.focus();return}
  const rec={at:Date.now(),type:CASH.ex.type,amount:amt,note:CASH.ex.note.trim(),by:whoAmI()};
  const nref=FB.push(FB.ref(FB.db,'cashbook/'+CASH.day+'/expenses'));
  try{await FB.set(nref,rec)}
  catch(e){alert('新增失敗：'+(e.code||e.message));return}
  logAct('收銀'+(rec.type==='存鈔'?'存鈔':rec.type==='補入'?'補入':'支出'),null,'',`${expLabel(rec.type)} $${amt}${rec.note?'｜'+rec.note:''}`);
  (CASH.data.expenses=CASH.data.expenses||{})[nref.key]=rec;      // 直接加進畫面上的清單，不重新整頁
  CASH.ex.amount='';CASH.ex.note='';
  const a=$('exAmt'),n=$('exNote');
  if(a)a.value='';if(n)n.value='';
  refreshExpList();
  if(a)a.focus();
}
async function editExpense(id){
  if(!isManager())return;
  const e=(CASH.data.expenses||{})[id];if(!e)return;
  const a=prompt('修改金額',e.amount);if(a===null)return;
  const amt=parseFloat(a);if(!(amt>0)){alert('金額不正確');return}
  const n=prompt('修改說明',e.note||'');if(n===null)return;
  try{await FB.update(FB.ref(FB.db,'cashbook/'+CASH.day+'/expenses/'+id),{amount:amt,note:n.trim()})}
  catch(er){alert('修改失敗：'+(er.code||er.message));return}
  logAct('修改收銀紀錄',null,'',`${expLabel(e.type)} $${e.amount}→$${amt}`);
  e.amount=amt;e.note=n.trim();refreshExpList();
}
async function delExpense(id){
  if(!isManager())return;
  const e=(CASH.data.expenses||{})[id];if(!e||!confirm(`刪除這筆「${expLabel(e.type)} $${e.amount}」？`))return;
  try{await FB.remove(FB.ref(FB.db,'cashbook/'+CASH.day+'/expenses/'+id))}
  catch(er){alert('刪除失敗：'+(er.code||er.message));return}
  logAct('刪除收銀紀錄',null,'',`${expLabel(e.type)} $${e.amount}${e.note?'｜'+e.note:''}`);
  delete CASH.data.expenses[id];refreshExpList();
}

/* ===== 採購清單：先列好明天要買的東西；品項記住「單位、單價」，點選後只要輸入數量，金額自動算好並直接算入當天支出 ===== */
let PLAN={day:'',groups:{},catalog:{},ok:false,loading:false};
const DEFAULT_SHOP=[      // 第一次打開採購清單時，自動匯入一次（匯入後可自行刪改，不會再被補回來）
 ['嘉振鹹水雞',[['大型鹹水雞','隻',95],'大型煙燻雞','雞胗','雞皮','雞冠','雞生腸','珍珠蛋','鹹雞湯','香雞湯','香雞油']],
 ['大市場',['油麵','芥蘭','雞軟骨','蒜泥','薑絲','切好小辣','娃娃菜','玉米筍','鴻喜菇','龍鬚菜','水蓮','花椰菜','高麗菜','白蘿蔔','小黃瓜','四季豆','杏鮑菇','金針菇','洋蔥','百頁豆腐','豆干','豆皮','海帶根','紅綠辣椒','香菜','紅蔥頭']],
 ['同興',['牛五花','牛炒片','羊炒片','雞心','松阪豬']],

 ['萬濱食品',['水晶餃','貢丸','鴨肉丸','蟹味腿','蒟蒻絲','鑫鑫腸','米血','甜不辣','炸豆皮']],
 ['戀鳳爪',['豬耳朵','原味鳳爪','脆腸']],
 ['祥宏瓦斯',['瓦斯']],
 ['大同',['冰塊']]
];
const dashDay=d=>d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8);
const planMD=d=>(+d.slice(4,6))+'月'+(+d.slice(6,8))+'日';
const byO=(a,b)=>(+(a.o??1e15))-(+(b.o??1e15));
const r2=n=>Math.round((+n||0)*100)/100;
const itemAmt=i=>+i.amount||0;
const itemDone=i=>i.done===true;
const gExtra=g=>+g.amount||0;
const gPlanned=g=>Object.values(g.items||{}).reduce((a,i)=>a+itemAmt(i),0)+gExtra(g);
const gBought=g=>Object.values(g.items||{}).filter(itemDone).reduce((a,i)=>a+itemAmt(i),0)+gExtra(g);
const gCount=g=>{const l=Object.values(g.items||{});return[l.filter(itemDone).length,l.length]};
const planSum=g=>{const [d,n]=gCount(g);return `已採購 ${d}/${n} 項　${money(gBought(g))}／預計 ${money(gPlanned(g))}`};
const planSums=()=>Object.values(PLAN.groups).reduce((a,g)=>({p:a.p+gPlanned(g),b:a.b+gBought(g)}),{p:0,b:0});
const planTxt=i=>`${i.name}${(i.qty!==''&&i.qty!=null)?' '+i.qty+(i.unit||''):''}${i.note?'（'+i.note+'）':''}`;
const planNote=g=>'【採購】'+g.name+'｜'+(Object.values(g.items||{}).filter(itemDone).map(planTxt).join('、')||'（其他費用）');
const planColl=()=>{try{return JSON.parse(localStorage.getItem('plan_coll')||'{}')}catch(e){return{}}};
const planCollSet=o=>{try{localStorage.setItem('plan_coll',JSON.stringify(o))}catch(e){}};
async function planSeed(){
  try{
    if((await FB.get(FB.ref(FB.db,'shopMeta/seed1'))).val())return;
    let gi=0;
    for(const [gname,list] of DEFAULT_SHOP){
      let cid=Object.keys(PLAN.catalog).find(k=>PLAN.catalog[k].name===gname);const isNew=!cid;
      if(isNew){cid=FB.push(FB.ref(FB.db,'shopCatalog')).key;PLAN.catalog[cid]={name:gname,o:gi,items:{}}}
      const cat=PLAN.catalog[cid];cat.items=cat.items||{};const add={};
      list.forEach((it,ii)=>{
        const [name,unit,price]=Array.isArray(it)?it:[it,'',0];
        if(Object.values(cat.items).some(x=>x.name===name))return;
        const iid=FB.push(FB.ref(FB.db,'shopCatalog/'+cid+'/items')).key;
        add[iid]={name,unit:unit||'',price:+price||0,o:ii};cat.items[iid]=add[iid];
      });
      if(isNew)await FB.set(FB.ref(FB.db,'shopCatalog/'+cid),{name:gname,o:gi,items:add});
      else if(Object.keys(add).length)await FB.update(FB.ref(FB.db,'shopCatalog/'+cid+'/items'),add);
      gi++;
    }
    await FB.set(FB.ref(FB.db,'shopMeta/seed1'),true);
  }catch(e){alert('匯入常用清單失敗：'+(e.code||e.message))}
}
async function planLoad(day){
  PLAN.day=day;PLAN.ok=false;PLAN.loading=true;
  try{
    const [p,c]=await Promise.all([FB.get(FB.ref(FB.db,'shopPlan/'+day)),FB.get(FB.ref(FB.db,'shopCatalog'))]);
    PLAN.groups=p.val()||{};PLAN.catalog=c.val()||{};
    await planSeed();
    // 舊版清單（已經算入過支出、還沒有「已採購」勾選）→ 視為已採購，避免支出被洗掉
    for(const [gid,g] of Object.entries(PLAN.groups)){
      const its=Object.entries(g.items||{});
      if(g.expAt&&its.some(([,i])=>i.done===undefined)){
        its.forEach(([,i])=>{if(i.done===undefined)i.done=true});
        try{await FB.set(FB.ref(FB.db,'shopPlan/'+day+'/'+gid+'/items'),g.items)}catch(e){}
      }
    }
  }catch(e){PLAN.groups={};PLAN.catalog={};alert('讀取採購清單失敗：'+(e.code||e.message))}
  PLAN.ok=true;PLAN.loading=false;
}
function openPlan(day){
  viewingOrders=viewingStats=viewingTrack=false;
  $('mBox').className='m-box xl';
  PLAN.ok=false;PLAN.day=day||PLAN.day||shiftDay(today8(),1);
  $('modal').classList.add('open');
  renderPlan();
}
function renderPlan(){
  const head=`<div class="oh"><h3>🛒 採購清單</h3><button onclick="itemsMenu()">返回</button></div>`;
  if(!PLAN.ok){
    $('mBox').innerHTML=head+'<div style="text-align:center;color:var(--mu);padding:30px">讀取中…</div>';
    if(!PLAN.loading)planLoad(PLAN.day).then(()=>renderPlan());
    return;
  }
  $('mBox').innerHTML=head+planBody();
}
function planBody(){
  const d=PLAN.day,S=planSums();
  return `<div class="fm-sec" style="padding:10px 14px">

    <div class="modal-tip" style="text-align:left;margin:6px 0">選好採購日期（目前是 <b>${dayLabel(d)}</b>）。買到的品項<b>前面打勾</b>，勾選品項的金額就會<b>直接算入 ${planMD(d)} 的支出</b>（進貨/材料）；沒買到的不要勾，就不會算。</div>
    <div class="fm-row"><b>新增群組</b><input id="pgName" lang="zh-TW" list="pgList" placeholder="例如：大市場（打新的會自動記起來）" onkeydown="if(event.key==='Enter'&&!event.isComposing){event.preventDefault();planAddGroup()}"><button class="chip sm" onclick="planAddGroup()">＋ 加入</button></div>
    <datalist id="pgList">${Object.values(PLAN.catalog).map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist>
    <div class="chips pcc" id="pgChips">${planGroupChips()}</div>
    <div class="fm-line"><span>預計 <b id="planPlanned">${money(S.p)}</b>　已採購（算入支出）<b id="planBought" style="color:var(--ok)">${money(S.b)}</b></span><span><button class="chip sm" onclick="planCollapseAll(false)">全部展開</button> <button class="chip sm" onclick="planCollapseAll(true)">全部收合</button></span></div>
  </div>
  <div id="planGroups">${Object.entries(PLAN.groups).map(([gid,g])=>planCard(gid,g)).join('')}</div>`;
}
function planGroupChips(){
  const list=Object.entries(PLAN.catalog).filter(([id])=>!PLAN.groups[id]).sort(([,a],[,b])=>byO(a,b));
  if(!list.length)return '';
  return '<span style="color:var(--mu);font-size:12px;align-self:center">常用群組：</span>'+list.map(([id,c])=>`<span class="pchip"><button class="chip sm" onclick="planAddGroup('${id}')">＋ ${esc(c.name)}</button><button class="chip sm" style="padding:4px 7px;color:var(--bad)" title="從常用群組移除" onclick="planForgetGroup('${id}')">✕</button></span>`).join('');
}
function planItemRow(gid,iid,i){
  const k=`${gid}_${iid}`,pe=`'${gid}','${iid}'`;
  return `<div class="pit2${itemDone(i)?' done':''}" id="pit_${k}">
   <input type="checkbox" title="買到了就打勾" ${itemDone(i)?'checked':''} onchange="planCheck(${pe},this.checked)">
   <span class="pnm" title="${esc(i.name)}">${esc(i.name)}</span>
   <input id="q_${k}" class="pi" inputmode="decimal" placeholder="數量" value="${esc(i.qty??'')}" oninput="planLive(${pe})" onchange="planItemSave(${pe},'qty')">
   <input id="u_${k}" class="pi" lang="zh-TW" placeholder="單位" value="${esc(i.unit||'')}" onchange="planItemSave(${pe},'unit')">
   <input id="p_${k}" class="pi" inputmode="decimal" placeholder="單價" value="${esc((+i.price||0)||'')}" oninput="planLive(${pe})" onchange="planItemSave(${pe},'price')">
   <input id="m_${k}" class="pi" inputmode="decimal" placeholder="金額" value="${esc(itemAmt(i)||'')}" onchange="planItemSave(${pe},'amount')">
   <input id="n_${k}" class="pi nt" lang="zh-TW" placeholder="備註" value="${esc(i.note||'')}" onchange="planItemSave(${pe},'note')">
   <button class="pdel" title="刪除這個品項" onclick="planDelItem(${pe})">✕</button>
  </div>`;
}
function planItemsHtml(gid){
  const g=PLAN.groups[gid]||{},its=Object.entries(g.items||{});
  if(!its.length)return '<div style="color:var(--mu);font-size:13px;padding:4px 2px">還沒有品項，請點下面的常用品項，或在最下面新增</div>';
  const all=its.every(([,i])=>itemDone(i));
  return `<div class="pit2 phd"><input type="checkbox" title="全選／全不選" ${all?'checked':''} onchange="planCheckAll('${gid}',this.checked)"><span>品項</span><span>數量</span><span>單位</span><span>單價</span><span>金額</span><span>備註</span><span></span></div>`+its.map(([iid,i])=>planItemRow(gid,iid,i)).join('');
}
function planItemChips(gid){
  const g=PLAN.groups[gid]||{},cat=PLAN.catalog[g.cid]||{},have=g.items||{};
  const list=Object.entries(cat.items||{}).filter(([id])=>!have[id]).sort(([,a],[,b])=>byO(a,b));
  if(!list.length)return '<span style="color:var(--mu);font-size:12px">常用品項都已經在清單裡了</span>';
  return list.map(([id,i])=>`<button class="chip sm" onclick="planChip('${gid}','${id}')">＋ ${esc(i.name)}${(i.unit||+i.price)?'<small style="opacity:.7"> '+esc(i.unit||'')+((+i.price)?' $'+i.price:'')+'</small>':''}</button>`).join('');
}
const planStatus=g=>{const b=gBought(g),[d]=gCount(g);return b>0?`<span style="color:var(--ok);font-weight:700">✅ 已算入 ${planMD(PLAN.day)} 的支出 ${money(b)}</span><span style="color:var(--mu)">（已採購 ${d} 項${gExtra(g)?' ＋ 其他費用 '+money(gExtra(g)):''}）</span>`:`勾選已買到的品項，才會算入 ${planMD(PLAN.day)} 的支出`};
function planCard(gid,g){
  const cat=PLAN.catalog[g.cid]||{},coll=!!planColl()[gid];
  return `<div class="pgc" id="pg_${gid}">
   <div class="pgh" onclick="planToggle('${gid}')"><span id="pga_${gid}">${coll?'▶':'▼'}</span><b class="pgn">🛒 ${esc(g.name)}</b><span class="pgs" id="pgs_${gid}">${planSum(g)}</span><span style="flex:1"></span><button class="chip sm" onclick="event.stopPropagation();planDelGroup('${gid}')">移除群組</button></div>
   <div class="pgb" id="pgb_${gid}" style="display:${coll?'none':'block'}">
    <div id="pi_${gid}">${planItemsHtml(gid)}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin:8px 0 3px"><span style="color:var(--mu);font-size:12px">常用品項（點一下加入，再輸入數量）</span><button class="chip sm" onclick="planManage('${gid}')">⚙ 編輯常用品項</button></div>
    <div class="chips pcc" id="pc_${gid}">${planItemChips(gid)}</div>
    <div id="pmg_${gid}"></div>
    <div class="pmr" style="margin-top:8px"><input id="pn_${gid}" class="pi" lang="zh-TW" list="pl_${gid}" placeholder="新品項名稱（會記進常用）" oninput="planNameIn('${gid}')" onkeydown="if(event.key==='Enter'&&!event.isComposing){event.preventDefault();planAddItem('${gid}')}"><input id="pu_${gid}" class="pi" lang="zh-TW" placeholder="單位"><input id="pp_${gid}" class="pi" inputmode="decimal" placeholder="單價" onkeydown="if(event.key==='Enter'){event.preventDefault();planAddItem('${gid}')}"><button class="chip sm" onclick="planAddItem('${gid}')">＋ 新增</button>
     <datalist id="pl_${gid}">${Object.values(cat.items||{}).map(i=>`<option value="${esc(i.name)}">`).join('')}</datalist></div>
    <div class="pmr" style="margin-top:6px;grid-template-columns:auto minmax(120px,260px) 1fr"><span style="font-size:13px;color:var(--mu)">其他費用</span><input id="pa_${gid}" class="pi" type="number" inputmode="numeric" min="0" value="${(+g.amount||0)||''}" placeholder="運費等（可不填）" onchange="planAmount('${gid}',this.value)"><span id="ps_${gid}" style="font-size:12px;color:var(--mu)">${planStatus(g)}</span></div>

function planTotalsOnly(gid){
  const g=PLAN.groups[gid],S=planSums();
  const a=$('pgs_'+gid),b=$('ps_'+gid),p=$('planPlanned'),q=$('planBought');
  if(g){if(a)a.textContent=planSum(g);if(b)b.innerHTML=planStatus(g)}
  if(p)p.textContent=money(S.p);if(q)q.textContent=money(S.b);
}
function planRefresh(gid){
  const a=$('pi_'+gid),b=$('pc_'+gid),g=$('pgChips');
  if(a)a.innerHTML=planItemsHtml(gid);if(b)b.innerHTML=planItemChips(gid);if(g)g.innerHTML=planGroupChips();
  planTotalsOnly(gid);
}
function planToggle(gid){
  const o=planColl(),now=!o[gid];o[gid]=now;if(!now)delete o[gid];planCollSet(o);
  const b=$('pgb_'+gid),a=$('pga_'+gid);if(b)b.style.display=now?'none':'block';if(a)a.textContent=now?'▶':'▼';
}
function planCollapseAll(v){
  const o={};if(v)Object.keys(PLAN.groups).forEach(g=>o[g]=true);planCollSet(o);
  Object.keys(PLAN.groups).forEach(g=>{const b=$('pgb_'+g),a=$('pga_'+g);if(b)b.style.display=v?'none':'block';if(a)a.textContent=v?'▶':'▼'});
}
async function planDay(v){const d=String(v).replace(/-/g,'');if(/^\d{8}$/.test(d)){PLAN.day=d;PLAN.ok=false;renderPlan()}}
/* 群組「已採購」的花費（勾選品項的金額加總＋其他費用）同步成「那一天」的一筆支出；key 固定為 plan_群組，所以勾選、改數量、改金額都是更新同一筆 */
async function syncPlanExpense(gid){
  const g=PLAN.groups[gid];if(!g)return;
  const rf=FB.ref(FB.db,'cashbook/'+PLAN.day+'/expenses/plan_'+gid),amt=r2(gBought(g));
  try{
    if(amt>0){
      if(!g.expAt){g.expAt=Date.now();await FB.update(FB.ref(FB.db,'shopPlan/'+PLAN.day+'/'+gid),{expAt:g.expAt})}
      await FB.set(rf,{at:g.expAt,type:'進貨',amount:amt,note:planNote(g),by:whoAmI(),plan:true});
    }else await FB.remove(rf);
  }catch(e){alert('同步支出失敗：'+(e.code||e.message))}
}
async function planCheck(gid,iid,v){
  const g=PLAN.groups[gid],it=(g.items||{})[iid];if(!it)return;
  it.done=!!v;
  const row=$(`pit_${gid}_${iid}`);if(row)row.classList.toggle('done',it.done);

  if(!it.manual){const m=$('m_'+k);if(m)m.value=q&&p?r2(q*p):''}

/* 離開欄位時存檔：金額沒有手改過，就一直是 數量 × 單價；你手動改了金額，就以你輸入的為準。單位、單價會自動記住（最近一次輸入的） */
async function planItemSave(gid,iid,key){
  const g=PLAN.groups[gid],it=(g.items||{})[iid];if(!it)return;
  const k=`${gid}_${iid}`,val=id=>($(id+'_'+k)||{value:''}).value;
  const qtyS=val('q').trim(),q=parseFloat(qtyS)||0;
  let price=parseFloat(val('p'))||0;
  it.qty=qtyS;it.unit=val('u').trim();it.note=val('n').trim();
  if(key==='amount'){
    const a=r2(parseFloat(val('m'))||0);
    if(a>0&&q>0&&!price){price=r2(a/q);it.manual=Math.abs(a-r2(q*price))>0.005}      // 還沒設單價：只輸入總金額，就自動算出單價
    else it.manual=a>0&&Math.abs(a-r2(q*price))>0.005;
    it.amount=a;
  }else if(!it.manual)it.amount=r2(q*price);
  it.price=price;
  const m=$('m_'+k),pe=$('p_'+k);if(m)m.value=it.amount||'';if(pe&&price)pe.value=price;
  try{await FB.update(FB.ref(FB.db,'shopPlan/'+PLAN.day+'/'+gid+'/items/'+iid),{qty:it.qty,unit:it.unit,price:it.price,amount:it.amount,manual:!!it.manual,note:it.note})}
  catch(e){alert('儲存失敗：'+(e.code||e.message));return}
  const cat=(PLAN.catalog[g.cid]||{}).items||{},ci=cat[iid];
  if(ci){
    const patch={};
    if(it.unit&&it.unit!==ci.unit)patch.unit=it.unit;
    if(price>0&&price!==(+ci.price||0))patch.price=price;
    if(Object.keys(patch).length){
      try{await FB.update(FB.ref(FB.db,'shopCatalog/'+g.cid+'/items/'+iid),patch);Object.assign(ci,patch);
        Object.keys(PLAN.groups).forEach(x=>{if(PLAN.groups[x].cid===g.cid){const c=$('pc_'+x);if(c)c.innerHTML=planItemChips(x)}});
        toast(`💾 已記住「${it.name}」${ci.unit?ci.unit:''}${(+ci.price)?' $'+ci.price:''}，下次直接帶出`)}catch(e){}
    }
  }
  planTotalsOnly(gid);await syncPlanExpense(gid);
}

/* --- 彙整 Excel：每次都匯出「所有日期」，隔天再匯出時前一天仍在 --- */
function loadXLSX(){
  return new Promise((res,rej)=>{
    if(window.XLSX)return res(window.XLSX);
    const sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload=()=>window.XLSX?res(window.XLSX):rej(new Error('xlsx'));
    sc.onerror=()=>rej(new Error('load'));
    document.head.appendChild(sc);
  });
}
async function buildCashbookSheets(){
  const [cbSn,osSn]=await Promise.all([FB.get(FB.ref(FB.db,'cashbook')),FB.get(FB.ref(FB.db,'orders'))]);
  const all=cbSn.val()||{};
  const figs=figsFrom(Object.values(osSn.val()||{}),all);
  const daily=[],exps=[],cnts=[],byMonth={};let cumRev=0,cumNet=0,cumFee=0,cumDiff=0;
  figs.forEach(f=>{
    const {day,cb,sales,c}=f;
    cumRev+=sales.revenue;cumNet+=f.net;cumFee+=f.fee;
    const diffOk=c.hasOpen&&c.hasClose;if(diffOk)cumDiff+=c.diff;
    daily.push([dayPlain(day),dayWeek(day),sales.manual?'手動補登':(c.hasClose?'已收店':(f.hasCb?'未收店':'無收銀紀錄')),sales.count,sales.voided,sales.revenue,sales.cash,sales.transfer,sales.linepay,sales.allpay,
      f.fl,f.fa,f.fee,f.net,sales.unpaid,c.hasOpen?c.open:'',c.topup,c.expense,c.deposit,c.hasOpen?c.expected:'',c.hasClose?c.close:'',diffOk?c.diff:'',cumRev,cumFee,cumNet,cumDiff]);
    (byMonth[day.slice(0,6)]=byMonth[day.slice(0,6)]||[]).push(f);
    Object.values(cb.expenses||{}).sort((a,b)=>a.at-b.at).forEach(e=>exps.push([dayPlain(day),fmtDT(e.at),expLabel(e.type),+e.amount||0,e.note||'',e.by||'']));
    [['open','開店'],['close','收店']].forEach(([k,nm])=>{
      const r=cb[k];if(!r)return;
      cnts.push([dayPlain(day),nm+'盤點',fmtDT(r.at),r.by||'',...DENOMS.map(d=>(+((r.counts||{})['d'+d])||0)*d),+r.total||0]);
    });
  });
  const monthly=[];let mRev=0,mNet=0;
  Object.keys(byMonth).sort().forEach(ym=>{
    const t=monthAgg(byMonth[ym]);mRev+=t.revenue;mNet+=t.net;
    monthly.push([ym.slice(0,4)+'年'+ym.slice(4,6)+'月',t.days,t.count,t.voided,t.revenue,t.cash,t.transfer,t.linepay,t.allpay,t.fl,t.fa,t.fee,t.net,t.days?Math.round(t.revenue/t.days):0,t.unpaid,t.expense,t.deposit,t.topup,t.diffDays?t.diff:'',mRev,mNet]);
  });
  return{
    daily:[['營業日','星期','狀態','訂單數','拒單數','營收合計','現金收入','轉帳','Linepay','全支付','Linepay手續費('+rateTxt('Linepay')+')','全支付手續費('+rateTxt('全支付')+')','手續費合計','扣手續費後營收','未收款','開店現金','補入收銀機','支出合計','存鈔合計','理論應有現金','收店現金','差額','累計營收','累計手續費','累計淨營收','累計差額'],...daily],
    monthly:[['月份','營業天數','訂單數','拒單數','營收合計','現金收入','轉帳','Linepay','全支付','Linepay手續費','全支付手續費','手續費合計','扣手續費後營收','日均營收','未收款','支出合計','存鈔合計','補入收銀機合計','現金差額合計','累計營收','累計淨營收'],...monthly],
    exps:[['營業日','時間','類別','金額','說明','登錄人'],...exps],
    cnts:[['營業日','類型','時間','登錄人',...DENOMS.map(d=>'$'+d+' 金額'),'合計'],...cnts]
  };
}
async function exportCashbook(){
  const btn=$('xlBtn');if(btn){btn.disabled=true;btn.textContent='整理中…'}
  try{
    const S=await buildCashbookSheets();
    if(S.daily.length<2){alert('目前還沒有任何訂單或收銀資料');return}
    const stamp=ymd(new Date());
    try{
      const X=await loadXLSX(),wb=X.utils.book_new();
      [[S.daily,'日報表彙整'],[S.monthly,'月報表彙整'],[S.exps,'支出與存鈔明細'],[S.cnts,'盤點明細']].forEach(([rows,name])=>{
        const ws=X.utils.aoa_to_sheet(rows);
        ws['!cols']=rows[0].map((_,i)=>({wch:i===0?12:14}));
        X.utils.book_append_sheet(wb,ws,name);
      });
      X.writeFile(wb,'收銀日報彙整_'+stamp+'.xlsx');
    }catch(e){
      /* 沒有網路載入 Excel 元件時，改匯出 CSV（只有日報表彙整） */
      const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
      const csv='\ufeff'+S.daily.map(r=>r.map(q).join(',')).join('\r\n');
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
      a.download='收銀日報彙整_'+stamp+'.csv';document.body.appendChild(a);a.click();a.remove();
      alert('Excel 元件載入失敗，已改匯出 CSV（只含日報表彙整）。');

  if(btn){btn.disabled=false;btn.textContent='📥 匯出彙整 Excel（全部日期）'}
}

/* ===== 當日庫存（賣完為止）===== */
const baseId=id=>String(id).split('_')[0];
let STOCK={},stockDay='',stockUnsub=null,STK={rows:{}},STKopen=false;
function subStock(){
  if(!window.FB)return;
  const d=today8();
  if(d===stockDay&&stockUnsub)return;
  if(stockUnsub){stockUnsub();stockUnsub=null}
  stockDay=d;STOCK={};
  stockUnsub=FB.onValue(FB.ref(FB.db,'stock/'+d),sn=>{STOCK=sn.val()||{};renderGrid();renderCart();if(STKopen)refreshStockCells()},()=>{});
}
const stockInfo=id=>{const r=STOCK[baseId(id)];return r&&r.limit!=null&&r.limit!==''?{limit:+r.limit,sold:+r.sold||0}:null};
const stockLeft=id=>{const s=stockInfo(id);return s?Math.max(0,s.limit-s.sold):Infinity};
let OVR={};   // 店家這張單「強制加入」的售完品項（補登過去的單、或特殊情況用）
const canAdd=id=>{
  if(OVR[baseId(id)])return true;
  const l=stockLeft(id);if(l===Infinity)return true;
  const b=baseId(id);return cart.filter(x=>baseId(x.id)===b).reduce((a,x)=>a+x.qty,0)<l;
};
const itemName=id=>((find(baseId(id))||{}).name)||id;
const needOf=items=>{const need={};(items||[]).forEach(x=>{const b=baseId(x.id);need[b]=(need[b]||0)+(+x.qty||0)});return need};
const soldRef=b=>FB.ref(FB.db,'stock/'+today8()+'/'+b+'/sold');

/* 下單時先「預留」庫存；不夠就擋下（force=true 時強制扣，店家可選擇仍要送出） */
async function reserveStock(items,force){
  const done=[];
  for(const [b,q] of Object.entries(needOf(items))){
    const info=STOCK[b];if(!info||info.limit==null)continue;
    const lim=+info.limit;let r;
    try{r=await FB.runTransaction(soldRef(b),cur=>{cur=+cur||0;if(!force&&cur+q>lim)return;return cur+q})}
    catch(e){await releaseStock(done);throw e}
    if(!r.committed){await releaseStock(done);return{ok:false,name:itemName(b),left:Math.max(0,lim-(+r.snapshot.val()||0))}}
    done.push([b,q]);
  }
  return{ok:true,done};
}
async function releaseStock(done){
  for(const [b,q] of done){try{await FB.runTransaction(soldRef(b),c=>Math.max(0,(+c||0)-q))}catch(e){}}
}
/* 拒單 → 把庫存還回去；還原 → 再扣掉 */
async function adjustStockForOrder(o,sign){
  if(!window.FB||!o||o.late||o.date!==today8())return;
  for(const [b,q] of Object.entries(needOf(o.items))){
    const info=STOCK[b];if(!info||info.limit==null)continue;
    try{await FB.runTransaction(soldRef(b),c=>Math.max(0,(+c||0)+sign*q))}catch(e){}
  }
}

/* --- 庫存設定畫面（店員、店長都能用）--- */
function openStock(){
  STK={rows:{}};
  Object.entries(STOCK).forEach(([id,r])=>{if(r&&r.limit!=null)STK.rows[id]=String(r.limit)});
  STKopen=true;viewingOrders=viewingStats=viewingTrack=false;
  $('mBox').className='m-box xl';renderStock();$('modal').classList.add('open');
}
const stkSold=id=>+((STOCK[id]||{}).sold)||0;
function renderStock(){
  const ids=Object.keys(STK.rows);
  const opts=MENU.map(c=>`<optgroup label="${esc(split(c.k)[0])}">${c.items.filter(i=>!(i.id in STK.rows)).map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join('')}</optgroup>`).join('');
  const rows=ids.map(id=>{
    const it=find(id)||{name:id},sold=stkSold(id),lim=parseInt(STK.rows[id]);
    return `<div class="er"><span style="flex:1;font-weight:700">${esc(it.name)}</span><span style="width:76px;color:var(--mu)">已售 <b id="ss_${id}">${sold}</b></span><span style="width:70px">剩 <b id="sl_${id}">${lim>=0?Math.max(0,lim-sold):'-'}</b></span><input class="qt" style="width:96px" type="number" min="0" inputmode="numeric" value="${esc(STK.rows[id])}" placeholder="限量" oninput="stkInput('${id}',this.value)"><button class="del-btn" onclick="stkDel('${id}')" title="移除限量">✕</button></div>`;
  }).join('');
  $('mBox').innerHTML=`<div class="oh"><h3>📦 今日庫存（限量品項）</h3><button onclick="closeModal()">關閉</button></div>
   <div class="modal-tip">沒有設定限量的品項＝不限量。限量品項賣完會<b>自動反黑、不能點選</b>，客人頁面也會顯示「剩 N」。營業日（每日 02:00 換日）換日後庫存會自動重新開始。</div>
   <div class="fm-sec"><div class="fm-title">${dayLabel(today8())}</div>
    ${rows||'<div style="text-align:center;color:var(--mu);padding:14px">今天還沒有設定任何限量品項</div>'}
    <div class="fm-row"><select onchange="stkAdd(this.value)"><option value="">＋ 加入限量品項…</option>${opts}</select></div></div>
   <div class="m-btns"><button class="btn-confirm" onclick="stkSave()">儲存庫存設定</button></div>
   <div class="m-btns"><button class="btn-cancel" onclick="stkCopy()">沿用昨天的限量</button><button class="btn-cancel" onclick="stkRecalc()">依今日訂單重算已售</button><button class="btn-cancel" onclick="stkClear()">清空今日庫存設定</button></div>`;
}
function stkInput(id,v){
  STK.rows[id]=v;const el=$('sl_'+id),n=parseInt(v);
  if(el)el.textContent=n>=0?Math.max(0,n-stkSold(id)):'-';
}
function refreshStockCells(){
  Object.keys(STK.rows).forEach(id=>{
    const a=$('ss_'+id),b=$('sl_'+id),n=parseInt(STK.rows[id]);
    if(a)a.textContent=stkSold(id);if(b)b.textContent=n>=0?Math.max(0,n-stkSold(id)):'-';
  });
}
function stkAdd(id){if(id){STK.rows[id]='';renderStock()}}
async function stkDel(id){
  const saved=STOCK[id]&&STOCK[id].limit!=null;
  if(saved){
    if(!confirm(`移除「${(find(id)||{}).name||id}」的限量（改成不限量）？`))return;
    try{await FB.remove(FB.ref(FB.db,'stock/'+today8()+'/'+id))}catch(e){alert('移除失敗：'+(e.code||e.message));return}
  }
  delete STK.rows[id];renderStock();
}
async function stkSave(){
  const ids=Object.keys(STK.rows);
  for(const id of ids){if(!(parseInt(STK.rows[id])>=0)){alert(`「${(find(id)||{}).name||id}」請輸入限量數字（0 以上）`);return}}
  try{
    for(const id of ids){
      const v=parseInt(STK.rows[id]),cur=STOCK[id];
      await FB.update(FB.ref(FB.db,'stock/'+today8()+'/'+id),cur&&cur.sold!=null?{limit:v}:{limit:v,sold:0});
    }
  }catch(e){alert('儲存失敗：'+(e.code||e.message));return}
  logAct('設定庫存',null,'',ids.map(id=>`${(find(id)||{}).name||id}×${STK.rows[id]}`).join('、')||'（無）');
  toast('✅ 庫存設定已儲存');
}
async function stkRecalc(){
  if(!confirm('依今日所有訂單（不含已拒單）重新計算每個限量品項的「已售」數量？'))return;
  try{
    const list=(await fetchDayOrders(today8())).filter(o=>o.status!=='cancelled');
    const sold={};list.forEach(o=>Object.entries(needOf(o.items)).forEach(([b,q])=>sold[b]=(sold[b]||0)+q));
    for(const id of Object.keys(STOCK)){
      if(STOCK[id]&&STOCK[id].limit!=null)await FB.update(FB.ref(FB.db,'stock/'+today8()+'/'+id),{sold:sold[id]||0});
    }
  }catch(e){alert('重新計算失敗：'+(e.code||e.message));return}
  logAct('重算庫存已售',null,'',dayPlain(today8()));
  toast('✅ 已重新計算已售數量');
}
async function stkClear(){
  if(!confirm('清空今天所有限量設定？（全部品項改成不限量）'))return;
  try{await FB.remove(FB.ref(FB.db,'stock/'+today8()))}catch(e){alert('清空失敗：'+(e.code||e.message));return}
  STK.rows={};renderStock();
}
async function stkCopy(){
  try{
    const y=(await FB.get(FB.ref(FB.db,'stock/'+shiftDay(today8(),-1)))).val()||{};
    const ids=Object.keys(y).filter(id=>y[id]&&y[id].limit!=null);
    if(!ids.length){alert('昨天沒有限量設定可沿用');return}
    for(const id of ids)await FB.update(FB.ref(FB.db,'stock/'+today8()+'/'+id),{limit:+y[id].limit,sold:0});
    ids.forEach(id=>STK.rows[id]=String(y[id].limit));
  }catch(e){alert('沿用失敗：'+(e.code||e.message));return}
  toast('✅ 已沿用昨天的限量（已售歸零）');renderStock();
}

function tick(){const d=new Date(),z=n=>String(n).padStart(2,'0'),w='週'+'日一二三四五六'[d.getDay()],t=`${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`;$('clock').textContent=innerWidth<600?`${d.getFullYear()}/${z(d.getMonth()+1)}/${z(d.getDate())} ${w} ${t}`:`${d.getFullYear()}年${z(d.getMonth()+1)}月${z(d.getDate())}日 ${w} ${t}`}
function toggleCart(){document.querySelector('.cart').classList.toggle('cart-open')}
tick();setInterval(tick,1e3);
setInterval(()=>{if(isAdmin&&ordUnsub&&bizStart()!==ordStart)startOrders()},6e4);
