<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>去中心鹹水雞 X 厝邊溫食 POS</title>
<style>
:root{--bg:#1a1410;--s1:#2a2118;--s2:#382c20;--ln:#5c4837;--tx:#f4ebd0;--mu:#c2b29f;--ac:#d4af37;--ac2:#f3e5ab;--ok:#4caf7d;--bad:#d9534f;--r:10px}
*{box-sizing:border-box;margin:0;padding:0;font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%}body{background:var(--bg);color:var(--tx);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.top{display:flex;align-items:center;gap:14px;padding:12px 20px;background:linear-gradient(135deg,#2c2218,#1c1510);border-bottom:3px solid var(--ac);box-shadow:0 4px 12px rgba(0,0,0,.6)}
.top-left{display:flex;align-items:center;gap:10px}
.pill{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:99px;background:var(--s2);border:1px solid var(--ln);font-size:14px;font-weight:600;transition:.15s}
.pill.admin-mode{cursor:pointer}.pill.admin-mode:hover{border-color:var(--ac)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.sp{flex:1}
.brand-center{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.brand-center .brand-row{display:flex;align-items:center;white-space:nowrap}
.brand-center b{font-size:20px;letter-spacing:.5px;color:var(--ac2)}
.brand-center .sep{color:var(--ac);margin:0 6px;font-size:18px}
.brand-actions{display:flex;gap:8px;align-items:center}
.top-right{display:flex;align-items:center;gap:10px}
.clock{color:var(--mu);font-variant-numeric:tabular-nums;font-size:14px}
.ibtn{padding:5px 12px;border-radius:8px;background:var(--s2);border:1px solid var(--ln);font-size:13px;display:none;color:var(--ac2);transition:.15s}
.ibtn:hover{border-color:var(--ac);background:rgba(212,175,55,.15)}
.main{flex:1;display:grid;grid-template-columns:150px 1fr 350px;min-height:0}
.nav{background:var(--s1);border-right:2px solid var(--ln);padding:12px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.nv{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 6px;border-radius:8px;text-align:center;color:var(--mu);border:1px solid transparent;transition:.15s}
.nv i{font-style:normal;font-size:24px}.nv b{font-size:14px}.nv small{font-size:11px;opacity:.8;min-height:14px}
.nv:hover{background:var(--s2);color:var(--tx)}
.nv.on{background:rgba(212,175,55,.15);border-color:var(--ac);color:var(--ac2)}
.nv.sold-out{opacity:.4;filter:grayscale(100%)}
.pane{display:flex;flex-direction:column;min-height:0;background:radial-gradient(circle at center,#231b14 0%,#17110d 100%)}
.ph{padding:16px 22px 6px}.ph h2{font-size:22px;color:var(--ac2)}.ph p{color:var(--mu);font-size:13px;margin-top:2px}
.grid{flex:1;overflow-y:auto;padding:12px 22px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;align-content:start}
.grid.wide{grid-template-columns:1fr}
.card{position:relative;background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);padding:16px 14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:.15s;user-select:none;box-shadow:0 4px 8px rgba(0,0,0,.3)}
.card:hover{border-color:var(--ac);transform:translateY(-2px);box-shadow:0 6px 12px rgba(212,175,55,.15)}.card:active{transform:scale(.98)}
.card.sold-out{opacity:.4;filter:grayscale(100%)}
.card .n{font-size:16px;font-weight:700;line-height:1.35;color:var(--tx)}
.card .d{font-size:12.5px;color:var(--mu);line-height:1.6}
.card .f{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.price{font-size:20px;font-weight:800;color:var(--ac)}.price:before{content:"$";font-size:13px;margin-right:1px;opacity:.8}
.add{width:34px;height:34px;border-radius:50%;background:var(--ac);color:#1a1204;font-size:22px;font-weight:700;display:grid;place-items:center}
.qb{position:absolute;top:-8px;right:-8px;min-width:26px;height:26px;padding:0 7px;border-radius:99px;background:var(--bad);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.sec{grid-column:1/-1;font-size:13px;font-weight:700;color:var(--ac);letter-spacing:2px;padding:6px 2px;border-bottom:1px dashed var(--ln)}
.card.wd{flex-direction:row;align-items:center;gap:16px}.card.wd .m{flex:1}
.cat-badge{position:absolute;top:2px;left:4px;width:18px;height:18px;background:var(--bad);color:#fff;border-radius:3px;font-size:11px;font-weight:700;display:none;place-items:center;z-index:5}
.sold-mode .cat-badge{display:grid}
.cart{background:var(--s1);border-left:2px solid var(--ln);display:flex;flex-direction:column;min-height:0}
.ch{padding:16px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--ln)}
.ch h3{font-size:18px;color:var(--ac2)}.ch button{color:var(--mu);font-size:13px}.ch button:hover{color:var(--bad)}
.cl{flex:1;overflow-y:auto;padding:8px 14px}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--mu);font-size:14px}.empty i{font-style:normal;font-size:40px;opacity:.5}
.ci{padding:12px 4px;border-bottom:1px solid var(--ln)}
.cr{display:flex;align-items:center;gap:10px}
.del-btn{background:none;border:none;color:var(--bad);font-size:16px;font-weight:700;cursor:pointer;padding:2px 6px;border-radius:6px;transition:.15s}
.del-btn:hover{background:rgba(217,83,79,.2)}
.cr .t{flex:1;font-weight:600;font-size:15px}.cr .p{font-weight:700;color:var(--ac)}
.stp{display:flex;align-items:center;gap:2px;background:var(--s2);border-radius:99px;padding:2px;margin-top:8px;width:max-content;border:1px solid var(--ln)}
.stp button{width:28px;height:28px;border-radius:50%;font-size:17px}.stp button:hover{background:var(--ln)}.stp span{min-width:28px;text-align:center;font-weight:700}
.cf{padding:16px 18px;border-top:2px solid var(--ln);display:flex;flex-direction:column;gap:12px;background:var(--s2)}
.sum{display:flex;justify-content:space-between;align-items:baseline;color:var(--mu);font-size:14px}.sum b{font-size:28px;color:var(--ac)}
.go{padding:16px;border-radius:10px;background:linear-gradient(135deg,var(--ac2),var(--ac));color:#1a1204;font-weight:800;font-size:17px;box-shadow:0 4px 10px rgba(212,175,55,.3)}
.go:disabled{background:var(--ln);color:var(--mu);cursor:not-allowed;box-shadow:none}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);display:none;place-items:center;z-index:999;padding:20px}
.modal.open{display:grid}
.m-box{background:var(--s1);border:2px solid var(--ac);border-radius:var(--r);width:100%;max-width:440px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 8px 24px rgba(0,0,0,.8);max-height:90vh;overflow-y:auto}
.m-box.wide{max-width:560px}
.m-box h3{font-size:20px;color:var(--ac2)}
.m-box label{font-size:13px;color:var(--mu);display:flex;flex-direction:column;gap:6px}
.m-box input{padding:12px;border-radius:8px;background:var(--s2);border:1px solid var(--ln);color:var(--tx);font-size:16px}
.m-box input:focus{border-color:var(--ac);outline:none}
.m-btns{display:flex;gap:10px;margin-top:4px}
.m-btns button{flex:1;padding:12px;border-radius:8px;font-weight:700}
.btn-cancel{background:var(--s2);border:1px solid var(--ln)}
.btn-confirm{background:var(--ac);color:#1a1204}
.sold-list-container{display:flex;flex-direction:column;gap:10px;max-height:350px;overflow-y:auto;padding-right:4px}
.sold-item-row{display:flex;align-items:center;justify-content:space-between;background:var(--s2);padding:10px 14px;border-radius:8px;border:1px solid var(--ln)}
.sold-item-name{font-size:15px;font-weight:600;color:var(--tx)}
.sold-restore-btn{background:var(--ok);color:#fff;padding:6px 12px;border-radius:6px;font-size:13px;font-weight:700}
.sold-restore-btn:hover{opacity:.9}
.opt-section-title{font-size:14px;font-weight:700;color:var(--ac);margin-bottom:6px}
.opt-list{display:flex;flex-direction:column;gap:8px}
.opt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.opt-btn{padding:12px;border-radius:8px;background:var(--s2);border:1px solid var(--ln);text-align:center;font-size:15px;font-weight:600;transition:.15s;color:var(--tx)}
.opt-btn:hover{border-color:var(--ac);background:rgba(212,175,55,.15);color:var(--ac2)}
.opt-btn.selected{background:var(--ac);color:#1a1204;border-color:var(--ac2);font-weight:700}
.opt-btn.disabled-opt{opacity:.3;filter:grayscale(100%);cursor:not-allowed;pointer-events:none}
.modal-tip{font-size:11.5px;color:var(--mu);line-height:1.5;background:rgba(0,0,0,.2);padding:10px;border-radius:6px;border-left:3px solid var(--ac)}
/* 取餐資訊 */
.fm-sec{border:1px solid var(--ln);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.fm-row{display:flex;align-items:center;gap:10px}
.fm-row>b{width:78px;flex:none;font-size:14px;color:var(--ac2)}
.fm-row input,.fm-row select{flex:1;min-width:0;padding:10px;border-radius:8px;background:var(--s2);border:1px solid var(--ln);color:var(--tx);font-size:15px}
.fm-row input:focus,.fm-row select:focus{border-color:var(--ac);outline:none}
.fm-row.err input,.fm-row.err select{border-color:var(--bad)}
.fm-err{display:none;color:var(--bad);font-size:12px;margin:-6px 0 0 88px}
.fm-row.err+.fm-err{display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px;flex:1}
.chip{padding:8px 12px;border-radius:8px;background:var(--s2);border:1px solid var(--ln);font-size:14px;color:var(--tx);transition:.15s}
.chip:hover{border-color:var(--ac)}
.chip.on{background:var(--ac);color:#1a1204;font-weight:700}
.fm-title{text-align:center;font-weight:700;color:var(--ac2)}
.fm-line{display:flex;justify-content:space-between;color:var(--mu);font-size:14px}
.fm-total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--ln);padding-top:12px;font-weight:800;color:var(--ac2);font-size:18px}
.fm-total b{font-size:26px;color:var(--ac)}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--ln);border-radius:4px}
@media(max-width:900px){
 body{overflow:auto;height:auto}.main{grid-template-columns:1fr;display:flex;flex-direction:column}
 .nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:2px solid var(--ln);padding:8px}.nv{flex:0 0 auto;min-width:92px;padding:8px 10px}.nv small{display:none}
 .grid{max-height:none;overflow:visible;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));padding:12px 14px}
 .cart{border-left:0;border-top:2px solid var(--ln);position:sticky;bottom:0;max-height:55vh}
 .top{padding:10px 14px;flex-wrap:wrap}.clock{display:none}
 .brand-center b{font-size:16px}
 .fm-row{flex-wrap:wrap}.fm-err{margin-left:0}
}
</style></head>
<body id="bodyRoot">
<header class="top">
 <div class="top-left"><div class="pill" id="statusPill"><span class="dot" id="statusDot"></span><span id="statusText">營業中</span></div></div>
 <div class="sp"></div>
 <div class="brand-center">
  <div class="brand-row"><b>去中心鹹水雞 X 厝邊溫食</b><span class="sep">｜</span><b>POS 點餐系統</b></div>
  <div class="brand-actions">
   <button class="ibtn" id="soldOutModeBtn" onclick="toggleSoldOutMode()">🔴 餐點管理</button>
   <button class="ibtn" id="soldOutListBtn" onclick="openSoldOutListModal()">📋 售完品項</button>
   <button class="ibtn" id="adminBtn" onclick="openAdminLogin()">⚙ 後台管理</button>
  </div>
 </div>
 <div class="sp"></div>
 <div class="top-right"><div class="clock" id="clock"></div></div>
</header>
<div class="main">
 <nav class="nav" id="nav"></nav>
 <section class="pane"><div class="ph" id="ph"></div><div class="grid" id="grid"></div></section>
 <aside class="cart">
  <div class="ch"><h3>📦 訂單明細</h3><button onclick="clearCart()">清空</button></div>
  <div class="cl" id="cl"></div>
  <div class="cf"><div class="sum"><span id="cnt">共 0 項</span><b id="tot">$0</b></div>
   <button class="go" id="go" disabled onclick="openCheckout()">下一步：填寫取餐資訊</button></div>
 </aside>
</div>
<div class="modal" id="modal"><div class="m-box" id="mBox"></div></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mk=(p,r)=>r.map(([n,pr],i)=>({id:p+(i+1),name:n,price:pr}));
const MENU=[
{k:'信仰雞本位主義 (主食)',ic:'🍗',items:mk('m',[["鹹水雞腿",65],["煙燻雞腿",75],["鹹水雞胸",65],["煙燻雞胸",75],["鹹水半雞",130],["煙燻半雞",150]]),two:true},
{k:'智能合約 (套餐)',ic:'🍱',combo:true,items:[
 {id:'s1',name:'散戶輕倉個人餐',price:260,c:'雞肉：半隻（可選 鹹水 / 煙燻）',d:["豬耳朵","雞冠","豆干","鴨肉丸","珍珠蛋"]},
 {id:'s2',name:'巨鯨重倉肉多多餐',price:390,c:'雞肉：半隻（可選 鹹水 / 煙燻）',d:["牛五花","松阪豬","雞冠","雞腸","雞軟骨","鴨肉丸","鑫鑫腸"]},
 {id:'s3',name:'DAO節點下酒派對餐',price:630,c:'雞肉：全雞（可選 鹹水 / 煙燻）',d:["牛五花","松阪豬","豬耳朵","珍珠蛋","雞冠","雞腸","雞皮","鴨肉丸","貢丸","水晶餃","百頁豆腐"]},
 {id:'s4',name:'輕食減醣套餐',price:139,c:'雞肉:鹹水雞胸',d:["冬粉","花椰菜","玉米筍","豆皮","高麗菜"]},
 {id:'s5',name:'輕食減醣肉多餐',price:239,c:'雞肉:鹹水雞胸 × 2',d:["冬粉","白蘿蔔","高麗菜","玉米筍","龍鬚菜","珍珠蛋"]}]},
{k:'鏈上綠色資產 (蔬菜)',ic:'🥬',items:mk('v',[["娃娃菜",40],["玉米筍",30],["筍片",25],["水蓮",25],["四季豆",25],["龍鬚菜",25],["花椰菜",25],["鴻喜菇",25],["杏鮑菇",20],["金針菇",20],["小黃瓜",20],["高麗菜",20],["白蘿蔔",20],["黑木耳",20],["洋蔥",20],["海帶",20]])},
{k:'DAO去中心肉類 (肉類)',ic:'🥩',items:mk('meat',[["松阪豬",75],["牛五花",70],["雞軟骨",40],["雞心",30],["雞胗",30],["雞冠",25],["雞腸",25],["雞皮",25],["珍珠蛋",25],["鑫鑫腸",25]])},
{k:'節點火鍋料',ic:'🍢',items:mk('f',[["鴨肉丸",30],["貢丸",30],["水晶餃",30],["甜不辣",25],["蟹味棒",25],["皮蛋(溏心)",25],["鹹蛋(碎)",25],["豆干",25],["百頁豆腐",20],["蒟蒻絲",20],["豆皮衣(炸)",20],["豆皮",20],["米血",20]])},
{k:'共識滷味協議',ic:'🌶️',items:mk('l',[["無骨鳳爪",45],["豬耳朵",45],["滷脆腸",45]])},
{k:'自由流通麵 (麵食)',ic:'🍜',items:mk('z',[["王子麵",15],["冬粉",15]])},
{k:'厝邊溫食(炒麵/燴飯)',ic:'🔥',note:'炒麵類預設使用芥藍菜，若遇缺貨將調整為油菜或高麗菜。炒青菜為當季時令蔬菜，恕無法指定。',items:[...mk('w',[["沙茶羊肉炒麵",120],["沙茶牛肉炒麵",120],["沙茶羊肉燴飯",120],["沙茶牛肉燴飯",120],["炒羊肉",150],["炒牛肉",150],["炒青菜",100]]),{id:'w8',name:'當歸羊肉湯',price:80},{id:'w9',name:'當歸清湯',price:40}]}
];
MENU[1].note='套餐內容物如遇缺貨將自動更換等值商品，恕無法指定變更。';
const split=k=>{const m=k.match(/^(.*?)\s*\((.*?)\)$/);return m?[m[1],m[2]]:[k,'']};
let cur=0,cart=[];
let adminPassword=localStorage.getItem('admin_pwd')||'8888';
let isAdmin=false,isSoldOutMode=false;
let soldOutItems=JSON.parse(localStorage.getItem('sold_out_items')||'{}');
let soldOutCats=JSON.parse(localStorage.getItem('sold_out_cats')||'{}');

window.addEventListener('DOMContentLoaded',()=>{
  const params=new URLSearchParams(window.location.search);
  if(params.get('mode')==='admin'){
    isAdmin=true;
    $('soldOutModeBtn').style.display='block';
    $('soldOutListBtn').style.display='block';$('adminBtn').style.display='block';
    $('statusPill').classList.add('admin-mode');$('statusPill').onclick=openStatusSelector;
  }
  updateStatusDisplay();renderNav();renderGrid();renderCart();
});
window.addEventListener('storage',e=>{
  if(e.key==='shop_status')updateStatusDisplay();
  if(e.key==='sold_out_items'||e.key==='sold_out_cats'){
    soldOutItems=JSON.parse(localStorage.getItem('sold_out_items')||'{}');
    soldOutCats=JSON.parse(localStorage.getItem('sold_out_cats')||'{}');
    renderNav();renderGrid();
  }
});

function updateStatusDisplay(){
  const s=localStorage.getItem('shop_status')||'營業中';
  $('statusText').textContent=s;
  const c=s==='營業中'?'var(--ok)':s==='備料中'?'var(--ac)':'var(--bad)';
  $('statusDot').style.background=c;$('statusDot').style.boxShadow='0 0 8px '+c;
}
function openStatusSelector(){
  if(!isAdmin)return;
  $('mBox').innerHTML=`<h3>變更營業狀態</h3>
   <div class="opt-list">
    <button class="opt-btn" onclick="setShopStatus('營業中')">1. 營業中</button>
    <button class="opt-btn" onclick="setShopStatus('備料中')">2. 備料中</button>
    <button class="opt-btn" onclick="setShopStatus('休息中')">3. 休息中</button>
   </div>
   <div class="m-btns"><button class="btn-cancel" onclick="closeModal()">取消</button></div>`;
  $('modal').classList.add('open');
}
function setShopStatus(s){localStorage.setItem('shop_status',s);updateStatusDisplay();closeModal()}

function toggleSoldOutMode(){
  isSoldOutMode=!isSoldOutMode;
  const b=$('soldOutModeBtn');
  if(isSoldOutMode){b.style.background='var(--bad)';b.style.color='#fff';$('bodyRoot').classList.add('sold-mode')}
  else{b.style.background='var(--s2)';b.style.color='var(--ac2)';$('bodyRoot').classList.remove('sold-mode')}
  renderNav();renderGrid();
}
function openSoldOutListModal(){
  let h='';
  MENU.forEach((c,idx)=>{
    if(soldOutCats[idx]){const [t]=split(c.k);
      h+=`<div class="sold-item-row"><span class="sold-item-name">📁 群組：${esc(t)}</span><button class="sold-restore-btn" onclick="restoreCat(${idx})">恢復販售</button></div>`}
    c.items.forEach(it=>{
      if(soldOutItems[it.id])h+=`<div class="sold-item-row"><span class="sold-item-name">🍗 ${esc(it.name)}</span><button class="sold-restore-btn" onclick="restoreItem('${it.id}')">恢復販售</button></div>`;
    });
  });
  if(!h)h='<div style="text-align:center;color:var(--mu);padding:20px">目前沒有任何售完或關閉的品項！</div>';
  $('mBox').innerHTML=`<h3>📋 售完品項快速管理</h3><div class="sold-list-container">${h}</div><div class="m-btns"><button class="btn-cancel" onclick="closeModal()">關閉</button></div>`;
  $('modal').classList.add('open');
}
function restoreCat(i){soldOutCats[i]=false;localStorage.setItem('sold_out_cats',JSON.stringify(soldOutCats));renderNav();renderGrid();openSoldOutListModal()}
function restoreItem(id){
  soldOutItems[id]=false;
  if(id==='m1'||id==='m3')soldOutItems.m5=false;
  if(id==='m2'||id==='m4')soldOutItems.m6=false;
  localStorage.setItem('sold_out_items',JSON.stringify(soldOutItems));renderGrid();openSoldOutListModal();
}
function toggleCatSoldOut(i,e){
  if(e)e.stopPropagation();
  if(!isSoldOutMode)return;
  soldOutCats[i]=!soldOutCats[i];
  localStorage.setItem('sold_out_cats',JSON.stringify(soldOutCats));renderNav();renderGrid();
}
function toggleItemSoldOut(id){
  if(!isSoldOutMode)return;
  soldOutItems[id]=!soldOutItems[id];
  const S=soldOutItems;
  if(id==='m1'||id==='m3')S.m5=!!(S.m1||S.m3);
  else if(id==='m5'){S.m1=S.m3=S.m5}
  if(id==='m2'||id==='m4')S.m6=!!(S.m2||S.m4);
  else if(id==='m6'){S.m2=S.m4=S.m6}
  localStorage.setItem('sold_out_items',JSON.stringify(S));renderGrid();
}

function renderNav(){
  $('nav').innerHTML=MENU.map((c,i)=>{
    const [t,s]=split(c.k);
    return `<button class="nv${i===cur?' on':''}${soldOutCats[i]?' sold-out':''}" onclick="cur=${i};renderNav();renderGrid()">
      <div class="cat-badge" onclick="toggleCatSoldOut(${i},event)">✕</div>
      <i>${c.ic}</i><b>${esc(t)}</b><small>${esc(s)}</small></button>`;
  }).join('');
}
function renderGrid(){
  const c=MENU[cur],[t,s]=split(c.k),catSold=soldOutCats[cur];
  $('ph').innerHTML=`<h2>${esc(t)}</h2><p>${esc(c.note||s||'')}</p>`;
  $('grid').className='grid'+(c.combo?' wide':'');
  const card=(it,extra)=>{
    const q=cart.filter(x=>x.id.split('_')[0]===it.id).reduce((a,x)=>a+x.qty,0);
    const sold=catSold||soldOutItems[it.id];
    return `<div class="card${c.combo?' wd':''}${sold?' sold-out':''}" onclick="handleCardClick('${it.id}')">
      ${q?`<i class="qb">${q}</i>`:''}
      <div class="m"><div class="n">${esc(it.name)}</div>${extra||''}</div>
      <div class="f"><span class="price">${it.price}</span><span class="add">+</span></div></div>`;
  };
  let h='';
  if(c.two){
    h+='<div class="sec">鹹本位</div>'+c.items.filter(i=>i.name.startsWith('鹹')).map(i=>card(i)).join('')+
       '<div class="sec">燻本位</div>'+c.items.filter(i=>i.name.startsWith('煙')).map(i=>card(i)).join('');
  }else h=c.items.map(i=>card(i,c.combo?`<div class="d"><b>${esc(i.c)}</b><br>內容物：${esc(i.d.join('、'))}</div>`:'')).join('');
  $('grid').innerHTML=h;
}
function handleCardClick(id){
  if(isSoldOutMode){toggleItemSoldOut(id);return}
  const item=find(id);
  if(soldOutItems[id]||soldOutCats[cur])return;
  if(['s1','s2','s3'].includes(id))showComboOptions(item);
  else if(['w1','w2','w3','w4','w5','w6','w7'].includes(id))showStirFryOptions(item);
  else if(['w8','w9'].includes(id))showSoupOptions(item);
  else add(item.name,item.price,id);
}
function find(id){for(const c of MENU){const i=c.items.find(x=>x.id===id);if(i)return i}}

function showComboOptions(item){
  const saltSold=soldOutItems.m1||soldOutItems.m3||soldOutItems.m5||soldOutCats[0];
  const smokeSold=soldOutItems.m2||soldOutItems.m4||soldOutItems.m6||soldOutCats[0];
  const b=(label,dis,fl)=>`<button class="opt-btn ${dis?'disabled-opt':''}" ${dis?'':`onclick="addComboWithFlavor('${item.id}','${item.name}',${item.price},'${fl}')"`}>${label}</button>`;
  const opts=item.id==='s3'
    ?b('1. 全鹹水全雞',saltSold,'全鹹水')+b('2. 全煙燻全雞',smokeSold,'全煙燻')+b('3. 鹹半 + 燻半',saltSold||smokeSold,'鹹半+燻半')
    :b('1. 鹹水半雞',saltSold,'鹹水半雞')+b('2. 煙燻半雞',smokeSold,'煙燻半雞');
  $('mBox').innerHTML=`<h3>${esc(item.name)}</h3><div class="opt-list">${opts}</div><div class="m-btns"><button class="btn-cancel" onclick="closeModal()">取消</button></div>`;
  $('modal').classList.add('open');
}

let tempStirFryOptions={spice:'',flavor:''};
function showStirFryOptions(item){tempStirFryOptions={spice:'',flavor:''};renderStirFryModal(item)}
function renderStirFryModal(item){
  const sp=['微辣','小辣','中辣','大辣'],fl=['清淡','正常','重鹹'];
  $('mBox').innerHTML=`<h3>${esc(item.name)}</h3>
   <div class="opt-section-title">辣度選擇</div>
   <div class="opt-grid">${sp.map(s=>`<button class="opt-btn ${tempStirFryOptions.spice===s?'selected':''}" onclick="toggleStirFryOpt('spice','${s}','${item.id}')">${s}</button>`).join('')}</div>
   <div class="opt-section-title">口味選擇</div>
   <div class="opt-grid">${fl.map(f=>`<button class="opt-btn ${tempStirFryOptions.flavor===f?'selected':''}" onclick="toggleStirFryOpt('flavor','${f}','${item.id}')">${f}</button>`).join('')}</div>
   <div class="modal-tip">【溫馨提示】若您於點餐時未特別勾選或註明辣度與口味偏好 系統將自動以「不辣、正常口味」為您製作 謝謝您的配合</div>
   <div class="m-btns"><button class="btn-cancel" onclick="closeModal()">取消</button><button class="btn-confirm" onclick="confirmStirFry('${item.id}','${item.name}',${item.price})">確認</button></div>`;
  $('modal').classList.add('open');
}
function toggleStirFryOpt(type,val,id){
  tempStirFryOptions[type]=tempStirFryOptions[type]===val?'':val;
  renderStirFryModal(find(id));
}
function confirmStirFry(id,name,price){
  const tags=[tempStirFryOptions.spice,tempStirFryOptions.flavor].filter(Boolean);
  add(tags.length?`${name} (${tags.join(', ')})`:name,price,tags.length?id+'_'+tags.join('_'):id);
  closeModal();
}

let tempSoupGinger=true;
function showSoupOptions(item){tempSoupGinger=true;renderSoupModal(item)}
function renderSoupModal(item){
  $('mBox').innerHTML=`<h3>${esc(item.name)}</h3>
   <div class="opt-grid" style="grid-template-columns:1fr"><button class="opt-btn ${!tempSoupGinger?'selected':''}" onclick="toggleSoupGinger('${item.id}')">不要薑絲</button></div>
   <div class="modal-tip">【溫馨提示】若您於點餐時未特別勾選 系統將自動以「加薑絲」為您製作 謝謝您的配合</div>
   <div class="m-btns"><button class="btn-cancel" onclick="closeModal()">取消</button><button class="btn-confirm" onclick="confirmSoup('${item.id}','${item.name}',${item.price})">確認</button></div>`;
  $('modal').classList.add('open');
}
function toggleSoupGinger(id){tempSoupGinger=!tempSoupGinger;renderSoupModal(find(id))}
function confirmSoup(id,name,price){
  add(tempSoupGinger?name:name+' (不要薑絲)',price,tempSoupGinger?id:id+'_no_ginger');
  closeModal();
}
function addComboWithFlavor(id,name,price,flavor){add(`${name} (${flavor})`,price,`${id}_${flavor}`);closeModal()}

function add(name,price,id){
  const e=cart.find(x=>x.id===id);
  e?e.qty++:cart.push({id,name,price,qty:1});
  renderCart();renderGrid();
}
function qty(id,d){const e=cart.find(x=>x.id===id);if(!e)return;e.qty+=d;if(e.qty<=0)cart=cart.filter(x=>x.id!==id);renderCart();renderGrid()}
function removeItem(id){cart=cart.filter(x=>x.id!==id);renderCart();renderGrid()}
function clearCart(){cart=[];renderCart();renderGrid()}
function renderCart(){
  $('cl').innerHTML=cart.length?cart.map(x=>`<div class="ci"><div class="cr"><button class="del-btn" onclick="removeItem('${x.id}')" title="刪除">✕</button><span class="t">${esc(x.name)}</span><span class="p">$${x.price*x.qty}</span></div>
   <div class="stp"><button onclick="qty('${x.id}',-1)">−</button><span>${x.qty}</span><button onclick="qty('${x.id}',1)">+</button></div></div>`).join(''):'<div class="empty"><i>🛒</i>點選左側餐點加入訂單</div>';
  const n=cart.reduce((a,x)=>a+x.qty,0),t=cart.reduce((a,x)=>a+x.qty*x.price,0);
  $('cnt').textContent=`共 ${n} 項`;$('tot').textContent='$'+t;$('go').disabled=!n;
}
function closeModal(){$('modal').classList.remove('open');$('mBox').className='m-box'}

/* ===== 取餐資訊 ===== */
const NOODLE=['麵食分開裝','麵食裝一起','多數麵分開裝'];
const CK={name:'',phone:'',time:'',note:'',flavor:'',spice:'',salt:'',gear:[],pay:'現金',pct:100,off:0,err:false};

function timeSlots(){
  const d=new Date();d.setSeconds(0,0);
  d.setMinutes(Math.ceil(d.getMinutes()/10)*10);
  const day=d.getDate(),out=[];
  while(out.length<24&&d.getDate()===day){
    out.push(String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'));
    d.setMinutes(d.getMinutes()+10);
  }
  return out;
}
function openCheckout(){
  if(!cart.length)return;
  CK.err=false;
  $('mBox').className='m-box wide';
  renderCheckout();
  $('modal').classList.add('open');
}
const chip=(key,v)=>`<button class="chip${CK[key]===v?' on':''}" onclick="pick('${key}','${v}')">${v}</button>`;
const gearChip=v=>`<button class="chip${CK.gear.includes(v)?' on':''}" onclick="toggleGear('${v}')">${v}</button>`;
function pick(key,v){CK[key]=CK[key]===v?'':v;renderCheckout()}
function toggleGear(v){
  if(CK.gear.includes(v))CK.gear=CK.gear.filter(x=>x!==v);
  else{
    if(NOODLE.includes(v))CK.gear=CK.gear.filter(x=>!NOODLE.includes(x));
    CK.gear.push(v);
  }
  renderCheckout();
}
function fmtPhone(el){
  const d=el.value.replace(/\D/g,'').slice(0,10);
  let s=d;
  if(d.length>7)s=d.slice(0,4)+'-'+d.slice(4,7)+'-'+d.slice(7);
  else if(d.length>4)s=d.slice(0,4)+'-'+d.slice(4);
  el.value=s;CK.phone=s;
}
const phoneOK=p=>/^09\d{2}-\d{3}-\d{3}$/.test(p);

function calcTotals(){
  const sub=cart.reduce((a,x)=>a+x.qty*x.price,0);
  const extra=CK.flavor==='泰式+5元'?5:0;
  let total=sub+extra;
  if(isAdmin){
    const p=Math.min(100,Math.max(0,parseFloat(CK.pct)||0));
    total=Math.round(total*p/100)-(parseFloat(CK.off)||0);
  }
  return{sub,extra,total:Math.max(0,total)};
}
function updateTotal(){$('fmTot').textContent='$'+calcTotals().total}

function renderCheckout(){
  const slots=timeSlots();
  if(!slots.includes(CK.time))CK.time='';
  const t=calcTotals(),e=CK.err;
  $('mBox').innerHTML=`
   <h3 style="text-align:center">填寫取餐資訊</h3>
   <div class="fm-sec">
    <div class="fm-row${e&&!CK.name.trim()?' err':''}"><b>訂購人*</b><input value="${esc(CK.name)}" placeholder="請輸入訂購人姓名 (必填)" oninput="CK.name=this.value"></div>
    <div class="fm-err">請輸入訂購人姓名</div>
    <div class="fm-row${e&&!phoneOK(CK.phone)?' err':''}"><b>電話*</b><input value="${esc(CK.phone)}" inputmode="numeric" maxlength="12" placeholder="例如: 0912-345-678" oninput="fmtPhone(this)"></div>
    <div class="fm-err">電話格式需為 09XX-XXX-XXX</div>
    <div class="fm-row${e&&!CK.time?' err':''}"><b>取餐時間*</b>
     <select onchange="CK.time=this.value"><option value="">請選擇取餐時間</option>${slots.map(s=>`<option value="${s}"${CK.time===s?' selected':''}>${s}</option>`).join('')}</select></div>
    <div class="fm-err">請選擇取餐時間</div>
    <div class="fm-row"><b>顧客備註</b><input value="${esc(CK.note)}" placeholder="特殊需求 (例如:多蒜、少雞油)" oninput="CK.note=this.value"></div>
   </div>
   <div class="fm-sec">
    <div class="fm-title">倉位調整(選取口味)</div>
    <div class="fm-row"><b>口味:</b><div class="chips">${['原味','蒜味','泰式+5元'].map(v=>chip('flavor',v)).join('')}</div></div>
    <div class="fm-row"><b>辣度:</b><div class="chips">${['不辣','小辣','中辣','大辣'].map(v=>chip('spice',v)).join('')}</div></div>
    <div class="fm-row"><b>鹹度:</b><div class="chips">${['清淡','正常','重鹹'].map(v=>chip('salt',v)).join('')}</div></div>
    <div class="fm-row" style="border-top:1px dashed var(--ln);padding-top:12px"><b>配備:</b><div class="chips">${['需熱食','需餐具',...NOODLE].map(gearChip).join('')}</div></div>
    <div style="text-align:center;font-size:12.5px;color:var(--mu)">🌱 依法不主動提供免洗餐具</div>
    <div class="modal-tip">【溫馨提示】若您於點餐時未特別勾選或註明辣度與口味偏好 系統將自動以「原味、不辣、正常口味」為您製作 謝謝您的配合</div>
   </div>
   <div class="fm-sec">
    <div class="fm-line"><span>小計金額:</span><span>$${t.sub}</span></div>
    ${t.extra?`<div class="fm-line"><span>口味加價 (泰式):</span><span>+$${t.extra}</span></div>`:''}
    ${isAdmin?`<div class="fm-row"><b style="width:auto">折扣(%數)</b><input type="number" min="0" max="100" value="${CK.pct}" oninput="CK.pct=this.value;updateTotal()"><b style="width:auto">折讓(-$)</b><input type="number" min="0" value="${CK.off}" oninput="CK.off=this.value;updateTotal()"></div>`:''}
    <div class="fm-total"><span>應付總額:</span><b id="fmTot">$${t.total}</b></div>
    <div class="chips">${['現金','轉帳','Linepay','全支付'].map(v=>chip('pay',v)).join('')}</div>
   </div>
   <div class="m-btns"><button class="btn-cancel" onclick="closeModal()">上一步</button><button class="btn-confirm" onclick="submitCheckout()">下一步</button></div>`;
}
function submitCheckout(){
  CK.err=true;
  if(!CK.name.trim()||!phoneOK(CK.phone)||!CK.time){renderCheckout();return}
  const t=calcTotals();
  window.pendingOrder={
    name:CK.name.trim(),phone:CK.phone,time:CK.time,note:CK.note.trim(),
    flavor:CK.flavor||'原味',spice:CK.spice||'不辣',salt:CK.salt||'正常',
    gear:[...CK.gear],pay:CK.pay,items:JSON.parse(JSON.stringify(cart)),
    subtotal:t.sub,total:t.total
  };
  closeModal();
  alert('取餐資訊已確認！（訂單確認頁將於下一步製作）');
}

/* ===== 後台 ===== */
function openAdminLogin(){
  $('mBox').innerHTML=`<h3>後台管理登入</h3>
   <label>請輸入管理密碼<input type="password" id="loginPwd" placeholder="請輸入密碼" onkeydown="if(event.key==='Enter')verifyAdmin()"></label>
   <div class="m-btns"><button class="btn-cancel" onclick="closeModal()">取消</button><button class="btn-confirm" onclick="verifyAdmin()">登入</button></div>`;
  $('modal').classList.add('open');$('loginPwd').focus();
}
function verifyAdmin(){
  if($('loginPwd').value===adminPassword)openAdminPanel();
  else{alert('密碼錯誤！');$('loginPwd').value='';$('loginPwd').focus()}
}
function openAdminPanel(){
  $('mBox').innerHTML=`<h3>⚙ 後台管理</h3><div class="opt-list"><button class="opt-btn" onclick="openChangePassword()">🔒 修改密碼</button></div><div class="m-btns"><button class="btn-cancel" onclick="closeModal()">關閉</button></div>`;
}
function openChangePassword(){
  $('mBox').innerHTML=`<h3>修改後台密碼</h3>
   <label>1. 輸入舊密碼<input type="password" id="oldPwd" placeholder="請輸入舊密碼"></label>
   <label>2. 輸入新密碼<input type="password" id="newPwd" placeholder="請輸入新密碼"></label>
   <label>3. 再次輸入新密碼<input type="password" id="confirmPwd" placeholder="請再次輸入新密碼"></label>
   <div class="m-btns"><button class="btn-cancel" onclick="openAdminPanel()">返回</button><button class="btn-confirm" onclick="submitNewPassword()">確認修改</button></div>`;
}
function submitNewPassword(){
  const o=$('oldPwd').value,n=$('newPwd').value,c=$('confirmPwd').value;
  if(o!==adminPassword)return alert('舊密碼輸入錯誤！');
  if(!n)return alert('新密碼不得為空！');
  if(n!==c)return alert('兩次輸入的新密碼不一致！');
  adminPassword=n;localStorage.setItem('admin_pwd',n);
  alert('密碼修改成功！');openAdminPanel();
}

function tick(){const d=new Date();$('clock').textContent=`${d.getMonth()+1}/${d.getDate()} 週${'日一二三四五六'[d.getDay()]} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
tick();setInterval(tick,3e4);
</script></body></html>
