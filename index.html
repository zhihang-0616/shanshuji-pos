<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>線上點餐系統</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { display: flex; height: 100vh; background: #f4f6f9; color: #333; overflow: hidden; }
.main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
header { background: #fff; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e1e4e8; }
.search-bar input { padding: 10px 15px; width: 300px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
.categories { display: flex; gap: 10px; padding: 15px 25px; background: #fff; border-bottom: 1px solid #e1e4e8; overflow-x: auto; }
.cat-btn { padding: 8px 18px; border: none; background: #f0f2f5; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 14px; color: #555; white-space: nowrap; }
.cat-btn.active { background: #2f3542; color: #fff; }
.menu-grid { flex: 1; padding: 20px 25px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; align-content: start; }
.menu-item { background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); cursor: pointer; transition: transform 0.1s; display: flex; flex-direction: column; justify-content: space-between; }
.menu-item:active { transform: scale(0.98); }
.item-name { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
.item-price { color: #e74c3c; font-weight: 700; font-size: 15px; }
.cart-sidebar { width: 350px; background: #fff; border-left: 1px solid #e1e4e8; display: flex; flex-direction: column; height: 100vh; }
.cart-header { padding: 20px; border-bottom: 1px solid #e1e4e8; font-size: 18px; font-weight: 700; }
.cart-items { flex: 1; padding: 20px; overflow-y: auto; }
.cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 14px; }
.cart-footer { padding: 20px; border-top: 1px solid #e1e4e8; background: #fafbfc; }
.total-row { display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; margin-bottom: 15px; }
.checkout-btn { width: 100%; padding: 12px; background: #2ed573; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; }
.checkout-btn:hover { background: #26af5f; }
</style>
</head>
<body>

<div class="main-content">
  <header>
    <h2>去中心點餐系統</h2>
    <div class="search-bar">
      <input type="text" placeholder="搜尋品項名稱...">
    </div>
  </header>
  
  <div class="categories">
    <button class="cat-btn active">全部品項</button>
    <button class="cat-btn">招牌套餐</button>
    <button class="cat-btn">雞肉系列</button>
    <button class="cat-btn">配菜加料</button>
  </div>

  <div class="menu-grid">
    <div class="menu-item">
      <div class="item-name">散戶輕倉個人餐</div>
      <div class="item-price">$260</div>
    </div>
    <div class="menu-item">
      <div class="item-name">巨鯨重倉肉多多餐</div>
      <div class="item-price">$390</div>
    </div>
    <div class="menu-item">
      <div class="item-name">去骨雞腿</div>
      <div class="item-price">$60</div>
    </div>
    <div class="menu-item">
      <div class="item-name">雞胗</div>
      <div class="item-price">$30</div>
    </div>
  </div>
</div>

<div class="cart-sidebar">
  <div class="cart-header">目前訂單</div>
  <div class="cart-items">
    <div class="cart-item">
      <span>散戶輕倉個人餐 (煙燻)</span>
      <span>$260</span>
    </div>
  </div>
  <div class="cart-footer">
    <div class="total-row">
      <span>總計</span>
      <span>$260</span>
    </div>
    <button class="checkout-btn">送出結算</button>
  </div>
</div>

</body>
</html>
