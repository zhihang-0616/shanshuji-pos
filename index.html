<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>去中心鹹水雞 X 厝邊溫食 POS</title>
<style>
:root{--bg:#0f0d0b;--s1:#1a1612;--s2:#241e18;--ln:#3a3027;--tx:#f4ece0;--mu:#a3937e;--ac:#e8a33d;--ac2:#f6c86a;--ok:#4caf7d;--bad:#e5604d;--r:14px}
*{box-sizing:border-box;margin:0;padding:0;font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%}body{background:var(--bg);color:var(--tx);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* 頂部列 */
.top{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--s1);border-bottom:1px solid var(--ln)}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--ac2),var(--ac));display:grid;place-items:center;font-size:22px}
.brand b{display:block;font-size:17px;letter-spacing:.5px}.brand small{color:var(--mu);font-size:12px}
.sp{flex:1}
.pill{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:99px;background:var(--s2);border:1px solid var(--ln);font-size:14px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.clock{color:var(--mu);font-variant-numeric:tabular-nums;font-size:14px}
.ibtn{padding:8px 14px;border-radius:10px;background:var(--s2);border:1px solid var(--ln);font-size:14px;display:none}
.ibtn:hover{border-color:var(--ac)}

/* 主體三欄 */
.main{flex:1;display:grid;grid-template-columns:150px 1fr 350px;min-height:0}
.nav{background:var(--s1);border-right:1px solid var(--ln);padding:12px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.nv{display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 6px;border-radius:12px;text-align:center;color:var(--mu);border:1px solid transparent;transition:.15s}
.nv i{font-style:normal;font-size:24px}.nv b{font-size:14px}.nv small{font-size:11px;opacity:.8;min-height:14px}
.nv:hover{background:var(--s2)}
.nv.on{background:rgba(232,163,61,.14);border-color:var(--ac);color:var(--ac2)}

.pane{display:flex;flex-direction:column;min-height:0}
.ph{padding:16px 22px 6px}.ph h2{font-size:22px}.ph p{color:var(--mu);font-size:13px;margin-top:2px}
.grid{flex:1;overflow-y:auto;padding:12px 22px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;align-content:start}
.grid.wide{grid-template-columns:1fr}
.card{position:relative;background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);padding:16px 14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:.15s;user-select:none}
.card:hover{border-color:var(--ac);transform:translateY(-2px)}.card:active{transform:scale(.98)}
.card .n{font-size:16px;font-weight:700;line-height:1.35}
.card .d{font-size:12.5px;color:var(--mu);line-height:1.6}
.card .f{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.price{font-size:20px;font-weight:800;color:var(--ac2)}.price:before{content:"$";font-size:13px;margin-right:1px;opacity:.8}
.add{width:34px;height:34px;border-radius:50%;background:var(--ac);color:#1a1204;font-size:22px;font-weight:700;display:grid;place-items:center}
.qb{position:absolute;top:-8px;right:-8px;min-width:26px;height:26px;padding:0 7px;border-radius:99px;background:var(--bad);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.sec{grid-column:1/-1;font-size:13px;font-weight:700;color:var(--ac);letter-spacing:2px;padding:6px 2px;border-bottom:1px dashed var(--ln)}
.card.wd{flex-direction:row;align-items:center;gap:16px}.card.wd .m{flex:1}

/* 購物車 */
.cart{background:var(--s1);border-left:1px solid var(--ln);display:flex;flex-direction:column;min-height:0}
.ch{padding:16px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--ln)}
.ch h3{font-size:18px}.ch button{color:var(--mu);font-size:13px}.ch button:hover{color:var(--bad)}
.cl{flex:1;overflow-y:auto;padding:8px 14px}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--mu);font-size:14px}.empty i{font-style:normal;font-size:40px;opacity:.5}
.ci{padding:12px 4px;border-bottom:1px solid var(--ln)}
.cr{display:flex;align-items:center;gap:10px}.cr .t{flex:1;font-weight:600;font-size:15px}.cr .p{font-weight:700;color:var(--ac2)}
.stp{display:flex;align-items:center;gap:2px;background:var(--s2);border-radius:99px;padding:2px;margin-top:8px;width:max-content}
.stp button{width:28px;height:28px;border-radius:50%;font-size:17px}.stp button:hover{background:var(--ln)}.stp span{min-width:28px;text-align:center;font-weight:700}
.cf{padding:16px 18px;border-top:1px solid var(--ln);display:flex;flex-direction:column;gap:12px;background:var(--s2)}
.sum{display:flex;justify-content:space-between;align-items:baseline;color:var(--mu);font-size:14px}.sum b{font-size:28px;color:var(--ac2)}
.go{padding:16px;border-radius:12px;background:linear-gradient(135deg,var(--ac2),var(--ac));color:#1a1204;font-weight:800;font-size:17px}
.go:disabled{background:var(--ln);color:var(--mu);cursor:not-allowed}
.hint{font-size:12px;color:var(--mu);text-align:center}

/* 彈窗樣式 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;place-items:center;z-index:999;padding:20px}
.modal.open{display:grid}
.m-box{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);width:100%;max-width:400px;padding:24px;display:flex;flex-direction:column;gap:16px}
.m-box h3{font-size:18px;color:var(--ac2)}
.m-box label{font-size:14px;color:var(--mu);display:flex;flex-direction:column;gap:6px}
.m-box input, .m-box select{padding:10px 14px;border-radius:10px;background:var(--s2);border:1px solid var(--ln);color:var(--tx);font-size:15px}
.m-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:10px}
.m-btns button{padding:10px 18px;border-radius:10px;font-weight:600}
.m-btns .btn-cancel{background:var(--s2);border:1px solid var(--ln)}
.m-btns .btn-confirm{background:var(--ac);color:#1a1204}

::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--ln);border-radius:4px}

/* 手機 / 平板直式 */
@media(max-width:900px){
 body{overflow:auto;height:auto}.main{grid-template-columns:1fr;display:flex;flex-direction:column}
 .nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--ln);padding:8px}.nv{flex:0 0 auto;min-width:92px;padding:8px 10px}.nv small{display:none}
 .grid{max-height:none;overflow:visible;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));padding:12px 14px}
 .cart{border-left:0;border-top:2px solid var(--ln);position:sticky;bottom:0;max-height:55vh}
 .top{padding:10px 14px;flex-wrap:wrap}.clock{display:none}
}
</style></head>
<body>
<header class="top">
 <div class="logo">🍗</div>
 <div class="brand"><b>去中心鹹水雞 X 厝邊溫食</b><small>POS 點餐系統</small></div>
 <div class="sp"></div>
 <div class="pill"><span class="dot" id="statusDot"></span><span id="statusText">營業中</span></div>
 <div class="clock" id="clock"></div>
 <button class="ibtn" id="adminBtn" onclick="openAdminLogin()">⚙ 店家</button>
</header>
<div class="main">
 <nav class="nav" id="nav"></nav>
 <section class="pane"><div class="ph" id="ph"></div><div class="grid" id="grid"></div></section>
 <aside class="cart">
  <div class="ch"><h3>🧾 訂單明細</h3><button onclick="clearCart()">清空</button></div>
  <div class="cl" id="cl"></div>
  <div class="cf"><div class="sum"><span id="cnt">共 0 項</span><b id="tot">$0</b></div>
   <button class="go" id="go" disabled>下一步：填寫取餐資訊</button><div class="hint">結帳流程將在下一步製作</div></div>
 </aside>
</div>

<!-- 店家登入與後台管理彈窗 -->
<div class="modal" id="adminModal">
 <div class="m-box" id="adminModalContent">
  <!-- 內容由 JS 動態填入 -->
 </div>
</div>

<!-- 套餐口味選擇彈窗 -->
<div class="modal" id="comboModal">
 <div class="m-box">
  <h3>選擇套餐雞肉口味</h3>
  <p id="comboModalTitle" style="font-size:14px;color:var(--mu)"></p>
  <label>請選擇雞肉作法：
   <select id="comboFlavorSelect">
    <option value="鹹水">1. 鹹水</option>
    <option value="煙燻">2. 煙燻</option>
   </select>
  </label>
  <div class="m-btns">
   <button class="btn-cancel" onclick="$('comboModal').classList.remove('open')">取消</button>
   <button class="btn-confirm" onclick="confirmComboAdd()">加入訂單</button>
  </div>
 </div>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;n'}[c]));
const mk=(p,r)=>r.map(([n,pr],i)=>({id:p+(i+1),name:n,price:pr}));
const MENU=[
{k:'信仰雞本位主義 (主食)',ic:'🍗',items:mk('m',[["鹹水雞腿",65],["煙燻雞腿",75],["鹹水雞胸",65],["煙燻雞胸",75],["鹹水半雞",130],["煙燻半雞",150]]),two:true},
{k:'智能合約 (套餐)',ic:'🍱',combo:true,items:[
 {id:'s1',name:'散戶輕倉個人餐',price:260,c:'雞肉：半隻（鹹水 / 煙燻）',d:["豬耳朵","雞冠","豆干","鴨肉丸","珍珠蛋"]},
 {id:'s2',name:'巨鯨重倉肉多多餐',price:390,c:'雞肉：半隻（鹹水 / 煙燻）',d:["牛五花","松阪豬","雞冠","雞腸","雞軟骨","鴨肉丸","鑫鑫腸"]},
 {id:'s3',name:'DAO節點下酒派對餐',price:630,c:'雞肉：全雞（全鹹水 / 全煙燻 / 鹹半+燻半）',d:["牛五花","松阪豬","豬耳朵","珍珠蛋","雞冠","雞腸","雞皮","鴨肉丸","貢丸","水晶餃","百頁豆腐"]},
 {id:'s4',name:'輕食減醣套餐',price:139,c:'雞肉：鹹水雞胸',d:["冬粉","花椰菜","玉米筍","豆皮","高麗菜"]},
 {id:'s5',name:'輕食減醣肉多餐',price:239,c:'雞肉：鹹水雞胸 × 2',d:["冬粉","白蘿蔔","高麗菜","玉米筍","龍鬚菜","珍珠蛋"]}]},
{k:'鏈上綠色資產 (蔬菜)',ic:'🥬',items:mk('v',[["娃娃菜",40],["玉米筍",30],["筍片",25],["水蓮",25],["四季豆",25],["龍鬚菜",25],["花椰菜",25],["鴻喜菇",25],["杏鮑菇",20],["金針菇",20],["小黃瓜",20],["高麗菜",20],["白蘿蔔",20],["黑木耳",20],["洋蔥",20],["海帶",20]])},
{k:'DAO去中心肉類 (肉類)',ic:'🥩',items:mk('meat',[["松阪豬",75],["牛五花",70],["雞軟骨",40],["雞心",30],["雞胗",30],["雞冠",25],["雞腸",25],["雞皮",25],["珍珠蛋",25],["鑫鑫腸",25]])},
{k:'節點火鍋料',ic:'🍢',items:mk('f',[["鴨肉丸",30],["貢丸",30],["水晶餃",30],["甜不辣",25],["蟹味棒",25],["皮蛋(溏心)",25],["鹹蛋(碎)",25],["豆干",25],["百頁豆腐",20],["蒟蒻絲",20],["豆皮衣(炸)",20],["豆皮",20],["米血",20]])},
{k:'共識滷味協議',ic:'🌶️',items:mk('l',[["無骨鳳爪",45],["豬耳朵",45],["滷脆腸",45]])},
{k:'自由流通麵 (麵食)',ic:'🍜',items:mk('z',[["王子麵",15],["冬粉",15]])},
{k:'厝邊溫食(炒麵/燴飯)',ic:'🔥',note:'炒麵類預設使用芥藍菜，若遇缺貨將調整為油菜或高麗菜。炒青菜為當季時令蔬菜，恕無法指定。',items:[...mk('w',[["沙茶羊肉炒麵",120],["沙茶牛肉炒麵",120],["沙茶羊肉燴飯",120],["沙茶牛肉燴飯",120],["炒羊肉",150],["炒牛肉",150],["炒青菜",100]]),{id:'w8',name:'當歸羊肉湯',price:80},{id:'w9',name:'當歸清湯',price:40}]}
];
MENU[1].note='套餐內容物如遇缺貨將自動更換等值商品，恕無法指定變更。';
const split=k=>{const m=k.match(/^(.*?)\s*\((.*?)\)$/);return m?[m[1],m[2]]:[k,''] };
let cur=0,cart=[],shopStatus='營業中',adminPass=localStorage.getItem('pos_pass')||'8888',pendingCombo=null;

// 檢查網址是否為 admin 模式
if(new URLSearchParams(window.location.search).get('mode')==='admin'){
 $('adminBtn').style.display='inline-block';
}

function updateStatusUI(){
 const dot=$('statusDot'),txt=$('statusText');
 txt.textContent=shopStatus;
 if(shopStatus==='營業中'){dot.style.background='var(--ok)';dot.style.boxShadow='0 0 8px var(--ok)';}
 else if(shopStatus==='備料中'){dot.style.background='var(--ac)';dot.style.boxShadow='0 0 8px var(--ac)';}
 else{dot.style.background='var(--bad)';dot.style.boxShadow='0 0 8px var(--bad)';}
}

function openAdminLogin(){
 const modal=$('adminModal'),c=$('adminModalContent');
 c.innerHTML=`
  <h3>店家登入</h3>
  <label>請輸入管理密碼：<input type="password" id="loginPass" placeholder="預設 8888"></label>
  <div class="m-btns">
   <button class="btn-cancel" onclick="$('adminModal').classList.remove('open')">取消</button>
   <button class="btn-confirm" onclick="verifyAdmin()">登入</button>
  </div>
 `;
 modal.classList.add('open');
}

function verifyAdmin(){
 const p=$('loginPass').value;
 if(p===adminPass){
  openAdminPanel();
 }else{
  alert('密碼錯誤！');
 }
}

function openAdminPanel(){
 const modal=$('adminModal'),c=$('adminModalContent');
 c.innerHTML=`
  <h3>⚙ 店家管理中心</h3>
  <label>切換營業狀態：
   <select id="statusSelect">
    <option value="營業中"${shopStatus==='營業中'?' selected':''}>營業中</option>
    <option value="備料中"${shopStatus==='備料中'?' selected':''}>備料中</option>
    <option value="休息中"${shopStatus==='休息中'?' selected':''}>休息中</option>
   </select>
  </label>
  <hr style="border-color:var(--ln)">
  <label>修改管理密碼：<input type="password" id="newPass" placeholder="輸入新密碼"></label>
  <div class="m-btns">
   <button class="btn-cancel" onclick="$('adminModal').classList.remove('open')">關閉</button>
   <button class="btn-confirm" onclick="saveAdminSettings()">儲存設定</button>
  </div>
 `;
 modal.classList.add('open');
}

function saveAdminSettings(){
 shopStatus=$('statusSelect').value;
 updateStatusUI();
 const np=$('newPass').value;
 if(np){
  adminPass=np;
  localStorage.setItem('pos_pass',np);
  alert('狀態已更新，密碼修改成功！');
 }else{
  alert('狀態已更新！');
 }
 $('adminModal').classList.remove('open');
}

function renderNav(){$('nav').innerHTML=MENU.map((c,i)=>{const[t,s]=split(c.k);return`<button class="nv${i===cur?' on':''}" onclick="cur=${i};renderNav();renderGrid()"><i>${c.ic}</i><b>${esc(t)}</b><small>${esc(s)}</small></button>`}).join('')}

function renderGrid(){const c=MENU[cur],[t,s]=split(c.k);
 $('ph').innerHTML=`<h2>${esc(t)}</h2><p>${esc(c.note||s||'')}</p>`;
 $('grid').className='grid'+(c.combo?' wide':'');
 const card=(it,extra)=>{const q=cart.filter(x=>x.id===it.id).reduce((a,x)=>a+x.qty,0);
  return`<div class="card${c.combo?' wd':''}" onclick="handleItemClick('${it.id}')">${q?`<i class="qb">${q}</i>`:''}<div class="m"><div class="n">${esc(it.name)}</div>${extra||''}</div><div class="f"><span class="price">${it.price}</span><span class="add">+</span></div></div>`};
 let h='';
 if(c.two){h+='<div class="sec">鹹本位</div>'+c.items.filter(i=>i.name.startsWith('鹹')).map(i=>card(i)).join('')+'<div class="sec">燻本位</div>'+c.items.filter(i=>i.name.startsWith('煙')).map(i=>card(i)).join('')}
 else h=c.items.map(i=>card(i,c.combo?`<div class="d"><b>${esc(i.c)}</b><br>內容物：${esc(i.d.join('、'))}</div>`:'')).join('');
 $('grid').innerHTML=h}

function find(id){for(const c of MENU){const i=c.items.find(x=>x.id===id);if(i)return i}}

function handleItemClick(id){
 const item=find(id);
 // 檢查是否為散戶、巨鯨、DAO 套餐 (id 為 s1, s2, s3)
 if(['s1','s2','s3'].includes(id)){
  pendingCombo=item;
  $('comboModalTitle').textContent=item.name+' ($'+item.price+')';$('comboModal').classList.add('open');
 }else{
  addCartItem(item.id, item.name, item.price);
 }
}

function confirmComboAdd(){
 const flavor=$('comboFlavorSelect').value;
 if(!pendingCombo)return;
 const customName=`${pendingCombo.name} (${flavor})`;
 addCartItem(pendingCombo.id+'_'+flavor, customName, pendingCombo.price);
 $('comboModal').classList.remove('open');
 pendingCombo=null;
}

function addCartItem(id, name, price){
 const e=cart.find(x=>x.id===id);
 e?e.qty++:cart.push({id,name,price,qty:1});
 renderCart();renderGrid();
}

function qty(id,d){const e=cart.find(x=>x.id===id);if(!e)return;e.qty+=d;if(e.qty<=0)cart=cart.filter(x=>x.id!==id);renderCart();renderGrid()}
function clearCart(){if(cart.length&&!confirm('確定清空訂單？'))return;cart=[];renderCart();renderGrid()}

function renderCart(){
 $('cl').innerHTML=cart.length?cart.map(x=>`<div class="ci"><div class="cr"><span class="t">${esc(x.name)}</span><span class="p">$${x.price*x.qty}</span></div>
  <div class="stp"><button onclick="qty('${x.id}',-1)">−</button><span>${x.qty}</span><button onclick="qty('${x.id}',1)">+</button></div></div>`).join(''):'<div class="empty"><i>🛒</i>點選左側餐點加入訂單</div>';
 const n=cart.reduce((a,x)=>a+x.qty,0),t=cart.reduce((a,x)=>a+x.qty*x.price,0);
 $('cnt').textContent=`共 ${n} 項`;$('tot').textContent='$'+t;$('go').disabled=!n}

function tick(){const d=new Date();$('clock').textContent=`${d.getMonth()+1}/${d.getDate()} 週${'日一二三四五六'[d.getDay()]} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
tick();setInterval(tick,3e4);renderNav();renderGrid();renderCart();updateStatusUI();
</script></body></html>
