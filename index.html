<head>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background-color: #1a1612;
            color: #dcd6cd;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        /* 頂部資訊列 */
        header {
            background-color: #241e18;
            border-bottom: 1px solid #4a3b2c;
            padding: 12px 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-badge {
            background-color: #2e4d2e;
            color: #7ecc7e;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #4CAF50;
            border-radius: 50%;
        }
        .title {
            font-size: 20px;
            font-weight: bold;
            color: #d4af37;
            letter-spacing: 1px;
        }
        .header-info {
            display: flex;
            gap: 30px;
            font-size: 13px;
            color: #b8aaa0;
        }

        /* 主體佈局：左側選單、右側訂單 */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .menu-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #4a3b2c;
            overflow: hidden;
        }

        /* 分類標籤列 */
        .tabs {
            display: flex;
            background-color: #241e18;
            border-bottom: 1px solid #4a3b2c;
            overflow-x: auto;
            white-space: nowrap;
        }
        .tab {
            padding: 14px 18px;
            cursor: pointer;
            font-size: 14px;
            color: #9c8b7c;
            border-bottom: 3px solid transparent;
            text-align: center;
            transition: all 0.2s;
        }
        .tab small {
            display: block;
            font-size: 11px;
            color: #6e5f52;
            margin-top: 2px;
        }
        .tab.active {
            color: #d4af37;
            border-bottom-color: #d4af37;
            background-color: #2c241d;
        }

        /* 商品展示區 */
        .products-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: #1a1612;
        }
        .category-notice {
            background-color: #2b2218;
            border-left: 4px solid #d4af37;
            padding: 10px 15px;
            font-size: 13px;
            color: #dcd6cd;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }
        .product-card {
            background-color: #26201a;
            border: 1px solid #423528;
            border-radius: 6px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 90px;
        }
        .product-card:hover {
            border-color: #d4af37;
            background-color: #332a21;
        }
        .product-name {
            font-size: 15px;
            color: #f0e6d8;
            margin-bottom: 8px;
        }
        .product-price {
            font-size: 14px;
            color: #d4af37;
            font-weight: bold;
        }

        /* 套餐特殊排版 */
        .set-card {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px;
            text-align: left;
        }
        .set-info h3 {
            font-size: 16px;
            color: #f0e6d8;
            margin-bottom: 6px;
        }
        .set-info p {
            font-size: 12px;
            color: #a89888;
            line-height: 1.5;
        }
        .set-price {
            font-size: 18px;
            color: #d4af37;
            font-weight: bold;
        }

        /* 右側訂單與設定面板 */
        .order-panel {
            width: 420px;
            background-color: #221c16;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #4a3b2c;
        }
        .order-header-bar {
            padding: 12px 15px;
            background-color: #2a221b;
            border-bottom: 1px solid #4a3b2c;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #d4af37;
            cursor: pointer;
        }
        .order-content {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .query-order-btn {
            background-color: #1f363b;
            color: #61cbd9;
            border: 1px solid #2d5861;
            padding: 8px;
            border-radius: 4px;
            text-align: center;
            font-size: 13px;
            cursor: pointer;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }
        .form-row label {
            width: 70px;
            color: #b8aaa0;
        }
        .form-row input, .form-row textarea {
            flex: 1;
            background-color: #1a1612;
            border: 1px solid #423528;
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 13px;
        }
        .form-row input:focus, .form-row textarea:focus {
            border-color: #d4af37;
            outline: none;
        }

        /* 開倉調整區塊 */
        .adjustment-section {
            background-color: #1f1914;
            border: 1px solid #3b2f23;
            border-radius: 6px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .adjustment-title {
            font-size: 13px;
            color: #d4af37;
            text-align: center;
            font-weight: bold;
            margin-bottom: 2px;
        }
        .option-group {
            display: flex;
            align-items: center;
            font-size: 12px;
            gap: 8px;
        }
        .option-label {
            width: 45px;
            color: #a89888;
        }
        .option-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            flex: 1;
        }
        .opt-btn {
            background-color: #2b2218;
            border: 1px solid #4a3b2c;
            color: #c4b6a8;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 11px;
            cursor: pointer;
        }
        .opt-btn.active {
            background-color: #4a3b2c;
            color: #d4af37;
            border-color: #d4af37;
        }
        .cutlery-notice {
            font-size: 10px;
            color: #8c7d70;
            text-align: center;
            margin-top: 2px;
        }

        /* 結算與按鈕區 */
        .checkout-footer {
            padding: 15px;
            background-color: #241e18;
            border-top: 1px solid #4a3b2c;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .total-amount {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
        }
        .total-amount span:last-child {
            color: #d4af37;
            font-size: 20px;
        }
        .payment-methods {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        .pay-btn {
            background-color: #1f363b;
            border: 1px solid #2d5861;
            color: #fff;
            padding: 8px 0;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            text-align: center;
        }
        .pay-btn.active {
            background-color: #2e6b3e;
            border-color: #4CAF50;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
        }
        .btn-clear {
            flex: 1;
            background-color: #8b2626;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-submit {
            flex: 2;
            background-color: #d4af37;
            color: #1a1612;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }
        .btn-submit:hover {
            background-color: #e6c55c;
        }
    </style>
</head>

        let currentTabId = menuData[0].id;

        // 初始化分頁與商品顯示
        function renderTabs() {
            const tabsContainer = document.getElementById('categoryTabs');
            tabsContainer.innerHTML = '';
            menuData.forEach((cat, index) => {
                const tab = document.createElement('div');
                tab.className = `tab ${cat.id === currentTabId ? 'active' : ''}`;
                tab.innerHTML = `${cat.name} ${cat.sub ? `<small>${cat.sub}</small>` : ''}`;
                tab.onclick = () => {
                    currentTabId = cat.id;
                    renderTabs();
                    renderProducts();
                };
                tabsContainer.appendChild(tab);
            });
        }

        function renderProducts() {
            const container = document.getElementById('productsContainer');
            container.innerHTML = '';
            
            const currentCat = menuData.find(c => c.id === currentTabId);
            
            if (currentCat.notice) {
                const noticeDiv = document.createElement('div');
                noticeDiv.className = 'category-notice';
                noticeDiv.innerText = currentCat.notice;
                container.appendChild(noticeDiv);
            }

            const grid = document.createElement('div');
            grid.className = 'products-grid';

            currentCat.items.forEach(item => {
                const card = document.createElement('div');
                card.className = `product-card ${currentCat.type === 'set' ? 'set-card' : ''}`;
                
                if (currentCat.type === 'set') {
                    card.innerHTML = `
                        <div class="set-info">
                            <h3>${item.name}</h3>
                            <p>${item.desc.replace(/\n/g, '<br>')}</p>
                        </div>
                        <div class="set-price">$${item.price}</div>
                    `;
                } else {
                    card.innerHTML = `
                        <div class="product-name">${item.name}</div>
                        <div class="product-price">$${item.price}</div>
                    `;
                }
                
                // 點擊加入點餐示範（可在此擴充購物車陣列計算總金額）
                card.onclick = () => {
                    alert(`已點選：${item.name} ($${item.price})`);
                };

                grid.appendChild(card);
            });

            container.appendChild(grid);
        }

        function selectOpt(btn, groupType) {
            const parent = btn.parentElement;
            parent.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function clearOrder() {
            document.getElementById('orderName').value = '';
            document.getElementById('orderPhone').value = '';
            document.getElementById('orderMemo').value = '';
            alert('已清除訂單資訊');
        }

        function submitOrder() {
            const name = document.getElementById('orderName').value;
            const phone = document.getElementById('orderPhone').value;
            if(!name || !phone) {
                alert('請填寫訂購人姓名與電話！');
                return;
            }
            alert(`感謝 ${name} 的訂單！已成功送出結帳。`);
        }

        // 初始化執行
        renderTabs();
        renderProducts();
    </script>
</body>
</html>
