<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>去中心鹹水雞 X 厝邊溫食 POS</title>
<link rel="manifest" id="mf" href="manifest.json">
<meta name="theme-color" content="#140a04">
<link rel="icon" type="image/png" href="logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#120a04;--s1:#2a1a0c;--s2:#3b2512;--ln:#7a5420;--tx:#fbefd0;--mu:#d3b887;--ac:#e0b040;--ac2:#ffe9a8;--ok:#4caf7d;--bad:#d9534f;--r:10px}
*{box-sizing:border-box;margin:0;padding:0;font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%}body{background:var(--bg);color:var(--tx);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.top{position:relative;display:flex;align-items:center;gap:14px;padding:10px 20px;background:linear-gradient(180deg,rgba(14,7,2,.5),rgba(14,7,2,.82)),url(bg-wave.jpg) center 72%/cover,#140a04;border-style:solid;border-width:0 0 3px;border-image:linear-gradient(90deg,transparent,#c08a25 12%,#ffe9a8 50%,#c08a25 88%,transparent) 1;box-shadow:0 6px 18px rgba(0,0,0,.75)}
.top:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,#c08a25 12%,#ffe9a8 50%,#c08a25 88%,transparent)}
.top-left{display:flex;align-items:center;gap:10px}
.pill{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:99px;background:var(--s2);border:1px solid var(--ln);font-size:14px;font-weight:600;transition:.15s}
.pill.admin-mode{cursor:pointer}.pill.admin-mode:hover{border-color:var(--ac)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.sp{flex:1}
.brand-center{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.brand-center .brand-row{display:flex;align-items:center;white-space:nowrap}
.brand-center .shop{font-family:"Noto Serif TC","Songti TC","PMingLiU","Microsoft JhengHei",serif;font-weight:900;font-size:28px;letter-spacing:2px;background:linear-gradient(180deg,#fff6c8 0%,#f0c24f 42%,#b57a1b 58%,#f6d77f 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(0 2px 0 #3d2306) drop-shadow(0 4px 8px rgba(0,0,0,.7))}
.brand-center .sub{font-size:15px;letter-spacing:3px;color:var(--ac2);font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.brand-center .logo{width:72px;height:72px;object-fit:contain;margin-right:12px;filter:drop-shadow(0 0 10px rgba(255,190,60,.55))}
.brand-center .sep{color:var(--ac);margin:0 12px;font-size:22px}
.brand-actions{display:flex;gap:6px 8px;align-items:center;flex-wrap:wrap;justify-content:center}
.ibtn,.pill{white-space:nowrap}
@media(max-width:1500px){.ibtn{padding:5px 9px}.top{gap:10px;padding-left:14px;padding-right:14px}}
.top-right{display:flex;align-items:center;gap:10px}
.clock{color:var(--ac2);font-variant-numeric:tabular-nums;font-size:15px;font-weight:700;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.ibtn{padding:5px 12px;border-radius:8px;background:var(--s2);border:1px solid var(--ln);font-size:13px;display:none;color:var(--ac2);transition:.15s}
.ibtn:hover{border-color:var(--ac);background:rgba(212,175,55,.15)}
.main{flex:1;display:grid;grid-template-columns:150px 1fr 350px;min-height:0}
.nav{background:linear-gradient(180deg,#1f130a,#120a04);border-right:2px solid #8a5f1c;box-shadow:inset -10px 0 16px rgba(0,0,0,.5);padding:12px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.nv{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 6px;border-radius:8px;text-align:center;color:var(--mu);border:1px solid transparent;transition:.15s}
.nv i{font-style:normal;font-size:24px}.nv b{font-size:14px}.nv small{font-size:11px;opacity:.8;min-height:14px}
.nv:hover{background:var(--s2);color:var(--tx)}
.nv.on{background:linear-gradient(180deg,rgba(224,176,64,.3),rgba(224,176,64,.1));border-color:var(--ac);color:var(--ac2);box-shadow:0 0 12px rgba(224,176,64,.28)}
.nv.sold-out{opacity:.6;filter:grayscale(100%)}
.pane{display:flex;flex-direction:column;min-height:0;background:linear-gradient(rgba(70,40,8,.10),rgba(70,40,8,.2)),url(bg-parchment.jpg) center/cover,#9a7230;box-shadow:inset 0 0 46px rgba(40,20,4,.4)}
.ph{text-align:center;margin:14px 22px 4px;padding:12px 20px;background:linear-gradient(180deg,rgba(32,18,7,.93),rgba(18,9,3,.95));border:1px solid #b8862e;border-radius:12px;box-shadow:0 5px 14px rgba(20,8,0,.5),inset 0 1px 0 rgba(255,225,140,.22)}.ph h2{font-size:26px;font-weight:900;letter-spacing:2px;color:#ffe9a8;text-shadow:0 2px 4px rgba(0,0,0,.8)}.ph p{color:#ecd7a6;font-size:14px;margin-top:3px;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.grid{flex:1;overflow-y:auto;padding:12px 22px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;align-content:start}
.grid.wide{grid-template-columns:1fr}
.card{position:relative;background:linear-gradient(150deg,#33200f,#1d1108);border:1px solid #a87a2a;border-radius:var(--r);padding:16px 14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:.15s;user-select:none;box-shadow:0 5px 12px rgba(30,14,2,.55),inset 0 1px 0 rgba(255,225,140,.15)}
.card:hover{border-color:var(--ac);transform:translateY(-2px);box-shadow:0 6px 12px rgba(212,175,55,.15)}.card:active{transform:scale(.98)}
.card.sold-out{opacity:.85;filter:grayscale(100%) brightness(.8)}
.card.sold-out .n{padding-right:66px}
.stk{font-size:12px;font-weight:700;color:#ffd77a;background:rgba(224,176,64,.14);border:1px solid #a87a2a;border-radius:99px;padding:1px 8px;white-space:nowrap}
.stk.low{color:#ffb4a8;border-color:#b5483f;background:rgba(217,83,79,.18)}
.card.sold-out:after{content:"已售完";position:absolute;top:8px;right:10px;background:#8a2b27;color:#fff;font-size:12px;font-weight:800;padding:2px 10px;border-radius:99px;letter-spacing:1px}
.card .n{font-size:16px;font-weight:700;line-height:1.35;color:var(--tx)}
.card .d{font-size:12.5px;color:var(--mu);line-height:1.6}
.card .f{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.price{font-size:20px;font-weight:800;color:var(--ac)}.price:before{content:"$";font-size:13px;margin-right:1px;opacity:.8}
.add{width:34px;height:34px;border-radius:50%;background:var(--ac);color:#1a1204;font-size:22px;font-weight:700;display:grid;place-items:center}
.qb{position:absolute;top:-8px;right:-8px;min-width:26px;height:26px;padding:0 7px;border-radius:99px;background:var(--bad);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.sec{grid-column:1/-1;justify-self:start;width:max-content;font-size:15px;font-weight:900;color:#ffe9a8;letter-spacing:4px;padding:6px 18px;background:linear-gradient(180deg,rgba(32,18,7,.93),rgba(18,9,3,.95));border:1px solid #b8862e;border-radius:99px;box-shadow:0 3px 8px rgba(20,8,0,.45);text-shadow:0 1px 2px rgba(0,0,0,.8)}
.card.wd{flex-direction:row;align-items:center;gap:16px}.card.wd .m{flex:1}
.cat-badge{position:absolute;top:2px;left:4px;width:18px;height:18px;background:var(--bad);color:#fff;border-radius:3px;font-size:11px;font-weight:700;display:none;place-items:center;z-index:5}
.sold-mode .cat-badge{display:grid}
.cart{background:linear-gradient(180deg,#22150b,#140b05);border-left:2px solid #8a5f1c;box-shadow:inset 10px 0 16px rgba(0,0,0,.45);display:flex;flex-direction:column;min-height:0}
.ch{padding:16px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--ln)}
.ch h3{font-size:18px;color:var(--ac2)}.ch button{color:var(--mu);font-size:13px}.ch button:hover{color:var(--bad)}
.cl{flex:1;overflow-y:auto;padding:8px 14px}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--mu);font-size:14px}.empty i{font-style:normal;font-size:40px;opacity:.5}
.ci{padding:12px 4px;border-bottom:1px solid var(--ln)}
.cr{display:flex;align-items:center;gap:10px}
.del-btn{background:none;border:none;color:var(--bad);font-size:16px;font-weight:700;cursor:pointer;padding:2px 6px;border-radius:6px;transition:.15s}
.del-btn:hover{background:rgba(217,83,79,.2)}
.cr .t{flex:1;font-weight:600;font-size:15px}.cr .p{font-weight:700;color:var(--ac)}
.stp{display:flex;align-items:center;gap:2px;background:var(--s2);border-radius:99px;padding:2px;margin-top:8px;width:max-content;border:1px solid var(--ln)}
.stp button{width:28px;height:28px;border-radius:50%;font-size:17px}.stp button:hover{background:var(--ln)}.stp span{min-width:28px;text-align:center;font-weight:700}
.cf{padding:16px 18px;border-top:2px solid #8a5f1c;display:flex;flex-direction:column;gap:12px;background:linear-gradient(180deg,rgba(24,12,4,.72),rgba(24,12,4,.88)),url(bg-wave.jpg) center/cover,#1c1008}
.sum{display:flex;justify-content:space-between;align-items:baseline;color:var(--mu);font-size:14px}.sum b{font-size:28px;color:var(--ac)}
.go{padding:16px;border-radius:10px;background:linear-gradient(135deg,var(--ac2),var(--ac));color:#1a1204;font-weight:800;font-size:17px;box-shadow:0 4px 10px rgba(212,175,55,.3)}
.go:disabled{background:var(--ln);color:var(--mu);cursor:not-allowed;box-shadow:none}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);display:none;place-items:center;z-index:999;padding:20px}
.modal.open{display:grid}
.m-box{background:var(--s1);border:2px solid var(--ac);border-radius:var(--r);width:100%;max-width:440px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 8px 24px rgba(0,0,0,.8);max-height:90vh;overflow-y:auto}
.m-box.wide{max-width:560px}
.m-box>*{flex-shrink:0}
.m-box h3{font-size:20px;color:var(--ac2)}
.m-box label{font-size:13px;color:var(--mu);display:flex;flex-direction:column;gap:6px}
.m-box input{padding:12px;border-radius:8px;background:var(--s2);border:1px solid var(--ln);color:var(--tx);font-size:16px}
.m-box input:focus{border-color:var(--ac);outline:none}
.m-btns{display:flex;gap:10px;margin-top:4px;flex-wrap:wrap}
.m-btns button{flex:1;min-width:96px;padding:12px;border-radius:8px;font-weight:700}
.btn-cancel{background:var(--s2);border:1px solid var(--ln)}
.btn-confirm{background:var(--ac);color:#1a1204}
.btn-confirm:disabled{opacity:.4;cursor:not-allowed}
.sold-list-container{display:flex;flex-direction:column;gap:10px;max-height:350px;overflow-y:auto;padding-right:4px}
.sold-item-row{display:flex;align-items:center;justify-content:space-between;background:var(--s2);padding:10px 14px;border-radius:8px;border:1px solid var(--ln)}
.sold-item-name{font-size:15px;font-weight:600;color:var(--tx)}
.sold-restore-btn{background:var(--ok);color:#fff;padding:6px 12px;border-radius:6px;font-size:13px;font-weight:700}
.sold-restore-btn:hover{opacity:.9}
.opt-section-title{font-size:14px;font-weight:700;color:var(--ac);margin-bottom:6px}
.opt-list{display:flex;flex-direction:column;gap:8px}
.opt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.opt-btn{padding:12px;border-radius:8px;background:var(--s2);border:1px solid var(--ln);text-align:center;font-size:15px;font-weight:600;transition:.15s;color:var(--tx)}
.opt-btn:hover{border-color:var(--ac);background:rgba(212,175,55,.15);color:var(--ac2)}
.opt-btn.selected{background:var(--ac);color:#1a1204;border-color:var(--ac2);font-weight:700}
.opt-btn.disabled-opt{opacity:.3;filter:grayscale(100%);cursor:not-allowed;pointer-events:none}
.modal-tip{font-size:11.5px;color:var(--mu);line-height:1.5;background:rgba(0,0,0,.2);padding:10px;border-radius:6px;border-left:3px solid var(--ac)}
/* 取餐資訊 */
.fm-sec{border:1px solid var(--ln);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.fm-row{display:flex;align-items:center;gap:10px}
.fm-row>b{width:78px;flex:none;font-size:14px;color:var(--ac2)}
.fm-row input,.fm-row select{flex:1;min-width:0;padding:10px;border-radius:8px;background:var(--s2);border:1px solid var(--ln);color:var(--tx);font-size:15px}
.fm-row input:focus,.fm-row select:focus{border-color:var(--ac);outline:none}
.fm-row.err input,.fm-row.err select{border-color:var(--bad)}
.fm-err{display:none;color:var(--bad);font-size:12px;margin:-6px 0 0 88px}
.fm-row.err+.fm-err{display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px;flex:1}
.chip{padding:8px 12px;border-radius:8px;background:var(--s2);border:1px solid var(--ln);font-size:14px;color:var(--tx);transition:.15s}
.chip:hover{border-color:var(--ac)}
.chip.on{background:var(--ac);color:#1a1204;font-weight:700}
.fm-title{text-align:center;font-weight:700;color:var(--ac2)}
.fm-line{display:flex;justify-content:space-between;color:var(--mu);font-size:14px}
.fm-total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--ln);padding-top:12px;font-weight:800;color:var(--ac2);font-size:18px}
.fm-total b{font-size:26px;color:var(--ac)}
/* 訂單明細 */
.rc-head{text-align:center}.rc-head small{display:block;color:var(--mu);font-size:13px;margin-top:4px}
.rc-row{display:flex;justify-content:space-between;gap:14px;font-size:14px;line-height:1.5}
.rc-row span:first-child{color:var(--mu);flex:none}.rc-row span:last-child{text-align:right;word-break:break-all}
.rc-item{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.rc-item .nm{flex:1}.rc-item .nm small{color:var(--mu);margin-left:6px}.rc-item .pr{font-weight:700;color:var(--ac)}
.rc-done{text-align:center;padding:10px 0}.rc-done .ok{font-size:48px}
.rc-no{font-size:30px;font-weight:800;color:var(--ac);letter-spacing:2px;margin:6px 0}
/* 訂單列表 / 提示 */
.m-box.xl{max-width:820px}
.oh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.oh button{padding:8px 14px;border-radius:8px;background:var(--s2);border:1px solid var(--ln);font-size:14px}
.ofl{display:flex;flex-wrap:wrap;gap:8px}
.oc{border:1px solid var(--ln);border-left:5px solid var(--ln);border-radius:var(--r);background:var(--s2);padding:14px;display:flex;flex-direction:column;gap:8px}
.oc.st-new{border-left-color:var(--bad)}.oc.st-making{border-left-color:var(--ac)}.oc.st-done{border-left-color:var(--ok)}
.oc.st-picked,.oc.st-cancelled{opacity:.6}
.oc-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.oc-h b{font-size:20px;color:var(--ac)}
.oc-t{font-weight:700;color:var(--ac2)}
.oc-s{margin-left:auto;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--ln)}
.st-new .oc-s{background:var(--bad);color:#fff}.st-making .oc-s{background:var(--ac);color:#1a1204}.st-done .oc-s{background:var(--ok);color:#fff}
.oc-b{font-size:14px;line-height:1.7}.oc-b .mu{color:var(--mu);font-size:13px}
.oc-b a{color:var(--ac2)}
.oc-a{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.oc-a button{padding:9px 16px;border-radius:8px;font-weight:700;font-size:14px}
.oc-go{background:var(--ac);color:#1a1204}.oc-no{background:var(--s1);border:1px solid var(--ln);color:var(--mu)}
#toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-140px);background:var(--ac);color:#1a1204;padding:12px 20px;border-radius:10px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.6);z-index:1500;cursor:pointer;transition:transform .3s;max-width:90%}
#toast.show{transform:translate(-50%,0)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.ibtn.pulse{background:var(--bad);color:#fff;border-color:var(--bad);animation:pulse 1s infinite}
/* 營業狀態橫幅 / 表格 / 進度 */
#banner{display:none;text-align:center;padding:8px 12px;font-weight:700;font-size:14px}
#banner.bn-rest{display:block;background:var(--bad);color:#fff}
#banner.bn-prep{display:block;background:var(--ac);color:#1a1204}
input[type=date]{color-scheme:dark}
.tbw{overflow-x:auto;border:1px solid var(--ln);border-radius:var(--r)}
.tbw table{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
.tbw th{background:var(--s2);color:var(--ac2);text-align:left;padding:8px 10px;white-space:nowrap}
.tbw td{padding:8px 10px;border-top:1px solid var(--ln);vertical-align:top}
.tbw .mu{color:var(--mu);font-size:12px}
.trk{display:flex;gap:6px}
.trk span{flex:1;text-align:center;padding:8px 4px;border-radius:8px;background:var(--s2);border:1px solid var(--ln);font-size:13px;color:var(--mu)}
.trk .ok{background:rgba(76,175,125,.2);border-color:var(--ok);color:var(--tx)}
.trk .cur{background:var(--ac);color:#1a1204;font-weight:700;border-color:var(--ac2)}
/* 編輯 / 結帳 */
.oc-pay{background:var(--ok);color:#fff}
.btn-del{background:var(--bad);color:#fff}
.er{display:flex;gap:6px;align-items:center}
.m-box .er input{padding:8px;font-size:14px;min-width:0}
.er .nm{flex:1}.er .pr{width:84px}.er .qt{width:62px}
.rb{padding:5px 10px;border-radius:6px;font-size:12px;font-weight:700;background:var(--s1);border:1px solid var(--ln);margin:2px;white-space:nowrap}
.rb.del{color:var(--bad)}
input[type=time],input[type=datetime-local]{color-scheme:dark}
/* 多人點餐 */
.pbar{padding:8px 14px;border-bottom:1px solid var(--ln);display:flex;flex-direction:column;gap:8px}
.pbar .chips{gap:6px}.pbar .chip{padding:6px 10px;font-size:13px}
.m-box .pbar input,.pbar input{padding:8px;border-radius:8px;background:var(--s2);border:1px solid var(--ln);color:var(--tx);font-size:14px;flex:1;min-width:0}
.pgh{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 4px;font-weight:700;color:var(--ac2);border-bottom:1px dashed var(--ln);cursor:pointer}
.pgh.cur{color:var(--ac)}
.pg{margin:6px 0;padding:6px 8px;border-left:3px solid var(--ln);background:rgba(0,0,0,.15);border-radius:4px}
.pg .mu{color:var(--mu);font-size:13px}
.er select{padding:8px;border-radius:8px;background:var(--s2);border:1px solid var(--ln);color:var(--tx);font-size:14px;width:96px}
.xhead{position:sticky;top:-24px;margin:-24px -24px 0;padding:22px 24px 12px;background:var(--s1);z-index:3;text-align:center;border-radius:var(--r) var(--r) 0 0}
.xbtn{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;background:var(--s2);border:1px solid var(--ln);font-size:16px;line-height:1;color:var(--tx)}
.xbtn:hover{border-color:var(--ac);color:var(--ac2)}
#netbar{display:none;text-align:center;padding:8px 12px;font-weight:700;font-size:14px}
#netbar.net-bad{display:block;background:#7a2b28;color:#fff}
#netbar button{margin-left:8px;padding:4px 12px;border-radius:6px;background:var(--ac);color:#1a1204;font-weight:700}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--ln);border-radius:4px}
@media(max-width:900px){
 body{overflow:auto;height:auto}.main{grid-template-columns:1fr;display:flex;flex-direction:column}
 .nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:2px solid var(--ln);padding:8px}.nv{flex:0 0 auto;min-width:92px;padding:8px 10px}.nv small{display:none}
 .grid{max-height:none;overflow:visible;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));padding:12px 14px}
 .cart{border-left:0;border-top:2px solid var(--ln);position:sticky;bottom:0;max-height:55vh}

 .fm-row{flex-wrap:wrap}.fm-err{margin-left:0}
}

 html{-webkit-text-size-adjust:100%}
 .top{display:grid;grid-template-columns:1fr auto;grid-template-areas:"brand brand" "left right";align-items:center;gap:6px 8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px}

 .brand-center{grid-area:brand;gap:4px}.top-left{grid-area:left}.top-right{grid-area:right;justify-self:end;gap:6px}

 .brand-center .shop{font-size:16px;letter-spacing:0}

 .brand-actions{flex-wrap:wrap;justify-content:center;gap:5px}
 .pill{padding:4px 10px;font-size:12px}.ibtn{padding:4px 10px;font-size:12px}.clock{font-size:11px}
 .nav{padding:6px 8px;gap:4px}.nv{min-width:74px;padding:6px 8px;gap:1px}.nv i{font-size:20px}.nv b{font-size:12px}
 .ph{margin:8px 10px 2px;padding:8px 12px}.ph h2{font-size:19px}.ph p{font-size:12px;margin-top:2px}
 .sec{font-size:13px;padding:4px 14px;letter-spacing:3px}
 .grid{grid-template-columns:repeat(2,1fr);gap:8px;padding:8px 10px 14px}.grid.wide{grid-template-columns:1fr}
 .card{padding:10px;gap:6px}.card .n{font-size:14px}.card .d{font-size:11.5px}.price{font-size:17px}.add{width:30px;height:30px;font-size:19px}
 .cart{max-height:80vh;padding-bottom:env(safe-area-inset-bottom,0px)}
 .cart .ch,.cart .pbar,.cart .cl{display:none}
 .cart.cart-open .ch{display:flex}.cart.cart-open .pbar{display:flex}
 .cart.cart-open .cl{display:block;max-height:46vh;overflow-y:auto}
 .cf{padding:10px 14px;gap:8px}.sum{cursor:pointer}.sum b{font-size:22px}
 .sum #cnt:after{content:"　▲ 展開明細";color:var(--ac);font-size:12px}
 .cart.cart-open .sum #cnt:after{content:"　▼ 收合"}
 .go{padding:12px;font-size:16px}.hint{font-size:11px}
 .m-box{padding:16px;max-height:92vh}.m-box.wide,.m-box.xl{max-width:100%}
 .tbw table{min-width:560px}
}

<body id="bodyRoot">
<header class="top">
 <div class="top-left"><div class="pill" id="statusPill"><span class="dot" id="statusDot"></span><span id="statusText">營業中</span></div></div>
 <div class="sp"></div>
 <div class="brand-center">
  <div class="brand-row"><img class="logo" src="logo.png" alt="去中心鹹水雞"><b class="shop">去中心鹹水雞 X 厝邊溫食</b><span class="sep">｜</span><b class="sub">POS 點餐系統</b></div>
  <div class="brand-actions">
   <button class="ibtn" id="ordersBtn" onclick="openOrders()">📦 訂單管理</button>
   <button class="ibtn" id="soldOutModeBtn" onclick="toggleSoldOutMode()">🔴 餐點管理</button>
   <button class="ibtn" id="soldOutListBtn" onclick="openSoldOutListModal()">📋 售完品項</button>
   <button class="ibtn" id="stockBtn" onclick="openStock()">📦 今日庫存</button>
   <button class="ibtn" id="adminBtn" onclick="openAdminPanel()">⚙ 後台管理</button>
   <button class="ibtn" id="cashBtn" onclick="openCash()">💵 收銀盤點</button>
   <button class="ibtn" id="soundBtn" onclick="toggleSound()">🔔 提示音</button>
   <button class="ibtn" id="logoutBtn" onclick="doLogout()">🚪 登出</button>
  </div>
 </div>
 <div class="sp"></div>
 <div class="top-right"><button class="ibtn" id="trackBtn" style="display:block" onclick="openTrack()">📋 我的訂單</button><div class="clock" id="clock"></div></div>
</header>
<div id="banner"></div>
<div id="netbar"></div>
<div class="main">
 <nav class="nav" id="nav"></nav>
 <section class="pane"><div class="ph" id="ph"></div><div class="grid" id="grid"></div></section>
 <aside class="cart">
  <div class="ch"><h3>📦 訂單明細</h3><button onclick="clearCart()">清空</button></div>
  <div class="pbar" id="pbar"></div>
  <div class="cl" id="cl"></div>
  <div class="cf"><div class="sum" onclick="toggleCart()"><span id="cnt">共 0 項</span><b id="tot">$0</b></div>
   <button class="go" id="go" disabled onclick="openCheckout()">下一步：填寫取餐資訊</button></div>
 </aside>
</div>
<div id="toast"></div>
<div class="modal" id="modal"><div class="m-box" id="mBox"></div></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mk=(p,r)=>r.map(([n,pr],i)=>({id:p+(i+1),name:n,price:pr}));
const MENU=[
{k:'信仰雞本位主義 (主食)',ic:'🍗',items:mk('m',[["鹹水雞腿",65],["煙燻雞腿",75],["鹹水雞胸",65],["煙燻雞胸",75],["鹹水半雞",130],["煙燻半雞",150]]),two:true},
{k:'智能合約 (套餐)',ic:'🍱',combo:true,items:[
 {id:'s1',name:'散戶輕倉個人餐',price:260,c:'雞肉：半隻（可選 鹹水 / 煙燻）',d:["豬耳朵","雞冠","豆干","鴨肉丸","珍珠蛋"]},
 {id:'s2',name:'巨鯨重倉肉多多餐',price:390,c:'雞肉：半隻（可選 鹹水 / 煙燻）',d:["牛五花","松阪豬","雞冠","雞腸","雞軟骨","鴨肉丸","鑫鑫腸"]},
 {id:'s3',name:'DAO節點下酒派對餐',price:630,c:'雞肉：全雞（可選 鹹水 / 煙燻）',d:["牛五花","松阪豬","豬耳朵","珍珠蛋","雞冠","雞腸","雞皮","鴨肉丸","貢丸","水晶餃","百頁豆腐"]},
 {id:'s4',name:'輕食減醣套餐',price:139,c:'雞肉:鹹水雞胸',d:["冬粉","花椰菜","玉米筍","豆皮","高麗菜"]},
 {id:'s5',name:'輕食減醣肉多餐',price:239,c:'雞肉:鹹水雞胸 × 2',d:["冬粉","白蘿蔔","高麗菜","玉米筍","龍鬚菜","珍珠蛋"]}]},
{k:'鏈上綠色資產 (蔬菜)',ic:'🥬',items:mk('v',[["娃娃菜",40],["玉米筍",30],["筍片",25],["水蓮",25],["四季豆",25],["龍鬚菜",25],["花椰菜",25],["鴻喜菇",25],["杏鮑菇",20],["金針菇",20],["小黃瓜",20],["高麗菜",20],["白蘿蔔",20],["黑木耳",20],["洋蔥",20],["海帶",20]])},
{k:'DAO去中心肉類 (肉類)',ic:'🥩',items:mk('meat',[["松阪豬",75],["牛五花",70],["雞軟骨",40],["雞心",30],["雞胗",30],["雞冠",25],["雞腸",25],["雞皮",25],["珍珠蛋",25],["鑫鑫腸",25]])},
{k:'節點火鍋料',ic:'🍢',items:mk('f',[["鴨肉丸",30],["貢丸",30],["水晶餃",30],["甜不辣",25],["蟹味棒",25],["皮蛋(溏心)",25],["鹹蛋(碎)",25],["豆干",25],["百頁豆腐",20],["蒟蒻絲",20],["豆皮(炸)",20],["豆皮",20],["米血",20]])},
{k:'共識滷味協議',ic:'🌶️',items:mk('l',[["無骨鳳爪",45],["豬耳朵",45],["滷脆腸",45]])},
{k:'自由流通麵 (麵食)',ic:'🍜',items:mk('z',[["王子麵",15],["冬粉",15]])},
{k:'厝邊溫食(炒麵/燴飯)',ic:'🔥',note:'炒麵類預設使用芥藍菜，若遇缺貨將調整為油菜或高麗菜。\n炒青菜為當季時令蔬菜，恕無法指定。',items:[...mk('w',[["沙茶羊肉炒麵",120],["沙茶牛肉炒麵",120],["沙茶羊肉燴飯",120],["沙茶牛肉燴飯",120],["炒羊肉",150],["炒牛肉",150],["炒青菜",100]]),{id:'w8',name:'當歸羊肉湯',price:80},{id:'w9',name:'當歸清湯',price:40}]}
];
MENU[1].note='套餐內容物如遇缺貨將自動更換等值商品，恕無法指定變更。';
const split=k=>{const m=k.match(/^(.*?)\s*\((.*?)\)$/);return m?[m[1],m[2]]:[k,'']};
let cur=0,cart=[],curP=0;
const ADMIN_PARAM=new URLSearchParams(location.search).get('mode')==='admin';
const LINE_HOOK='https://script.google.com/macros/s/AKfycbwzKZCv2hvCCMvrczkmpbXkIqgl2grN-miQThQGXoHV3rUvHyAGsu4IiY5UdzWr6gnIHg/exec';/* 貼上 Google Apps Script 網頁應用程式網址，用來把新訂單通知到 LINE 群組；留空則不啟用 */
const BASE_TITLE=document.title;
{const mf=document.getElementById('mf');if(mf&&ADMIN_PARAM)mf.href='manifest-admin.json'}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
let isAdmin=false,isSoldOutMode=false;
let soldOutItems=JSON.parse(localStorage.getItem('sold_out_items')||'{}');
let soldOutCats=JSON.parse(localStorage.getItem('sold_out_cats')||'{}');

window.addEventListener('DOMContentLoaded',()=>{
  updateStatusDisplay();renderNav();renderGrid();renderCart();
  if(ADMIN_PARAM)setTimeout(()=>{if(!window.FB)alert('雲端元件載入失敗，請檢查網路後重新整理')},8000);
});
document.addEventListener('click',()=>{if(isAdmin){unlockAudio();keepAwake();setTimeout(updateSoundBtn,300)}});
const isClosed=()=>!isAdmin&&(localStorage.getItem('shop_status')||'營業中')==='休息中';
const norm=v=>v?Object.assign({},v):{};
const onlyTrue=o=>Object.fromEntries(Object.entries(o).filter(([k,v])=>v));
function fbReady(){
  FB.onValue(FB.ref(FB.db,'shop/status'),sn=>{const v=sn.val();if(v){localStorage.setItem('shop_status',v);updateStatusDisplay()}});
  FB.onValue(FB.ref(FB.db,'soldOut'),sn=>{
    const v=sn.val()||{};
    soldOutItems=norm(v.items);soldOutCats=norm(v.cats);
    localStorage.setItem('sold_out_items',JSON.stringify(soldOutItems));
    localStorage.setItem('sold_out_cats',JSON.stringify(soldOutCats));
    renderNav();renderGrid();
  });
  loadMy();MY.forEach(m=>watchMy(m.id));
  subStock();setInterval(()=>{if(today8()!==stockDay)subStock()},60000);
  FB.onValue(FB.ref(FB.db,'.info/connected'),sn=>{CONNECTED=sn.val()===true;if(CONNECTED)everConnected=true;updateNet();if(CONNECTED)flushOutbox()});
  window.addEventListener('online',()=>flushOutbox());
  setInterval(()=>flushOutbox(),20000);
  setTimeout(()=>{netChecked=true;updateNet()},8000);
  updateNet();
  FB.onAuthStateChanged(FB.auth,onAuth);
}
function saveSold(){
  localStorage.setItem('sold_out_items',JSON.stringify(soldOutItems));
  localStorage.setItem('sold_out_cats',JSON.stringify(soldOutCats));
  if(window.FB&&isAdmin)FB.set(FB.ref(FB.db,'soldOut'),{items:onlyTrue(soldOutItems),cats:onlyTrue(soldOutCats)}).catch(e=>alert('售完狀態同步失敗：'+e.message));
}

function updateStatusDisplay(){
  const s=localStorage.getItem('shop_status')||'營業中';
  $('statusText').textContent=s;
  const c=s==='營業中'?'var(--ok)':s==='備料中'?'var(--ac)':'var(--bad)';
  $('statusDot').style.background=c;$('statusDot').style.boxShadow='0 0 8px '+c;
  const bn=$('banner');
  if(s==='休息中'){bn.className='bn-rest';bn.textContent=isAdmin?'目前狀態：休息中（客人無法點餐，店家仍可下單）':'🔴 目前休息中，暫停接單'}
  else if(s==='備料中'){bn.className='bn-prep';bn.textContent=isAdmin?'目前狀態：備料中':'🟡 店家備料中，可先預訂，開始營業後依序製作'}
  else{bn.className='';bn.textContent=''}
  renderCart();
}
function openStatusSelector(){
  if(!isAdmin)return;
  $('mBox').innerHTML=`<h3>變更營業狀態</h3>
   <div class="opt-list">
    <button class="opt-btn" onclick="setShopStatus('營業中')">1. 營業中</button>
    <button class="opt-btn" onclick="setShopStatus('備料中')">2. 備料中</button>
    <button class="opt-btn" onclick="setShopStatus('休息中')">3. 休息中</button>
   </div>
   <div class="m-btns"><button class="btn-cancel" onclick="closeModal()">取消</button></div>`;
  $('modal').classList.add('open');
}
function setShopStatus(s){
  localStorage.setItem('shop_status',s);updateStatusDisplay();closeModal();
  if(window.FB)FB.set(FB.ref(FB.db,'shop/status'),s).catch(e=>alert('營業狀態同步失敗：'+e.message));
}

function toggleSoldOutMode(){
  isSoldOutMode=!isSoldOutMode;
  const b=$('soldOutModeBtn');
  if(isSoldOutMode){b.style.background='var(--bad)';b.style.color='#fff';$('bodyRoot').classList.add('sold-mode')}
  else{b.style.background='var(--s2)';b.style.color='var(--ac2)';$('bodyRoot').classList.remove('sold-mode')}
  renderNav();renderGrid();
}
function openSoldOutListModal(){
  let h='';
  MENU.forEach((c,idx)=>{
    if(soldOutCats[idx]){const [t]=split(c.k);
      h+=`<div class="sold-item-row"><span class="sold-item-name">📁 群組：${esc(t)}</span><button class="sold-restore-btn" onclick="restoreCat(${idx})">恢復販售</button></div>`}
    c.items.forEach(it=>{
      if(soldOutItems[it.id])h+=`<div class="sold-item-row"><span class="sold-item-name">🍗 ${esc(it.name)}</span><button class="sold-restore-btn" onclick="restoreItem('${it.id}')">恢復販售</button></div>`;
    });
  });
  if(!h)h='<div style="text-align:center;color:var(--mu);padding:20px">目前沒有任何售完或關閉的品項！</div>';
  $('mBox').innerHTML=`<h3>📋 售完品項快速管理</h3><div class="sold-list-container">${h}</div><div class="m-btns"><button class="btn-cancel" onclick="closeModal()">關閉</button></div>`;
  $('modal').classList.add('open');
}
function restoreCat(i){soldOutCats[i]=false;saveSold();renderNav();renderGrid();openSoldOutListModal()}
function restoreItem(id){
  soldOutItems[id]=false;
  if(id==='m1'||id==='m3')soldOutItems.m5=false;
  if(id==='m2'||id==='m4')soldOutItems.m6=false;
  saveSold();renderGrid();openSoldOutListModal();
}
function toggleCatSoldOut(i,e){
  if(e)e.stopPropagation();
  if(!isSoldOutMode)return;
  soldOutCats[i]=!soldOutCats[i];
  saveSold();renderNav();renderGrid();
}
function toggleItemSoldOut(id){
  if(!isSoldOutMode)return;
  soldOutItems[id]=!soldOutItems[id];
  const S=soldOutItems;
  if(id==='m1'||id==='m3')S.m5=!!(S.m1||S.m3);
  else if(id==='m5'){S.m1=S.m3=S.m5}
  if(id==='m2'||id==='m4')S.m6=!!(S.m2||S.m4);
  else if(id==='m6'){S.m2=S.m4=S.m6}
  saveSold();renderGrid();
}

function renderNav(){
  $('nav').innerHTML=MENU.map((c,i)=>{
    const [t,s]=split(c.k);
    return `<button class="nv${i===cur?' on':''}${soldOutCats[i]?' sold-out':''}" onclick="cur=${i};renderNav();renderGrid()">
      <div class="cat-badge" onclick="toggleCatSoldOut(${i},event)">✕</div>
      <i>${c.ic}</i><b>${esc(t)}</b><small>${esc(s)}</small></button>`;
  }).join('');
}
function renderGrid(){
  const c=MENU[cur],[t,s]=split(c.k),catSold=soldOutCats[cur];
  $('ph').innerHTML=`<h2>${esc(t)}</h2><p>${esc(c.note||s||'').replace(/\n/g,'<br>')}</p>`;
  $('grid').className='grid'+(c.combo?' wide':'');
  const card=(it,extra)=>{
    const q=cart.filter(x=>x.id.split('_')[0]===it.id&&x.p===curP).reduce((a,x)=>a+x.qty,0);
    const left=stockLeft(it.id),sold=catSold||soldOutItems[it.id]||left<=0;
    return `<div class="card${c.combo?' wd':''}${sold?' sold-out':''}" onclick="handleCardClick('${it.id}')">
      ${q?`<i class="qb">${q}</i>`:''}
      <div class="m"><div class="n">${esc(it.name)}</div>${extra||''}</div>
      <div class="f"><span class="price">${it.price}</span>${left!==Infinity&&left>0?`<span class="stk${left<=3?' low':''}">剩 ${left}</span>`:''}<span class="add">+</span></div></div>`;
  };
  let h='';
  if(c.two){
    h+='<div class="sec">鹹本位</div>'+c.items.filter(i=>i.name.startsWith('鹹')).map(i=>card(i)).join('')+
       '<div class="sec">燻本位</div>'+c.items.filter(i=>i.name.startsWith('煙')).map(i=>card(i)).join('');
  }else h=c.items.map(i=>card(i,c.combo?`<div class="d"><b>${esc(i.c)}</b><br>內容物：${esc(i.d.join('、'))}</div>`:'')).join('');
  $('grid').innerHTML=h;
}
function handleCardClick(id){
  if(isSoldOutMode){toggleItemSoldOut(id);return}
  if(isClosed()){toast('目前休息中，暫停接單');return}
  const item=find(id);
  if(soldOutItems[id]||soldOutCats[cur]||stockLeft(id)<=0)return;
  if(['s1','s2','s3'].includes(id))showComboOptions(item);
  else if(['w1','w2','w3','w4','w5','w6','w7'].includes(id))showStirFryOptions(item);
  else if(['w8','w9'].includes(id))showSoupOptions(item);
  else if(MENU.find(c=>c.k.startsWith('自由流通麵')).items.some(x=>x.id===id))showNoodleOptions(item);
  else add(item.name,item.price,id);
}
function find(id){for(const c of MENU){const i=c.items.find(x=>x.id===id);if(i)return i}}

function showComboOptions(item){
  const saltSold=soldOutItems.m1||soldOutItems.m3||soldOutItems.m5||soldOutCats[0];
  const smokeSold=soldOutItems.m2||soldOutItems.m4||soldOutItems.m6||soldOutCats[0];
  const b=(label,dis,fl)=>`<button class="opt-btn ${dis?'disabled-opt':''}" ${dis?'':`onclick="addComboWithFlavor('${item.id}','${item.name}',${item.price},'${fl}')"`}>${label}</button>`;
  const opts=item.id==='s3'
    ?b('1. 全鹹水全雞',saltSold,'全鹹水')+b('2. 全煙燻全雞',smokeSold,'全煙燻')+b('3. 鹹半 + 燻半',saltSold||smokeSold,'鹹半+燻半')
    :b('1. 鹹水半雞',saltSold,'鹹水半雞')+b('2. 煙燻半雞',smokeSold,'煙燻半雞');
  $('mBox').innerHTML=`<h3>${esc(item.name)}</h3><div class="opt-list">${opts}</div><div class="m-btns"><button class="btn-cancel" onclick="closeModal()">取消</button></div>`;
  $('modal').classList.add('open');
}

let tempStirFryOptions={spice:'',flavor:''};
function showStirFryOptions(item){tempStirFryOptions={spice:'',flavor:''};renderStirFryModal(item)}
function renderStirFryModal(item){
  const sp=['微辣','小辣','中辣','大辣'],fl=['清淡','正常','重鹹'];
  $('mBox').innerHTML=`<h3>${esc(item.name)}</h3>
   <div class="opt-section-title">辣度選擇</div>
   <div class="opt-grid">${sp.map(s=>`<button class="opt-btn ${tempStirFryOptions.spice===s?'selected':''}" onclick="toggleStirFryOpt('spice','${s}','${item.id}')">${s}</button>`).join('')}</div>
   <div class="opt-section-title">口味選擇</div>
   <div class="opt-grid">${fl.map(f=>`<button class="opt-btn ${tempStirFryOptions.flavor===f?'selected':''}" onclick="toggleStirFryOpt('flavor','${f}','${item.id}')">${f}</button>`).join('')}</div>

function add(name,price,id){
  if(!canAdd(id)){toast(`「${itemName(id)}」今日數量不足，無法再增加`);return}
  const e=cart.find(x=>x.id===id&&x.p===curP);
  e?e.qty++:cart.push({id,name,price,qty:1,p:curP});
  renderCart();renderGrid();
}
function qty(j,d){const e=cart[j];if(!e)return;if(d>0&&!canAdd(e.id)){toast(`「${itemName(e.id)}」今日數量不足，無法再增加`);return}e.qty+=d;if(e.qty<=0)cart.splice(j,1);renderCart();renderGrid()}
function removeItem(j){cart.splice(j,1);renderCart();renderGrid()}
function clearCart(){cart=[];CK.people=[newP()];curP=0;renderCart();renderGrid()}
function selPerson(i){curP=i;renderCart();renderGrid()}
function addPerson(){CK.people.push(newP());curP=CK.people.length-1;renderCart();renderGrid()}
function delPerson(i){
  const n=cart.filter(x=>x.p===i).length;
  if(n&&!confirm(`移除「${plabel(i)}」會一併刪除 ${n} 項餐點，確定嗎？`))return;
  cart=cart.filter(x=>x.p!==i);cart.forEach(x=>{if(x.p>i)x.p--});
  CK.people.splice(i,1);if(!CK.people.length)CK.people.push(newP());
  curP=Math.min(curP,CK.people.length-1);renderCart();renderGrid();
}
function prunePeople(){
  const keep=CK.people.map((_,i)=>cart.some(x=>x.p===i));
  if(keep.every(Boolean)||!keep.some(Boolean))return;
  const map={};let n=0;keep.forEach((k,i)=>{if(k)map[i]=n++});
  CK.people=CK.people.filter((_,i)=>keep[i]);
  cart.forEach(x=>{x.p=map[x.p]});
  curP=Math.min(curP,CK.people.length-1);renderCart();renderGrid();
}
function renderCart(){
  const P=CK.people,multi=P.length>1;
  $('pbar').innerHTML=multi
    ?`<div class="chips">${P.map((pp,i)=>`<button class="chip${i===curP?' on':''}" onclick="selPerson(${i})">👤 ${esc(plabel(i))}</button>`).join('')}<button class="chip" onclick="addPerson()">＋ 新增一位</button></div>
      <div style="display:flex;gap:6px"><input id="pName" value="${esc(P[curP].name)}" placeholder="這份餐點是給誰的？（選填）" oninput="CK.people[curP].name=this.value" onchange="renderCart()"><button class="chip" onclick="delPerson(${curP})">移除此位</button></div>
      <div class="hint">目前點的餐會加到「${esc(plabel(curP))}」，全部點完再一次送單</div>`
    :`<button class="chip" onclick="addPerson()" style="align-self:flex-start">＋ 幫別人一起點（分開計）</button>`;
  const row=(x,j)=>`<div class="ci"><div class="cr"><button class="del-btn" onclick="removeItem(${j})" title="刪除">✕</button><span class="t">${esc(x.name)}</span><span class="p">$${x.price*x.qty}</span></div>
   <div class="stp"><button onclick="qty(${j},-1)">−</button><span>${x.qty}</span><button onclick="qty(${j},1)">+</button></div></div>`;
  let h;
  if(!multi)h=cart.length?cart.map(row).join(''):'<div class="empty"><i>🛒</i>點選左側餐點加入訂單</div>';
  else h=P.map((pp,i)=>{
    const its=cart.map((x,j)=>[x,j]).filter(([x])=>x.p===i);
    const sub=its.reduce((a,[x])=>a+x.qty*x.price,0);
    return `<div class="pgh${i===curP?' cur':''}" onclick="selPerson(${i})"><span>👤 ${esc(plabel(i))}</span><span>$${sub}</span></div>`
      +(its.length?its.map(([x,j])=>row(x,j)).join(''):'<div class="hint" style="padding:8px">（尚未點餐）</div>');
  }).join('');
  $('cl').innerHTML=h;
  const n=cart.reduce((a,x)=>a+x.qty,0),t=cart.reduce((a,x)=>a+x.qty*x.price,0);
  $('cnt').textContent=`共 ${n} 項`+(multi?`・正在幫「${plabel(curP)}」點餐`:'');$('tot').textContent='$'+t;$('go').disabled=!n||isClosed();
}

const newP=()=>({name:'',flavor:'',spice:'',salt:'',note:''});
const CK={name:'',phone:'',time:'',note:'',gear:[],pay:'現金',pct:100,off:0,err:false,src:'現場',people:[newP()],late:false,lateAt:'',lateStatus:'picked',latePaid:true,lateNo:'',walkin:false};
const plabel=i=>(CK.people[i].name||'').trim()||'第'+(i+1)+'位';

function timeSlots(){
  const d=new Date();d.setSeconds(0,0);
  d.setMinutes(Math.ceil(d.getMinutes()/10)*10);
  const day=d.getDate(),out=[];
  while(out.length<24&&d.getDate()===day){
    out.push(String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'));
    d.setMinutes(d.getMinutes()+10);
  }
  return out;
}

  if(!cart.length||isClosed())return;
  prunePeople();

  $('mBox').className='m-box wide';
  renderCheckout();

const chip=(key,v)=>`<button class="chip${CK[key]===v?' on':''}" onclick="pick('${key}','${v}')">${v}</button>`;
const gearChip=v=>`<button class="chip${CK.gear.includes(v)?' on':''}" onclick="toggleGear('${v}')">${v}</button>`;

function fmtPhone(el){
  const d=el.value.replace(/\D/g,'').slice(0,10);
  let s=d;
  if(d.length>7)s=d.slice(0,4)+'-'+d.slice(4,7)+'-'+d.slice(7);
  else if(d.length>4)s=d.slice(0,4)+'-'+d.slice(4);
  el.value=s;CK.phone=s;
}
const phoneOK=p=>/^09\d{2}-\d{3}-\d{3}$/.test(p);
const loose=()=>isAdmin||CK.walkin;
const nameValid=()=>loose()||!!CK.name.trim();
const phoneValid=()=>CK.phone?phoneOK(CK.phone):loose();
function setWalkin(v){CK.walkin=!!v;CK.err=false;renderCheckout()}

function calcTotals(){
  const sub=cart.reduce((a,x)=>a+x.qty*x.price,0);
  const extra=5*CK.people.filter(p=>p.flavor==='泰式+5元').length;
  let total=sub+extra;
  if(isAdmin){
    const p=Math.min(100,Math.max(0,parseFloat(CK.pct)||0));
    total=Math.round(total*p/100)-(parseFloat(CK.off)||0);
  }
  const base=sub+extra;
  return{sub,extra,disc:Math.max(0,base-Math.max(0,total)),total:Math.max(0,total)};
}
function updateTotal(){$('fmTot').textContent='$'+calcTotals().total}

const pchip=(i,k,v)=>`<button class="chip${CK.people[i][k]===v?' on':''}" onclick="pickP(${i},'${k}','${v}')">${v}</button>`;

   </div>`;
}
const pad2=n=>String(n).padStart(2,'0');
const nowLocal=()=>{const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+'T'+pad2(d.getHours())+':'+pad2(d.getMinutes())};
function toggleLate(){

   <div class="fm-row"><b>訂單狀態</b><div class="chips">${[['picked','已取餐'],['done','待取餐'],['making','製作中'],['new','新單']].map(([k,t])=>`<button class="chip${CK.lateStatus===k?' on':''}" onclick="CK.lateStatus='${k}';renderCheckout()">${t}</button>`).join('')}</div></div>

    <div class="fm-err">電話格式需為 09XX-XXX-XXX</div>
    <div class="fm-row${e&&!CK.time?' err':''}"><b>取餐時間*</b>
     ${isAdmin&&CK.late?`<input type="time" value="${esc(CK.time)}" oninput="CK.time=this.value">`:`<select onchange="CK.time=this.value"><option value="">請選擇取餐時間</option>${slots.map(s=>`<option value="${s}"${CK.time===s?' selected':''}>${s}</option>`).join('')}</select>`}</div>
    <div class="fm-err">請選擇取餐時間</div>
    ${isAdmin?`<div class="fm-row"><b>訂單來源</b><div class="chips">${['現場','線上','電話'].map(v=>chip('src',v)).join('')}</div></div>
    <div class="fm-row"><b>補單</b><div class="chips"><button class="chip${CK.late?' on':''}" onclick="toggleLate()">📝 這是補單（事後補登）</button></div></div>${CK.late?lateBlock():''}`:''}
    <div class="fm-row"><b>${CK.people.length>1?'整單備註':'顧客備註'}</b><input value="${esc(CK.note)}" placeholder="特殊需求 (例如:多蒜、少雞油)" oninput="CK.note=this.value"></div>

function submitCheckout(){
  if(isClosed()){alert('店家目前休息中，暫停接單');return}
  CK.err=true;
  if(isAdmin&&CK.late&&!(new Date(CK.lateAt).getTime()>0)){alert('請選擇補單的實際下單時間');return}
  if(!nameValid()||!phoneValid()||!CK.time){renderCheckout();return}
  const t=calcTotals();
  window.pendingOrder={
    name:CK.name.trim()||'現場客',phone:CK.phone,src:isAdmin?(CK.src||'現場'):(CK.walkin?'現場':'線上'),time:CK.time,note:CK.note.trim(),
    flavor:CK.people[0].flavor||'原味',spice:CK.people[0].spice||'不辣',salt:CK.people[0].salt||'正常',
    gear:[...CK.gear],pay:CK.pay,items:JSON.parse(JSON.stringify(cart)),
    subtotal:t.sub,extra:t.extra,discount:t.disc,total:t.total
  };
  if(isAdmin)window.pendingOrder.staff=true;
  if(isAdmin&&CK.late)Object.assign(window.pendingOrder,{late:true,lateAt:new Date(CK.lateAt).getTime(),lateStatus:CK.lateStatus,latePaid:CK.latePaid,lateNo:CK.lateNo.trim()});
  if(CK.people.length>1)window.pendingOrder.people=CK.people.map((x,i)=>({name:x.name.trim()||'第'+(i+1)+'位',flavor:x.flavor||'原味',spice:x.spice||'不辣',salt:x.salt||'正常',note:x.note.trim()}));
  renderReceipt();
}

let submitting=false;
async function confirmOrder(){
  const o=window.pendingOrder;if(!o||submitting)return;
  if(isClosed()){alert('店家目前休息中，暫停接單');return}
  if(!isAdmin&&!window.FB){alert('無法連線到雲端，請檢查網路後重試');return}
  submitting=true;
  const btn=$('cfBtn');if(btn){btn.disabled=true;btn.textContent='送出中…'}
  const ts=o.late?o.lateAt:Date.now(),day=o.late?bizDay(ts):today8();
  if(o.late&&o.lateNo)o.no=/^\d+$/.test(o.lateNo)?o.lateNo.padStart(3,'0'):o.lateNo;
  o.date=day;o.createdAt=ts;o.status=o.late?(o.lateStatus||'picked'):'new';
  if(o.late&&o.latePaid){o.paid=true;o.paidAt=ts;o.received=o.total;o.change=0}
  const data=JSON.parse(JSON.stringify(o));['lateAt','lateStatus','latePaid','lateNo'].forEach(k=>delete data[k]);
  if(isAdmin){
    /* 店家下單：斷線時先暫存在這台裝置，連線後自動補送 */
    const key='L'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    try{
      if(!window.FB||!CONNECTED)throw new Error('offline');
      let held=[];
      if(!o.late){
        let rs=await withTimeout(reserveStock(o.items,false),10000);
        if(!rs.ok){
          if(!confirm(`「${rs.name}」庫存只剩 ${rs.left} 份，仍要送出這張單嗎？`)){if(btn){btn.disabled=false;btn.textContent='確認送出'}submitting=false;return}
          rs=await withTimeout(reserveStock(o.items,true),10000);
        }
        held=rs.done||[];
      }
      try{o.no=await withTimeout(sendOrder(key,{...data},day),10000)}catch(er){await releaseStock(held);throw er}
      if(!o.late)notifyLine(key);
      showDone(o);
    }catch(e){OUT.push({key,day,data});saveOut();showQueued(o)}
  }else{
    let held=[],written=false;
    try{
      const rs=await reserveStock(o.items,false);
      if(!rs.ok){
        alert(`「${rs.name}」目前只剩 ${rs.left} 份，請調整數量後再送出。`);
        if(btn){btn.disabled=false;btn.textContent='確認送出'}
        submitting=false;return;
      }
      held=rs.done;
      const r=await FB.runTransaction(FB.ref(FB.db,'counters/'+day),n=>(n||0)+1);
      o.no=String(r.snapshot.val()).padStart(3,'0');data.no=o.no;
      const nref=FB.push(FB.ref(FB.db,'orders'));
      await FB.set(nref,data);written=true;
      saveMy(nref.key,o.no);
      notifyLine(nref.key);
      showDone(o);
    }catch(e){
      if(!written)await releaseStock(held);
      const em=String(e.code||e.message);
      alert(/PERMISSION/i.test(em)?'訂單無法送出：店家目前可能已暫停接單，請稍後再試。（'+em+'）':'訂單送出失敗，請檢查網路後再試一次。\n（'+em+'）');
      if(btn){btn.disabled=false;btn.textContent='確認送出'}
    }
  }
  submitting=false;
}

   <div class="rc-done"><div class="ok">✅</div><h3>${o.late?'補單完成':'訂單已送出'}</h3>
    <div class="rc-no">#${o.no}</div>
    <div class="rc-row" style="justify-content:center;gap:8px"><span>取餐時間</span><span>今日 ${o.time}</span></div>

let actx=null;
function unlockAudio(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
function beep(){
  if(!actx)return;
  [0,.28,.56].forEach(t=>{
    const o=actx.createOscillator(),g=actx.createGain();
    o.type='sine';o.frequency.value=880;g.gain.value=.3;
    o.connect(g);g.connect(actx.destination);
    o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.18);
  });
}
function toast(msg,fn){
  const t=$('toast');t.textContent=msg;t.classList.add('show');

  clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),8000);
}

const p2=n=>String(n).padStart(2,'0');
const bizStartOf=t=>{const d=new Date(t);if(d.getHours()<2)d.setDate(d.getDate()-1);d.setHours(2,0,0,0);return d.getTime()};
const bizStart=()=>bizStartOf(Date.now());
const bizDay=t=>{const d=new Date(bizStartOf(t));return d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())};
const today8=()=>bizDay(Date.now());
let MY=[],MYD={},myUn={};
const STEPS=[['new','等待接單'],['making','製作中'],['done','待取餐'],['picked','已取餐']];
const fmtTS=t=>{const d=new Date(t);return p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds())};
const TRK_MSG={new:'訂單已送出，等待店家接單',making:'店家已接單，正在製作中',done:'餐點完成了，請前往取餐',picked:'訂單已完成，謝謝光臨！'};

function saveMy(id,no){MY.push({id,no,date:today8(),at:Date.now()});MY=MY.slice(-8);localStorage.setItem('my_orders',JSON.stringify(MY));watchMy(id)}
function watchMy(id){
  if(myUn[id]||!window.FB)return;
  myUn[id]=FB.onValue(FB.ref(FB.db,'orders/'+id),sn=>{
    const v=sn.val(),prev=MYD[id]&&MYD[id].status;
    MYD[id]=v||{gone:true};
    if(v&&v.notice){try{const seen=JSON.parse(localStorage.getItem('seen_notice')||'{}');if(seen[id]!==v.notice.at){seen[id]=v.notice.at;localStorage.setItem('seen_notice',JSON.stringify(seen));toast(`📢 訂單 #${v.no}：${v.notice.text}`,openTrack)}}catch(e){}}
    if(v&&prev&&prev!==v.status){
      if(v.status==='making')toast(`🍳 訂單 #${v.no} 店家已接單，製作中`,openTrack);
      else if(v.status==='done')toast(`🍱 訂單 #${v.no} 餐點完成（待取餐），請前往取餐`,openTrack);

   <div class="modal-tip">狀態會即時更新，餐點完成時會跳出提醒。只顯示最近 12 小時內、在這個裝置送出的訂單。</div>`;

const baseName=n=>String(n).replace(/\s+\(.*\)\s*$/,'');
const money=n=>'$'+Math.round(n).toLocaleString();
function summarize(list){
  const ok=list.filter(o=>o.status!=='cancelled');
  const rev=ok.reduce((a,o)=>a+(o.total||0),0);
  const pay={},src={},items={};
  ok.forEach(o=>{
    const p=o.pay||'未填';pay[p]=pay[p]||{n:0,s:0};pay[p].n++;pay[p].s+=o.total||0;
    const sr=o.src||'線上';src[sr]=src[sr]||{n:0,s:0};src[sr].n++;src[sr].s+=o.total||0;
    (o.items||[]).forEach(x=>{const k=baseName(x.name);items[k]=items[k]||{q:0,s:0};items[k].q+=x.qty;items[k].s+=x.qty*x.price});
  });
  const un=ok.filter(o=>!o.paid);
  return{ok,rev,cancelled:list.length-ok.length,pay,src,items,unpaid:{n:un.length,s:un.reduce((a,o)=>a+(o.total||0),0)}};
}

function exportCSV(){
  if(!HIST.length){alert('請先查詢，且區間內要有訂單');return}
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const head=['日期時間','訂單編號','取餐時間','訂購人','電話','用餐者','餐點','口味','辣度','鹹度','配備','備註','本筆小計','整單小計','加價(+)/折扣(-)','整單應付總額','付款方式','收款','來源','狀態'];
  const rows=[];
  HIST.forEach(o=>{
    const P=peopleOf(o)||[{name:o.name,flavor:o.flavor,spice:o.spice,salt:o.salt,note:'',items:o.items||[]}];
    const n=P.length,adj=(o.extra||0)-(o.discount||0);
    P.forEach((pp,i)=>{
      const first=i===0;
      const sub=pp.items.reduce((a,x)=>a+x.price*x.qty,0);
      const note=n>1?[pp.note,first&&o.note?'整單備註：'+o.note:''].filter(Boolean).join('｜'):(o.note||'');
      rows.push([fmtDT(o.createdAt),'#'+o.no,o.time,o.name,o.phone||'',pp.name||o.name,
        pp.items.map(x=>x.name+'×'+x.qty).join('；'),pp.flavor||'',pp.spice||'',pp.salt||'',(o.gear||[]).join('、'),note,
        sub,first?o.subtotal:'',first?adj:'',first?o.total:'',
        o.pay,o.paid?'已收款':'未收款',(o.src||'線上')+(o.late?'（補單）':''),ST[o.status]||o.status]);
    });
  });
  const csv='\ufeff'+[head,...rows].map(r=>r.map(q).join(',')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='訂單_'+$('hS').value+'_'+$('hE').value+'.csv';
  document.body.appendChild(a);a.click();a.remove();
}

  if(!items.length){alert('至少要有一項餐點');return}

  const sub=items.reduce((a,x)=>a+x.price*x.qty,0),adj=parseFloat(ED.adj)||0,total=Math.max(0,sub+adj);

    pay:ED.pay,status:ED.status,items,subtotal:sub,extra:adj>0?adj:0,discount:adj<0?-adj:0,total,updatedAt:Date.now()};
  const parts=[];
  if(ED.time!==o.time)parts.push(`取餐時間改為 ${ED.time}（原 ${o.time}）`);
  const sig=a=>(a||[]).map(x=>`${x.p||0}|${String(x.name).trim()}|${+x.price}|${+x.qty}`).join(';');
  if(sig(items)!==sig(o.items))parts.push(`餐點內容已調整，應付總額 $${total}`);
  if(parts.length)data.notice={at:Date.now(),text:parts.join('；')};
  const ch=[];

/* ===== 取餐 → 自動結帳完成，並跳出結帳畫面（可改付款方式、折扣、折讓）===== */
let PAY=null;
const payBase=o=>{const sub=+o.subtotal;return(sub>0?sub:(o.items||[]).reduce((a,x)=>a+(+x.price||0)*(+x.qty||0),0))+(+o.extra||0)};
const payTotal=()=>{
  let p=parseFloat(PAY.pct);if(isNaN(p))p=100;p=Math.min(100,Math.max(0,p));
  const off=Math.max(0,parseFloat(PAY.off)||0);
  return Math.max(0,Math.round(PAY.base*p/100)-off);
};
async function pickup(id){

  if(o.paid){toast(`✅ #${o.no} 已取餐（原本已收款，訂單結束）`);return}

function openPay(id,after,fresh){

const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),ms))]);
async function sendOrder(key,data,day){
  const rf=FB.ref(FB.db,'orders/'+key);
  const ex=await FB.get(rf);
  if(ex.exists())return ex.val().no;
  if(!data.no){const r=await FB.runTransaction(FB.ref(FB.db,'counters/'+day),n=>(n||0)+1);data.no=String(r.snapshot.val()).padStart(3,'0')}
  await FB.set(rf,data);

}
async function flushOutbox(manual){
  if(flushing||!OUT.length||!window.FB||!isAdmin)return;
  if(!CONNECTED&&manual!==true)return;
  flushing=true;let ok=0;
  for(const it of [...OUT]){
    try{
      if(!it.reserved&&!it.data.late&&it.day===today8()){await withTimeout(reserveStock(it.data.items,true),12000);it.reserved=true;saveOut()}
      await withTimeout(sendOrder(it.key,{...it.data},it.day),12000);OUT=OUT.filter(x=>x.key!==it.key);ok++;saveOut();if(!it.data.late)notifyLine(it.key)}
    catch(e){break}
  }
  flushing=false;
  if(ok)toast(`✅ 已補送 ${ok} 筆暫存訂單`);
}

/* ===== 收銀盤點 / 日報表 / 彙整匯出 ===== */
const DENOMS=[1000,500,100,50,10,5,1];
const EXP_TYPES=[['進貨','進貨/材料'],['雜支','雜支'],['退款','退款'],['其他','其他支出'],['存鈔','存鈔（存起來）']];
const expLabel=k=>(EXP_TYPES.find(x=>x[0]===k)||[k,k])[1];
const dayStartMs=day=>new Date(+day.slice(0,4),+day.slice(4,6)-1,+day.slice(6,8),2,0,0,0).getTime();
const dayPlain=day=>day.slice(0,4)+'/'+day.slice(4,6)+'/'+day.slice(6,8);
const dayWeek=day=>'週'+'日一二三四五六'[new Date(dayStartMs(day)).getDay()];
const dayLabel=day=>dayPlain(day)+'（'+dayWeek(day)+'）';
const shiftDay=(day,n)=>{const d=new Date(dayStartMs(day));d.setDate(d.getDate()+n);return d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())};

async function fetchDayOrders(day){
  const a=dayStartMs(day),b=a+86400000-1;
  const sn=await FB.get(FB.query(FB.ref(FB.db,'orders'),FB.orderByChild('createdAt'),FB.startAt(a),FB.endAt(b)));
  return Object.values(sn.val()||{});
}
function salesOf(list){
  const ok=list.filter(o=>o.status!=='cancelled');
  const r={count:ok.length,voided:list.length-ok.length,revenue:0,cash:0,transfer:0,linepay:0,allpay:0,unpaidN:0,unpaid:0};
  ok.forEach(o=>{
    const t=+o.total||0;r.revenue+=t;
    if(!o.paid){r.unpaidN++;r.unpaid+=t;return}
    if(o.pay==='現金')r.cash+=t;else if(o.pay==='轉帳')r.transfer+=t;else if(o.pay==='Linepay')r.linepay+=t;else if(o.pay==='全支付')r.allpay+=t;
  });
  return r;
}
function calcDay(cb,sales){
  const exps=Object.values(cb.expenses||{});
  const sum=f=>exps.filter(f).reduce((a,e)=>a+(+e.amount||0),0);
  const expense=sum(e=>e.type!=='存鈔'),deposit=sum(e=>e.type==='存鈔');
  const hasOpen=!!cb.open,hasClose=!!cb.close,open=hasOpen?(+cb.open.total||0):0;
  const expected=open+sales.cash-expense-deposit;
  const close=hasClose?(+cb.close.total||0):null;
  return{expense,deposit,hasOpen,hasClose,open,expected,close,diff:hasClose?Math.round((close-expected)*100)/100:null};
}

/* --- 手續費、彙整計算、月報表 --- */
const FEES={Linepay:0.023,'全支付':0.02};   // ← 手續費率：Linepay 2.3%、全支付 2%（日後費率改了，改這一行）
const feeOf=(k,amt)=>Math.round((+amt||0)*(FEES[k]||0));
const rateTxt=k=>(FEES[k]*100).toFixed((FEES[k]*100)%1?1:0)+'%';
const feesOf=sales=>{const fl=feeOf('Linepay',sales.linepay),fa=feeOf('全支付',sales.allpay);return{fl,fa,fee:fl+fa,net:(+sales.revenue||0)-fl-fa}};
function figsFrom(orders,all,filter){
  const by={};
  orders.forEach(o=>{if(!o||!o.createdAt)return;const d=bizDay(o.createdAt);(by[d]=by[d]||[]).push(o)});
  const days=[...new Set([...Object.keys(by),...Object.keys(all)])].filter(d=>/^\d{8}$/.test(d)&&(!filter||filter(d))).sort();
  return days.map(day=>{
    const cb=all[day]||{},sales=cb.summary||salesOf(by[day]||[]);
    return{day,cb,sales,c:calcDay(cb,sales),...feesOf(sales),hasCb:!!all[day]};
  });
}
function monthAgg(figs){
  const t={days:0,count:0,voided:0,revenue:0,cash:0,transfer:0,linepay:0,allpay:0,unpaid:0,fl:0,fa:0,fee:0,net:0,expense:0,deposit:0,diff:0,diffDays:0};
  figs.forEach(f=>{
    const s=f.sales;if(s.count>0)t.days++;
    t.count+=s.count;t.voided+=s.voided;t.revenue+=s.revenue;t.cash+=s.cash;t.transfer+=s.transfer;t.linepay+=s.linepay;t.allpay+=s.allpay;t.unpaid+=s.unpaid;
    t.fl+=f.fl;t.fa+=f.fa;t.fee+=f.fee;t.net+=f.net;t.expense+=f.c.expense;t.deposit+=f.c.deposit;
    if(f.c.hasOpen&&f.c.hasClose){t.diff+=f.c.diff;t.diffDays++}
  });
  return t;
}
let MR={ym:''};
const shiftMonth=(ym,n)=>{const d=new Date(+ym.slice(0,4),+ym.slice(4,6)-1+n,1);return d.getFullYear()+p2(d.getMonth()+1)};

/* --- 盤點 / 支出 輸入畫面（店員、店長都可用）--- */
let CASH={day:'',data:{},tab:null,cnt:null,ex:{type:'進貨',amount:'',note:''}};
async function openCash(day,tab){
  CASH={day:day||today8(),data:{},tab:tab||null,cnt:null,ex:{type:'進貨',amount:'',note:''}};
  viewingOrders=viewingStats=viewingTrack=false;$('mBox').className='m-box xl';
  $('mBox').innerHTML='<div style="text-align:center;color:var(--mu);padding:30px">讀取中…</div>';
  $('modal').classList.add('open');
  await reloadCash();
}
async function reloadCash(){
  try{const sn=await FB.get(FB.ref(FB.db,'cashbook/'+CASH.day));CASH.data=sn.val()||{}}
  catch(e){CASH.data={};alert('讀取收銀資料失敗：'+(e.code||e.message))}
  if(!CASH.tab)CASH.tab=!CASH.data.open?'open':(!CASH.data.close?'exp':'close');
  CASH.cnt=null;renderCash();
}
function cashTab(k){CASH.tab=k;CASH.cnt=null;renderCash()}
function cntInit(kind){const src=((CASH.data||{})[kind]||{}).counts||{};CASH.cnt={};DENOMS.forEach(d=>CASH.cnt[d]=+src['d'+d]||0)}
const cashTotal=()=>DENOMS.reduce((a,d)=>a+d*(CASH.cnt[d]||0),0);
function cashCnt(d,v){
  CASH.cnt[d]=Math.max(0,parseInt(v)||0);
  const el=$('cs'+d);if(el)el.textContent='$'+d*CASH.cnt[d];
  const t=$('cashTot');if(t)t.textContent='$'+cashTotal();
}
function renderCash(){
  const D=CASH.data||{},t=CASH.tab,day=CASH.day;
  const tabs=[['open','開店盤點',!!D.open],['exp','支出／存鈔',false],['close','收班盤點',!!D.close]];
  let body='';
  if(t==='open'||t==='close'){
    if(!CASH.cnt)cntInit(t);
    const rec=D[t],nm=t==='open'?'開店':'收班';
    body=`<div class="fm-sec"><div class="fm-title">${nm}時收銀台內的現金（輸入每種面額的張數／枚數）</div>
      ${rec?`<div class="modal-tip">已盤點：$${rec.total}（${fmtDT(rec.at)}　${esc(rec.by||'')}）。重新輸入後按儲存即可修改。</div>`:''}
      ${DENOMS.map(d=>`<div class="er"><b style="width:96px;color:var(--ac2)">${d>=100?'紙鈔':'硬幣'} $${d}</b><input class="qt" style="width:100px" type="number" min="0" inputmode="numeric" value="${CASH.cnt[d]||''}" placeholder="0" oninput="cashCnt(${d},this.value)"><span style="flex:1;text-align:right;color:var(--mu)" id="cs${d}">$${d*(CASH.cnt[d]||0)}</span></div>`).join('')}
      <div class="fm-total"><span>合計</span><b id="cashTot">$${cashTotal()}</b></div></div>
      <div class="m-btns"><button class="btn-confirm" id="cashSave" onclick="saveCount('${t}')">儲存${nm}盤點</button></div>`;
  }else body=expHtml();
  $('mBox').innerHTML=`<div class="oh"><h3>💵 收銀盤點</h3><button onclick="closeModal()">關閉</button></div>
   <div class="modal-tip">營業日：${dayLabel(day)}（每日 02:00 換日）</div>
   <div class="chips">${tabs.map(([k,n,ok])=>`<button class="chip${t===k?' on':''}" onclick="cashTab('${k}')">${ok?'✔ ':''}${n}</button>`).join('')}</div>${body}`;
}
async function saveCount(kind){
  const total=cashTotal(),counts={};DENOMS.forEach(d=>counts['d'+d]=CASH.cnt[d]||0);
  const old=CASH.data[kind],nm=kind==='open'?'開店':'收班';
  if(total===0&&!confirm(`${nm}盤點合計是 $0，確定要儲存嗎？`))return;
  const b=$('cashSave');b.disabled=true;b.textContent='儲存中…';
  try{
    await FB.set(FB.ref(FB.db,'cashbook/'+CASH.day+'/'+kind),{counts,total,at:Date.now(),by:whoAmI()});
    if(kind==='close'){
      const sm=salesOf(await fetchDayOrders(CASH.day));sm.at=Date.now();
      await FB.set(FB.ref(FB.db,'cashbook/'+CASH.day+'/summary'),sm);
    }
    logAct(nm+'盤點',null,'',`${dayPlain(CASH.day)} 合計 $${total}${old?'（原 $'+old.total+'）':''}`);
  }catch(e){alert('儲存失敗：'+(e.code||e.message));b.disabled=false;b.textContent='儲存'+nm+'盤點';return}
  CASH.tab=kind==='open'?'exp':'close';
  toast(`✅ ${nm}盤點已儲存：$${total}`+(kind==='close'&&isManager()?'　可到「後台管理 → 日報表」查看差額':''));
  await reloadCash();
}
function expHtml(){
  const D=CASH.data||{};
  const list=Object.entries(D.expenses||{}).map(([id,e])=>({id,...e})).sort((a,b)=>a.at-b.at);
  const sum=f=>list.filter(f).reduce((a,e)=>a+(+e.amount||0),0);
  const mg=isManager();
  const rows=list.map(e=>`<tr><td>${fmtT(e.at)}</td><td>${esc(expLabel(e.type))}</td><td>$${e.amount}</td><td>${esc(e.note||'')}</td><td>${esc(e.by||'')}</td>${mg?`<td><button class="rb" onclick="editExpense('${e.id}')">修改</button><button class="rb del" onclick="delExpense('${e.id}')">刪除</button></td>`:''}</tr>`).join('');
  return `<div class="fm-sec"><div class="fm-title">新增一筆（從收銀機拿出去的錢）</div>
    <div class="chips">${EXP_TYPES.map(([k,n])=>`<button class="chip${CASH.ex.type===k?' on':''}" onclick="CASH.ex.type='${k}';renderCash()">${n}</button>`).join('')}</div>
    <div class="fm-row"><b>金額</b><input type="number" inputmode="numeric" min="0" value="${esc(CASH.ex.amount)}" placeholder="例如 1000" oninput="CASH.ex.amount=this.value"></div>
    <div class="fm-row"><b>說明</b><input value="${esc(CASH.ex.note)}" placeholder="例如：買雞腿、存千鈔 ×2" oninput="CASH.ex.note=this.value"></div>
    <div class="m-btns"><button class="btn-confirm" onclick="addExpense()">＋ 新增</button></div></div>
   <div class="fm-sec"><div class="fm-title">當日紀錄</div>
    ${list.length?`<div class="tbw"><table><thead><tr><th>時間</th><th>類別</th><th>金額</th><th>說明</th><th>登錄人</th>${mg?'<th>操作</th>':''}</tr></thead><tbody>${rows}</tbody></table></div>`:'<div style="text-align:center;color:var(--mu);padding:12px">今天還沒有支出或存鈔紀錄</div>'}
    <div class="fm-line"><span>支出合計</span><span>$${sum(e=>e.type!=='存鈔')}</span></div>
    <div class="fm-line"><span>存鈔合計（非支出，錢只是從收銀機移走）</span><span>$${sum(e=>e.type==='存鈔')}</span></div></div>`;
}
async function addExpense(){
  const amt=parseFloat(CASH.ex.amount);
  if(!(amt>0)){alert('請輸入大於 0 的金額');return}
  const rec={at:Date.now(),type:CASH.ex.type,amount:amt,note:CASH.ex.note.trim(),by:whoAmI()};
  try{await FB.set(FB.push(FB.ref(FB.db,'cashbook/'+CASH.day+'/expenses')),rec)}
  catch(e){alert('新增失敗：'+(e.code||e.message));return}
  logAct('收銀'+(rec.type==='存鈔'?'存鈔':'支出'),null,'',`${expLabel(rec.type)} $${amt}${rec.note?'｜'+rec.note:''}`);
  CASH.ex={type:CASH.ex.type,amount:'',note:''};
  await reloadCash();
}
async function editExpense(id){
  if(!isManager())return;
  const e=(CASH.data.expenses||{})[id];if(!e)return;
  const a=prompt('修改金額',e.amount);if(a===null)return;
  const amt=parseFloat(a);if(!(amt>0)){alert('金額不正確');return}
  const n=prompt('修改說明',e.note||'');if(n===null)return;
  try{await FB.update(FB.ref(FB.db,'cashbook/'+CASH.day+'/expenses/'+id),{amount:amt,note:n.trim()})}
  catch(er){alert('修改失敗：'+(er.code||er.message));return}
  logAct('修改收銀紀錄',null,'',`${expLabel(e.type)} $${e.amount}→$${amt}`);
  await reloadCash();
}
async function delExpense(id){
  if(!isManager())return;
  const e=(CASH.data.expenses||{})[id];if(!e||!confirm(`刪除這筆「${expLabel(e.type)} $${e.amount}」？`))return;
  try{await FB.remove(FB.ref(FB.db,'cashbook/'+CASH.day+'/expenses/'+id))}
  catch(er){alert('刪除失敗：'+(er.code||er.message));return}
  logAct('刪除收銀紀錄',null,'',`${expLabel(e.type)} $${e.amount}${e.note?'｜'+e.note:''}`);
  await reloadCash();
}
async function checkOpenReminder(){
  if(!isAdmin||!window.FB)return;

function gotoReport(day){if(/^\d{8}$/.test(day)){RP.day=day;renderDayReport()}}
async function recalcSales(day){
  try{
    const sm=salesOf(await fetchDayOrders(day));sm.at=Date.now();
    const cb=(await FB.get(FB.ref(FB.db,'cashbook/'+day))).val()||{};
    if(cb.close){await FB.set(FB.ref(FB.db,'cashbook/'+day+'/summary'),sm);logAct('重算日報銷售',null,'',dayPlain(day))}
  }catch(e){alert('重新計算失敗：'+(e.code||e.message));return}
  renderDayReport();
}

/* --- 彙整 Excel：每次都匯出「所有日期」，隔天再匯出時前一天仍在 --- */
function loadXLSX(){
  return new Promise((res,rej)=>{
    if(window.XLSX)return res(window.XLSX);
    const sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload=()=>window.XLSX?res(window.XLSX):rej(new Error('xlsx'));
    sc.onerror=()=>rej(new Error('load'));
    document.head.appendChild(sc);
  });
}
async function buildCashbookSheets(){
  const [cbSn,osSn]=await Promise.all([FB.get(FB.ref(FB.db,'cashbook')),FB.get(FB.ref(FB.db,'orders'))]);
  const all=cbSn.val()||{};
  const figs=figsFrom(Object.values(osSn.val()||{}),all);
  const daily=[],exps=[],cnts=[],byMonth={};let cumRev=0,cumNet=0,cumFee=0,cumDiff=0;
  figs.forEach(f=>{
    const {day,cb,sales,c}=f;
    cumRev+=sales.revenue;cumNet+=f.net;cumFee+=f.fee;
    const diffOk=c.hasOpen&&c.hasClose;if(diffOk)cumDiff+=c.diff;
    daily.push([dayPlain(day),dayWeek(day),c.hasClose?'已收班':(f.hasCb?'未收班':'無收銀紀錄'),sales.count,sales.voided,sales.revenue,sales.cash,sales.transfer,sales.linepay,sales.allpay,
      f.fl,f.fa,f.fee,f.net,sales.unpaid,c.hasOpen?c.open:'',c.expense,c.deposit,c.hasOpen?c.expected:'',c.hasClose?c.close:'',diffOk?c.diff:'',cumRev,cumFee,cumNet,cumDiff]);
    (byMonth[day.slice(0,6)]=byMonth[day.slice(0,6)]||[]).push(f);
    Object.values(cb.expenses||{}).sort((a,b)=>a.at-b.at).forEach(e=>exps.push([dayPlain(day),fmtDT(e.at),expLabel(e.type),+e.amount||0,e.note||'',e.by||'']));
    [['open','開店'],['close','收班']].forEach(([k,nm])=>{
      const r=cb[k];if(!r)return;
      cnts.push([dayPlain(day),nm+'盤點',fmtDT(r.at),r.by||'',...DENOMS.map(d=>+((r.counts||{})['d'+d])||0),+r.total||0]);
    });
  });
  const monthly=[];let mRev=0,mNet=0;
  Object.keys(byMonth).sort().forEach(ym=>{
    const t=monthAgg(byMonth[ym]);mRev+=t.revenue;mNet+=t.net;
    monthly.push([ym.slice(0,4)+'年'+ym.slice(4,6)+'月',t.days,t.count,t.voided,t.revenue,t.cash,t.transfer,t.linepay,t.allpay,t.fl,t.fa,t.fee,t.net,t.days?Math.round(t.revenue/t.days):0,t.unpaid,t.expense,t.deposit,t.diffDays?t.diff:'',mRev,mNet]);
  });
  return{
    daily:[['營業日','星期','狀態','訂單數','拒單數','營收合計','現金收入','轉帳','Linepay','全支付','Linepay手續費('+rateTxt('Linepay')+')','全支付手續費('+rateTxt('全支付')+')','手續費合計','扣手續費後營收','未收款','開店現金','支出合計','存鈔合計','理論應有現金','收班現金','差額','累計營收','累計手續費','累計淨營收','累計差額'],...daily],
    monthly:[['月份','營業天數','訂單數','拒單數','營收合計','現金收入','轉帳','Linepay','全支付','Linepay手續費','全支付手續費','手續費合計','扣手續費後營收','日均營收','未收款','支出合計','存鈔合計','現金差額合計','累計營收','累計淨營收'],...monthly],
    exps:[['營業日','時間','類別','金額','說明','登錄人'],...exps],
    cnts:[['營業日','類型','時間','登錄人',...DENOMS.map(d=>'$'+d),'合計'],...cnts]
  };
}
async function exportCashbook(){
  const btn=$('xlBtn');if(btn){btn.disabled=true;btn.textContent='整理中…'}
  try{
    const S=await buildCashbookSheets();
    if(S.daily.length<2){alert('目前還沒有任何訂單或收銀資料');return}
    const stamp=ymd(new Date());
    try{
      const X=await loadXLSX(),wb=X.utils.book_new();
      [[S.daily,'日報表彙整'],[S.monthly,'月報表彙整'],[S.exps,'支出與存鈔明細'],[S.cnts,'盤點明細']].forEach(([rows,name])=>{
        const ws=X.utils.aoa_to_sheet(rows);
        ws['!cols']=rows[0].map((_,i)=>({wch:i===0?12:14}));
        X.utils.book_append_sheet(wb,ws,name);
      });
      X.writeFile(wb,'收銀日報彙整_'+stamp+'.xlsx');
    }catch(e){
      /* 沒有網路載入 Excel 元件時，改匯出 CSV（只有日報表彙整） */
      const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
      const csv='\ufeff'+S.daily.map(r=>r.map(q).join(',')).join('\r\n');
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
      a.download='收銀日報彙整_'+stamp+'.csv';document.body.appendChild(a);a.click();a.remove();
      alert('Excel 元件載入失敗，已改匯出 CSV（只含日報表彙整）。');
    }
  }catch(e){alert('匯出失敗：'+(e.code||e.message))}
  if(btn){btn.disabled=false;btn.textContent='📥 匯出彙整 Excel（全部日期）'}
}

/* ===== 當日庫存（賣完為止）===== */
const baseId=id=>String(id).split('_')[0];
let STOCK={},stockDay='',stockUnsub=null,STK={rows:{}},STKopen=false;
function subStock(){
  if(!window.FB)return;
  const d=today8();
  if(d===stockDay&&stockUnsub)return;
  if(stockUnsub){stockUnsub();stockUnsub=null}
  stockDay=d;STOCK={};
  stockUnsub=FB.onValue(FB.ref(FB.db,'stock/'+d),sn=>{STOCK=sn.val()||{};renderGrid();renderCart();if(STKopen)refreshStockCells()},()=>{});
}
const stockInfo=id=>{const r=STOCK[baseId(id)];return r&&r.limit!=null&&r.limit!==''?{limit:+r.limit,sold:+r.sold||0}:null};
const stockLeft=id=>{const s=stockInfo(id);return s?Math.max(0,s.limit-s.sold):Infinity};
const canAdd=id=>{
  const l=stockLeft(id);if(l===Infinity)return true;
  const b=baseId(id);return cart.filter(x=>baseId(x.id)===b).reduce((a,x)=>a+x.qty,0)<l;
};
const itemName=id=>((find(baseId(id))||{}).name)||id;
const needOf=items=>{const need={};(items||[]).forEach(x=>{const b=baseId(x.id);need[b]=(need[b]||0)+(+x.qty||0)});return need};
const soldRef=b=>FB.ref(FB.db,'stock/'+today8()+'/'+b+'/sold');

/* 下單時先「預留」庫存；不夠就擋下（force=true 時強制扣，店家可選擇仍要送出） */
async function reserveStock(items,force){
  const done=[];
  for(const [b,q] of Object.entries(needOf(items))){
    const info=STOCK[b];if(!info||info.limit==null)continue;
    const lim=+info.limit;let r;
    try{r=await FB.runTransaction(soldRef(b),cur=>{cur=+cur||0;if(!force&&cur+q>lim)return;return cur+q})}
    catch(e){await releaseStock(done);throw e}
    if(!r.committed){await releaseStock(done);return{ok:false,name:itemName(b),left:Math.max(0,lim-(+r.snapshot.val()||0))}}
    done.push([b,q]);
  }
  return{ok:true,done};
}
async function releaseStock(done){
  for(const [b,q] of done){try{await FB.runTransaction(soldRef(b),c=>Math.max(0,(+c||0)-q))}catch(e){}}
}
/* 拒單 → 把庫存還回去；還原 → 再扣掉 */
async function adjustStockForOrder(o,sign){
  if(!window.FB||!o||o.late||o.date!==today8())return;
  for(const [b,q] of Object.entries(needOf(o.items))){
    const info=STOCK[b];if(!info||info.limit==null)continue;
    try{await FB.runTransaction(soldRef(b),c=>Math.max(0,(+c||0)+sign*q))}catch(e){}
  }
}

/* --- 庫存設定畫面（店員、店長都能用）--- */
function openStock(){
  STK={rows:{}};
  Object.entries(STOCK).forEach(([id,r])=>{if(r&&r.limit!=null)STK.rows[id]=String(r.limit)});
  STKopen=true;viewingOrders=viewingStats=viewingTrack=false;
  $('mBox').className='m-box xl';renderStock();$('modal').classList.add('open');
}
const stkSold=id=>+((STOCK[id]||{}).sold)||0;
function renderStock(){
  const ids=Object.keys(STK.rows);
  const opts=MENU.map(c=>`<optgroup label="${esc(split(c.k)[0])}">${c.items.filter(i=>!(i.id in STK.rows)).map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join('')}</optgroup>`).join('');
  const rows=ids.map(id=>{
    const it=find(id)||{name:id},sold=stkSold(id),lim=parseInt(STK.rows[id]);
    return `<div class="er"><span style="flex:1;font-weight:700">${esc(it.name)}</span><span style="width:76px;color:var(--mu)">已售 <b id="ss_${id}">${sold}</b></span><span style="width:70px">剩 <b id="sl_${id}">${lim>=0?Math.max(0,lim-sold):'-'}</b></span><input class="qt" style="width:96px" type="number" min="0" inputmode="numeric" value="${esc(STK.rows[id])}" placeholder="限量" oninput="stkInput('${id}',this.value)"><button class="del-btn" onclick="stkDel('${id}')" title="移除限量">✕</button></div>`;
  }).join('');
  $('mBox').innerHTML=`<div class="oh"><h3>📦 今日庫存（限量品項）</h3><button onclick="closeModal()">關閉</button></div>
   <div class="modal-tip">沒有設定限量的品項＝不限量。限量品項賣完會<b>自動反黑、不能點選</b>，客人頁面也會顯示「剩 N」。營業日（每日 02:00 換日）換日後庫存會自動重新開始。</div>
   <div class="fm-sec"><div class="fm-title">${dayLabel(today8())}</div>
    ${rows||'<div style="text-align:center;color:var(--mu);padding:14px">今天還沒有設定任何限量品項</div>'}
    <div class="fm-row"><select onchange="stkAdd(this.value)"><option value="">＋ 加入限量品項…</option>${opts}</select></div></div>
   <div class="m-btns"><button class="btn-confirm" onclick="stkSave()">儲存庫存設定</button></div>
   <div class="m-btns"><button class="btn-cancel" onclick="stkCopy()">沿用昨天的限量</button><button class="btn-cancel" onclick="stkRecalc()">依今日訂單重算已售</button><button class="btn-cancel" onclick="stkClear()">清空今日庫存設定</button></div>`;
}
function stkInput(id,v){
  STK.rows[id]=v;const el=$('sl_'+id),n=parseInt(v);
  if(el)el.textContent=n>=0?Math.max(0,n-stkSold(id)):'-';
}
function refreshStockCells(){
  Object.keys(STK.rows).forEach(id=>{
    const a=$('ss_'+id),b=$('sl_'+id),n=parseInt(STK.rows[id]);
    if(a)a.textContent=stkSold(id);if(b)b.textContent=n>=0?Math.max(0,n-stkSold(id)):'-';
  });
}
function stkAdd(id){if(id){STK.rows[id]='';renderStock()}}
async function stkDel(id){
  const saved=STOCK[id]&&STOCK[id].limit!=null;
  if(saved){
    if(!confirm(`移除「${(find(id)||{}).name||id}」的限量（改成不限量）？`))return;
    try{await FB.remove(FB.ref(FB.db,'stock/'+today8()+'/'+id))}catch(e){alert('移除失敗：'+(e.code||e.message));return}
  }
  delete STK.rows[id];renderStock();
}
async function stkSave(){
  const ids=Object.keys(STK.rows);
  for(const id of ids){if(!(parseInt(STK.rows[id])>=0)){alert(`「${(find(id)||{}).name||id}」請輸入限量數字（0 以上）`);return}}
  try{
    for(const id of ids){
      const v=parseInt(STK.rows[id]),cur=STOCK[id];
      await FB.update(FB.ref(FB.db,'stock/'+today8()+'/'+id),cur&&cur.sold!=null?{limit:v}:{limit:v,sold:0});
    }
  }catch(e){alert('儲存失敗：'+(e.code||e.message));return}
  logAct('設定庫存',null,'',ids.map(id=>`${(find(id)||{}).name||id}×${STK.rows[id]}`).join('、')||'（無）');
  toast('✅ 庫存設定已儲存');
}
async function stkRecalc(){
  if(!confirm('依今日所有訂單（不含已拒單）重新計算每個限量品項的「已售」數量？'))return;
  try{
    const list=(await fetchDayOrders(today8())).filter(o=>o.status!=='cancelled');
    const sold={};list.forEach(o=>Object.entries(needOf(o.items)).forEach(([b,q])=>sold[b]=(sold[b]||0)+q));
    for(const id of Object.keys(STOCK)){
      if(STOCK[id]&&STOCK[id].limit!=null)await FB.update(FB.ref(FB.db,'stock/'+today8()+'/'+id),{sold:sold[id]||0});
    }
  }catch(e){alert('重新計算失敗：'+(e.code||e.message));return}
  logAct('重算庫存已售',null,'',dayPlain(today8()));
  toast('✅ 已重新計算已售數量');
}
async function stkClear(){
  if(!confirm('清空今天所有限量設定？（全部品項改成不限量）'))return;
  try{await FB.remove(FB.ref(FB.db,'stock/'+today8()))}catch(e){alert('清空失敗：'+(e.code||e.message));return}
  STK.rows={};renderStock();
}
async function stkCopy(){
  try{
    const y=(await FB.get(FB.ref(FB.db,'stock/'+shiftDay(today8(),-1)))).val()||{};
    const ids=Object.keys(y).filter(id=>y[id]&&y[id].limit!=null);
    if(!ids.length){alert('昨天沒有限量設定可沿用');return}
    for(const id of ids)await FB.update(FB.ref(FB.db,'stock/'+today8()+'/'+id),{limit:+y[id].limit,sold:0});
    ids.forEach(id=>STK.rows[id]=String(y[id].limit));
  }catch(e){alert('沿用失敗：'+(e.code||e.message));return}
  toast('✅ 已沿用昨天的限量（已售歸零）');renderStock();
}

function toggleCart(){document.querySelector('.cart').classList.toggle('cart-open')}
tick();setInterval(tick,1e3);
setInterval(()=>{if(isAdmin&&ordUnsub&&bizStart()!==ordStart)startOrders()},6e4);
