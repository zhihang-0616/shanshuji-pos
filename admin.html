.pit2{display:grid;grid-template-columns:24px minmax(84px,1.1fr) 62px 54px 62px 78px minmax(70px,1.5fr) 22px;gap:4px 6px;align-items:center;padding:2px 2px;border-bottom:1px solid rgba(255,255,255,.06)}

/* ===== 營業時間：週一至週四 17:30–24:00、週五六 17:30–02:00（次日）、週日公休；店家可手動提早開店／提早打烊／備料／臨時休假 ===== */
const TZ=28800000,DAYMS=86400000,WEEKMS=604800000;
const SCHED_TXT='週一至週四 17:30–24:00｜週五、週六 17:30–02:00｜週日公休｜營業日 16:30 起備料中（可先預訂）';
let SHOP={ovr:null,vac:null,wait:null},SV_OFF=0;
const svNow=()=>Date.now()+SV_OFF;
const twHM=ms=>{const m=Math.floor(((ms+TZ)%DAYMS)/60000);return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};   // 一律顯示台灣時間（24 小時制）
function schedOpenAt(t){      // 與 Firebase 規則使用同一組算式（台灣時間 UTC+8）
  const L=t+TZ,DM=L%DAYMS,WM=(L+4*DAYMS)%WEEKMS;     // DM：當天第幾毫秒；WM：本週（週日 00:00 起算）第幾毫秒
  return (WM>=DAYMS&&DM>=63000000)||(DM<7200000&&(WM>=6*DAYMS||WM<DAYMS));
}
function prepWinAt(t){        // 週一～週六 16:30–17:30：預定備料時段（客人可預訂）
  const L=t+TZ,DM=L%DAYMS,WM=(L+4*DAYMS)%WEEKMS;
  return WM>=DAYMS&&DM>=59400000&&DM<63000000;
}
function nextChange(t){
  const base=schedOpenAt(t);let m=Math.floor(t/60000)*60000+60000;
  for(let i=0;i<4320;i++,m+=60000)if(schedOpenAt(m)!==base)return m;
  return t+DAYMS;
}
function curStatus(t){
  t=t||svNow();
  const o=SHOP.ovr;
  if(o&&+o.until>t){
    if(o.mode==='open')return{s:'營業中',why:'手動營業'};
    if(o.mode==='prep'){const pu=+o.prepUntil||+o.until;return t<pu?{s:'備料中',why:'備料中',until:pu}:{s:'營業中',why:'備料完成，自動營業'}}
    return{s:'休息中',why:'手動休息'};
  }
  const v=SHOP.vac;
  if(v&&+v.from<=t&&t<+v.to)return{s:'休息中',why:'臨時休假'};
  if(schedOpenAt(t))return{s:'營業中',why:'依營業時間'};
  if(prepWinAt(t))return{s:'備料中',why:'預定備料時間',until:nextChange(t)};
  return{s:'休息中',why:'非營業時間'};
}
function updateStatusDisplay(){
  const st=curStatus(),s=st.s;
  $('statusText').textContent=(s==='備料中'&&st.until)?`備料中 至${twHM(st.until)}`:s;
  {const pe=$('statusText').parentElement;if(pe)pe.title=st.why}
  const c=s==='營業中'?'var(--ok)':s==='備料中'?'var(--ac)':'var(--bad)';
  $('statusDot').style.background=c;$('statusDot').style.boxShadow='0 0 8px '+c;
  const bn=$('banner'),v=SHOP.vac&&+SHOP.vac.to>svNow()&&+SHOP.vac.from<=svNow()?SHOP.vac:null;
  const back=v?`　臨時休假至 ${dayLabel(bizDay(+v.to-1)).slice(5,10)}`:'';
  if(s==='休息中'){bn.className='bn-rest';bn.textContent=isAdmin?`目前狀態：休息中（${st.why}；客人無法點餐，店家仍可下單）`:`🔴 目前休息中，暫停接單${back}　營業時間：${SCHED_TXT}`}
  else if(s==='備料中'){
    const left=Math.max(1,Math.ceil((st.until-svNow())/60000));
    bn.className='bn-prep';
    const sch=st.why==='預定備料時間';
    bn.textContent=isAdmin?(sch?`目前狀態：備料中（預定備料時間），${twHM(st.until)} 自動開始營業（還有約 ${left} 分鐘）`:`目前狀態：備料中，預計 ${twHM(st.until)} 完成（還有約 ${left} 分鐘）`)
      :(sch?`🟡 店家備料中，${twHM(st.until)} 開始營業（約還需 ${left} 分鐘）。可先預訂，開始營業後依序製作`:`🟡 店家備料中，預計 ${twHM(st.until)} 備料完成（約還需 ${left} 分鐘）。可先預訂，備料完成後依序製作`);
  }
  else{
    const wm=waitMin(),man=waitManual();
    if(wm>0){bn.className='bn-info';bn.textContent=isAdmin?`目前狀態：營業中${st.why!=='依營業時間'?`（${st.why}）`:''}　預估等候約 ${wm} 分鐘（${man?'手動':'自動'}）`:`⏱ 目前約等候 ${wm} 分鐘`}
    else{bn.className='';bn.textContent=isAdmin&&st.why!=='依營業時間'?`目前狀態：營業中（${st.why}）`:''}
  }
  renderCart();
}
/* ===== 預估等候時間：店家端依「進行中的單數」和「最近出餐速度」估算，客人看得到；也可手動設定 ===== */
function waitAuto(){
  const all=Object.values(ORDERS),n=all.filter(o=>o.status==='new'||o.status==='making').length;
  const done=all.filter(o=>o.acceptedAt&&o.doneAt&&o.doneAt>o.acceptedAt).sort((a,b)=>b.doneAt-a.doneAt).slice(0,10);
  let avg=done.length>=3?done.reduce((a,o)=>a+(o.doneAt-o.acceptedAt),0)/done.length/60000:8;
  avg=Math.min(25,Math.max(4,avg));
  const min=Math.min(120,Math.ceil((10+n*avg*0.8)/5)*5);          // 基本 10 分鐘 + 每張單的製作時間，湊到 5 分鐘
  return{n,min,avg:Math.round(avg)};
}
let lastWaitMin=-1,lastWaitAt=0;
function publishWait(){
  if(!isAdmin||!window.FB)return;
  const w=waitAuto(),t=svNow();
  if(w.min===lastWaitMin&&t-lastWaitAt<5*60000)return;
  lastWaitMin=w.min;lastWaitAt=t;
  SHOP.wait={...(SHOP.wait||{}),n:w.n,min:w.min,at:t};updateStatusDisplay();
  FB.update(FB.ref(FB.db,'shop/wait'),{n:w.n,min:w.min,at:t}).catch(()=>{});
}
const waitManual=()=>{const w=SHOP.wait;return w&&w.manual&&+w.manual.until>svNow()?w.manual:null};
function waitMin(){
  const w=SHOP.wait,t=svNow();if(!w)return 0;
  const m=waitManual();if(m)return +m.min||0;
  return 0;       // 不再自動預估等候時間（只有店家手動設定才會顯示）
}
async function setWaitManual(){
  const m=Math.round(+($('waitIn').value)||0);
  if(!(m>=1&&m<=180)){alert('請輸入 1～180 分鐘');return}
  try{await FB.update(FB.ref(FB.db,'shop/wait'),{manual:{min:m,until:svNow()+2*3600000,by:whoAmI()}});logAct('營業狀態',null,'',`預估等候時間手動設為 ${m} 分鐘（2 小時內有效）`)}
  catch(e){alert('設定失敗：'+(e.code||e.message));return}
  SHOP.wait={...(SHOP.wait||{}),manual:{min:m,until:svNow()+2*3600000}};updateStatusDisplay();openStatusSelector();
}
async function clearWaitManual(){
  try{await FB.remove(FB.ref(FB.db,'shop/wait/manual'));logAct('營業狀態',null,'','預估等候時間改回自動')}catch(e){alert('設定失敗：'+(e.code||e.message));return}
  if(SHOP.wait)delete SHOP.wait.manual;updateStatusDisplay();openStatusSelector();
}
function openStatusSelector(){
  if(!isAdmin)return;
  const t=svNow(),st=curStatus(t);
  const ovr=SHOP.ovr&&+SHOP.ovr.until>t,vac=SHOP.vac&&+SHOP.vac.to>t;
  const b=(label,on,click)=>`<button class="opt-btn ${on?'selected':''}" onclick="${click}">${label}${on?'　✓ 目前':''}</button>`;
  $('mBox').className='m-box';
  $('mBox').innerHTML=`<h3>營業狀態</h3>
   <div class="modal-tip" style="text-align:left">目前：<b>${st.s}</b>　${st.why}${st.until?`（至 ${twHM(st.until)}）`:''}<br>營業時間：${SCHED_TXT}<br>${vac?`臨時休假：${dayLabel(bizDay(+SHOP.vac.from)).slice(0,10)} 至 ${dayLabel(bizDay(+SHOP.vac.to-1)).slice(0,10)}<br>`:''}到了營業時間會自動變成營業中，打烊時間到了會自動變成休息中；你也可以隨時手動切換，到下一個營業時段會自動恢復。</div>
   <div class="opt-list">
    ${b('🟢 營業中',st.s==='營業中',"setState('open')")}
    ${b('🔴 休息中',st.s==='休息中',"setState('closed')")}
    ${b('🟡 備料中',st.s==='備料中',"prepForm()")}
    <button class="opt-btn" onclick="vacForm()">🌴 臨時休假</button>
    ${(ovr||vac)?'<button class="opt-btn" onclick="clearOvr()">↩ 恢復依營業時間自動切換</button>':''}
   </div>
   <div class="fm-sec" style="margin:10px 0"><div class="fm-title" style="font-size:13px">預估等候時間（客人看得到）</div>
    <div style="font-size:13px;color:var(--mu)">${waitManual()?`目前手動設定：約 ${waitManual().min} 分鐘（到 ${twHM(+waitManual().until)}）`:'目前沒有顯示等候時間（要顯示給客人時，在下方輸入分鐘再按「手動設定」，2 小時後自動取消）'}</div>
    <div class="fm-row" style="margin-top:6px"><input id="waitIn" type="number" inputmode="numeric" min="1" max="180" placeholder="手動分鐘，例如 40"><button class="chip sm" onclick="setWaitManual()">手動設定</button><button class="chip sm" onclick="clearWaitManual()">取消顯示</button></div></div>
   <div class="m-btns"><button class="btn-cancel" onclick="closeModal()">關閉</button></div>`;
  $('modal').classList.add('open');
}
async function setState(mode){
  const t=svNow(),st=curStatus(t);
  if(mode==='open'){
    if(st.s==='營業中'){closeModal();return}
    const vacOn=SHOP.vac&&+SHOP.vac.from<=t&&t<+SHOP.vac.to;
    if(schedOpenAt(t)&&!vacOn){      // 現在本來就是營業時間：取消手動設定就是營業中
      SHOP.ovr=null;updateStatusDisplay();closeModal();
      try{await FB.remove(FB.ref(FB.db,'shop/ovr'));logAct('營業狀態',null,'','手動切換：營業中（恢復依營業時間）')}catch(e){alert('營業狀態同步失敗：'+(e.code||e.message))}
      return;
    }
    return setOvr('open');
  }
  if(st.s==='休息中'){closeModal();return}
  return setOvr('closed');
}
async function setOvr(mode){
  const t=svNow(),open=schedOpenAt(t);
  const until=mode==='open'?(open?nextChange(t):nextChange(nextChange(t))):nextChange(t);   // 手動營業：營業到當次預定打烊；手動休息：到下一個營業時段切換為止
  const o={mode,until,at:t,by:whoAmI()};
  SHOP.ovr=o;updateStatusDisplay();closeModal();
  try{await FB.set(FB.ref(FB.db,'shop/ovr'),o);
    logAct('營業狀態',null,'',mode==='open'?`手動切換：營業中（提早開店，營業到 ${twHM(until)}）`:`手動切換：休息中（到 ${twHM(until)} 之後恢復依營業時間）`)}
  catch(e){alert('營業狀態同步失敗：'+(e.code||e.message))}
}
/* 備料中：從現在開始，輸入或快選「備料完成時間」，客人會看到預計完成時間 */
let PREP={end:''};
const tenUp=t=>Math.ceil((t+TZ)/600000)*600000-TZ;                  // 往後湊到下一個整 10 分鐘（台灣時間）
function prepSlots(){const st=tenUp(svNow()),out=[];for(let i=0;i<60;i++)out.push(twHM(st+i*600000));return out}   // 10 分鐘為單位，最長 10 小時
function prepEndMs(hm){
  const n=normTime(hm);if(!n)return NaN;
  const t=svNow(),day0=t-((t+TZ)%DAYMS),[h,m]=n.split(':').map(Number);
  let e=day0+h*3600000+m*60000;if(e<=t)e+=DAYMS;                    // 輸入的時間已經過了，就當作是隔天
  return e;
}
function prepInfo(){
  const e=prepEndMs(PREP.end);
  if(isNaN(e))return '請輸入正確的完成時間，例如 18:30';
  const t=svNow(),mins=Math.round((e-t)/60000);
  if(mins>600)return '備料時間最長 10 小時，請輸入較近的時間';
  const nextDay=Math.floor((e+TZ)/DAYMS)>Math.floor((t+TZ)/DAYMS);
  return `預計 ${twHM(e)}${nextDay?'（隔天）':''} 備料完成，約 ${mins} 分鐘`;
}
function prepForm(){PREP={end:twHM(tenUp(svNow()+30*60000))};renderPrep()}
function renderPrep(){
  const t=svNow();
  $('mBox').innerHTML=`<h3>🟡 備料中</h3>
   <div class="modal-tip" style="text-align:left">從現在（${twHM(t)}）開始備料。選好或輸入<b>備料完成時間</b>（24 小時制），<b>客人會看到「預計幾點備料完成」</b>，備料期間客人可以先預訂；時間到了會依營業時間自動切換。</div>
   <div class="fm-row"><b>完成時間</b>${timeField('prep','prepEnd24',prepSlots())}</div>
   <div class="fm-line"><span id="prepInfo" style="font-weight:700">${esc(prepInfo())}</span></div>
   <div class="m-btns"><button class="btn-cancel" onclick="openStatusSelector()">返回</button><button class="btn-confirm" onclick="savePrep()">開始備料</button></div>`;
  $('modal').classList.add('open');
}
async function savePrep(){
  const t=svNow(),e=prepEndMs(PREP.end);
  if(isNaN(e)){alert('請輸入正確的完成時間（24 小時制，例如 18:30）');return}
  if(e-t>600*60000){alert('備料時間最長 10 小時');return}
  const o={mode:'prep',prepUntil:e,until:e,at:t,by:whoAmI()};
  SHOP.ovr=o;updateStatusDisplay();closeModal();
  try{await FB.set(FB.ref(FB.db,'shop/ovr'),o);
    logAct('營業狀態',null,'',`手動切換：備料中（${twHM(t)} 開始，預計 ${twHM(e)} 完成，約 ${Math.round((e-t)/60000)} 分鐘）`)}
  catch(er){alert('營業狀態同步失敗：'+(er.code||er.message))}
}

/* ===== 搜尋欄（各個清單共用）：打關鍵字（可空格分開打好幾個字）→ 只顯示符合的項目 ===== */
const SQ={},SQCFG={};let SQF=null;
const sqNorm=t=>String(t==null?'':t).toLowerCase().replace(/\s+/g,' ').trim();
function sqBox(key,ph,cfg){
  SQCFG[key]=cfg;
  return `<div class="sqb"><input type="search" id="sq_${key}" placeholder="🔍 ${ph}" value="${esc(SQ[key]||'')}" autocomplete="off" oninput="sqSet('${key}',this.value)"></div><div class="sqe" id="sqe_${key}">找不到符合的資料</div>`;
}
function sqSet(key,v){const _was=sqNorm(SQ[key])!=='';SQ[key]=v;const a=document.activeElement;SQF={key,pos:(a&&a.selectionStart!=null)?a.selectionStart:String(v).length};
  const c=SQCFG[key];if(c&&c.re&&_was!==(sqNorm(v)!=='')){c.re();return}   // 有／沒有關鍵字會改變清單範圍時，重畫一次
  sqApply(key)}
function sqApply(key){
  const cfg=SQCFG[key],root=$('mBox');if(!cfg||!root||!$('sq_'+key))return;
  const terms=sqNorm(SQ[key]).split(' ').filter(Boolean);
  const txt=el=>sqNorm(el.textContent+' '+[...el.querySelectorAll('input:not([type=checkbox]):not([type=search]),select')].map(i=>i.value).join(' '));
  let shown=0;
  const items=[...root.querySelectorAll(cfg.item)];
  const gm=new Map();
  if(cfg.group)root.querySelectorAll(cfg.group).forEach(g=>{const t=g.querySelector(cfg.gtitle);gm.set(g,!!terms.length&&terms.every(w=>sqNorm(t?t.textContent:'').includes(w)))});
  items.forEach(el=>{
    const g=cfg.group?el.closest(cfg.group):null;
    const ok=!terms.length||(g&&gm.get(g))||terms.every(w=>txt(el).includes(w));
    el.style.display=ok?'':'none';if(ok)shown++;
  });
  if(cfg.group)root.querySelectorAll(cfg.group).forEach(g=>{
    const vis=[...g.querySelectorAll(cfg.item)].some(e=>e.style.display!=='none');
    g.style.display=(!terms.length||vis||gm.get(g))?'':'none';
    if(cfg.expand){const b=g.querySelector(cfg.expand);if(b)b.style.display=terms.length?'block':(cfg.collapsed&&cfg.collapsed(g)?'none':'block')}
  });
  const e=$('sqe_'+key);if(e)e.style.display=terms.length&&!shown?'block':'none';
}
function sqRefresh(){
  Object.keys(SQCFG).forEach(k=>{if($('sq_'+k))sqApply(k)});
  if(SQF){const el=$('sq_'+SQF.key);if(el&&document.activeElement!==el){el.focus();try{el.setSelectionRange(SQF.pos,SQF.pos)}catch(e){}}}
}
(function(){
  let t=0;const mb=$('mBox');if(!mb||!window.MutationObserver)return;
  new MutationObserver(()=>{if(t)return;t=requestAnimationFrame(()=>{t=0;sqRefresh()})}).observe(mb,{childList:true,subtree:true});
  document.addEventListener('pointerdown',e=>{if(!(e.target.closest&&e.target.closest('.sqb')))SQF=null},true);
})();

/* ===== 菜單：可在「品項管理 → 菜單編輯」新增／修改群組、品項、套餐與選項（口味、辣度…，可設必選） ===== */
function arr(x){return Array.isArray(x)?x:(x&&typeof x==='object'?Object.keys(x).sort((a,b)=>a-b).map(k=>x[k]):[])}
function normGroup(g){return{...g,n:g.n||'選項',req:!!g.req,multi:!!g.multi,tip:g.tip||'',ch:arr(g.ch).map(c=>({n:String(c.n==null?'':c.n),p:+c.p||0}))}}
function normMenu(v){
  return arr(v).map((c,i)=>({...c,cid:c.cid!=null?String(c.cid):String(i),ic:c.ic||'🍽',k:c.k||'未命名',
    items:arr(c.items).map(it=>({...it,d:arr(it.d),opts:arr(it.opts).map(normGroup)})),opts:arr(c.opts).map(normGroup)}));
}
let MENU=normMenu(MENU_DEFAULT);
const catKey=i=>{const c=MENU[i];return c&&c.cid!=null?String(c.cid):String(i)};   // 售完標記用群組代號記，群組搬位置也不會跑掉
const catOf=id=>MENU.find(c=>c.items.some(x=>x.id===id));
const effOpts=(item,cat)=>[...((cat&&cat.opts)||[]),...(item.opts||[])].filter(g=>g.ch&&g.ch.length);
/* 一次性升級：已存在雲端的舊菜單，輕食套餐還是「鹹水雞胸」寫死的話，自動改成「雞胸（可選 鹹水 / 煙燻 +$10）」＋必選選項。
   只有內容物還是舊寫法才會觸發，改完之後你再怎麼編輯都不會被蓋掉。 */
function migrateLight(m){
  let ch=false;
  const C5=()=>[{n:'兩份鹹水雞胸',p:0},{n:'兩份煙燻雞胸',p:20},{n:'鹹水雞胸 + 煙燻雞胸',p:10}];
  m.forEach(c=>c.items.forEach(it=>{
    if((it.id==='s4'||it.id==='s5')&&/^雞肉[:：]\s*鹹水雞胸/.test(String(it.c||''))&&!(it.opts||[]).length){
      if(it.id==='s5'){it.c='雞肉：雞胸 × 2（可選 鹹水 / 煙燻）';it.opts=[{n:'雞胸選擇',req:true,multi:false,tip:'',ch:C5()}]}
      else{it.c='雞肉：雞胸（可選 鹹水 / 煙燻 +$10）';it.opts=[{n:'雞胸口味',req:true,multi:false,tip:'',ch:[{n:'鹹水雞胸',p:0},{n:'煙燻雞胸',p:10}]}]}
      ch=true;
    }
    if(it.id==='s5'){      // 肉多餐有兩份雞胸：選項改成「兩份鹹水／兩份煙燻／各一份」（只改還是舊的兩選一）
      (it.opts||[]).forEach(g=>{
        const nm=(g.ch||[]).map(x=>String(x.n).trim());
        if(nm.length===2&&nm.includes('鹹水雞胸')&&nm.includes('煙燻雞胸')){g.ch=C5();it.c='雞肉：雞胸 × 2（可選 鹹水 / 煙燻）';ch=true}
      });
    }
  }));
  return ch;
}

/* --- 客人／店員點餐：通用選項視窗 --- */
let GO=null;
function showGenericOpts(item,cat){const opts=effOpts(item,cat);GO={item,opts,sel:opts.map(()=>[]),miss:false};renderGenericOpts()}
/* 選項和「售完品項」同步：選項名稱「包含」菜單上某個品項的完整名稱（例如選項「兩份鹹水雞胸」包含品項「鹹水雞胸」），
   那個品項標示售完（當日／無期限）、群組售完、或今日庫存用完時，這個選項就反黑不能選 */
function choiceSold(name){
  const nm=String(name).trim();if(!nm)return false;
  for(let ci=0;ci<MENU.length;ci++){
    for(const it of MENU[ci].items){
      const n=String(it.name).trim();
      if(n.length>=2&&nm.includes(n)&&(soldOutItems[it.id]||soldOutCats[catKey(ci)]||stockLeft(it.id)<=0))return true;   // 選項名稱「包含」某個品項的完整名稱，那個品項售完，這個選項就不能選
    }
  }
  return false;
}
function goPrice(){return GO.opts.reduce((a,g,gi)=>a+GO.sel[gi].reduce((b,ci)=>b+(+g.ch[ci].p||0),0),+GO.item.price||0)}
function renderGenericOpts(){
  const {item,opts,sel,miss}=GO;
  const groups=opts.map((g,gi)=>{
    const bad=miss&&g.req&&!sel[gi].length;
    return `<div class="opt-section-title"${bad?' style="color:var(--bad)"':''}>${esc(g.n)}<span style="font-size:12px;color:${g.req?'var(--bad)':'var(--mu)'}">　${g.req?'必選':'選填'}${g.multi?'・可複選':''}</span></div>
     <div class="opt-grid">${g.ch.map((c,ci)=>`${choiceSold(c.n)?`<button class="opt-btn disabled-opt ${sel[gi].includes(ci)?'selected':''}" onclick="goPick(${gi},${ci})">${esc(c.n)}<small> 已售完</small></button>`:`<button class="opt-btn ${sel[gi].includes(ci)?'selected':''}" onclick="goPick(${gi},${ci})">${esc(c.n)}${(+c.p)?`<small> ${c.p>0?'+':''}${c.p}</small>`:''}</button>`}`).join('')}</div>
     ${g.tip?`<div class="modal-tip">${esc(g.tip)}</div>`:''}`;
  }).join('');
  $('mBox').innerHTML=`<h3>${esc(item.name)}</h3>${groups}
   ${miss?'<div class="fm-err" style="display:block">請先選好標示「必選」的項目</div>':''}
   <div class="m-btns"><button class="btn-cancel" onclick="closeModal()">取消</button><button class="btn-confirm" onclick="goConfirm()">確認加入　$${goPrice()}</button></div>`;
  $('modal').classList.add('open');
}
function goPick(gi,ci){
  const g=GO.opts[gi],a=GO.sel[gi];
  if(choiceSold(g.ch[ci].n)&&!a.includes(ci)){
    if(!isAdmin){toast('「'+g.ch[ci].n+'」已售完');return}
    if(!confirm('「'+g.ch[ci].n+'」已標示售完。\n\n要強制選這個嗎？（補登過去的單、或特殊情況才需要）'))return;
  }
  if(g.multi){const i=a.indexOf(ci);i>=0?a.splice(i,1):a.push(ci)}
  else GO.sel[gi]=a[0]===ci?[]:[ci];
  renderGenericOpts();
}
function goConfirm(){
  const {item,opts,sel}=GO;
  if(opts.some((g,gi)=>g.req&&!sel[gi].length)){GO.miss=true;renderGenericOpts();return}
  if(!isAdmin){const bad=[];opts.forEach((g,gi)=>sel[gi].forEach(ci=>{if(choiceSold(g.ch[ci].n))bad.push(g.ch[ci].n)}));
    if(bad.length){toast('「'+bad.join('、')+'」剛剛售完了，請重新選擇');opts.forEach((g,gi)=>{sel[gi]=sel[gi].filter(ci=>!choiceSold(g.ch[ci].n))});renderGenericOpts();return}}
  const tags=[];opts.forEach((g,gi)=>sel[gi].forEach(ci=>tags.push(String(g.ch[ci].n).replace(/_/g,'-'))));
  add(tags.length?`${item.name} (${tags.join(', ')})`:item.name,goPrice(),tags.length?item.id+'_'+tags.join('_'):item.id);
  closeModal();
}

/* --- 菜單編輯（店長） --- */
let ME={m:null,ci:-1,ii:-1};
const meId=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const meSplit=k=>split(k);
function openMenuEditor(){
  if(!isManager())return;
  ME={m:JSON.parse(JSON.stringify(MENU)),ci:-1,ii:-1};
  viewingOrders=viewingStats=viewingTrack=false;
  $('mBox').className='m-box xl';$('modal').classList.add('open');
  meList();
}
async function meSave(msg){
  try{await FB.set(FB.ref(FB.db,'menu/cfg'),JSON.parse(JSON.stringify(ME.m)))}
  catch(e){alert('菜單儲存失敗：'+(e.code||e.message));return false}
  applyMenu(JSON.parse(JSON.stringify(ME.m)));
  if(msg)toast('✅ '+msg);
  return true;
}
function meHead(title,back){return `<div class="oh"><h3>${title}</h3><button onclick="${back}">返回</button></div>`}
function meQ(v){
  ME.q=v;const t=sqNorm(v).split(' ').filter(Boolean),box=$('meQr');if(!box)return;
  if(!t.length){box.innerHTML='';return}
  let h='';
  ME.m.forEach((c,ci)=>{const gn=meSplit(c.k)[0];
    if(t.every(w=>sqNorm(gn).includes(w)))h+=`<div class="mrow"><span class="mic">${esc(c.ic)}</span><div style="flex:1"><b>群組：${esc(gn)}</b> <small style="color:var(--mu)">${c.items.length} 項</small></div><button class="chip sm" onclick="meCat(${ci})">編輯</button></div>`;
    c.items.forEach((it,ii)=>{if(t.every(w=>sqNorm(it.name+' '+gn+' '+(it.c||'')+' '+(it.d||[]).join(' ')).includes(w)))h+=`<div class="mrow"><div style="flex:1;min-width:0"><b>${esc(it.name)}</b> <small style="color:var(--mu)">${esc(gn)}</small></div><span style="width:70px;text-align:right">$${it.price}</span><button class="chip sm" onclick="meCat(${ci});meItem(${ii})">編輯</button></div>`});
  });
  box.innerHTML=h||'<div style="color:var(--mu);padding:8px">找不到符合的群組或品項</div>';
}
function meList(){
  ME.ci=-1;ME.ii=-1;
  const rows=ME.m.map((c,i)=>{const [t,s]=meSplit(c.k);return `<div class="mrow"><span class="mic">${esc(c.ic)}</span><div style="flex:1;min-width:0"><b>${esc(t)}</b> <small style="color:var(--mu)">${esc(s)}　${c.items.length} 項${c.opts.length?'　有群組選項':''}</small></div><button class="chip sm" onclick="meMove(${i},-1)">↑</button><button class="chip sm" onclick="meMove(${i},1)">↓</button><button class="chip sm" onclick="meCat(${i})">編輯</button><button class="chip sm" style="color:var(--bad)" onclick="meDelCat(${i})">刪除</button></div>`}).join('');
  $('mBox').innerHTML=meHead('✏️ 菜單編輯','openMenuFolder()')+`<div class="fm-sec"><div class="fm-title">搜尋品項</div><div class="sqb"><input type="search" id="meQ" placeholder="🔍 搜尋群組或品項，例如：雞胸" value="${esc(ME.q||'')}" autocomplete="off" oninput="meQ(this.value)"></div><div id="meQr"></div></div>
   <div class="fm-sec"><div class="fm-title">群組（點「編輯」進去改名稱、新增或修改品項）</div>${rows||'<div style="color:var(--mu);padding:8px">還沒有群組</div>'}</div>
   <div class="fm-sec"><div class="fm-title">新增群組</div><div class="fm-row"><input id="neName" lang="zh-TW" placeholder="群組名稱，例如：飲料" onkeydown="if(event.key==='Enter'&&!event.isComposing){event.preventDefault();meAddCat()}"><input id="neIc" lang="zh-TW" style="max-width:90px" placeholder="圖示 🍹"><button class="chip" onclick="meAddCat()">＋ 新增群組</button></div></div>
   <div class="modal-tip" style="text-align:left">存檔後，客人和所有店家裝置的菜單會<b>立刻更新</b>。已經下過的訂單不受影響。</div>`;
  if(ME.q)meQ(ME.q);
}
async function meMove(i,d){const j=i+d;if(j<0||j>=ME.m.length)return;[ME.m[i],ME.m[j]]=[ME.m[j],ME.m[i]];if(await meSave())logAct('菜單編輯',null,'',`群組順序：「${meSplit(ME.m[j].k)[0]}」往${d<0?'上':'下'}移`);meList()}
async function meAddCat(){
  const n=$('neName').value.trim();if(!n){$('neName').focus();return}
  ME.m.push({cid:meId(),k:n,ic:($('neIc').value.trim()||'🍽'),items:[],opts:[]});
  if(await meSave('已新增群組「'+n+'」')){logAct('菜單編輯',null,'',`新增群組「${n}」`);meCat(ME.m.length-1)}
}
async function meDelCat(i){
  const c=ME.m[i];if(!confirm(`刪除群組「${meSplit(c.k)[0]}」？\n裡面的 ${c.items.length} 個品項也會一起刪除。`))return;
  const nm=meSplit(c.k)[0],cnt=c.items.length;ME.m.splice(i,1);if(await meSave('已刪除群組'))logAct('菜單編輯',null,'',`刪除群組「${nm}」（含 ${cnt} 個品項）`);meList();
}
function meCat(ci){
  ME.ci=ci;ME.ii=-1;const c=ME.m[ci],[t,s]=meSplit(c.k);
  const rows=c.items.map((it,ii)=>`<div class="mrow"><div style="flex:1;min-width:0"><b>${esc(it.name)}</b>${it.opts.length?' <small style="color:var(--mu)">有選項</small>':''}</div><span style="width:70px;text-align:right">$${it.price}</span><button class="chip sm" onclick="meMoveItem(${ii},-1)">↑</button><button class="chip sm" onclick="meMoveItem(${ii},1)">↓</button><button class="chip sm" onclick="meItem(${ii})">編輯</button><button class="chip sm" style="color:var(--bad)" onclick="meDelItem(${ii})">刪除</button></div>`).join('');
  $('mBox').innerHTML=meHead('✏️ 群組：'+esc(t),'meList()')+`
   <div class="fm-sec"><div class="fm-title">群組設定</div>
    <div class="fm-row"><b>名稱</b><input id="ceName" lang="zh-TW" value="${esc(t)}"><b style="width:auto">圖示</b><input id="ceIc" lang="zh-TW" style="max-width:80px" value="${esc(c.ic)}"></div>
    <div class="fm-row"><b>副標題</b><input id="ceSub" lang="zh-TW" value="${esc(s)}" placeholder="例如：主食、套餐（可不填）"></div>
    <div class="fm-row"><b>說明文字</b><input id="ceNote" lang="zh-TW" value="${esc(c.note||'')}" placeholder="顯示在群組上方的提醒（可不填）"></div>
    <label style="display:flex;gap:8px;align-items:center;margin:6px 0;font-size:14px"><input type="checkbox" id="ceCombo" ${c.combo?'checked':''}> 套餐樣式（品項顯示「說明」和「內容物」）</label>
    <div class="m-btns"><button class="btn-confirm" onclick="meCatSave()">儲存群組設定</button></div></div>
   <div class="fm-sec"><div class="fm-title">群組選項（套用到這個群組的<b>所有品項</b>，例如全部都要選辣度）</div><div id="oe_cat">${optEditorHtml('cat')}</div></div>
   <div class="fm-sec"><div class="fm-title">品項</div>${c.items.length>6?sqBox('mec','搜尋這個群組的品項',{item:'.mrow'}):''}${rows||'<div style="color:var(--mu);padding:6px">還沒有品項</div>'}
    <div class="fm-row" style="margin-top:8px"><input id="niName" lang="zh-TW" placeholder="新品項名稱" onkeydown="if(event.key==='Enter'&&!event.isComposing){event.preventDefault();document.getElementById('niPrice').focus()}"><input id="niPrice" type="number" inputmode="numeric" style="max-width:110px" placeholder="價格" onkeydown="if(event.key==='Enter'){event.preventDefault();meAddItem()}"><button class="chip" onclick="meAddItem()">＋ 新增品項</button></div></div>`;
}
async function meCatSave(){
  const c=ME.m[ME.ci],n=$('ceName').value.trim();if(!n){alert('群組名稱不能是空的');return}
  const sub=$('ceSub').value.trim(),b0={k:c.k,ic:c.ic,note:c.note||'',combo:!!c.combo};
  c.k=sub?`${n} (${sub})`:n;c.ic=$('ceIc').value.trim()||'🍽';c.note=$('ceNote').value.trim();c.combo=$('ceCombo').checked;
  if(!c.note)delete c.note;
  const ch=[];
  if(b0.k!==c.k)ch.push(`名稱「${meSplit(b0.k).join('／')}」→「${meSplit(c.k).join('／')}」`);
  if(b0.ic!==c.ic)ch.push(`圖示 ${b0.ic}→${c.ic}`);
  if(b0.note!==(c.note||''))ch.push('說明文字已修改');
  if(b0.combo!==c.combo)ch.push(`套餐樣式 ${c.combo?'開啟':'關閉'}`);
  if(await meSave('群組設定已儲存')){if(ch.length)logAct('菜單編輯',null,'',`修改群組「${meSplit(b0.k)[0]}」：${ch.join('；')}`);meCat(ME.ci)}
}
async function meAddItem(){
  const c=ME.m[ME.ci],n=$('niName').value.trim(),p=parseFloat($('niPrice').value);
  if(!n){$('niName').focus();return}
  if(!(p>=0)){$('niPrice').focus();return}
  c.items.push({id:meId(),name:n,price:p,d:[],opts:[]});
  if(await meSave('已新增「'+n+'」')){logAct('菜單編輯',null,'',`在「${meSplit(c.k)[0]}」新增品項「${n}」$${p}`);meItem(c.items.length-1)}   // 直接進入編輯，可繼續加選項
}
async function meMoveItem(ii,d){const c=ME.m[ME.ci],j=ii+d;if(j<0||j>=c.items.length)return;[c.items[ii],c.items[j]]=[c.items[j],c.items[ii]];if(await meSave())logAct('菜單編輯',null,'',`「${meSplit(c.k)[0]}」品項順序：「${c.items[j].name}」往${d<0?'上':'下'}移`);meCat(ME.ci)}
async function meDelItem(ii){
  const c=ME.m[ME.ci];if(!confirm(`刪除品項「${c.items[ii].name}」？`))return;
  const it0=c.items[ii];c.items.splice(ii,1);if(await meSave('已刪除品項'))logAct('菜單編輯',null,'',`刪除「${meSplit(c.k)[0]}」的品項「${it0.name}」$${it0.price}`);meCat(ME.ci);
}
const BUILTIN_OPT=(c,it)=>(['s1','s2','s3'].includes(it.id)&&c.combo)||c.noodle;
function meItem(ii){
  ME.ii=ii;const c=ME.m[ME.ci],it=c.items[ii],built=BUILTIN_OPT(c,it);
  $('mBox').innerHTML=meHead('✏️ 品項：'+esc(it.name),`meCat(${ME.ci})`)+`
   <div class="fm-sec"><div class="fm-row"><b>名稱</b><input id="ieName" lang="zh-TW" value="${esc(it.name)}"></div>
    <div class="fm-row"><b>價格</b><input id="iePrice" type="number" inputmode="numeric" style="max-width:160px" value="${it.price}"></div>
    ${c.combo?`<div class="fm-row"><b>說明</b><input id="ieC" lang="zh-TW" value="${esc(it.c||'')}" placeholder="例如：雞肉：半隻"></div>
    <div class="fm-row"><b>內容物</b><textarea id="ieD" lang="zh-TW" rows="3" placeholder="用頓號或逗號分開，例如：豬耳朵、雞冠、豆干" style="flex:1">${esc((it.d||[]).join('、'))}</textarea></div>`:''}
    <div class="m-btns"><button class="btn-cancel" style="color:var(--bad)" onclick="meDelItem(${ii})">刪除這個品項</button><button class="btn-confirm" onclick="meItemSave()">儲存</button></div></div>
   <div class="fm-sec"><div class="fm-title">這個品項的選項（口味、辣度…，可設必選）</div>
    ${built?'<div class="modal-tip" style="text-align:left">這個品項使用系統內建的選擇（套餐雞肉口味／麵食包裝方式），這裡不能再加選項；名稱、價格、內容物都可以改。</div>':`<div id="oe_item">${optEditorHtml('item')}</div>`}</div>`;
}
async function meItemSave(){
  const c=ME.m[ME.ci],it=c.items[ME.ii],n=$('ieName').value.trim(),p=parseFloat($('iePrice').value);
  if(!n){alert('品名不能是空的');return}
  if(!(p>=0)){alert('請輸入正確的價格');return}
  const b0={name:it.name,price:it.price,c:it.c||'',d:(it.d||[]).join('、')};
  it.name=n;it.price=p;
  if(c.combo){it.c=$('ieC').value.trim();it.d=$('ieD').value.split(/[、,，\n]/).map(x=>x.trim()).filter(Boolean)}
  const ch=[];
  if(b0.name!==n)ch.push(`名稱「${b0.name}」→「${n}」`);
  if(+b0.price!==p)ch.push(`價格 $${b0.price}→$${p}`);
  if(c.combo&&b0.c!==(it.c||''))ch.push('說明已修改');
  if(c.combo&&b0.d!==(it.d||[]).join('、'))ch.push(`內容物「${b0.d}」→「${(it.d||[]).join('、')}」`);
  if(await meSave('「'+n+'」已儲存')){if(ch.length)logAct('菜單編輯',null,'',`修改「${meSplit(c.k)[0]}」的品項「${b0.name}」：${ch.join('；')}`);meCat(ME.ci)}
}
/* 選項編輯器：kind = 'cat'（整個群組）或 'item'（單一品項） */
const meTarget=kind=>kind==='cat'?ME.m[ME.ci]:ME.m[ME.ci].items[ME.ii];
const chText=g=>g.ch.map(c=>c.n+((+c.p)?` ${c.p>0?'+':''}${c.p}`:'')).join('\n');
function parseCh(text){
  return String(text).split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const m=l.match(/^(.+?)\s*([+\-]\s*\d+(?:\.\d+)?)\s*$/);
    const n=(m?m[1]:l).replace(/_/g,'-').replace(/,/g,'，').trim(),p=m?parseFloat(m[2].replace(/\s/g,'')):0;
    return{n,p};
  });
}
function optEditorHtml(kind){
  const t=meTarget(kind);t.opts=t.opts||[];
  const gs=t.opts.map((g,gi)=>`<div class="og">
    <div class="fm-row"><b style="width:auto">選項名稱</b><input lang="zh-TW" value="${esc(g.n)}" oninput="meOptSet('${kind}',${gi},'n',this.value)"><button class="chip sm" style="color:var(--bad)" onclick="meOptDel('${kind}',${gi})">刪除</button></div>
    <div style="display:flex;gap:18px;margin:4px 0;font-size:14px"><label><input type="checkbox" ${g.req?'checked':''} onchange="meOptSet('${kind}',${gi},'req',this.checked)"> <b>必選</b>（沒選不能加入）</label><label><input type="checkbox" ${g.multi?'checked':''} onchange="meOptSet('${kind}',${gi},'multi',this.checked)"> 可複選</label></div>
    <div style="font-size:12px;color:var(--mu)">每行一個選項；要加價就在後面寫「+5」，例如：泰式 +5</div>
    <textarea rows="${Math.max(3,g.ch.length+1)}" lang="zh-TW" style="width:100%;box-sizing:border-box" onchange="meOptCh('${kind}',${gi},this.value)">${esc(chText(g))}</textarea>
    <div class="fm-row"><b style="width:auto;font-size:13px">提示文字</b><input lang="zh-TW" value="${esc(g.tip||'')}" placeholder="可不填，例如：未選時以不辣製作" oninput="meOptSet('${kind}',${gi},'tip',this.value)"></div></div>`).join('');
  return gs+`<div class="chips" style="margin-top:6px"><button class="chip sm" onclick="meOptAdd('${kind}','口味')">＋ 口味選擇</button><button class="chip sm" onclick="meOptAdd('${kind}','辣度')">＋ 辣度選擇</button><button class="chip sm" onclick="meOptAdd('${kind}','')">＋ 自訂選項</button></div>
    <div class="m-btns"><button class="btn-confirm" onclick="meOptSave('${kind}')">儲存選項</button></div>`;
}
function meOptSet(kind,gi,key,val){meTarget(kind).opts[gi][key]=val}
function meOptCh(kind,gi,text){const g=meTarget(kind).opts[gi];g.ch=parseCh(text);$('oe_'+kind).innerHTML=optEditorHtml(kind)}
function meOptAdd(kind,preset){
  const t=meTarget(kind);t.opts=t.opts||[];
  const ch=preset==='口味'?[{n:'原味',p:0},{n:'蒜味',p:0}]:preset==='辣度'?[{n:'不辣',p:0},{n:'小辣',p:0},{n:'中辣',p:0},{n:'大辣',p:0}]:[{n:'選項一',p:0},{n:'選項二',p:0}];
  t.opts.push({n:preset||'自訂選項',req:false,multi:false,tip:'',ch});
  $('oe_'+kind).innerHTML=optEditorHtml(kind);
}
function meOptDel(kind,gi){meTarget(kind).opts.splice(gi,1);$('oe_'+kind).innerHTML=optEditorHtml(kind)}
async function meOptSave(kind){
  const t=meTarget(kind);
  t.opts=(t.opts||[]).filter(g=>g.ch&&g.ch.length);
  for(const g of t.opts){g.n=(g.n||'').trim()||'選項';if(!g.tip)delete g.tip}
  const who=kind==='cat'?`群組「${meSplit(ME.m[ME.ci].k)[0]}」`:`「${meSplit(ME.m[ME.ci].k)[0]}」的品項「${t.name}」`;
  const sum=t.opts.map(g=>`${g.n}（${g.req?'必選':'選填'}${g.multi?'、可複選':''}：${g.ch.map(c=>c.n+((+c.p)?(c.p>0?'+':'')+c.p:'')).join('/')}）`).join('；')||'（已清除所有選項）';
  if(await meSave('選項已儲存')){logAct('菜單編輯',null,'',`${who}的選項：${sum}`);kind==='cat'?meCat(ME.ci):meItem(ME.ii)}
}


function showComboOptions(item){
  const saltSold=soldOutItems.m1||soldOutItems.m3||soldOutItems.m5||soldOutCats['0'];
  const smokeSold=soldOutItems.m2||soldOutItems.m4||soldOutItems.m6||soldOutCats['0'];
  const b=(label,dis,fl)=>`<button class="opt-btn ${dis?'disabled-opt':''}" ${dis?'':`onclick="addComboWithFlavor('${item.id}','${item.name}',${item.price},'${fl}')"`}>${label}</button>`;
  const opts=item.id==='s3'
    ?b('1. 全鹹水全雞',saltSold,'全鹹水')+b('2. 全煙燻全雞',smokeSold,'全煙燻')+b('3. 鹹半 + 燻半',saltSold||smokeSold,'鹹半+燻半')
    :b('1. 鹹水半雞',saltSold,'鹹水半雞')+b('2. 煙燻半雞',smokeSold,'煙燻半雞');
  $('mBox').innerHTML=`<h3>${esc(item.name)}</h3><div class="opt-list">${opts}</div><div class="m-btns"><button class="btn-cancel" onclick="closeModal()">取消</button></div>`;
  $('modal').classList.add('open');
}

/* 自由流通麵：客人必選包裝方式 */
const NOODLE_OPTS=['與食材裝一起','麵食另外裝','多數麵食獨立分開裝'];
let NDL=null;
const prodQty=(base,p)=>EDADD?ED.items.filter(x=>baseId(x.id)===base).reduce((a,x)=>a+(+x.qty||0),0):cart.filter(x=>baseId(x.id)===base&&(x.p||0)===p).reduce((a,x)=>a+x.qty,0);
const isMultiNoodle=x=>String(x.id).endsWith('_'+NOODLE_OPTS[2]);
function showNoodleOptions(item){NDL={item,opt:'',qty:1};renderNoodleModal()}
function renderNoodleModal(){
  const it=NDL.item,have=prodQty(it.id,curP),multiOk=NDL.qty+have>=2;
  if(NDL.opt===NOODLE_OPTS[2]&&!multiOk)NDL.opt='';
  $('mBox').innerHTML=`<h3>${esc(it.name)}</h3>
   <div class="fm-row"><b style="width:auto">數量</b><div class="stp"><button onclick="ndlQty(-1)">−</button><span>${NDL.qty}</span><button onclick="ndlQty(1)">+</button></div></div>
   <div class="opt-section-title">麵食包裝方式（必選）</div>
   <div class="opt-grid" style="grid-template-columns:1fr">${NOODLE_OPTS.map((o,i)=>{const dis=i===2&&!multiOk;return `<button class="opt-btn ${NDL.opt===o?'selected':''} ${dis?'disabled-opt':''}" ${dis?'disabled':''} onclick="ndlPick(${i})">${o}${i===2?`<br><small style="font-weight:400">同商品需點 2 份（含）以上才能選${have?`（購物車已有 ${have} 份）`:''}</small>`:''}</button>`}).join('')}</div>
   <div class="modal-tip">請選擇麵食要怎麼包裝，選好後才能加入訂單。</div>
   <div class="m-btns"><button class="btn-cancel" onclick="closeModal()">取消</button><button class="btn-confirm" ${NDL.opt?'':'disabled'} onclick="confirmNoodle()">確認加入</button></div>`;
  $('modal').classList.add('open');
}
function ndlQty(d){NDL.qty=Math.max(1,Math.min(20,NDL.qty+d));renderNoodleModal()}
function ndlPick(i){
  if(i===2&&NDL.qty+prodQty(NDL.item.id,curP)<2)return;
  NDL.opt=NOODLE_OPTS[i];renderNoodleModal();
}
function confirmNoodle(){
  if(!NDL||!NDL.opt){alert('請先選擇麵食包裝方式');return}
  const it=NDL.item,name=`${it.name} (${NDL.opt})`,id=it.id+'_'+NDL.opt;
  for(let i=0;i<NDL.qty;i++)add(name,it.price,id);
  closeModal();
}
/* 選了「多數麵食獨立分開裝」的商品，同一位客人必須點到 2 份以上 */
function noodleViolation(){
  const x=cart.find(l=>isMultiNoodle(l)&&prodQty(baseId(l.id),l.p||0)<2);
  return x?itemName(x.id):'';
}

/* 購物車裡這一行是不是已經售完：品項、群組、庫存、或選到已售完的選項（客人端會擋；店家端補單可強制） */
function soldLine(id){
  const base=baseId(id);let ci=-1;
  for(let i=0;i<MENU.length;i++)if(MENU[i].items.some(x=>x.id===base)){ci=i;break}
  if(ci<0)return false;
  if(soldOutItems[base]||soldOutCats[catKey(ci)]||stockLeft(base)<=0)return true;
  return String(id).split('_').slice(1).some(t=>choiceSold(t));
}
function dropSoldFromCart(msgPrefix){
  if(isAdmin||!cart.length)return false;
  const gone=cart.filter(x=>soldLine(x.id));
  if(!gone.length)return false;
  cart=cart.filter(x=>!soldLine(x.id));
  renderCart();renderGrid();
  alert((msgPrefix||'以下品項剛剛售完，已從購物車移除：')+'\n'+[...new Set(gone.map(x=>x.name))].join('\n'));
  return true;
}
function add(name,price,id){
  if(EDADD){edPush(name,price,id);return}
  if(!isAdmin&&!OVR[baseId(id)]&&soldLine(id)){toast('「'+name+'」已售完');return}
  if(!canAdd(id)){toast(`「${itemName(id)}」今日數量不足，無法再增加`);return}
  const e=cart.find(x=>x.id===id&&x.p===curP);
  if(e)e.qty++;else{const id0=baseId(id),inc=incText(find(id0),catOf(id0));cart.push(inc?{id,name,price,qty:1,p:curP,inc}:{id,name,price,qty:1,p:curP})}
  renderCart();renderGrid();
}
function qty(j,d){const e=cart[j];if(!e)return;if(d<0&&isMultiNoodle(e)&&prodQty(baseId(e.id),e.p||0)+d<2){toast(`「${itemName(e.id)}」選了「多數麵食獨立分開裝」，同商品需要 2 份以上；要減少請先刪除這一項，再重新選擇包裝方式`);return}if(d>0&&!isAdmin&&soldLine(e.id)){toast(`「${e.name}」已售完`);return}if(d>0&&!canAdd(e.id)){toast(`「${itemName(e.id)}」今日數量不足，無法再增加`);return}e.qty+=d;if(e.qty<=0)cart.splice(j,1);renderCart();renderGrid()}

function delPerson(i){
  const n=cart.filter(x=>x.p===i).length;
  if(n&&!confirm(`移除「${plabel(i)}」會一併刪除 ${n} 項餐點，確定嗎？`))return;
  cart=cart.filter(x=>x.p!==i);cart.forEach(x=>{if(x.p>i)x.p--});
  CK.people.splice(i,1);if(!CK.people.length)CK.people.push(newP());
  curP=Math.min(curP,CK.people.length-1);renderCart();renderGrid();
}
function prunePeople(){
  const keep=CK.people.map((_,i)=>cart.some(x=>x.p===i));
  if(keep.every(Boolean)||!keep.some(Boolean))return;
  const map={};let n=0;keep.forEach((k,i)=>{if(k)map[i]=n++});
  CK.people=CK.people.filter((_,i)=>keep[i]);
  cart.forEach(x=>{x.p=map[x.p]});
  curP=Math.min(curP,CK.people.length-1);renderCart();renderGrid();
}

/* 客人最早可選的取餐時間：17:30 開店，最快 17:40 才做得出來，所以 06:00～17:40 之間預約都只能選 17:40 以後 */
const FIRST_PICK='17:40';
function minPickHM(){const hm=new Date().toTimeString().slice(0,5);return(hm>='06:00'&&hm<FIRST_PICK)?FIRST_PICK:hm}
function timeSlots(full){
  /* 客人：從現在之後的每 10 分鐘到 23:50；店家（full）：整天 00:00～23:50 */
  const now=new Date();now.setSeconds(0,0);
  const t=full?new Date(now.getFullYear(),now.getMonth(),now.getDate(),0,0,0,0):new Date(now);
  if(!full){
    t.setMinutes(Math.ceil(t.getMinutes()/10)*10);
    const mp=minPickHM();if(mp===FIRST_PICK&&t.toTimeString().slice(0,5)<mp)t.setHours(17,40,0,0);
  }
  const day=now.getDate(),out=[];
  while(t.getDate()===day){
    out.push(String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0'));
    t.setMinutes(t.getMinutes()+10);
  }
  return out;
}

async function custInfo(phone,force){
  const k=phoneKey(phone);if(k.length<10)return null;
  const c=CUST[k];if(c&&!force&&svNow()-c.t<5*60000)return c.v;
  let list=[];
  try{const sn=await FB.get(FB.query(FB.ref(FB.db,'orders'),FB.orderByChild('phone'),FB.startAt(phone),FB.endAt(phone)));list=Object.values(sn.val()||{})}catch(e){return null}
  const ok=list.filter(o=>o.status!=='cancelled').sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  let note='';try{note=((await FB.get(FB.ref(FB.db,'customerNotes/'+k))).val()||{}).note||''}catch(e){}
  const last=ok[0];
  const v={n:ok.length,total:ok.reduce((a,o)=>a+(+o.total||0),0),last:last?last.createdAt:0,lastName:last?last.name:'',lastItems:last?(last.items||[]).map(x=>`${x.name}×${x.qty}`).join('、'):'',note};
  CUST[k]={t:svNow(),v};return v;
}

function calcTotals(){
  const sub=cart.reduce((a,x)=>a+x.qty*x.price,0);
  const extra=5*CK.people.filter(p=>p.flavor==='泰式+5元').length;
  let total=sub+extra;
  if(isAdmin){
    const p=Math.min(100,Math.max(0,parseFloat(CK.pct)||0));
    total=Math.round(total*p/100)-(parseFloat(CK.off)||0);
  }
  const base=sub+extra;
  return{sub,extra,disc:Math.max(0,base-Math.max(0,total)),total:Math.max(0,total)};
}

/* ===== 24 小時制時間欄位：可以手動輸入，也可以從清單快選 ===== */
const pad2t=n=>String(n).padStart(2,'0');
function fmt24(raw){
  const v=String(raw).replace(/：/g,':').replace(/[^\d:]/g,'');
  const i=v.indexOf(':');
  if(i>=0)return v.slice(0,i).slice(0,2)+':'+v.slice(i+1).replace(/:/g,'').slice(0,2);
  if(v.length<=2)return v;
  const hl=(+v[0]>2)?1:2;                       // 930 → 9:30；1235 → 12:35
  return v.slice(0,hl)+':'+v.slice(hl,hl+2);
}
function normTime(v){
  const m=/^(\d{1,2}):(\d{1,2})$/.exec(String(v||'').trim());
  if(!m)return '';
  const h=+m[1],mi=+m[2];
  return(h>23||mi>59)?'':pad2t(h)+':'+pad2t(mi);
}

function submitCheckout(){
  if(isClosed()){alert('店家目前休息中，暫停接單');return}
  if(dropSoldFromCart('下列品項已經售完，已從購物車移除，請確認後再送出：')){closeModal();return}
  CK.err=true;
  if(isAdmin&&CK.late&&!(lateMs()>0)){alert('請輸入補單的下單日期與時間（時間為 24 小時制，例如 12:35）');return}
  if(normTime(CK.time))CK.time=normTime(CK.time);
  if(!nameValid()||!phoneValid()||!timeOK()||!gearOK()){renderCheckout();return}
  const t=calcTotals();
  window.pendingOrder={
    name:CK.name.trim()||'現場客',phone:CK.phone,src:isAdmin?(CK.src||'現場'):(CK.walkin?'現場':'線上'),time:CK.time,note:CK.note.trim(),
    flavor:CK.people[0].flavor||'原味',spice:CK.people[0].spice||'不辣',salt:CK.people[0].salt||'正常',
    gear:[...CK.gear],pay:CK.pay,items:JSON.parse(JSON.stringify(cart)),
    subtotal:t.sub,extra:t.extra,discount:t.disc,total:t.total
  };
  if(!isAdmin&&CK.pay==='轉帳'&&CK.x5){if(!/^\d{5}$/.test(CK.x5)){alert('轉帳帳號後五碼請輸入 5 位數字，或留空');return}window.pendingOrder.x5=CK.x5}
  if(CK.pay==='Linepay'){
    if(!CK.lpMode){alert('請選擇 LINE Pay 付款方式：現場掃碼或線上支付');return}
    if(CK.lpMode==='online'){
      if(!LINE_HOOK){alert('目前無法使用線上支付');return}
      if(isAdmin&&CK.late){alert('補單無法使用線上支付，請改選「現場掃碼」');return}
      if(isAdmin&&(!window.FB||!CONNECTED)){alert('目前離線，無法開啟線上支付，請改選「現場掃碼」或稍後再試');return}
      window.pendingOrder.lp='pending';
    }
  }
  if(isAdmin)window.pendingOrder.staff=true;
  if(isAdmin&&CK.late)Object.assign(window.pendingOrder,{late:true,lateAt:lateMs(),lateStatus:CK.lateStatus,latePaid:CK.latePaid,lateNo:CK.lateNo.trim()});
  if(CK.people.length>1)window.pendingOrder.people=CK.people.map((x,i)=>({name:x.name.trim()||'第'+(i+1)+'位',flavor:x.flavor||'原味',spice:x.spice||'不辣',salt:x.salt||'正常',note:x.note.trim()}));
  renderReceipt();
}

let submitting=false;
async function confirmOrder(){
  const o=window.pendingOrder;if(!o||submitting)return;
  if(isClosed()){alert('店家目前休息中，暫停接單');return}
  if(!isAdmin&&!window.FB){alert('無法連線到雲端，請檢查網路後重試');return}
  submitting=true;
  const btn=$('cfBtn');if(btn){btn.disabled=true;btn.textContent='送出中…'}
  const ts=o.late?o.lateAt:Date.now(),day=o.late?bizDay(ts):today8();
  if(o.late&&o.lateNo)o.no=/^\d+$/.test(o.lateNo)?o.lateNo.padStart(3,'0'):o.lateNo;
  o.date=day;o.createdAt=ts;o.status=o.late?(o.lateStatus||'picked'):'new';
  if(o.late&&o.latePaid){o.paid=true;o.paidAt=ts;o.received=o.total;o.change=0}
  const data=JSON.parse(JSON.stringify(o));['lateAt','lateStatus','latePaid','lateNo'].forEach(k=>delete data[k]);
  if(isAdmin){
    /* 店家下單：斷線時先暫存在這台裝置，連線後自動補送 */
    const key='L'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    try{
      if(!window.FB||!CONNECTED)throw new Error('offline');
      let held=[];
      if(!o.late){
        let rs=await withTimeout(reserveStock(o.items,false),10000);
        if(!rs.ok){
          if(!confirm(`「${rs.name}」庫存只剩 ${rs.left} 份，仍要送出這張單嗎？`)){if(btn){btn.disabled=false;btn.textContent='確認送出'}submitting=false;return}
          rs=await withTimeout(reserveStock(o.items,true),10000);
        }
        held=rs.done||[];
      }
      try{o.no=await withTimeout(sendOrder(key,{...data},day),10000)}catch(er){await releaseStock(held);throw er}
      if(!o.late)notifyLine(key);
      if(o.lp){await lpGo(key,o);submitting=false;return}
      if(o.late)logAct('補單',null,o.no,`下單時間 ${fmtDT(ts)}｜${o.name||'現場客'} $${o.total}${o.lateStatus&&o.lateStatus!=='picked'?'｜狀態 '+(ST[o.lateStatus]||o.lateStatus):''}`);
      showDone(o);
    }catch(e){OUT.push({key,day,data});saveOut();showQueued(o)}
  }else{
    let held=[],written=false;
    try{
      const rs=await reserveStock(o.items,false);
      if(!rs.ok){
        alert(`「${rs.name}」目前只剩 ${rs.left} 份，請調整數量後再送出。`);
        if(btn){btn.disabled=false;btn.textContent='確認送出'}
        submitting=false;return;
      }
      held=rs.done;
      const r=await FB.runTransaction(FB.ref(FB.db,'counters/'+day),n=>(n||0)+1);
      o.no=String(r.snapshot.val()).padStart(3,'0');data.no=o.no;
      const nref=FB.push(FB.ref(FB.db,'orders'));
      await FB.set(nref,data);written=true;
      saveMy(nref.key,o.no);
      if(!isAdmin&&o.phone){try{localStorage.setItem('cust_info',JSON.stringify({name:o.name,phone:o.phone}))}catch(e){}}
      notifyLine(nref.key);
      if(o.lp){await lpGo(nref.key,o);submitting=false;return}
      showDone(o);
    }catch(e){
      if(!written)await releaseStock(held);
      const em=String(e.code||e.message);
      alert(/PERMISSION/i.test(em)?'訂單無法送出：店家目前可能已暫停接單，請稍後再試。（'+em+'）':'訂單送出失敗，請檢查網路後再試一次。\n（'+em+'）');
      if(btn){btn.disabled=false;btn.textContent='確認送出'}
    }
  }
  submitting=false;
}

    <div class="rc-no">#${o.no}</div>

let authMsg='';
async function onAuth(user){
  if(!ADMIN_PARAM)return;
  if(user){
    UID=user.uid;
    let r=null;
    try{r=(await FB.get(FB.ref(FB.db,'roles/'+user.uid))).val();localStorage.setItem('role_'+user.uid,r||'')}
    catch(e){r=localStorage.getItem('role_'+user.uid)||null}
    if(r!=='manager'&&r!=='staff'){
      authMsg='此帳號尚未被授權。請店長到 Firebase 資料庫 roles 新增這個帳號：名稱貼 '+user.uid+'，值填 staff（或 manager）。';
      FB.signOut(FB.auth);return;
    }
    ROLE=r;
    muted=false;localStorage.removeItem('alarm_muted');
    isAdmin=true;setAdminUI(true);startOrders();startAlarm();keepAwake();updateSoundBtn();
    toast(isManager()?'已登入：店長':'已登入：店員（可接單、結帳；無法刪單與查看統計）');
    setTimeout(checkOpenReminder,5000);
    if(isManager())setTimeout(checkBackupReminder,9000);
  }else{
    isAdmin=false;ROLE='staff';setAdminUI(false);stopOrders();stopAlarm();const m=authMsg;authMsg='';openAdminLogin(m);
  }
}
function openAdminLogin(msg){
  $('mBox').className='m-box';
  $('mBox').innerHTML=`<h3>店家登入</h3>
   <label>Email<input type="email" id="loginEmail" autocomplete="username" placeholder="請輸入店家 Email"></label>

async function doLogin(){
  unlockAudio();
  const err=$('loginErr');
  if(!window.FB){err.textContent='雲端連線失敗，請重新整理頁面';return}
  const em=$('loginEmail').value.trim(),pw=$('loginPwd').value;
  if(!em||!pw){err.textContent='請輸入 Email 與密碼';return}
  const btn=$('loginBtn');btn.disabled=true;btn.textContent='登入中…';
  try{await FB.signIn(FB.auth,em,pw);closeModal()}
  catch(e){
    const c=e.code||'';
    err.textContent=['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email'].includes(c)?'帳號或密碼錯誤'
      :c==='auth/too-many-requests'?'嘗試次數過多，請稍後再試'
      :c==='auth/network-request-failed'?'網路連線失敗':'登入失敗（'+c+'）';
    btn.disabled=false;btn.textContent='登入';
  }
}
function doLogout(){if(confirm('確定要登出店家帳號？'))FB.signOut(FB.auth)}

/* ===== 提示音 / 通知 ===== */
let actx=null;
function unlockAudio(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
function beep(){
  if(!actx)return;
  [0,.28,.56].forEach(t=>{
    const o=actx.createOscillator(),g=actx.createGain();
    o.type='sine';o.frequency.value=880;g.gain.value=.3;
    o.connect(g);g.connect(actx.destination);
    o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.18);
  });
}
function toast(msg,fn){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  t.onclick=()=>{t.classList.remove('show');(fn||openOrders)()};

/* ===== 異常提醒：金額對不起來、價格低於菜單價、疑似重複下單 ===== */
function anomalies(o){
  const w=[];if(!o||o.status==='cancelled')return w;
  const items=o.items||[],sum=items.reduce((a,x)=>a+(+x.price||0)*(+x.qty||0),0);
  if(!o.staff&&!o.late){
    if(o.subtotal!=null&&Math.abs(sum-(+o.subtotal))>0.5)w.push(`品項加總 $${sum} 和小計 $${o.subtotal} 不一致`);
    if(o.baseTotal==null&&o.subtotal!=null&&Math.abs((+o.subtotal+(+o.extra||0)-(+o.discount||0))-(+o.total))>0.5)w.push(`應付總額 $${o.total} 和小計不一致`);
    items.forEach(x=>{
      const id=baseId(String(x.id||'')),it=find(id);
      if(!(+x.qty>=1)||+x.qty>50)w.push(`「${x.name}」數量 ${x.qty} 異常`);
      if(!it||!(it.price>0))return;
      const cat=catOf(id),neg=effOpts(it,cat).some(g=>g.ch.some(c=>(+c.p)<0));
      if(!neg&&(+x.price)<it.price)w.push(`「${x.name}」單價 $${x.price} 低於菜單價 $${it.price}`);
    });
  }
  if(o.phone){
    const dup=Object.entries(ORDERS).some(([id,p])=>id!==o.id&&p.phone===o.phone&&p.status!=='cancelled'&&p.total===o.total&&Math.abs((p.createdAt||0)-(o.createdAt||0))<=180000);
    if(dup)w.push('疑似重複下單（同電話、同金額、3 分鐘內）');
  }
  return w;
}

const baseName=n=>String(n).replace(/\s+\(.*\)\s*$/,'');
const money=n=>'$'+Math.round(n).toLocaleString();
function summarize(list){
  const ok=list.filter(o=>o.status!=='cancelled');
  const rev=ok.reduce((a,o)=>a+(o.total||0),0);
  const pay={},src={},items={};
  ok.forEach(o=>{
    const p=o.pay||'未填';pay[p]=pay[p]||{n:0,s:0};pay[p].n++;pay[p].s+=o.total||0;
    const sr=o.src||'線上';src[sr]=src[sr]||{n:0,s:0};src[sr].n++;src[sr].s+=o.total||0;
    (o.items||[]).forEach(x=>{const k=baseName(x.name);items[k]=items[k]||{q:0,s:0};items[k].q+=x.qty;items[k].s+=x.qty*x.price});
  });
  const un=ok.filter(o=>!o.paid);
  return{ok,rev,cancelled:list.length-ok.length,pay,src,items,unpaid:{n:un.length,s:un.reduce((a,o)=>a+(o.total||0),0)}};
}

/* 前一天／後一天：單日就是 ±1 天；選了一段區間，就整段往前／往後移動同樣的天數。移完自動查詢 */
function histSpan(){
  const s=($('hS').value||'').replace(/-/g,''),e=($('hE').value||'').replace(/-/g,'');
  if(!/^\d{8}$/.test(s)||!/^\d{8}$/.test(e)||s>e)return 1;
  return Math.max(1,Math.round((dayStartMs(e)-dayStartMs(s))/86400000)+1);
}
function histLbl(){
  const n=histSpan(),a=$('hPrev'),b=$('hNext');
  if(a)a.textContent=n>1?'◀ 前'+n+'天':'◀ 前一天';
  if(b)b.textContent=n>1?'後'+n+'天 ▶':'後一天 ▶';
}
function histShift(dir){
  const sv=($('hS').value||'').replace(/-/g,''),ev=($('hE').value||'').replace(/-/g,'');
  if(!/^\d{8}$/.test(sv)||!/^\d{8}$/.test(ev)||sv>ev){alert('請先選擇正確的日期區間');return}
  const n=histSpan()*dir;
  $('hS').value=dashDay(shiftDay(sv,n));$('hE').value=dashDay(shiftDay(ev,n));
  histLbl();loadHistory();
}

function exportCSV(){
  if(!HIST.length){alert('請先查詢，且區間內要有訂單');return}
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';

  const rows=[];
  HIST.forEach(o=>{
    const P=peopleOf(o)||[{name:o.name,flavor:o.flavor,spice:o.spice,salt:o.salt,note:'',items:o.items||[]}];
    const n=P.length,adj=(o.extra||0)-(o.discount||0);
    P.forEach((pp,i)=>{
      const first=i===0;
      const sub=pp.items.reduce((a,x)=>a+x.price*x.qty,0);
      const note=n>1?[pp.note,first&&o.note?'整單備註：'+o.note:''].filter(Boolean).join('｜'):(o.note||'');

        pp.items.map(x=>x.name+'×'+x.qty).join('；'),pp.flavor||'',pp.spice||'',pp.salt||'',(o.gear||[]).join('、'),note,
        sub,first?o.subtotal:'',first?adj:'',first?o.total:'',

    });
  });
  const csv='\ufeff'+[head,...rows].map(r=>r.map(q).join(',')).join('\r\n');
  const a=document.createElement('a');

function incText(item,cat){        // 套餐才有內含物
  if(!item||!cat||!cat.combo)return '';
  const ch=String(item.c||'').replace(/（可選[^）]*）/,'').replace(/^雞肉[：:]\s*/,'');
  return [ch,...(item.d||[])].filter(Boolean).join('、');
}

function itemsBlock(o,withOpt){

function edPush(name,price,id){
  const ex=ED.items.find(x=>x.id===id&&x.name===name&&x.p===0);

function edAddMenu(sel){
  const it=find(sel.value);

  else if(cat&&cat.noodle){EDADD=true;showNoodleOptions(it)}

function backFromEdit(){EDFROM==='history'?openHistory(true):openOrders()}
async function saveEdit(){
  if(ED.phone&&!phoneOK(ED.phone)){alert('電話格式需為 09XX-XXX-XXX，或留空');return}
  const tm24=normTime(ED.time);
  if(!tm24){alert('請輸入正確的取餐時間（24 小時制，例如 17:30）');return}
  ED.time=tm24;
  let newTs=null;
  if(isManager()){
    const t2=normTime(ED.at);
    if(!ED.d||!t2){alert('請輸入正確的下單日期與時間（時間為 24 小時制，例如 12:35）');return}
    ED.at=t2;
    if(ED.d!==ED.d0||t2!==ED.t0){newTs=new Date(ED.d+'T'+t2+':00').getTime();if(!(newTs>0)){alert('下單日期或時間不正確');return}}
  }
  const multi=ED.people.length>1,o=ED.orig;
  const items=ED.items.map(x=>({id:x.id||'',name:String(x.name).trim(),price:parseFloat(x.price)||0,qty:Math.max(1,parseInt(x.qty)||1),p:multi?Math.min(parseInt(x.p)||0,ED.people.length-1):0})).filter(x=>x.name);
  if(!items.length){alert('至少要有一項餐點');return}
  const pp=ED.people.map((x,i)=>({name:x.name.trim()||'第'+(i+1)+'位',flavor:x.flavor||'原味',spice:x.spice||'不辣',salt:x.salt||'正常',note:x.note.trim()}));
  const sub=items.reduce((a,x)=>a+x.price*x.qty,0),adj=parseFloat(ED.adj)||0,total=Math.max(0,sub+adj);
  const data={name:ED.name.trim()||'現場客',phone:ED.phone,time:ED.time,note:ED.note.trim(),src:ED.src,
    flavor:pp[0].flavor,spice:pp[0].spice,salt:pp[0].salt,people:multi?pp:null,gear:ED.gear.length?ED.gear:null,
    pay:ED.pay,status:ED.status,items,subtotal:sub,extra:adj>0?adj:0,discount:adj<0?-adj:0,total,updatedAt:Date.now()};
  if(newTs){data.createdAt=newTs;data.date=bizDay(newTs)}
  const parts=[];
  if(ED.time!==o.time)parts.push(`取餐時間改為 ${ED.time}（原 ${o.time}）`);
  const sig=a=>(a||[]).map(x=>`${x.p||0}|${String(x.name).trim()}|${+x.price}|${+x.qty}`).join(';');
  if(sig(items)!==sig(o.items))parts.push(`餐點內容已調整，應付總額 $${total}`);
  if(parts.length)data.notice={at:Date.now(),text:parts.join('；')};
  const ch=[];
  if(newTs)ch.push(`下單日期 ${ED.d0} ${ED.t0}→${ED.d} ${ED.at}`);
  if(ED.time!==o.time)ch.push(`取餐時間 ${o.time}→${ED.time}`);
  if(total!==(+o.total||0))ch.push(`金額 $${o.total}→$${total}`);
  if(sig(items)!==sig(o.items))ch.push('餐點內容');
  if(ED.pay!==o.pay)ch.push(`付款 ${o.pay}→${ED.pay}`);
  if(ED.status!==o.status)ch.push(`狀態 ${ST[o.status]||o.status}→${ST[ED.status]||ED.status}`);
  if(ED.name.trim()!==o.name||ED.phone!==(o.phone||'')||ED.note.trim()!==(o.note||''))ch.push('姓名/電話/備註');
  const b=$('edSave');b.disabled=true;b.textContent='儲存中…';
  try{await FB.update(FB.ref(FB.db,'orders/'+ED.id),data);if(ch.length)logAct('編輯',ED.id,ED.no,ch.join('；'));
    if(newTs&&bizDay(newTs)!==today8())toast(`✅ 已移到 ${dayPlain(bizDay(newTs)).slice(5)} 的營業日，可在「歷史訂單」或日報表查看`);
    backFromEdit()}
  catch(e){alert('儲存失敗：'+(e.code||e.message));b.disabled=false;b.textContent='儲存'}
}
async function delOrder(id,no,from){
  if(!isManager()){alert('只有店長可以永久刪除訂單，請改用「拒單」');return}
  if(!confirm(`確定要「永久刪除」訂單 #${no}？\n刪除後無法復原（系統會留下刪除紀錄）。`))return;
  const o=ORDERS[id]||HIST.find(x=>x.id===id)||{};
  try{await FB.remove(FB.ref(FB.db,'orders/'+id))}catch(e){alert('刪除失敗：'+(e.code||e.message));return}
  logAct('永久刪除',id,no,`${o.name||''} $${o.total==null?'':o.total}${o.voidReason?'（先前已拒單：'+o.voidReason+'）':''}`,{name:o.name||'',total:o.total==null?0:o.total,items:(o.items||[]).map(x=>x.name+'×'+x.qty).join('；')});
  if(from==='histlist')loadHistory();else if(from==='orders')openOrders();else backFromEdit();
}

/* ===== 取餐 → 自動結帳完成，並跳出結帳畫面（可改付款方式、折扣、折讓）===== */
let PAY=null;
const payBase=o=>{const sub=+o.subtotal;return(sub>0?sub:(o.items||[]).reduce((a,x)=>a+(+x.price||0)*(+x.qty||0),0))+(+o.extra||0)};
const payTotal=()=>{
  let p=parseFloat(PAY.pct);if(isNaN(p))p=100;p=Math.min(100,Math.max(0,p));
  const off=Math.max(0,parseFloat(PAY.off)||0);
  return Math.max(0,Math.round(PAY.base*p/100)-off);
};
async function pickup(id){
  const o=ORDERS[id];if(!o)return;
  if(o.paid){        // 客人先付過款的單：直接完成取餐
    try{await FB.update(FB.ref(FB.db,'orders/'+id),{status:'picked',pickedAt:Date.now(),updatedAt:Date.now()})}
    catch(e){alert('取餐失敗：'+(e.code||e.message));return}
    toast(`✅ #${o.no} 已取餐（原本已收款，訂單結束）`);
    return;
  }
  openPay(id,true);   // 取餐一定會進結帳畫面；按下「結帳」才算取餐完成
}
function openPay(id,after,fresh){
  const o=fresh||ORDERS[id];if(!o)return;
  PAY={id,o,after:!!after,pay:o.pay||'現金',recv:'',pct:'100',off:String(+o.discount||0),base:payBase(o)};
  viewingOrders=viewingStats=viewingTrack=false;
  $('mBox').className='m-box wide';renderPay();$('modal').classList.add('open');
}
function payBack(){openOrders()}
function payMethod(v){PAY.pay=v;if(v!=='現金')PAY.recv='';renderPay()}
function payRecv(v){PAY.recv=String(v);renderPay()}
function payChgText(){
  const total=payTotal();
  if(PAY.recv==='')return'$0';
  const c=(parseFloat(PAY.recv)||0)-total;
  return c>=0?'$'+c:'不足 $'+(-c);
}
function payCalc(){
  const t=$('payTotal');if(t)t.textContent='$'+payTotal();
  const el=$('payChg');if(el){el.textContent=payChgText();el.style.color=payChgText().startsWith('不足')?'var(--bad)':''}
}

  const tip=PAY.after?`<div class="modal-tip">📦 客人取餐中。請確認金額與付款方式（可修改<b>付款方式、折扣、折讓</b>），按下「<b>結帳</b>」後，這筆訂單就完成取餐並結束。若按「返回」，訂單會維持「待取餐」。</div>`
    :(o.paid?`<div class="modal-tip">此訂單已收款（${esc(o.pay||'')}${o.received?'，收 $'+o.received:''}），可重新結帳修改。</div>`:'');
  $('mBox').innerHTML=`
   <div class="oh"><h3>💰 結帳 #${esc(o.no)}　${esc(o.name)}</h3><button onclick="payBack()">返回</button></div>
   ${tip}
   <div class="fm-sec">${items}
    <div class="fm-line" style="border-top:1px dashed var(--ln);padding-top:8px"><span>小計金額</span><span>$${PAY.base}</span></div>
    <div class="fm-row"><b style="width:auto">折扣（%數）</b><input type="number" min="0" max="100" inputmode="decimal" value="${esc(PAY.pct)}" placeholder="100＝不打折" oninput="PAY.pct=this.value;payCalc()" onchange="renderPay()"><b style="width:auto">折讓（－$）</b><input type="number" min="0" inputmode="numeric" value="${esc(PAY.off)}" placeholder="0" oninput="PAY.off=this.value;payCalc()" onchange="renderPay()"></div>
    <div style="text-align:left;font-size:12px;color:var(--mu);line-height:1.5">折扣：打 9 折請輸入 90、打 85 折輸入 85；折讓是直接扣掉的金額。</div>
    <div class="fm-total"><span>應付總額</span><b id="payTotal">$${total}</b></div></div>
   <div class="fm-sec">
    <div class="fm-title">付款方式${o.pay&&o.pay!==PAY.pay?`（客人原選：${esc(o.pay)}）`:''}</div>
    <div class="chips">${['現金','轉帳','Linepay','全支付'].map(v=>`<button class="chip${PAY.pay===v?' on':''}" onclick="payMethod('${v}')">${v}</button>`).join('')}</div>
    ${cash?`<div class="fm-row"><b style="width:auto">收到金額</b><input id="payRecv" type="number" inputmode="numeric" value="${esc(PAY.recv)}" placeholder="輸入收到的金額" oninput="PAY.recv=this.value;payCalc()"></div>
     <div class="chips">${quick.map((v,i)=>`<button class="chip" onclick="payRecv(${v})">${i===0?'剛好 $'+v:'$'+v}</button>`).join('')}</div>
     <div class="fm-total"><span>找零</span><b id="payChg" style="${payChgText().startsWith('不足')?'color:var(--bad)':''}">${payChgText()}</b></div>`
     :`<div style="color:var(--mu);font-size:14px">${esc(PAY.pay)} 無需找零，確認款項已收到即可。</div>${PAY.pay==='轉帳'?bankBox(total):''}`}
   </div>
   <div class="m-btns"><button class="btn-cancel" onclick="payBack()">返回</button><button class="btn-confirm" id="payBtn" onclick="confirmPay()">結帳</button></div>`;
}
async function confirmPay(){
  const total=payTotal(),cash=PAY.pay==='現金',o=PAY.o;
  let recv=total;
  if(cash&&PAY.recv!==''){recv=parseFloat(PAY.recv);if(!(recv>=total)){alert('收到的金額不足 $'+total);return}}
  const chg=cash?recv-total:0;
  const data={pay:PAY.pay,paid:true,paidAt:Date.now(),received:recv,change:chg,total,discount:Math.max(0,PAY.base-total),updatedAt:Date.now()};
  if(o.lp==='pending')data.lp='staff';      // 店員手動結帳，不再等線上支付
  if(PAY.after||o.status==='done'){data.status='picked';data.pickedAt=Date.now()}    // 結帳＝客人取餐完成，訂單結束
  const b=$('payBtn');b.disabled=true;b.textContent='處理中…';
  try{
    await FB.update(FB.ref(FB.db,'orders/'+PAY.id),data);
    const adj=[],pct=parseFloat(PAY.pct)||100,off=parseFloat(PAY.off)||0;      // 單純結帳不記；有改付款方式、打折、折讓、金額才記
    if(PAY.pay!==(o.pay||''))adj.push(`付款方式 ${o.pay||'—'}→${PAY.pay}`);
    if(pct<100)adj.push(`折扣 ${pct}%`);
    if(off>0&&off!==(+o.discount||0))adj.push(`折讓 $${off}`);
    if(total!==(+o.total||0))adj.push(`金額 $${o.total}→$${total}`);
    if(adj.length)logAct('結帳調整',PAY.id,o.no,adj.join('｜'));
  }catch(e){alert('結帳失敗：'+(e.code||e.message));b.disabled=false;b.textContent='結帳';return}
  prnAfterPay({...o,...data,id:PAY.id});      // 結帳 → 自動印收據、現金彈開錢櫃（出單設定開啟才會做）
  $('mBox').innerHTML=`<div class="rc-done"><div class="ok">✅</div><h3>結帳完成 #${esc(o.no)}</h3>
    <div class="rc-row" style="justify-content:center;gap:8px"><span>${esc(PAY.pay)}</span><span style="color:var(--ac);font-weight:800">$${total}</span></div>
    ${cash?`<div class="rc-no">找零 $${chg}</div><div class="rc-row" style="justify-content:center;gap:8px"><span>收到</span><span>$${recv}</span></div>`:''}
    <div class="modal-tip" style="text-align:left;margin-top:10px">這筆訂單已結束。</div>
   </div><div class="m-btns"><button class="btn-confirm" onclick="openOrders()">完成</button></div>`;
}

/* ===== 出單機（POS 電腦用）=====
   做法：網頁把單據畫成圖片（中文不會亂碼）→ 交給這台電腦上的「出單小幫手」→ 用網路線送到出單機；現金結帳時順便彈開錢櫃。
   設定只存在「這台電腦」的瀏覽器（localStorage），其他手機／平板不會出單。 */
const PRN_DEF={on:false,url:'http://127.0.0.1:9101',kNew:true,rNew:false,drawerCash:true};
const prnCfg=()=>{try{return{...PRN_DEF,...JSON.parse(localStorage.getItem('prn_cfg')||'{}')}}catch(e){return{...PRN_DEF}}};
const prnCfgSave=c=>{try{localStorage.setItem('prn_cfg',JSON.stringify(c))}catch(e){}};
const PRN_W=576;                                   // 80mm 紙＝576 點
const PRN_FONT='"Noto Sans TC","Microsoft JhengHei","PingFang TC","Heiti TC",sans-serif';
const PRN_SZ={1:24,2:34,3:56};
function prnRender(rows){
  const mc=document.createElement('canvas').getContext('2d');
  const fnt=(s,b)=>(b?'700 ':'400 ')+(PRN_SZ[s]||24)+'px '+PRN_FONT;
  const wid=(t,s,b)=>{mc.font=fnt(s,b);return mc.measureText(t).width};
  const wrap=(t,s,b,max)=>{
    const out=[];let cur='';
    for(const ch of String(t)){
      if(ch==='\n'){out.push(cur);cur='';continue}
      if(cur&&wid(cur+ch,s,b)>max){out.push(cur);cur=ch}else cur+=ch;
    }
    out.push(cur);return out;
  };
  const ops=[];let y=6;
  rows.forEach(r=>{
    if(r.gap){y+=r.gap;return}
    if(r.dash){ops.push({k:'dash',y:y+6});y+=14;return}
    const s=r.s||1,b=!!r.b,lh=Math.round((PRN_SZ[s]||24)*1.35);
    if(r.l!==undefined){                           // 左右對齊：品名在左、金額在右
      const rw=wid(String(r.r||''),s,b);
      const lines=wrap(r.l,s,b,PRN_W-rw-12);
      lines.forEach((t,i)=>{ops.push({k:'t',t,x:0,y,s,b,a:'l'});if(i===0&&r.r!==undefined)ops.push({k:'t',t:String(r.r),x:PRN_W,y,s,b,a:'r'});y+=lh});
      return;
    }
    wrap(r.t,s,b,PRN_W).forEach(t=>{ops.push({k:'t',t,y,s,b,a:r.a||'l'});y+=lh});
  });
  y+=10;
  const cv=document.createElement('canvas');cv.width=PRN_W;cv.height=y;
  const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,PRN_W,y);c.fillStyle='#000';c.textBaseline='top';
  ops.forEach(o=>{
    if(o.k==='dash'){c.fillRect(0,o.y,PRN_W,2);return}
    c.font=fnt(o.s,o.b);
    if(o.a==='c'){c.textAlign='center';c.fillText(o.t,PRN_W/2,o.y)}
    else if(o.a==='r'){c.textAlign='right';c.fillText(o.t,PRN_W,o.y)}
    else{c.textAlign='left';c.fillText(o.t,0,o.y)}
  });
  return cv;
}
function prnBits(cv){                              // 畫布 → 1 位元黑白點陣（每列 72 bytes）
  const w=cv.width,h=cv.height,wb=w>>3,px=cv.getContext('2d').getImageData(0,0,w,h).data,out=new Uint8Array(wb*h);
  for(let yy=0;yy<h;yy++)for(let x=0;x<w;x++){
    const i=(yy*w+x)*4,lum=px[i]*.3+px[i+1]*.59+px[i+2]*.11;
    if(lum<170)out[yy*wb+(x>>3)]|=0x80>>(x&7);
  }
  return{w:wb,h,data:out};
}
function prnB64(u8){let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s)}
async function prnSend(path,body){
  const c=prnCfg(),ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),8000);
  try{
    const r=await fetch(c.url.replace(/\/$/,'')+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{}),signal:ctl.signal});
    const j=await r.json().catch(()=>({}));
    return(r.ok&&j.ok)?{ok:true}:{ok:false,err:j.err||('HTTP '+r.status)};
  }catch(e){return{ok:false,err:'連不到「出單小幫手」，請確認這台電腦上的小幫手視窗有開著'}}
  finally{clearTimeout(to)}
}
async function prnPrint(rows,opt){
  opt=opt||{};

}

/* ===== 自動出單的「補印佇列」：出單失敗（沒紙、卡紙、小幫手沒開、斷線…）的單會先存起來，恢復後自動補印，不會漏單 =====
   只有「自動出單」會進佇列；你手動按的 🖨 廚房單／🧾 收據 失敗時只提示，不進佇列（避免重複印）。 */
const PRNQ_MAX=40,PRNQ_TTL=3*3600000;
const prnqLoad=()=>{try{return JSON.parse(localStorage.getItem('prn_queue')||'[]')}catch(e){return[]}};
const prnqSave=q=>{try{localStorage.setItem('prn_queue',JSON.stringify(q.slice(-PRNQ_MAX)))}catch(e){}prnqUI()};
let prnFlushing=false;
function prnqUI(){
  let el=$('prnQ');const n=prnqLoad().length;
  if(!n){if(el)el.style.display='none';return}
  if(!el){
    el=document.createElement('div');el.id='prnQ';
    el.style.cssText='position:fixed;left:12px;bottom:12px;z-index:9999;background:#b45309;color:#fff;border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.5);display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:92vw';
    document.body.appendChild(el);
  }
  el.style.display='flex';
  el.innerHTML=`<span>🖨 有 ${n} 張單還沒印出來（會自動補印）</span><button class="chip sm" onclick="prnFlush(true)">立即補印</button><button class="chip sm" onclick="prnqClear()">清除</button>`;
}
function prnqClear(){if(!confirm('確定清除所有待補印的單？清除後不會再補印。'))return;prnqSave([])}
function prnEnqueue(jobs,err){
  const q=prnqLoad(),now=Date.now();
  jobs.forEach(j=>q.push({label:j.label,rows:j.rows,at:now}));
  prnqSave(q);
  if(err)toast(`🖨 出單失敗（${err}）：已加入補印佇列，恢復後會自動補印`,()=>{});
}
async function prnFlush(manual){
  if(prnFlushing)return;
  let q=prnqLoad();if(!q.length)return;
  if(!prnCfg().on){if(manual)toast('🖨 出單機尚未啟用',()=>{});return}
  prnFlushing=true;
  try{
    const now=Date.now(),old=q.filter(x=>now-x.at>PRNQ_TTL).length;
    q=q.filter(x=>now-x.at<=PRNQ_TTL);prnqSave(q);
    if(old)toast(`🖨 有 ${old} 張超過 3 小時沒印出的單已略過`,()=>{});
    let ok=0;
    while(q.length){
      const r=await prnPrint(q[0].rows);
      if(!r.ok){if(manual)toast('🖨 還是印不出來：'+r.err,()=>{});break}
      q.shift();ok++;prnqSave(q);
    }
    if(ok)toast(`🖨 已補印 ${ok} 張${q.length?`，還剩 ${q.length} 張`:''}`,()=>{});
  }finally{prnFlushing=false}
}
/* 一批訂單的自動出單：照設定印廚房單／收據；有一張失敗，這張和後面的都進佇列（順序不亂） */
async function prnAutoOrders(orders){
  const c=prnCfg();if(!c.on||(!c.kNew&&!c.rNew))return;
  const jobs=[];
  orders.forEach(o=>{
    if(c.kNew)jobs.push({label:'廚房單 #'+o.no,rows:prnKitchenRows(o)});
    if(c.rNew)jobs.push({label:'收據 #'+o.no,rows:prnReceiptRows(o)});
  });
  if(prnqLoad().length||prnFlushing){prnEnqueue(jobs);prnFlush();return}   // 前面還有沒印的，排在後面
  for(let i=0;i<jobs.length;i++){
    const r=await prnPrint(jobs[i].rows);
    if(!r.ok){prnEnqueue(jobs.slice(i),r.err);return}
  }
}

const incPlain=x=>{try{return(x.inc!=null?x.inc:(()=>{const id=baseId(x.id);return incText(find(id),catOf(id))})())||''}catch(e){return''}};
const prnPayTxt=o=>o.paid?('已付款（'+(o.pay||'')+'）'):('未付款（'+(o.pay||'')+'）');
/* 廚房單：大字、重點是品項與數量 */
function prnKitchenRows(o){
  const R=[],P=peopleOf(o);
  R.push({t:'廚房單',s:2,b:true,a:'c'},{t:'#'+o.no,s:3,b:true,a:'c'},{t:'取餐 '+(o.time||''),s:2,b:true,a:'c'});
  R.push({t:((o.src&&o.src!=='線上')?o.src:'線上')+'　'+prnPayTxt(o)+(o.late?'　【補單】':''),s:1,a:'c'},{dash:1});
  const addItems=(items)=>items.forEach(x=>{
    R.push({t:x.name+'  ×'+x.qty,s:2,b:true});
    const inc=incPlain(x);if(inc)R.push({t:'　└ '+inc,s:1});
  });
  if(P){P.forEach(pp=>{
    R.push({t:'【'+(pp.name||'')+'】'+[pp.flavor,pp.spice,pp.salt].filter(Boolean).join(' / '),s:1,b:true});
    if(pp.note)R.push({t:'備註：'+pp.note,s:1});
    addItems(pp.items);R.push({gap:6});
  })}else{
    addItems(o.items||[]);
    const opt=[o.flavor,o.spice,o.salt].filter(Boolean).join(' / ');
    const g=(o.gear||[]).length?'配備：'+o.gear.join('、'):'';
    if(opt||g)R.push({gap:4},{t:[opt,g].filter(Boolean).join('　'),s:2,b:true});
    if(o.note)R.push({t:'備註：'+o.note,s:2,b:true});
  }
  R.push({dash:1});
  if(P){
    if((o.gear||[]).length)R.push({t:'配備：'+o.gear.join('、'),s:2,b:true});
    if(o.note)R.push({t:'備註：'+o.note,s:2,b:true});
  }
  R.push({t:[o.name,o.phone].filter(Boolean).join('　'),s:1},{t:'列印 '+fmtDT(Date.now()),s:1,a:'r'});
  return R;
}
/* 收據：有單價、小計、折扣、付款方式、找零 */
function prnReceiptRows(o){
  const R=[],P=peopleOf(o),sub=(o.items||[]).reduce((a,x)=>a+(+x.price||0)*(+x.qty||0),0);
  R.push({t:'去中心鹹水雞 X 厝邊溫食',s:2,b:true,a:'c'},{t:'收　據',s:1,a:'c'},{gap:4},{t:'#'+o.no+'　取餐 '+(o.time||''),s:2,b:true,a:'c'});
  R.push({t:((o.src&&o.src!=='線上')?o.src:'線上')+'　'+fmtDT(o.paidAt||o.createdAt||Date.now())+(o.late?'　【補單】':''),s:1,a:'c'},{dash:1});
  const addItems=(items)=>items.forEach(x=>{
    R.push({l:x.name+' ×'+x.qty,r:'$'+((+x.price||0)*(+x.qty||0)),s:2,b:true});
    const inc=incPlain(x);if(inc)R.push({t:'　└ '+inc,s:1});
  });
  if(P){P.forEach(pp=>{
    R.push({t:'【'+(pp.name||'')+'】'+[pp.flavor,pp.spice,pp.salt].filter(Boolean).join(' / '),s:1,b:true});
    if(pp.note)R.push({t:'備註：'+pp.note,s:1});
    addItems(pp.items);R.push({gap:6});
  })}else{
    addItems(o.items||[]);
    const opt=[o.flavor,o.spice,o.salt].filter(Boolean).join(' / ');
    const g=(o.gear||[]).length?'配備：'+o.gear.join('、'):'';
    if(opt||g)R.push({gap:4},{t:[opt,g].filter(Boolean).join('　'),s:2,b:true});
    if(o.note)R.push({t:'備註：'+o.note,s:2,b:true});
  }
  if(P){
    if((o.gear||[]).length)R.push({t:'配備：'+o.gear.join('、'),s:2,b:true});
    if(o.note)R.push({t:'備註：'+o.note,s:2,b:true});
  }
  R.push({dash:1},{l:'小計',r:'$'+(o.subtotal!=null?o.subtotal:sub),s:1});
  const adj=(+o.extra||0)-(+o.discount||0);
  if(adj)R.push({l:adj>0?'加價':'折扣／折讓',r:(adj>0?'+':'-')+'$'+Math.abs(adj),s:1});
  R.push({l:'應付總額',r:'$'+o.total,s:2,b:true},{gap:4},{l:'付款方式',r:(o.pay||'')+(o.paid?'（已收）':'（未收）'),s:1});
  if(o.pay==='現金'&&o.received!=null)R.push({l:'收到',r:'$'+o.received,s:1},{l:'找零',r:'$'+(o.change||0),s:1});
  R.push({t:[o.name,o.phone].filter(Boolean).join('　'),s:1},{dash:1},{t:'謝謝光臨，歡迎再來！',s:1,a:'c'});
  return R;
}

async function lpGo(id,o){

  let r=null;
  for(let n=0;n<3;n++){                                   // 網路不穩、系統忙碌時自動再試（最多 3 次），不用顧客自己重按
    try{
      const res=await fetch(LINE_HOOK,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({type:'lpPay',id,adm:isAdmin})});

/* ===== 收銀盤點 / 日報表 / 彙整匯出 ===== */
const DENOMS=[1000,500,100,50,10,5,1];
const EXP_TYPES=[['進貨','採購支出'],['雜支','雜支開銷'],['退款','退款'],['其他','其他支出'],['存鈔','存鈔'],['補入','補鈔']];
const expLabel=k=>(EXP_TYPES.find(x=>x[0]===k)||[k,k])[1];
const dayStartMs=day=>new Date(+day.slice(0,4),+day.slice(4,6)-1,+day.slice(6,8),2,0,0,0).getTime();
const dayPlain=day=>day.slice(0,4)+'/'+day.slice(4,6)+'/'+day.slice(6,8);
const dayWeek=day=>'週'+'日一二三四五六'[new Date(dayStartMs(day)).getDay()];
const dayLabel=day=>dayPlain(day)+'（'+dayWeek(day)+'）';
const shiftDay=(day,n)=>{const d=new Date(dayStartMs(day));d.setDate(d.getDate()+n);return d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())};

async function fetchDayOrders(day){
  const a=dayStartMs(day),b=a+86400000-1;
  const sn=await FB.get(FB.query(FB.ref(FB.db,'orders'),FB.orderByChild('createdAt'),FB.startAt(a),FB.endAt(b)));
  return Object.values(sn.val()||{});
}
function salesOf(list){
  const ok=list.filter(o=>o.status!=='cancelled');
  const r={count:ok.length,voided:list.length-ok.length,revenue:0,cash:0,transfer:0,linepay:0,allpay:0,unpaidN:0,unpaid:0};
  ok.forEach(o=>{
    const t=+o.total||0;r.revenue+=t;
    if(!o.paid){r.unpaidN++;r.unpaid+=t;return}
    if(o.pay==='現金')r.cash+=t;else if(o.pay==='轉帳')r.transfer+=t;else if(o.pay==='Linepay')r.linepay+=t;else if(o.pay==='全支付')r.allpay+=t;
  });
  return r;
}
function calcDay(cb,sales){
  const exps=Object.values(cb.expenses||{});
  const sum=f=>exps.filter(f).reduce((a,e)=>a+(+e.amount||0),0);
  const expense=sum(e=>e.type!=='存鈔'&&e.type!=='補入'),deposit=sum(e=>e.type==='存鈔'),topup=sum(e=>e.type==='補入');
  const hasOpen=!!cb.open,hasClose=!!cb.close,open=hasOpen?(+cb.open.total||0):0;
  const expected=open+sales.cash+topup-expense-deposit;
  const close=hasClose?(+cb.close.total||0):null;
  return{expense,deposit,topup,hasOpen,hasClose,open,expected,close,diff:hasClose?Math.round((close-expected)*100)/100:null};
}

/* --- 手續費、彙整計算、月報表 --- */
const FEES={Linepay:0.023,'全支付':0.02};   // ← 手續費率：Linepay 2.3%、全支付 2%（日後費率改了，改這一行）
const feeOf=(k,amt)=>Math.round((+amt||0)*(FEES[k]||0));
const rateTxt=k=>(FEES[k]*100).toFixed((FEES[k]*100)%1?1:0)+'%';
const feesOf=sales=>{const fl=feeOf('Linepay',sales.linepay),fa=feeOf('全支付',sales.allpay);return{fl,fa,fee:fl+fa,net:(+sales.revenue||0)-fl-fa}};
function figsFrom(orders,all,filter){
  const by={};
  orders.forEach(o=>{if(!o||!o.createdAt)return;const d=bizDay(o.createdAt);(by[d]=by[d]||[]).push(o)});
  const days=[...new Set([...Object.keys(by),...Object.keys(all)])].filter(d=>/^\d{8}$/.test(d)&&(!filter||filter(d))).sort();
  return days.map(day=>{
    const cb=all[day]||{},sales=(cb.summary&&cb.summary.manual)?cb.summary:salesOf(by[day]||[]);
    return{day,cb,sales,c:calcDay(cb,sales),...feesOf(sales),hasCb:!!all[day]};
  });
}
function monthAgg(figs){
  const t={days:0,count:0,voided:0,revenue:0,cash:0,transfer:0,linepay:0,allpay:0,unpaid:0,fl:0,fa:0,fee:0,net:0,expense:0,deposit:0,topup:0,diff:0,diffDays:0};
  figs.forEach(f=>{
    const s=f.sales;if(s.count>0)t.days++;
    t.count+=s.count;t.voided+=s.voided;t.revenue+=s.revenue;t.cash+=s.cash;t.transfer+=s.transfer;t.linepay+=s.linepay;t.allpay+=s.allpay;t.unpaid+=s.unpaid;
    t.fl+=f.fl;t.fa+=f.fa;t.fee+=f.fee;t.net+=f.net;t.expense+=f.c.expense;t.deposit+=f.c.deposit;t.topup+=f.c.topup;
    if(f.c.hasOpen&&f.c.hasClose){t.diff+=f.c.diff;t.diffDays++}
  });
  return t;
}

let CASH={day:'',data:{},tab:null,cnt:null,ex:{type:'雜支',amount:'',note:''}};
async function openCash(day,tab){

async function reloadCash(){
  try{const sn=await FB.get(FB.ref(FB.db,'cashbook/'+CASH.day));CASH.data=sn.val()||{}}
  catch(e){CASH.data={};alert('讀取收銀資料失敗：'+(e.code||e.message))}

function cashDay(v){const d=String(v).replace(/-/g,'');if(/^\d{8}$/.test(d))openCash(d,CASH.tab)}
function cashTab(k){CASH.tab=k;CASH.cnt=null;CASH.inh='';renderCash()}
function cntInit(kind){const src=((CASH.data||{})[kind]||{}).counts||{};CASH.cnt={};DENOMS.forEach(d=>CASH.cnt[d]=(+src['d'+d]||0)*d)}   // CASH.cnt[面額] ＝ 這個面額的「金額」

const cntNote=d=>{const a=CASH.cnt[d]||0;return a%d===0?`＝ ${a/d} ${d>=100?'張':'枚'}`:`⚠ 需為 ${d} 的倍數`};

/* 開店盤點：直接帶入「前一次」收店盤點的張數（遇到公休日會往前找，最多 14 天） */
async function inheritClose(){
  let d=CASH.day,found=null;
  try{
    for(let i=0;i<14&&!found;i++){
      d=shiftDay(d,-1);
      const sn=await FB.get(FB.ref(FB.db,'cashbook/'+d+'/close'));
      if(sn.exists())found={day:d,rec:sn.val()};
    }
    if(!found){alert('往前 14 天內找不到收店盤點紀錄');return}
    let moved=0;                                   // 這段期間（收店後到今天開店前）另外有的支出、存鈔
    for(let k=shiftDay(found.day,1);k<CASH.day;k=shiftDay(k,1)){
      const ex=(await FB.get(FB.ref(FB.db,'cashbook/'+k+'/expenses'))).val()||{};
      Object.values(ex).forEach(e=>{moved+=(+e.amount||0)});
    }
    if(!CASH.cnt)cntInit('open');
    DENOMS.forEach(x=>{CASH.cnt[x]=(+((found.rec.counts||{})['d'+x])||0)*x});
    CASH.inh=`已帶入 ${dayLabel(found.day)} 的收店盤點 $${found.rec.total}（${fmtDT(found.rec.at)}）。${moved?`<b>這段期間另有支出／存鈔共 $${moved}</b>，如果錢已經從收銀機拿出去，請把張數修正後再儲存。`:''}確認無誤後按「儲存開店盤點」。`;
  }catch(e){alert('讀取失敗：'+(e.code||e.message));return}
  renderCash();
}
async function saveCount(kind){
  const bad=DENOMS.filter(d=>(CASH.cnt[d]||0)%d!==0);
  if(bad.length){alert('下面的金額不是該面額的倍數，請檢查：\n'+bad.map(d=>`$${d} 的金額 ${CASH.cnt[d]}`).join('\n'));const el=$('ca'+bad[0]);if(el)el.focus();return}
  const total=cashTotal(),counts={};DENOMS.forEach(d=>counts['d'+d]=(CASH.cnt[d]||0)/d);
  const old=CASH.data[kind],nm=kind==='open'?'開店':'收店';
  if(total===0&&!confirm(`${nm}盤點合計是 $0，確定要儲存嗎？`))return;
  const b=$('cashSave');b.disabled=true;b.textContent='儲存中…';
  try{
    await FB.set(FB.ref(FB.db,'cashbook/'+CASH.day+'/'+kind),{counts,total,at:Date.now(),by:whoAmI()});
    logAct(nm+'盤點',null,'',`${dayPlain(CASH.day)} 合計 $${total}${old?'（原 $'+old.total+'）':''}`);
  }catch(e){alert('儲存失敗：'+(e.code||e.message));b.disabled=false;b.textContent='儲存'+nm+'盤點';return}
  CASH.tab=kind==='open'?'exp':'close';
  toast(`✅ ${nm}盤點已儲存：$${total}`+(kind==='close'&&isManager()?'　可到「後台管理 → 日報表」查看差額':''));
  await reloadCash();
}

let CB_ALL=null,CB_ALL_AT=0;
function exQ(v){CASH.q=v;clearTimeout(window._exqT);window._exqT=setTimeout(exQRender,250)}
async function exQRender(){
  const box=$('exqr');if(!box)return;
  const terms=sqNorm(CASH.q).split(' ').filter(Boolean);
  if(!terms.length){box.innerHTML='';return}
  if(!CB_ALL||Date.now()-CB_ALL_AT>30000){
    box.innerHTML='<div style="text-align:center;color:var(--mu);padding:14px">搜尋中…</div>';
    try{CB_ALL=(await FB.get(FB.ref(FB.db,'cashbook'))).val()||{};CB_ALL_AT=Date.now()}catch(e){box.innerHTML='<div style="color:var(--bad);padding:12px">讀取失敗：'+esc(e.code||e.message)+'</div>';return}
    if(sqNorm(CASH.q)!==terms.join(' '))return;
  }
  const R=[];
  Object.keys(CB_ALL).sort().reverse().forEach(day=>Object.entries((CB_ALL[day]||{}).expenses||{}).forEach(([id,e])=>{
    if(!e)return;
    const t=sqNorm([expLabel(e.type),e.type,e.note,e.by,e.amount,day,dayLabel(day)].join(' '));
    if(terms.every(w=>t.includes(w)))R.push({day,id,e});
  }));
  const tot=R.reduce((a,r)=>a+(r.e.type==='存鈔'||r.e.type==='補入'?0:(+r.e.amount||0)),0);
  box.innerHTML=R.length?`<div class="fm-line"><span>找到 <b>${R.length}</b> 筆（所有日期）</span><span>支出合計 <b>$${tot}</b>（不含存鈔、補鈔）</span></div><div class="tbw"><table style="min-width:560px"><thead><tr><th>日期</th><th>類別</th><th>金額</th><th>說明</th><th>登錄人</th><th></th></tr></thead><tbody>${R.map(r=>`<tr><td>${esc(dayLabel(r.day))}</td><td>${esc(expLabel(r.e.type))}</td><td>$${r.e.amount}</td><td>${esc(r.e.note||'')}</td><td>${esc(r.e.by||'')}</td><td><button class="chip sm" onclick="CASH.q='';cashDay('${r.day}')">前往這天</button></td></tr>`).join('')}</tbody></table></div>`:'<div style="text-align:center;color:var(--mu);padding:16px">所有日期都找不到符合的紀錄</div>';
}
