/* 說明欄打過的字會記住（連同上次的金額），下次打幾個字就跳出來，選了還會自動帶入金額。記在這台裝置上 */
const expMemo=()=>{try{return JSON.parse(localStorage.getItem('exp_memo')||'{}')}catch(e){return{}}};
function expMemoAdd(note,amt){
  note=(note||'').trim();if(!note||note.length>60)return;
  try{const m=expMemo();delete m[note];m[note]=amt;const ks=Object.keys(m);ks.slice(0,Math.max(0,ks.length-80)).forEach(k=>delete m[k]);localStorage.setItem('exp_memo',JSON.stringify(m))}catch(e){}
}
function exNoteIn(v){
  const m=expMemo(),a=$('exAmt');
  if(a&&!a.value&&m[v.trim()]>0){a.value=m[v.trim()];CASH.ex.amount=a.value}
}
const isLegacyBuy=e=>!(e.plan)&&/^【採購】/.test(e.note||'');
function setExType(k){
  CASH.ex.type=k;
  document.querySelectorAll('#exChips .chip').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
}
function refreshExpList(){const el=$('expList');if(el)el.innerHTML=expListHtml()}
async function addExpense(){
  const amt=parseFloat(CASH.ex.amount);
  if(!(amt>0)){alert('請輸入大於 0 的金額');const el=$('exAmt');if(el)el.focus();return}
  const rec={at:Date.now(),type:CASH.ex.type,amount:amt,note:CASH.ex.note.trim(),by:whoAmI()};
  const nref=FB.push(FB.ref(FB.db,'cashbook/'+CASH.day+'/expenses'));
  try{await FB.set(nref,rec)}
  catch(e){alert('新增失敗：'+(e.code||e.message));return}
  expMemoAdd(rec.note,rec.amount);
  logAct('收銀'+(rec.type==='存鈔'?'存鈔':rec.type==='補入'?'補入':'支出'),null,'',`${expLabel(rec.type)} $${amt}${rec.note?'｜'+rec.note:''}`);
  (CASH.data.expenses=CASH.data.expenses||{})[nref.key]=rec;      // 直接加進畫面上的清單，不重新整頁
  CASH.ex.amount='';CASH.ex.note='';
  const a=$('exAmt'),n=$('exNote');
  if(a)a.value='';if(n)n.value='';
  refreshExpList();
  if(a)a.focus();
}
async function editExpense(id){
  if(!isManager())return;
  const e=(CASH.data.expenses||{})[id];if(!e)return;
  if(e.plan||String(id).startsWith('plan_')){      // 採購清單自動算入的支出：要改群組、品項、單項金額、備註，請到採購清單改（這裡改了會被清單蓋回去）
    if(confirm('這筆是由「採購清單」自動算入的。\n\n要修改群組、品項、單項金額或備註，請到採購清單改，這裡會自動同步。\n\n現在前往 '+dayLabel(CASH.day)+' 的採購清單嗎？'))openPlan(CASH.day);
    return;
  }
  if(isLegacyBuy(e)){await convertLegacyBuy(id,e);return}
  const a=prompt('修改金額',e.amount);if(a===null)return;
  const amt=parseFloat(a);if(!(amt>0)){alert('金額不正確');return}
  const n=prompt('修改說明',e.note||'');if(n===null)return;
  try{await FB.update(FB.ref(FB.db,'cashbook/'+CASH.day+'/expenses/'+id),{amount:amt,note:n.trim()})}
  catch(er){alert('修改失敗：'+(er.code||er.message));return}
  logAct('修改收銀紀錄',null,'',`${expLabel(e.type)} $${e.amount}→$${amt}`);
  expMemoAdd(n,amt);e.amount=amt;e.note=n.trim();refreshExpList();
}
/* 舊版留下的「【採購】…」紀錄：轉成採購清單裡的群組＋品項，之後就能改群組、品項、單項金額、備註（品項／單位／單價／備註會記進常用，下次直接帶出）。總金額不變 */
function splitBuy(s){const out=[];let d=0,cur='';for(const ch of s){if(ch==='（'||ch==='(')d++;else if(ch==='）'||ch===')')d=Math.max(0,d-1);if(ch==='、'&&d===0){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out.map(x=>x.trim()).filter(Boolean)}
function parseBuy(t){
  let note='';const m=t.match(/[（(]([^）)]*)[）)]\s*$/);if(m){note=m[1];t=t.slice(0,m.index).trim()}
  const q=t.match(/^(.*?)\s+(\d+(?:\.\d+)?)\s*([^\s\d]*)$/);
  return q?{name:q[1].trim(),qty:q[2],unit:q[3]||'',note}:{name:t.trim(),qty:'',unit:'',note};
}
async function convertLegacyBuy(id,e){
  const m=(e.note||'').match(/^【採購】(.*?)[｜|](.*)$/),gname=(m?m[1]:'採購').trim(),rest=m?m[2]:'',day=CASH.day;
  if(!confirm(`這筆是舊版的採購紀錄（${gname} $${e.amount}），沒辦法直接改品項。\n\n要轉成「採購清單」嗎？\n・總金額不變（$${e.amount}）\n・轉完就能改群組、品項、單項金額、備註\n・各品項金額先用「常用品項」記住的單價算；算不出來的部分，先放在該群組的「其他費用」\n・之後請把各品項金額填進去，並把「其他費用」改成剩下的差額（或清成 0），總額才會對`))return;
  try{
    await planLoad(day);
    let cid=Object.keys(PLAN.catalog).find(k=>PLAN.catalog[k].name===gname);
    if(!cid){const r=FB.push(FB.ref(FB.db,'shopCatalog'));cid=r.key;PLAN.catalog[cid]={name:gname,o:Date.now(),items:{}};await FB.set(r,{name:gname,o:Date.now()})}
    const cat=PLAN.catalog[cid];cat.items=cat.items||{};
    const ex=PLAN.groups[cid];
    if(ex&&gBought(ex)>0){      // 這天的清單已經有這個群組而且有算入支出：舊紀錄是重複的，改由清單那筆為準
      if(!confirm(`這天的採購清單裡已經有「${gname}」（已採購 ${money(gBought(ex))}）。\n\n要刪掉這筆舊紀錄，以清單為準嗎？（避免同一筆算兩次）`))return;
      await FB.remove(FB.ref(FB.db,'cashbook/'+day+'/expenses/'+id));
      delete CASH.data.expenses[id];await syncPlanExpense(cid);logAct('採購紀錄轉清單',null,'',`${gname} 以清單為準`);
      openPlan(day);return;
    }
    const g=ex||{name:gname,cid,amount:0,items:{}};g.items=g.items||{};
    const added=[];let sum=0;
    for(const t of splitBuy(rest)){
      if(t==='（其他費用）')continue;
      const p=parseBuy(t);if(!p.name)continue;
      if(Object.values(g.items).some(x=>x.name===p.name))continue;
      let iid=Object.keys(cat.items).find(k=>cat.items[k].name===p.name);
      if(!iid){const r=FB.push(FB.ref(FB.db,'shopCatalog/'+cid+'/items'));iid=r.key;cat.items[iid]={name:p.name,unit:p.unit,price:0,note:p.note,o:Date.now()};await FB.set(r,cat.items[iid])}
      const ci=cat.items[iid],price=+ci.price||0,q=parseFloat(p.qty)||0,amt=(q&&price)?r2(q*price):0;
      g.items[iid]={name:p.name,qty:p.qty,unit:p.unit||ci.unit||'',price,amount:amt,manual:false,note:p.note,done:true};
      sum+=amt;added.push(iid);
    }
    let rest$=r2((+e.amount||0)-sum);
    if(rest$<0){added.forEach(i=>{g.items[i].amount=0});rest$=r2(+e.amount||0)}
    g.amount=r2((+g.amount||0)+rest$);g.expAt=g.expAt||e.at;
    await FB.set(FB.ref(FB.db,'shopPlan/'+day+'/'+cid),g);
    PLAN.groups[cid]=g;
    await syncPlanExpense(cid);
    await FB.remove(FB.ref(FB.db,'cashbook/'+day+'/expenses/'+id));
    delete CASH.data.expenses[id];
    logAct('採購紀錄轉清單',null,'',`${gname} $${e.amount}`);
  }catch(er){alert('轉換失敗：'+(er.code||er.message));return}
  toast('✅ 已轉成採購清單。請填各品項金額，並把該群組的「其他費用」改成剩下的差額（或清成 0）');
  openPlan(day);
}

  if(e.plan||String(id).startsWith('plan_')){

/* ===== 採購清單：先列好明天要買的東西；品項記住「單位、單價」，點選後只要輸入數量，金額自動算好並直接算入當天支出 ===== */
/* ===== 每份克數計算（品項管理 → 獨立頁面）=====
   品項＝採購清單的「常用群組／常用品項」（shopCatalog），新增／改名／刪除後重新打開本頁就同步。
   買價：優先帶入採購清單最近一次的備註（例如「1斤30」「100克15」「30元/斤」），其次單價＋單位；也可手動輸入並記住。
   售價：連結菜單品項（可改），或手動輸入。成本率預設 30%，可全部調、也可單項調。
   公式：每份克數 ＝ 售價 × 成本率 ÷ 每克買價（四捨五入成整數）。設定存在 shopMeta/gram、shopMeta/gramCr。 */
const GU={'斤':600,'公斤':1000,'克':1,'兩':37.5};
const GU_OPT=['斤','公斤','克','兩'];
const gUnitNorm=u=>({'台斤':'斤','公克':'克','kg':'公斤','KG':'公斤','g':'克','G':'克'}[u]||u);
const gCn=s=>({'一':1,'二':2,'兩':2,'三':3,'四':4,'五':5,'半':0.5}[s]||+s);
function gramParseNote(t){
  t=String(t||'').replace(/[，,]/g,' ');
  const U='公斤|台斤|公克|kg|KG|斤|克|g|G';
  let m=t.match(new RegExp('(\\d+(?:\\.\\d+)?)\\s*元?\\s*[\\/／每]\\s*(\\d+(?:\\.\\d+)?|[一二兩三四五半])?\\s*('+U+')'));
  if(m){const q=m[2]?gCn(m[2]):1,p=+m[1];if(p>0&&q>0)return{q,u:gUnitNorm(m[3]),p}}
  m=t.match(new RegExp('(\\d+(?:\\.\\d+)?|[一二兩三四五半])?\\s*('+U+')\\s*[\\/／=＝:：]?\\s*(?:約|共|\\$|＄|NT)?\\s*(\\d+(?:\\.\\d+)?)(?![\\d.])(?=\\s|元|塊|$|[，,;；、(（])(?!\\s*(?:公斤|台斤|公克|kg|KG|斤|克|g|G|兩|顆|包|條|個))'));
  if(m){const q=m[1]?gCn(m[1]):1,p=+m[3];if(p>0&&q>0)return{q,u:gUnitNorm(m[2]),p}}
  return null;
}
function gramDerive(i){
  const n=gramParseNote(i.note);
  if(n)return{...n,src:'備註「'+String(i.note).trim().slice(0,24)+'」'};
  const u=gUnitNorm(String(i.unit||'').trim());
  if(GU[u]&&+i.price>0)return{q:1,u,p:+i.price,src:'單價 $'+i.price+'／'+u};
  if(GU[u]&&+i.qty>0&&+i.amount>0)return{q:+i.qty,u,p:+i.amount,src:'金額 $'+i.amount+'（'+i.qty+u+'）'};
  return null;
}
function gramBuildAuto(plan){
  const A={};
  Object.keys(plan||{}).sort().reverse().forEach(day=>{
    Object.values(plan[day]||{}).forEach(g=>{
      Object.values((g&&g.items)||{}).forEach(i=>{
        if(!i||!i.name||A[i.name])return;
        const d=gramDerive(i);if(d){d.day=day;A[i.name]=d}
      });
    });
  });
  return A;
}

    (c.items||[]).forEach(it=>{if(!(it.d&&it.d.length))L.push({id:it.id,name:it.name,price:+it.price||0,grp:t})});

  return L;
}

function gramEff(iid,name){
  const g=GR.meta[iid]||{},a=GR.auto[name];
  if(+g.p>0&&(!a||a.day<=(g.ad||'')))return{p:+g.p,q:+g.q||1,u:g.u||'斤',src:'手動輸入'};
  if(a)return{p:a.p,q:a.q,u:a.u,src:planMD(a.day)+' 採購'+a.src};
  return null;
}
function gramSell(iid,name){
  const g=GR.meta[iid]||{},L=GR.menu;
  if(+g.sell>0)return{v:+g.sell,src:'手動輸入'};
  let m=g.mid&&L.find(x=>x.id===g.mid);
  if(!m)m=L.find(x=>x.name===name);
  if(!m&&name.length>=2){const c=L.filter(x=>x.name.includes(name));if(c.length===1)m=c[0]}
  return m?{v:m.price,src:'菜單「'+m.name+'」',mid:m.id}:null;
}

let CT={tab:'cost',q:'',grp:'',open:'',day:''};
const ptN=(n,d)=>{if(n==null||isNaN(n))return'—';const k=Math.pow(10,d==null?1:d);return String(Math.round(n*k)/k)};
const ptDash=d=>d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8);
const ptMD=d=>d.slice(4,6)+'/'+d.slice(6,8);
const CT_MODES=[['w','依重量（克）'],['n','整包拆小單位'],['s','幾包分幾份'],['c','由整隻拆分'],['u','只記買價']];
function ptRows(){
  const R=[],plan=GR.plan||{};
  Object.keys(plan).sort().forEach(day=>{
    Object.entries(plan[day]||{}).forEach(([gid,g])=>{
      if(!g||!g.items)return;
      const cid=g.cid,cg=GR.cat[cid]||{},gn=cg.name||g.name||'其他';
      Object.entries(g.items).forEach(([iid,it])=>{
        if(!it||!it.name)return;
        const qn=parseFloat(it.qty)||0,pr=+it.price||0,amount=+it.amount||(qn&&pr?r2(qn*pr):0);
        const d=gramDerive(it);
        if(!amount&&!d&&!it.done)return;
        R.push({day,gid,cid,iid,grp:gn,go:+cg.o||0,io:+((cg.items||{})[iid]||{}).o||0,name:it.name,qty:it.qty||'',qn,unit:it.unit||'',price:pr,amount,note:it.note||'',d,done:!!it.done});
      });
    });
  });
  return R;
}
/* 單位別名：kg／公斤／千克 → 公斤；g／公克 → 克；台斤／市斤 → 斤；其餘原樣 */
function ctUnitNorm(u){
  u=String(u||'').trim();const l=u.toLowerCase();
  if(['kg','kgs','公斤','千克','公kg'].includes(l))return'公斤';
  if(['g','公克','克'].includes(l))return'克';
  if(['台斤','市斤','斤'].includes(l))return'斤';
  if(['兩','两','台兩'].includes(l))return'兩';
  return u;
}
/* 每份用量：可以打「150」（克）、「0.15公斤」、「0.25斤」、「100g」，一律換成克存起來 */
async function ctSaveSg(iid,v){
  v=String(v||'').trim();
  if(!v){await gramPatch(iid,{sg:null});ctKeep();return}
  const m=v.match(/^([0-9]*\.?[0-9]+)\s*(.*)$/);
  if(!m){alert('請輸入數字，例如 150、0.15公斤');ctKeep();return}
  const u=ctUnitNorm(m[2]||'克');let g=parseFloat(m[1]);
  if(!GU[u]){alert('單位請用 克／公斤／斤／兩（例如 0.15公斤）');ctKeep();return}
  g=Math.round(g*GU[u]*100)/100;
  await gramPatch(iid,{sg:g>0?g:null});ctKeep();
}
function ctCatItem(iid){for(const c of Object.values(GR.cat||{})){const i=(c.items||{})[iid];if(i)return i}return null}
/* 重量品項的買價：手動輸入／最新採購進貨的備註；都沒有就用採購支出常用品項裡的單價＋單位（單位是 斤/公斤/克/兩 才算） */
function ctEffW(iid,name){
  const e=gramEff(iid,name);if(e)return e;
  const ci=ctCatItem(iid);
  if(ci&&+ci.price>0&&GU[ctUnitNorm(ci.unit)])return{p:+ci.price,q:1,u:ctUnitNorm(ci.unit),src:'採購支出的單價'};
  return null;
}
function ctMode(iid){
  const g=GR.meta[iid]||{};if(g.mode)return g.mode;
  const ci=ctCatItem(iid);
  if(!GR.auto[(ci||{}).name||'']&&ci&&ci.unit&&!GU[ci.unit])return'u';
  return'w';
}
function ctIdx(){const m={};ptRows().forEach(r=>{(m[r.iid]=m[r.iid]||[]).push(r)});Object.values(m).forEach(L=>L.sort((a,b)=>a.day.localeCompare(b.day)));return m}
/* 最新一次採購進貨的「每個單位多少錢」（盒、包、隻…；有單價用單價，沒有就用 金額÷數量） */
function ctUnitAuto(L){
  for(let i=(L||[]).length-1;i>=0;i--){const r=L[i],p=r.price>0?r.price:(r.qn>0&&r.amount>0?r.amount/r.qn:0);if(p>0)return{p,u:r.unit,day:r.day}}
  return null;
}
function ctUnit(iid,idx){
  const g=GR.meta[iid]||{},a=ctUnitAuto(idx[iid]);
  if(+g.pp>0&&(!a||a.day<=(g.ppd||'')))return{p:+g.pp,u:g.pu||(a&&a.u)||'',src:'手動輸入',auto:a};
  if(a)return{p:a.p,u:g.pu||a.u,src:ptMD(a.day)+' 採購進貨',auto:a};
  const ci=ctCatItem(iid);
  if(ci&&+ci.price>0)return{p:+ci.price,u:g.pu||ci.unit||'',src:'採購支出的單價',auto:null};
  return null;
}
function ctSiblings(par){return Object.entries(GR.meta).filter(([k,m])=>m&&m.mode==='c'&&m.par===par&&+m.cnt>0)}
function ctShare(iid){
  const g=GR.meta[iid]||{};if(+g.shr>0)return{v:+g.shr,auto:false};
  const sib=ctSiblings(g.par),tot=sib.reduce((a,[,m])=>a+(+m.cnt),0);
  return{v:tot>0&&+g.cnt>0?Math.round(+g.cnt/tot*1000)/10:0,auto:true};
}
function ctCalc(iid,name,idx){
  const g=GR.meta[iid]||{},mode=ctMode(iid),s=gramSell(iid,name),sell=s?s.v:0,cr=+g.cr>0?+g.cr:GR.cr;
  const o={mode,sell,cr,sellSrc:s?s.src:'',cps:0,rate:0,sug:0,grams:0,unitTxt:'',need:''};
  if(mode==='w'){
    const e=ctEffW(iid,name);
    if(!e){o.need='缺買價';return o}
    if(!GU[e.u]){o.need='單位請填 斤／公斤／克／兩（目前「'+(e.u||'空白')+'」）';return o}
    const cpg=e.p/(e.q*GU[e.u]);o.cpg=cpg;o.eff=e;
    if(sell>0)o.sug=Math.round(sell*cr/100/cpg);
    o.grams=+g.sg>0?+g.sg:o.sug;o.cps=o.grams?o.grams*cpg:0;
    o.unitTxt='每克 $'+ptN(cpg,3);
    if(!o.grams)o.need=sell>0?'':'缺售價';
  }else{
    const U=ctUnit(iid,idx);o.U=U;
    if(mode==='u'){o.unitTxt=U?'每'+(U.u||'單位')+' $'+ptN(U.p,1):'';if(!U)o.need='缺買價';return o}
    if(!U&&mode!=='c'){o.need='缺買價';return o}
    if(mode==='n'){
      if(+g.pn>0){o.unitTxt='每'+(g.nu||'個')+' $'+ptN(U.p/+g.pn,2)}
      if(+g.pn>0&&+g.pm>0)o.cps=U.p*(+g.pm)/(+g.pn);else o.need='填「每包幾個、每份幾個」';
    }else if(mode==='s'){
      if(+g.sx>0&&+g.sy>0){o.cps=U.p*(+g.sx)/(+g.sy);o.unitTxt='用 '+ptN(+g.sx,2)+(U.u||'單位')+' 分 '+ptN(+g.sy,2)+' 份'}
      else o.need='填「用幾包、分幾份」';
    }else if(mode==='c'){
      const par=g.par,pu=par&&par!==iid?ctUnit(par,idx):null;
      if(!par||par===iid)o.need='選「來源」（整隻是哪個品項）';
      else if(!pu)o.need='來源品項缺買價';
      else if(!(+g.cnt>0))o.need='填「每'+(pu.u||'隻')+'可分幾個」';
      else{
        const sh=ctShare(iid),piece=pu.p*sh.v/100/(+g.cnt);o.piece=piece;o.share=sh;o.pu=pu;
        o.unitTxt='每個 $'+ptN(piece,2);o.cps=piece*(+g.pm>0?+g.pm:1);
      }
    }
  }
  if(o.cps>0&&sell>0)o.rate=Math.round(o.cps/sell*1000)/10;
  return o;
}

const planTxt=i=>`${i.name}${(i.qty!==''&&i.qty!=null)?' '+i.qty+(i.unit||''):''}${i.note?'（'+i.note+'）':''}`;
const planNote=g=>'【採購】'+g.name+'｜'+(Object.values(g.items||{}).filter(itemDone).map(planTxt).join('、')||'（其他費用）');
const planColl=()=>{try{return JSON.parse(localStorage.getItem('plan_coll')||'{}')}catch(e){return{}}};
const planCollSet=o=>{try{localStorage.setItem('plan_coll',JSON.stringify(o))}catch(e){}};
async function planSeed(){
  try{
    if((await FB.get(FB.ref(FB.db,'shopMeta/seed1'))).val())return;
    let gi=0;
    for(const [gname,list] of DEFAULT_SHOP){
      let cid=Object.keys(PLAN.catalog).find(k=>PLAN.catalog[k].name===gname);const isNew=!cid;
      if(isNew){cid=FB.push(FB.ref(FB.db,'shopCatalog')).key;PLAN.catalog[cid]={name:gname,o:gi,items:{}}}
      const cat=PLAN.catalog[cid];cat.items=cat.items||{};const add={};
      list.forEach((it,ii)=>{
        const [name,unit,price]=Array.isArray(it)?it:[it,'',0];
        if(Object.values(cat.items).some(x=>x.name===name))return;
        const iid=FB.push(FB.ref(FB.db,'shopCatalog/'+cid+'/items')).key;
        add[iid]={name,unit:unit||'',price:+price||0,o:ii};cat.items[iid]=add[iid];
      });
      if(isNew)await FB.set(FB.ref(FB.db,'shopCatalog/'+cid),{name:gname,o:gi,items:add});
      else if(Object.keys(add).length)await FB.update(FB.ref(FB.db,'shopCatalog/'+cid+'/items'),add);
      gi++;
    }
    await FB.set(FB.ref(FB.db,'shopMeta/seed1'),true);
  }catch(e){alert('匯入常用清單失敗：'+(e.code||e.message))}
}
async function planLoad(day){
  PLAN.day=day;PLAN.ok=false;PLAN.loading=true;
  try{
    const [p,c]=await Promise.all([FB.get(FB.ref(FB.db,'shopPlan/'+day)),FB.get(FB.ref(FB.db,'shopCatalog'))]);
    PLAN.groups=p.val()||{};PLAN.catalog=c.val()||{};
    await planSeed();
    // 舊版清單（已經算入過支出、還沒有「已採購」勾選）→ 視為已採購，避免支出被洗掉
    for(const [gid,g] of Object.entries(PLAN.groups)){
      const its=Object.entries(g.items||{});
      if(g.expAt&&its.some(([,i])=>i.done===undefined)){
        its.forEach(([,i])=>{if(i.done===undefined)i.done=true});
        try{await FB.set(FB.ref(FB.db,'shopPlan/'+day+'/'+gid+'/items'),g.items)}catch(e){}
      }
    }
  }catch(e){PLAN.groups={};PLAN.catalog={};alert('讀取採購清單失敗：'+(e.code||e.message))}
  PLAN.ok=true;PLAN.loading=false;
}
function openPlan(day){
  viewingOrders=viewingStats=viewingTrack=false;
  $('mBox').className='m-box xl';
  PLAN.ok=false;PLAN.day=day||PLAN.day||shiftDay(today8(),1);
  $('modal').classList.add('open');

let PLAN_ALL=null,PLAN_ALL_AT=0;
function planQ(v){PLAN.q=v;clearTimeout(window._plqT);window._plqT=setTimeout(planQRender,250)}
async function planQRender(){
  const box=$('plqr'),g=$('planGroups');if(!box)return;
  const terms=sqNorm(PLAN.q).split(' ').filter(Boolean);
  if(!terms.length){box.innerHTML='';if(g)g.style.display='';return}
  if(g)g.style.display='none';
  if(!PLAN_ALL||Date.now()-PLAN_ALL_AT>30000){
    box.innerHTML='<div style="text-align:center;color:var(--mu);padding:14px">搜尋中…</div>';
    try{PLAN_ALL=(await FB.get(FB.ref(FB.db,'shopPlan'))).val()||{};PLAN_ALL_AT=Date.now()}catch(e){box.innerHTML='<div style="color:var(--bad);padding:12px">讀取失敗：'+esc(e.code||e.message)+'</div>';return}
    if(sqNorm(PLAN.q)!==terms.join(' '))return;   // 搜尋途中又改了字，交給最新那次
  }
  const R=[];
  Object.keys(PLAN_ALL).sort().reverse().forEach(day=>Object.values(PLAN_ALL[day]||{}).forEach(gr=>{
    if(!gr||!gr.items)return;
    Object.values(gr.items).forEach(it=>{
      if(!it||!it.name)return;
      const qn=parseFloat(it.qty)||0,pr=+it.price||0,amt=+it.amount||(qn&&pr?Math.round(qn*pr*100)/100:0);
      if(!(it.qty!==''&&it.qty!=null)&&!amt&&!it.done)return;
      const t=sqNorm(it.name+' '+(gr.name||'')+' '+(it.note||'')+' '+(it.unit||'')+' '+day+' '+dayLabel(day));
      if(terms.every(w=>t.includes(w)))R.push({day,grp:gr.name||'',it,amt,done:!!(it.done)});
    });
  }));
  const tot=R.reduce((a,r)=>a+r.amt,0);
  const rows=R.map(r=>`<tr><td>${esc(dayLabel(r.day))}</td><td>${esc(r.grp)}</td><td><b>${esc(r.it.name)}</b>${r.done?' <span style="color:var(--ok)">✓</span>':''}</td><td>${r.it.qty!==''&&r.it.qty!=null?esc(r.it.qty)+esc(r.it.unit||''):'—'}</td><td>${+r.it.price?'$'+r.it.price:'—'}</td><td>${r.amt?'$'+r.amt:'—'}</td><td class="mu">${esc(r.it.note||'')}</td><td><button class="chip sm" onclick="PLAN.q='';planDay('${r.day}')">前往這天</button></td></tr>`).join('');
  box.innerHTML=R.length?`<div class="fm-line"><span>找到 <b>${R.length}</b> 筆（所有日期）</span><span>合計 <b>$${Math.round(tot*10)/10}</b></span></div><div class="tbw"><table style="min-width:640px"><thead><tr><th>日期</th><th>群組</th><th>品項</th><th>數量</th><th>單價</th><th>金額</th><th>備註</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div style="text-align:center;color:var(--mu);padding:16px">所有日期都找不到符合的採購紀錄</div>';
}
function renderPlan(){
  const head=`<div class="oh"><h3>🛒 採購支出</h3><button onclick="openCash(CASH&&CASH.day?CASH.day:undefined,'exp')">返回收銀盤點</button></div>`;
  if(!PLAN.ok){
    $('mBox').innerHTML=head+'<div style="text-align:center;color:var(--mu);padding:30px">讀取中…</div>';
    if(!PLAN.loading)planLoad(PLAN.day).then(()=>renderPlan());
    return;
  }
  $('mBox').innerHTML=head+planBody();
  if(PLAN.q)planQRender();
}

    <div class="fm-row"><b>採購日期</b><button class="chip sm" onclick="planDay('${shiftDay(d,-1)}')">◀ 前一天</button><button class="chip sm${d===today8()?' on':''}" onclick="planDay('${today8()}')">今日</button><button class="chip sm${d===shiftDay(today8(),1)?' on':''}" onclick="planDay('${shiftDay(today8(),1)}')">明日</button><button class="chip sm" onclick="planDay('${shiftDay(d,1)}')">後一天 ▶</button><input type="date" id="planDate" value="${dashDay(d)}" onchange="planDay(this.value)" style="max-width:170px"></div>
    <div class="modal-tip" style="text-align:left;margin:6px 0">選好採購日期（目前是 <b>${dayLabel(d)}</b>）。買到的品項<b>前面打勾</b>，勾選品項的金額就會<b>直接算入 ${planMD(d)} 的支出</b>（進貨/材料）；沒買到的不要勾，就不會算。</div>
    <div class="fm-row"><b>新增群組</b><input id="pgName" lang="zh-TW" list="pgList" placeholder="例如：大市場（打新的會自動記起來）" onkeydown="if(event.key==='Enter'&&!event.isComposing){event.preventDefault();planAddGroup()}"><button class="chip sm" onclick="planAddGroup()">＋ 加入</button></div>
    <datalist id="pgList">${Object.values(PLAN.catalog).map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist>

    <div class="sqb"><input type="search" id="plq" value="${esc(PLAN.q||'')}" placeholder="🔍 搜尋所有日期的採購紀錄，例如：鴨肉丸" autocomplete="off" oninput="planQ(this.value)"></div><div id="plqr"></div>
    <div class="fm-line"><span>預計 <b id="planPlanned">${money(S.p)}</b>　已採購（算入支出）<b id="planBought" style="color:var(--ok)">${money(S.b)}</b></span><span><button class="chip sm" onclick="planCollapseAll(false)">全部展開</button> <button class="chip sm" onclick="planCollapseAll(true)">全部收合</button></span></div>
  </div>
  <div id="planGroups">${Object.entries(PLAN.groups).map(([gid,g])=>planCard(gid,g)).join('')}</div>`;
}

  const list=Object.entries(PLAN.catalog).filter(([id])=>!PLAN.groups[id]).sort(([,a],[,b])=>byO(a,b));
  if(!list.length)return '';
  return '<span style="color:var(--mu);font-size:12px;align-self:center">常用群組：</span>'+list.map(([id,c])=>`<span class="pchip"><button class="chip sm" onclick="planAddGroup('${id}')">＋ ${esc(c.name)}</button><button class="chip sm" style="padding:4px 7px;color:var(--bad)" title="從常用群組移除" onclick="planForgetGroup('${id}')">✕</button></span>`).join('');

function planItemsHtml(gid){

  const g=PLAN.groups[gid]||{},cat=PLAN.catalog[g.cid]||{},have=g.items||{};

}
const planStatus=g=>{const b=gBought(g),[d]=gCount(g);return b>0?`<span style="color:var(--ok);font-weight:700">✅ 已算入 ${planMD(PLAN.day)} 的支出 ${money(b)}</span><span style="color:var(--mu)">（已採購 ${d} 項${gExtra(g)?' ＋ 其他費用 '+money(gExtra(g)):''}）</span>`:`勾選已買到的品項，才會算入 ${planMD(PLAN.day)} 的支出`};

function planTotalsOnly(gid){
  const g=PLAN.groups[gid],S=planSums();
  const a=$('pgs_'+gid),b=$('ps_'+gid),p=$('planPlanned'),q=$('planBought');
  if(g){if(a)a.textContent=planSum(g);if(b)b.innerHTML=planStatus(g)}
  if(p)p.textContent=money(S.p);if(q)q.textContent=money(S.b);
}
function planRefresh(gid){
  const a=$('pi_'+gid),b=$('pc_'+gid),g=$('pgChips');
  if(a)a.innerHTML=planItemsHtml(gid);if(b)b.innerHTML=planItemChips(gid);if(g)g.innerHTML=planGroupChips();
  planTotalsOnly(gid);
}
function planToggle(gid){
  const o=planColl(),now=!o[gid];o[gid]=now;if(!now)delete o[gid];planCollSet(o);
  const b=$('pgb_'+gid),a=$('pga_'+gid);if(b)b.style.display=now?'none':'block';if(a)a.textContent=now?'▶':'▼';
}
function planCollapseAll(v){
  const o={};if(v)Object.keys(PLAN.groups).forEach(g=>o[g]=true);planCollSet(o);
  Object.keys(PLAN.groups).forEach(g=>{const b=$('pgb_'+g),a=$('pga_'+g);if(b)b.style.display=v?'none':'block';if(a)a.textContent=v?'▶':'▼'});
}
async function planDay(v){const d=String(v).replace(/-/g,'');if(/^\d{8}$/.test(d)){PLAN.day=d;PLAN.ok=false;renderPlan()}}
/* 群組「已採購」的花費（勾選品項的金額加總＋其他費用）同步成「那一天」的一筆支出；key 固定為 plan_群組，所以勾選、改數量、改金額都是更新同一筆 */
async function syncPlanExpense(gid){
  const g=PLAN.groups[gid];if(!g)return;
  const rf=FB.ref(FB.db,'cashbook/'+PLAN.day+'/expenses/plan_'+gid),amt=r2(gBought(g));
  try{
    if(amt>0){
      if(!g.expAt){g.expAt=Date.now();await FB.update(FB.ref(FB.db,'shopPlan/'+PLAN.day+'/'+gid),{expAt:g.expAt})}
      await FB.set(rf,{at:g.expAt,type:'進貨',amount:amt,note:planNote(g),by:whoAmI(),plan:true});
    }else await FB.remove(rf);
  }catch(e){alert('同步支出失敗：'+(e.code||e.message))}
}
async function planCheck(gid,iid,v){
  const g=PLAN.groups[gid],it=(g.items||{})[iid];if(!it)return;
  it.done=!!v;
  const row=$(`pit_${gid}_${iid}`);if(row)row.classList.toggle('done',it.done);
  try{await FB.update(FB.ref(FB.db,'shopPlan/'+PLAN.day+'/'+gid+'/items/'+iid),{done:it.done})}catch(e){alert('儲存失敗：'+(e.code||e.message));return}
  planTotalsOnly(gid);await syncPlanExpense(gid);
  const all=Object.values(g.items).every(itemDone),hd=document.querySelector(`#pi_${gid} .phd input`);if(hd)hd.checked=all;
}
async function planCheckAll(gid,v){
  const g=PLAN.groups[gid];if(!g)return;
  Object.values(g.items||{}).forEach(i=>i.done=!!v);
  try{await FB.set(FB.ref(FB.db,'shopPlan/'+PLAN.day+'/'+gid+'/items'),g.items)}catch(e){alert('儲存失敗：'+(e.code||e.message));return}
  planRefresh(gid);await syncPlanExpense(gid);
}
async function planAddGroup(arg){
  let cid=null,name='';
  if(arg&&PLAN.catalog[arg]){cid=arg;name=PLAN.catalog[arg].name}
  else{const el=$('pgName');name=(el?el.value:'').trim();if(!name){if(el)el.focus();return}
    cid=Object.keys(PLAN.catalog).find(k=>PLAN.catalog[k].name===name)||null}
  try{
    if(!cid){const r=FB.push(FB.ref(FB.db,'shopCatalog'));await FB.set(r,{name,o:Date.now()});cid=r.key;PLAN.catalog[cid]={name,o:Date.now(),items:{}}}
    if(PLAN.groups[cid]){toast('「'+name+'」已經在清單裡了');return}
    const g={name,cid,amount:0,items:{}};
    await FB.set(FB.ref(FB.db,'shopPlan/'+PLAN.day+'/'+cid),g);
    PLAN.groups[cid]=g;
  }catch(e){alert('新增群組失敗：'+(e.code||e.message));return}
  const el=$('pgName');if(el)el.value='';
  $('planGroups').insertAdjacentHTML('beforeend',planCard(cid,PLAN.groups[cid]));
  planRefresh(cid);
}
function planNameIn(gid){      // 打到已經記過的品名，單位和單價自動帶出
  const g=PLAN.groups[gid],cat=PLAN.catalog[g.cid]||{},nm=$('pn_'+gid).value.trim();
  const it=Object.values(cat.items||{}).find(i=>i.name===nm);
  if(it){const u=$('pu_'+gid),p=$('pp_'+gid),t=$('pt_'+gid);if(u&&!u.value)u.value=it.unit||'';if(p&&!p.value)p.value=(+it.price)||'';if(t&&!t.value)t.value=it.note||''}
}
async function planPutItem(gid,iid,cat){        // 把常用品項放進這一天的清單（數量先空白，等你輸入；買到了再打勾）
  const g=PLAN.groups[gid],c=cat.items[iid];

  await FB.set(FB.ref(FB.db,'shopPlan/'+PLAN.day+'/'+gid+'/items/'+iid),it);
  (g.items=g.items||{})[iid]=it;

async function planChip(gid,iid){
  const g=PLAN.groups[gid],cat=PLAN.catalog[g.cid];if(!cat||!cat.items[iid])return;

async function planAddItem(gid){
  const g=PLAN.groups[gid];if(!g)return;
  const ne=$('pn_'+gid),name=ne.value.trim();
  if(!name){ne.focus();return}
  const unit=$('pu_'+gid).value.trim(),price=parseFloat($('pp_'+gid).value)||0,note=($('pt_'+gid)||{value:''}).value.trim();
  const cat=PLAN.catalog[g.cid]||(PLAN.catalog[g.cid]={name:g.name,items:{}});cat.items=cat.items||{};

function planLive(gid,iid){

}
/* 離開欄位時存檔：金額沒有手改過，就一直是 數量 × 單價；你手動改了金額，就以你輸入的為準。單位、單價會自動記住（最近一次輸入的） */
async function planItemSave(gid,iid,key){
  const g=PLAN.groups[gid],it=(g.items||{})[iid];if(!it)return;
  const k=`${gid}_${iid}`,val=id=>($(id+'_'+k)||{value:''}).value;
  const qtyS=val('q').trim(),q=parseFloat(qtyS)||0;
  let price=parseFloat(val('p'))||0;
  it.qty=qtyS;it.unit=val('u').trim();it.note=val('n').trim();
  let autoP=false;
  if(!price){                                                   // 沒填單價：從備註讀（例如「1斤33」「33元/斤」），單位空白就一起帶入
    const n=gramParseNote(it.note);
    if(n&&(!it.unit||gUnitNorm(it.unit)===n.u)){price=r2(n.p/n.q);autoP=true;if(!it.unit){it.unit=n.u;const ue=$('u_'+k);if(ue)ue.value=n.u}}
  }
  const a0=r2(parseFloat(val('m'))||0);
  if(key!=='amount'&&a0>0&&!q&&price>0){                        // 已有總金額、數量空白：補上單價或備註後，自動換算數量（不動金額）
    it.qty=String(r2(a0/price));it.manual=Math.abs(a0-r2((+it.qty)*price))>0.005;it.amount=a0;
    const qe=$('q_'+k);if(qe)qe.value=it.qty;
    toast(`🧮 已換算數量：${it.qty}${it.unit||''}（$${a0} ÷ 單價 $${price}）`,()=>{});
  }else
  if(key==='amount'){
    const a=r2(parseFloat(val('m'))||0);
    if(a>0&&q>0&&!price){price=r2(a/q);it.manual=Math.abs(a-r2(q*price))>0.005}      // 還沒設單價：只輸入總金額，就自動算出單價
    else if(a>0&&!q&&price>0){                                                          // 數量不知道（例如買一顆，店家秤出總價）：數量＝金額÷單價
      it.qty=String(r2(a/price));it.manual=Math.abs(a-r2((+it.qty)*price))>0.005;
      const qe=$('q_'+k);if(qe)qe.value=it.qty;
      toast(`🧮 已換算數量：${it.qty}${it.unit||''}（$${a} ÷ 單價 $${price}）`,()=>{});
    }
    else it.manual=a>0&&Math.abs(a-r2(q*price))>0.005;
    it.amount=a;
  }else if(!it.manual)it.amount=r2(q*price);
  it.price=price;
  const m=$('m_'+k),pe=$('p_'+k);if(m)m.value=it.amount||'';if(pe&&price)pe.value=price;
  try{await FB.update(FB.ref(FB.db,'shopPlan/'+PLAN.day+'/'+gid+'/items/'+iid),{qty:it.qty,unit:it.unit,price:it.price,amount:it.amount,manual:!!it.manual,note:it.note})}
  catch(e){alert('儲存失敗：'+(e.code||e.message));return}
  const cat=(PLAN.catalog[g.cid]||{}).items||{},ci=cat[iid];
  if(ci){
    const patch={};
    if(it.unit&&it.unit!==ci.unit)patch.unit=it.unit;
    if(price>0&&price!==(+ci.price||0))patch.price=price;
    if(it.note!==(ci.note||''))patch.note=it.note;          // 備註也一起記住（清掉備註＝下次不帶）
    if(Object.keys(patch).length){
      try{await FB.update(FB.ref(FB.db,'shopCatalog/'+g.cid+'/items/'+iid),patch);Object.assign(ci,patch);
        Object.keys(PLAN.groups).forEach(x=>{if(PLAN.groups[x].cid===g.cid){const c=$('pc_'+x);if(c)c.innerHTML=planItemChips(x)}});
        toast(`💾 已記住「${it.name}」${ci.unit?ci.unit:''}${(+ci.price)?' $'+ci.price:''}${ci.note?'（'+ci.note+'）':''}，下次直接帶出`)}catch(e){}
    }
  }
  planTotalsOnly(gid);await syncPlanExpense(gid);
}

function loadXLSX(){

async function buildCashbookSheets(){
  const [cbSn,osSn]=await Promise.all([FB.get(FB.ref(FB.db,'cashbook')),FB.get(FB.ref(FB.db,'orders'))]);

  const daily=[],exps=[],cnts=[],byMonth={};let cumRev=0,cumNet=0,cumFee=0,cumDiff=0;
  figs.forEach(f=>{
    const {day,cb,sales,c}=f;
    cumRev+=sales.revenue;cumNet+=f.net;cumFee+=f.fee;
    const diffOk=c.hasOpen&&c.hasClose;if(diffOk)cumDiff+=c.diff;
    daily.push([dayPlain(day),dayWeek(day),sales.manual?'手動補登':(c.hasClose?'已收店':(f.hasCb?'未收店':'無收銀紀錄')),sales.count,sales.voided,sales.revenue,sales.cash,sales.transfer,sales.linepay,sales.allpay,
      f.fl,f.fa,f.fee,f.net,sales.unpaid,c.hasOpen?c.open:'',c.topup,c.expense,c.deposit,c.hasOpen?c.expected:'',c.hasClose?c.close:'',diffOk?c.diff:'',cumRev,cumFee,cumNet,cumDiff]);
    (byMonth[day.slice(0,6)]=byMonth[day.slice(0,6)]||[]).push(f);
    Object.values(cb.expenses||{}).sort((a,b)=>a.at-b.at).forEach(e=>exps.push([dayPlain(day),fmtDT(e.at),expLabel(e.type),+e.amount||0,e.note||'',e.by||'']));
    [['open','開店'],['close','收店']].forEach(([k,nm])=>{
      const r=cb[k];if(!r)return;
      cnts.push([dayPlain(day),nm+'盤點',fmtDT(r.at),r.by||'',...DENOMS.map(d=>(+((r.counts||{})['d'+d])||0)*d),+r.total||0]);
    });
  });
  const monthly=[];let mRev=0,mNet=0;
  Object.keys(byMonth).sort().forEach(ym=>{
    const t=monthAgg(byMonth[ym]);mRev+=t.revenue;mNet+=t.net;
    monthly.push([ym.slice(0,4)+'年'+ym.slice(4,6)+'月',t.days,t.count,t.voided,t.revenue,t.cash,t.transfer,t.linepay,t.allpay,t.fl,t.fa,t.fee,t.net,t.days?Math.round(t.revenue/t.days):0,t.unpaid,t.expense,t.deposit,t.topup,t.diffDays?t.diff:'',mRev,mNet]);
  });
  return{
    daily:[['營業日','星期','狀態','訂單數','拒單數','營收合計','現金收入','轉帳','Linepay','全支付','Linepay手續費('+rateTxt('Linepay')+')','全支付手續費('+rateTxt('全支付')+')','手續費合計','扣手續費後營收','未收款','開店現金','補鈔','支出合計','存鈔合計','理論應有現金','收店現金','差額','累計營收','累計手續費','累計淨營收','累計差額'],...daily],
    monthly:[['月份','營業天數','訂單數','拒單數','營收合計','現金收入','轉帳','Linepay','全支付','Linepay手續費','全支付手續費','手續費合計','扣手續費後營收','日均營收','未收款','支出合計','存鈔合計','補鈔合計','現金差額合計','累計營收','累計淨營收'],...monthly],
    exps:[['營業日','時間','類別','金額','說明','登錄人'],...exps],
    cnts:[['營業日','類型','時間','登錄人',...DENOMS.map(d=>'$'+d+' 金額'),'合計'],...cnts]
  };
}
async function exportCashbook(){

  if(!window.FB)return;
  const d=today8();
  if(d===stockDay&&stockUnsub)return;
  if(stockUnsub){stockUnsub();stockUnsub=null}
  stockDay=d;STOCK={};
  stockUnsub=FB.onValue(FB.ref(FB.db,'stock/'+d),sn=>{STOCK=sn.val()||{};renderGrid();renderCart();if(STKopen)refreshStockCells()},()=>{});
}
const stockInfo=id=>{const r=STOCK[baseId(id)];return r&&r.limit!=null&&r.limit!==''?{limit:+r.limit,sold:+r.sold||0}:null};
const stockLeft=id=>{const s=stockInfo(id);return s?Math.max(0,s.limit-s.sold):Infinity};
let OVR={};   // 店家這張單「強制加入」的售完品項（補登過去的單、或特殊情況用）
const canAdd=id=>{
  if(OVR[baseId(id)])return true;
  const l=stockLeft(id);if(l===Infinity)return true;
  const b=baseId(id);return cart.filter(x=>baseId(x.id)===b).reduce((a,x)=>a+x.qty,0)<l;
};
const itemName=id=>((find(baseId(id))||{}).name)||id;
const needOf=items=>{const need={};(items||[]).forEach(x=>{const b=baseId(x.id);need[b]=(need[b]||0)+(+x.qty||0)});return need};
const soldRef=b=>FB.ref(FB.db,'stock/'+today8()+'/'+b+'/sold');

/* 下單時先「預留」庫存；不夠就擋下（force=true 時強制扣，店家可選擇仍要送出） */
async function reserveStock(items,force){
  const done=[];
  for(const [b,q] of Object.entries(needOf(items))){
    const info=STOCK[b];if(!info||info.limit==null)continue;
    const lim=+info.limit;let r;
    try{r=await FB.runTransaction(soldRef(b),cur=>{cur=+cur||0;if(!force&&cur+q>lim)return;return cur+q})}
    catch(e){await releaseStock(done);throw e}
    if(!r.committed){await releaseStock(done);return{ok:false,name:itemName(b),left:Math.max(0,lim-(+r.snapshot.val()||0))}}
    done.push([b,q]);
  }
  return{ok:true,done};
}
async function releaseStock(done){
  for(const [b,q] of done){try{await FB.runTransaction(soldRef(b),c=>Math.max(0,(+c||0)-q))}catch(e){}}
}
/* 拒單 → 把庫存還回去；還原 → 再扣掉 */
async function adjustStockForOrder(o,sign){
  if(!window.FB||!o||o.late||o.date!==today8())return;
  for(const [b,q] of Object.entries(needOf(o.items))){
    const info=STOCK[b];if(!info||info.limit==null)continue;
    try{await FB.runTransaction(soldRef(b),c=>Math.max(0,(+c||0)+sign*q))}catch(e){}
  }
}

/* --- 庫存設定畫面（店員、店長都能用）--- */
function openStock(){
  STK={rows:{}};
  Object.entries(STOCK).forEach(([id,r])=>{if(r&&r.limit!=null)STK.rows[id]=String(r.limit)});
  STKopen=true;viewingOrders=viewingStats=viewingTrack=false;
  $('mBox').className='m-box xl';renderStock();$('modal').classList.add('open');
}
const stkSold=id=>+((STOCK[id]||{}).sold)||0;
function renderStock(){
  const ids=Object.keys(STK.rows);
  const opts=MENU.map(c=>`<optgroup label="${esc(split(c.k)[0])}">${c.items.filter(i=>!(i.id in STK.rows)).map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join('')}</optgroup>`).join('');
  const rows=ids.map(id=>{
    const it=find(id)||{name:id},sold=stkSold(id),lim=parseInt(STK.rows[id]);
    return `<div class="er"><span style="flex:1;font-weight:700">${esc(it.name)}</span><span style="width:76px;color:var(--mu)">已售 <b id="ss_${id}">${sold}</b></span><span style="width:70px">剩 <b id="sl_${id}">${lim>=0?Math.max(0,lim-sold):'-'}</b></span><input class="qt" style="width:96px" type="number" min="0" inputmode="numeric" value="${esc(STK.rows[id])}" placeholder="限量" oninput="stkInput('${id}',this.value)"><button class="del-btn" onclick="stkDel('${id}')" title="移除限量">✕</button></div>`;
  }).join('');
  $('mBox').innerHTML=`<div class="oh"><h3>📦 今日庫存（限量品項）</h3><button onclick="closeModal()">關閉</button></div>
   <div class="modal-tip">沒有設定限量的品項＝不限量。限量品項賣完會<b>自動反黑、不能點選</b>，客人頁面也會顯示「剩 N」。營業日（每日 02:00 換日）換日後庫存會自動重新開始。</div>
   <div class="fm-sec"><div class="fm-title">${dayLabel(today8())}</div>
    ${ids.length>4?sqBox('stk','搜尋限量品項',{item:'.er'}):''}
    ${rows||'<div style="text-align:center;color:var(--mu);padding:14px">今天還沒有設定任何限量品項</div>'}
    <div class="fm-row"><select onchange="stkAdd(this.value)"><option value="">＋ 加入限量品項…</option>${opts}</select></div></div>
   <div class="m-btns"><button class="btn-confirm" onclick="stkSave()">儲存庫存設定</button></div>
   <div class="m-btns"><button class="btn-cancel" onclick="stkCopy()">沿用昨天的限量</button><button class="btn-cancel" onclick="stkRecalc()">依今日訂單重算已售</button><button class="btn-cancel" onclick="stkClear()">清空今日庫存設定</button></div>`;
}
function stkInput(id,v){
  STK.rows[id]=v;const el=$('sl_'+id),n=parseInt(v);
  if(el)el.textContent=n>=0?Math.max(0,n-stkSold(id)):'-';
}
function refreshStockCells(){
  Object.keys(STK.rows).forEach(id=>{
    const a=$('ss_'+id),b=$('sl_'+id),n=parseInt(STK.rows[id]);
    if(a)a.textContent=stkSold(id);if(b)b.textContent=n>=0?Math.max(0,n-stkSold(id)):'-';
  });
}
function stkAdd(id){if(id){STK.rows[id]='';renderStock()}}
async function stkDel(id){
  const saved=STOCK[id]&&STOCK[id].limit!=null;
  if(saved){
    if(!confirm(`移除「${(find(id)||{}).name||id}」的限量（改成不限量）？`))return;
    try{await FB.remove(FB.ref(FB.db,'stock/'+today8()+'/'+id))}catch(e){alert('移除失敗：'+(e.code||e.message));return}
  }
  delete STK.rows[id];renderStock();
}
async function stkSave(){
  const ids=Object.keys(STK.rows);
  for(const id of ids){if(!(parseInt(STK.rows[id])>=0)){alert(`「${(find(id)||{}).name||id}」請輸入限量數字（0 以上）`);return}}
  try{
    for(const id of ids){
      const v=parseInt(STK.rows[id]),cur=STOCK[id];
      await FB.update(FB.ref(FB.db,'stock/'+today8()+'/'+id),cur&&cur.sold!=null?{limit:v}:{limit:v,sold:0});
    }
  }catch(e){alert('儲存失敗：'+(e.code||e.message));return}
  logAct('設定庫存',null,'',ids.map(id=>`${(find(id)||{}).name||id}×${STK.rows[id]}`).join('、')||'（無）');
  toast('✅ 庫存設定已儲存');
}
async function stkRecalc(){
  if(!confirm('依今日所有訂單（不含已拒單）重新計算每個限量品項的「已售」數量？'))return;
  try{
    const list=(await fetchDayOrders(today8())).filter(o=>o.status!=='cancelled');
    const sold={};list.forEach(o=>Object.entries(needOf(o.items)).forEach(([b,q])=>sold[b]=(sold[b]||0)+q));
    for(const id of Object.keys(STOCK)){
      if(STOCK[id]&&STOCK[id].limit!=null)await FB.update(FB.ref(FB.db,'stock/'+today8()+'/'+id),{sold:sold[id]||0});
    }
  }catch(e){alert('重新計算失敗：'+(e.code||e.message));return}
  logAct('重算庫存已售',null,'',dayPlain(today8()));
  toast('✅ 已重新計算已售數量');
}
async function stkClear(){
  if(!confirm('清空今天所有限量設定？（全部品項改成不限量）'))return;
  try{await FB.remove(FB.ref(FB.db,'stock/'+today8()))}catch(e){alert('清空失敗：'+(e.code||e.message));return}
  STK.rows={};renderStock();
}
async function stkCopy(){
  try{
    const y=(await FB.get(FB.ref(FB.db,'stock/'+shiftDay(today8(),-1)))).val()||{};
    const ids=Object.keys(y).filter(id=>y[id]&&y[id].limit!=null);
    if(!ids.length){alert('昨天沒有限量設定可沿用');return}
    for(const id of ids)await FB.update(FB.ref(FB.db,'stock/'+today8()+'/'+id),{limit:+y[id].limit,sold:0});
    ids.forEach(id=>STK.rows[id]=String(y[id].limit));
  }catch(e){alert('沿用失敗：'+(e.code||e.message));return}
  toast('✅ 已沿用昨天的限量（已售歸零）');renderStock();
}

function tick(){const d=new Date(),z=n=>String(n).padStart(2,'0'),w='週'+'日一二三四五六'[d.getDay()],t=`${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`;$('clock').textContent=innerWidth<600?`${d.getFullYear()}/${z(d.getMonth()+1)}/${z(d.getDate())} ${w} ${t}`:`${d.getFullYear()}年${z(d.getMonth()+1)}月${z(d.getDate())}日 ${w} ${t}`}
function toggleCart(){document.querySelector('.cart').classList.toggle('cart-open')}
tick();setInterval(tick,1e3);
setInterval(()=>{if(isAdmin&&ordUnsub&&bizStart()!==ordStart)startOrders()},6e4);
</script>
