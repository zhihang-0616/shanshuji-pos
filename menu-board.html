<style>
/* Layout: dark lacquered-wood board with gold ribbons; parchment sheet inside holds four menu columns; wood bands top (masthead) and bottom (payment/total). Single deliberate look. */
:root{
  --wood-0:#120904; --wood-1:#2a1608; --wood-2:#4a2a10;
  --gold-hi:#fff1c4; --gold:#e8bd62; --gold-mid:#b98232; --gold-lo:#6e4416;
  --paper:#c7a05f; --paper-hi:#dcbd80; --paper-lo:#8f6835;
  --ink:#2b1806; --ink-soft:#553411; --price:#7d1c0c; --hot:#a3170b;
  --notice:#ff9a73; --line:#f2d48c;
  --serif:"Noto Serif TC","Songti TC","PMingLiU","MingLiU",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--wood-0);
  background-image:radial-gradient(120% 80% at 50% 0%, #3a2109 0%, var(--wood-0) 70%);
  color:var(--ink); font-family:var(--serif);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 32px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#1b0e05}

/* ---------- toolbar ---------- */
.toolbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  max-width:1560px; margin:0 auto 18px; padding:10px 12px;
  background:linear-gradient(#24130799,#1b0e05f2); backdrop-filter:blur(6px);
  border:1px solid var(--gold-lo); border-top:0; border-radius:0 0 10px 10px;
  color:var(--gold);
}
.toolbar .brand{font-weight:900;letter-spacing:.08em;margin-right:auto;font-size:15px}
.btn{
  font:inherit; font-size:14px; font-weight:700; cursor:pointer;
  padding:7px 14px; border-radius:999px;
  border:1px solid var(--gold-mid); background:#2c1808; color:var(--gold-hi);
}
.btn:hover{background:#3d2109}
.btn:focus-visible,.ctl:focus-visible,.add:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.btn.on{background:linear-gradient(#f3cf7a,#b9822f);color:#2a1606;border-color:#f3cf7a}
.btn.warn[data-armed]{background:#7d1c0c;border-color:#ff9a73}
.status{font-size:12px;color:#c9a46a;min-width:5em}
.hint{
  max-width:1560px;margin:-8px auto 16px;color:#e7cf9a;font-size:13px;line-height:1.6;
  border-left:3px solid var(--gold-mid);padding:6px 12px;background:#2a160866;border-radius:4px;
}

/* ---------- A4 stage ---------- */
/* The menu is a fixed A4-landscape canvas (1123×794 CSS px = 297×210 mm) scaled to the screen; text size auto-fits so the page is always full. */
.stage{max-width:1560px;margin:0 auto;overflow-x:auto;overflow-y:hidden}
.stage-in{position:relative;margin:0 auto}
.paperinfo{max-width:1560px;margin:10px auto 0;text-align:center;font-size:12px;color:#b8955c;letter-spacing:.05em}
.paperinfo b{color:var(--gold)}
.paperinfo .over{color:var(--notice);font-weight:900}

/* ---------- board ---------- */
.board{
  --fs:1;
  position:absolute; top:0; left:0; transform-origin:0 0;
  width:1123px; height:794px; overflow:hidden;
  display:flex; flex-direction:column;
  background:
    repeating-linear-gradient(100deg, rgba(255,200,120,.035) 0 2px, transparent 2px 7px),
    radial-gradient(90% 60% at 80% 0%, #6b3f15 0%, transparent 55%),
    radial-gradient(80% 70% at 0% 100%, #5a3310 0%, transparent 60%),
    linear-gradient(160deg, var(--wood-2), var(--wood-1) 45%, var(--wood-0));
  box-shadow:inset 0 0 0 2px #b98232, inset 0 0 0 5px #1a0d04, inset 0 0 0 6px #8a5a20, 0 24px 50px rgba(0,0,0,.6);
}
.board.editing{height:auto;min-height:794px}
.swoosh{position:absolute;pointer-events:none;z-index:0}
.swoosh.tr{top:-24px;right:-30px;width:640px;height:170px}
.swoosh.bl{bottom:-14px;left:-30px;width:760px;height:150px}

/* masthead */
.mast{
  position:relative; z-index:1; flex:none;
  display:grid; grid-template-columns:104px 1fr 360px; gap:22px; align-items:center;
  padding:12px 30px 8px 26px;
}

.titlebox{text-align:center;min-width:0}
.orn{display:block;width:100%;max-width:380px;height:16px;margin:0 auto}
.shopname{
  display:inline-block; margin:0;
  font-size:50px; font-weight:900; letter-spacing:.08em; line-height:1.12;
  background:linear-gradient(180deg,#fff7d6 0%,#f6d27c 30%,#b47a2a 52%,#f2cc72 70%,#8d5a1b 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent; caret-color:var(--gold-hi);
  filter:drop-shadow(0 2px 0 #3a1f07) drop-shadow(0 4px 6px rgba(0,0,0,.65));
}
.shopsub{display:block;color:var(--gold);font-size:13px;letter-spacing:.7em;font-weight:700;margin:0 0 1px .7em}
.info{display:grid;gap:3px;color:var(--gold-hi);font-size:13.5px;line-height:1.45;min-width:0;
  padding:8px 0 8px 16px;border-left:1px solid rgba(232,189,98,.45)}
.info .row{display:flex;flex-wrap:wrap;gap:2px 10px}
.info .k{color:var(--gold);font-weight:700}
.info .notice{color:var(--notice);font-weight:900}
.info .line{color:var(--line);font-weight:900;font-size:15px}

/* parchment */
.paper{
  position:relative; z-index:1; flex:1 1 auto; min-height:0; overflow:hidden;
  margin:0 18px; padding:11px;
  border-radius:3px;
  background:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .32  0 0 0 0 .2  0 0 0 0 .07  0 0 0 .5 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"),
    repeating-linear-gradient(90deg, rgba(90,58,20,.05) 0 1px, transparent 1px 4px),
    radial-gradient(ellipse at 50% 40%, var(--paper-hi) 0%, var(--paper) 55%, var(--paper-lo) 100%);
  box-shadow:inset 0 0 46px rgba(60,30,5,.5), 0 0 0 1px #3b2108, 0 0 0 3px #c9953f55;
}
.editing .paper{overflow:visible}
.board:not(.editing) .paper{display:flex;flex-direction:column}
.cols{display:grid;grid-template-columns:1fr 1fr 1fr 1.42fr;gap:10px;align-items:start}
.board:not(.editing) .cols{flex:1 0 auto;align-items:stretch}
.board:not(.editing) .col>.sec:last-of-type{flex:1 0 auto}
.col{display:flex;flex-direction:column;gap:calc(9px * var(--fs));min-width:0}

/* section */
.sec{
  border:1px solid rgba(70,40,10,.5); border-radius:5px; overflow:hidden;
  background:rgba(255,240,205,.2);
  box-shadow:inset 0 0 0 2px rgba(255,236,190,.18);
}
.sec-h{
  display:flex; align-items:baseline; justify-content:center; gap:4px; flex-wrap:wrap;
  padding:calc(3px * var(--fs)) 8px calc(2px * var(--fs));
  background:linear-gradient(#3e230c,#1f1006); border-bottom:1px solid var(--gold-mid);
  color:var(--gold); font-weight:900; font-size:calc(15px * var(--fs)); letter-spacing:.03em;
}
.sec-h .t{color:var(--gold-hi);caret-color:var(--gold-hi)}
.sec-h .sum{color:var(--gold);font-weight:700}
.sec-b{padding:calc(4px * var(--fs)) 9px calc(5px * var(--fs));display:flex;flex-direction:column}

.item{display:flex;align-items:baseline;gap:3px;font-size:calc(14.5px * var(--fs));line-height:1.48;font-weight:700;min-width:0}
.qty{white-space:nowrap;color:var(--ink-soft);font-weight:500;font-size:.84em}
.qty i{display:inline-block;width:1.6em;border-bottom:1.2px solid var(--ink-soft);margin-right:1px;transform:translateY(-2px)}
.name{color:var(--ink);min-width:0;overflow-wrap:anywhere}
.tag{color:var(--hot);font-size:.88em;white-space:nowrap}
.lead{flex:1;min-width:8px;border-bottom:1.2px dotted rgba(60,35,10,.5);transform:translateY(-4px)}
.price{color:var(--price);font-weight:900;white-space:nowrap;font-variant-numeric:tabular-nums}
.dot{cursor:pointer;color:var(--hot);white-space:nowrap;font-weight:900;user-select:none;margin-left:2px}
.dot::before{content:"○";margin-right:1px}
.dot.on::before{content:"●"}

/* options box */
.grp{padding:calc(2px * var(--fs)) 0 calc(3px * var(--fs))}
.grp + .grp{border-top:1px dashed rgba(70,40,10,.35)}
.grp-h{color:var(--price);font-weight:900;font-size:calc(13.5px * var(--fs));line-height:1.45}
.grp-h .hint2{font-weight:700}
.choices{display:flex;flex-wrap:wrap;gap:0 10px;font-size:calc(13.5px * var(--fs));line-height:1.5;font-weight:700;color:var(--ink)}
.choices.stack{flex-direction:column}
.choice{display:inline-flex;align-items:baseline;gap:1px;cursor:pointer}
.choice::before{content:"○"}
.choice.on::before{content:"●"}

/* sets */
.set{padding:calc(5px * var(--fs)) 0}
.set + .set{border-top:1.2px dashed rgba(70,40,10,.4)}
.set-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px;font-size:calc(16px * var(--fs));line-height:1.4;font-weight:900}
.set-h .sname{color:var(--price)}
.set-h .sname::before{content:"《"} .set-h .sname::after{content:"》"}
.set-d{font-size:calc(13.5px * var(--fs));font-weight:700;color:var(--ink);line-height:1.5;margin-top:1px}

/* footer band */
.foot{
  position:relative; z-index:1; flex:none;
  display:flex; align-items:center; justify-content:space-between; gap:18px;
  padding:7px 30px 11px; color:var(--gold-hi);
}
.pays{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:19px;font-weight:900}
.pays .choice{color:var(--gold-hi)}
.total{display:flex;align-items:baseline;gap:8px}
.total .lbl{
  font-size:32px;font-weight:900;line-height:1.1;
  background:linear-gradient(180deg,#ffd2a8,#ff7a4a 55%,#b52a12);-webkit-background-clip:text;background-clip:text;color:transparent;caret-color:#ffd2a8;
}
.blank{display:inline-block;border-bottom:2px solid var(--gold);transform:translateY(-5px)}
.dt{display:flex;gap:6px;align-items:baseline;font-size:20px;font-weight:900;color:var(--gold-hi)}

/* ---------- edit mode ---------- */
.ed{outline:none;border-radius:3px}
.editing .ed{outline:1px dashed rgba(110,60,15,.55);outline-offset:1px;min-width:.8em;display:inline-block;cursor:text}
.editing .mast .ed,.editing .foot .ed,.editing .sec-h .ed{outline-color:rgba(240,200,120,.5)}
.editing .ed:focus{outline:2px solid #e8bd62;background:rgba(255,245,215,.35)}
.editing .mast .ed:focus,.editing .foot .ed:focus,.editing .sec-h .ed:focus{background:rgba(255,220,150,.12)}
.ed:empty::before{content:attr(data-ph);opacity:.45;font-weight:500}
.ctls{display:inline-flex;gap:3px;margin-left:4px;flex:none;align-self:center}
.ctl{
  font:inherit;font-size:12px;font-weight:700;line-height:1;cursor:pointer;
  min-width:24px;height:24px;padding:0 6px;border-radius:5px;
  border:1px solid rgba(80,45,10,.55);background:rgba(255,240,205,.7);color:#4a2a0c;
}
.ctl:hover{background:#fff3d6}
.ctl.del{color:#9c1b0c}
.ctl.on{background:#a3170b;color:#fff;border-color:#a3170b}
.sec-h .ctl{background:#3a200b;color:var(--gold-hi);border-color:var(--gold-mid)}
.sec-h .ctl.del{color:#ff9a73}
.sec-h .ctl[data-armed]{background:#7d1c0c;color:#fff}
.add{
  font:inherit;font-size:13px;font-weight:700;cursor:pointer;align-self:flex-start;
  margin-top:4px;padding:4px 10px;border-radius:5px;
  border:1px dashed rgba(80,45,10,.6);background:rgba(255,240,205,.35);color:#4a2a0c;
}
.foot .add{border-color:var(--gold-mid);background:transparent;color:var(--gold)}
.colAdd{display:flex;flex-wrap:wrap;gap:6px}
.colAdd .add{margin:0}
.flagrow{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--gold);font-weight:700;width:100%;justify-content:center}
.flagrow label{display:inline-flex;gap:4px;align-items:center;cursor:pointer}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,5,2,.7);display:grid;place-items:center;padding:16px}
.dlg{width:min(720px,100%);background:#22130a;border:1px solid var(--gold-mid);border-radius:12px;padding:18px;color:var(--gold-hi);display:grid;gap:10px}
.dlg h2{margin:0;font-size:20px;color:var(--gold)}
.dlg p{margin:0;font-size:14px;color:#d9c091;line-height:1.6}
.dlg textarea{width:100%;height:46vh;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;background:#120904;color:#f1dcae;border:1px solid var(--gold-lo);border-radius:6px;padding:10px;resize:vertical}
.dlg .acts{display:flex;flex-wrap:wrap;gap:8px}
.err{color:#ff9a73;font-size:13px;min-height:1em}

@media print{
  @page{size:A4 landscape;margin:0}
  html,body{background:none!important;padding:0!important;margin:0!important}
  body::before,.toolbar,.hint,.paperinfo,.ctls,.add,.colAdd,.flagrow{display:none!important}
  .stage,.stage-in{width:auto!important;height:auto!important;max-width:none;margin:0;overflow:visible}
  .board{position:relative;transform:none!important;width:297mm;height:209.5mm;min-height:0;box-shadow:inset 0 0 0 2px #b98232, inset 0 0 0 5px #1a0d04, inset 0 0 0 6px #8a5a20;break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function renderSection(s,si){

function render(){
  const sh=state.shop, f=state.foot;
  let cols=['','','',''];
  state.sections.forEach((s,si)=>{const c=Math.max(0,Math.min(3,s.col|0));cols[c]+=renderSection(s,si)});

  board.innerHTML=SWOOSH('tr',false)+SWOOSH('bl',true)+`

/* ---- A4 fit + scale ---- */
const W=1123,H=794;
const stage=document.getElementById('stage'),stageIn=document.getElementById('stageIn'),pinfo=document.getElementById('paperinfo');
let fitFs=1;
function fit(){
  const paper=board.querySelector('.paper');if(!paper)return;
  const over=()=>paper.scrollHeight>paper.clientHeight+1;
  let f=1.18;board.style.setProperty('--fs',f);
  while(over()&&f>0.7){f=Math.round((f-0.02)*100)/100;board.style.setProperty('--fs',f)}
  fitFs=f;
  return !over();
}
function scale(){
  const avail=stage.clientWidth;
  let k=Math.min(1.4,avail/W);
  if(editing)k=Math.max(k,Math.min(1,0.72));
  const h=board.offsetHeight;
  board.style.transform=`scale(${k})`;
  stageIn.style.width=(W*k)+'px';stageIn.style.height=(h*k)+'px';
}
function layout(){
  let ok=true;
  if(editing){board.style.setProperty('--fs',fitFs)}
  else ok=fit();
  scale();
  const pct=Math.round(fitFs*100);
  if(editing){
    const tall=board.offsetHeight>H+2;
    pinfo.innerHTML=`A4 橫式 297 × 210 mm ・ 編輯中版面會暫時拉長，按「完成編輯」後自動縮放回一張 A4`+(tall?'':'');
  }else{
    pinfo.innerHTML=ok?`A4 橫式 297 × 210 mm ・ 文字已自動調整為 <b>${pct}%</b>，剛好排滿一張`
      :`<span class="over">內容超出一張 A4：請刪減品項，或把分類用 ←→ 移到比較空的欄</span>`;
  }
}
addEventListener('resize',()=>scale());
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>layout());
addEventListener('beforeprint',()=>{if(editing)btnEdit.click();board.style.transform='none'});
addEventListener('afterprint',()=>scale());

function setPath(path,val){
  const ks=path.split('.');let o=state;
  for(let i=0;i<ks.length-1;i++)o=o[ks[i]];
  o[ks[ks.length-1]]=val;
}
function focusPath(path){
  const el=board.querySelector(`[data-k="${path}"]`);if(!el)return;
  el.focus();const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);
}
function swap(arr,i,j){if(j<0||j>=arr.length)return false;[arr[i],arr[j]]=[arr[j],arr[i]];return true}

const acts={
  addItem(si){const it=state.sections[si].items;it.push(I('新品項',0));return `sections.${si}.items.${it.length-1}.name`},
  addSet(si){const it=state.sections[si].items;it.push({name:'新套餐',price:'0',desc:'套餐內容'});return `sections.${si}.items.${it.length-1}.name`},
  delItem(si,ii){state.sections[si].items.splice(ii,1)},
  mvItem(si,ii,d){swap(state.sections[si].items,+ii,+ii+(+d))},
  spicy(si,ii){const it=state.sections[si].items[ii];it.spicy=!it.spicy},
  addGrp(si){const g=state.sections[si].groups;g.push({title:'新勾選',hint:'(請勾選)',stack:false,choices:['選項']});return `sections.${si}.groups.${g.length-1}.title`},
  delGrp(si,gi){state.sections[si].groups.splice(gi,1)},
  mvGrp(si,gi,d){swap(state.sections[si].groups,+gi,+gi+(+d))},
  stack(si,gi){const g=state.sections[si].groups[gi];g.stack=!g.stack},
  addCh(si,gi){const c=state.sections[si].groups[gi].choices;c.push('選項');return `sections.${si}.groups.${gi}.choices.${c.length-1}`},
  delCh(si,gi,ci){state.sections[si].groups[gi].choices.splice(ci,1)},
  addPay(){state.foot.pays.push('新方式');return `foot.pays.${state.foot.pays.length-1}`},
  delPay(i){state.foot.pays.splice(i,1)},
  addSec(c,type){
    const s=type==='sets'?{type,col:+c,title:'',items:[{name:'新套餐',price:'0',desc:'套餐內容'}]}
      :type==='options'?{type,col:+c,title:'',groups:[{title:'新勾選',hint:'(請勾選)',stack:false,choices:['選項一','選項二']}]}
      :{type:'items',col:+c,title:'新分類',showTotal:true,items:[I('新品項',0)]};
    state.sections.push(s);const si=state.sections.length-1;
    return type==='items'?`sections.${si}.title`:type==='sets'?`sections.${si}.items.0.name`:`sections.${si}.groups.0.title`;
  },
  mvSec(si,d){
    si=+si;const col=state.sections[si].col;const S=state.sections;
    let j=si+(+d);while(j>=0&&j<S.length&&S[j].col!==col)j+=(+d);
    if(j>=0&&j<S.length)swap(S,si,j);
  },
  colSec(si,d){const s=state.sections[si];s.col=Math.max(0,Math.min(3,s.col+(+d)))},
  delSec(si){state.sections.splice(si,1)}
};
const ARMED=new Set(['delSec']);

board.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(b){
    const act=b.dataset.act;
    if(ARMED.has(act)&&!b.dataset.armed){
      b.dataset.armed='1';b.textContent='確定刪除?';
      setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='×'}},3000);
      return;
    }
    const args=String(b.dataset.a).split(',');
    const focus=acts[act](...args);
    save();render();if(focus)focusPath(focus);
    return;
  }
  if(!editing){
    const d=e.target.closest('.dot,.choice');
    if(d)d.classList.toggle('on');
  }
});
board.addEventListener('change',e=>{
  const t=e.target;if(t.dataset.flag){state.sections[+t.dataset.si][t.dataset.flag]=t.checked;save();render()}
});
board.addEventListener('input',e=>{
  const el=e.target.closest('[data-k]');if(!el)return;
  setPath(el.dataset.k,el.textContent.replace(/\s+/g,' ').trim()===''?'':el.textContent.replace(/\n/g,' '));
  save();
});
board.addEventListener('blur',e=>{
  const el=e.target.closest&&e.target.closest('[data-k]');
  if(el&&el.textContent.trim()==='')el.textContent='';
},true);
board.addEventListener('keydown',e=>{
  if(e.target.closest('[data-k]')&&e.key==='Enter'){e.preventDefault();e.target.blur()}
});
board.addEventListener('paste',e=>{
  if(!e.target.closest('[data-k]'))return;
  e.preventDefault();
  const t=(e.clipboardData||window.clipboardData).getData('text').replace(/\s*\n\s*/g,' ');
  document.execCommand('insertText',false,t);
});

/* toolbar */
var btnEdit=document.getElementById('btnEdit'),hint=document.getElementById('hint');
btnEdit.addEventListener('click',()=>{
  editing=!editing;btnEdit.classList.toggle('on',editing);
  btnEdit.textContent=editing?'✓ 完成編輯':'✎ 編輯模式';hint.hidden=!editing;render();
});
const btnReset=document.getElementById('btnReset');
btnReset.addEventListener('click',()=>{
  if(!btnReset.dataset.armed){
    btnReset.dataset.armed='1';btnReset.textContent='再按一次：全部還原成原始菜單';
    setTimeout(()=>{delete btnReset.dataset.armed;btnReset.textContent='還原預設'},3500);return;
  }
  delete btnReset.dataset.armed;btnReset.textContent='還原預設';
  state=clone(DEFAULT);save();render();flash('已還原');
});
const btnPrint=document.getElementById('btnPrint');
btnPrint.hidden=false;btnPrint.addEventListener('click',()=>{if(editing)btnEdit.click();setTimeout(()=>window.print(),150)});

const modal=document.getElementById('modal'),ioText=document.getElementById('ioText'),ioErr=document.getElementById('ioErr');
document.getElementById('btnIO').addEventListener('click',()=>{ioText.value=JSON.stringify(state,null,2);ioErr.textContent='';modal.hidden=false;ioText.focus();ioText.select()});
document.getElementById('ioClose').addEventListener('click',()=>modal.hidden=true);
modal.addEventListener('click',e=>{if(e.target===modal)modal.hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.hidden=true});
document.getElementById('ioCopy').addEventListener('click',()=>{
  const done=()=>{ioErr.textContent='已複製到剪貼簿'};
  try{navigator.clipboard.writeText(ioText.value).then(done,()=>{ioText.select();ioErr.textContent='請按 Ctrl+C / ⌘C 複製已選取的文字'})}
  catch(e){ioText.select();ioErr.textContent='請按 Ctrl+C / ⌘C 複製已選取的文字'}
});
document.getElementById('ioApply').addEventListener('click',()=>{
  try{
    const d=JSON.parse(ioText.value);
    if(!d||!d.shop||!Array.isArray(d.sections)||!d.foot)throw new Error('缺少 shop / sections / foot');
    state=d;save();render();modal.hidden=true;flash('已套用匯入資料');
  }catch(e){ioErr.textContent='資料格式不對，請貼上完整的匯出內容（'+e.message+'）'}
});

render();
if(EMB){
  addEventListener('message',ev=>{
    const d=ev.data;if(!d||typeof d!=='object')return;
    if(d.t==='mb-data'){
      if(d.data){try{const o=JSON.parse(d.data);if(o&&o.shop&&Array.isArray(o.sections)&&o.foot){state=o;render()}}catch(e){}}
      flash(d.data?'已讀取雲端菜單':'尚未儲存過，顯示預設菜單（改了才會存）');
    }else if(d.t==='mb-saved')flash('已自動儲存（雲端）');
    else if(d.t==='mb-err')flash('儲存失敗：'+(d.msg||''));
  });
  try{parent.postMessage({t:'mb-ready'},'*')}catch(e){}
}
})();
</script>
</head></html>
